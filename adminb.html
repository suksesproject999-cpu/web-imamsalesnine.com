<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product CMS — Imam Sales Nine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--g:#8CC63F;--bg:#080b0a;--panel:#111513;--panel2:#171c19;--line:#29312d;--txt:#f5f7f6;--muted:#98a29d;--red:#ff6262}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Arial,sans-serif}
button,input,select,textarea{font:inherit}.top{height:68px;position:sticky;top:0;z-index:30;background:rgba(8,11,10,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-size:17px;font-weight:900;letter-spacing:.7px}.brand span{color:var(--g)}.top-actions{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--g);color:#10150d}.btn.ghost{background:#171c19;color:#dce2df;border:1px solid var(--line)}.btn.danger{background:#32191a;color:#ffb0b0;border:1px solid #5a282b}.btn:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{border-right:1px solid var(--line);background:#0c100e;padding:16px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}
.search{position:relative}.search i{position:absolute;left:13px;top:14px;color:#6f7974}.search input{padding-left:36px}.field,input,select,textarea{width:100%}input,select,textarea{background:#0c100e;color:#fff;border:1px solid #313a35;border-radius:9px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--g)}textarea{min-height:110px;resize:vertical}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.summary{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:12px 2px}
.product-list{display:grid;gap:7px}.pitem{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid transparent;border-radius:11px;cursor:pointer}.pitem:hover,.pitem.active{background:var(--panel2);border-color:var(--line)}.pitem img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px}.pname{font-weight:800;font-size:12px}.pmeta{font-size:10px;color:var(--muted);margin-top:2px}.dot{width:8px;height:8px;border-radius:50%;background:#4c5751}.dot.on{background:var(--g)}
.main{padding:24px;min-width:0}.empty{height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.empty i{font-size:42px;color:#334039;margin-bottom:15px}
.editor{max-width:1180px;margin:auto}.editor-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{color:var(--g);font-size:11px;font-weight:900;letter-spacing:1.5px}.editor h1{margin:5px 0 3px;font-size:30px}.muted{color:var(--muted)}.status-row{display:flex;gap:9px;flex-wrap:wrap}.switchbox{display:flex;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:9px 11px;border-radius:10px}.switchbox input{width:auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.card h2{font-size:15px;margin:0 0 15px}.full{grid-column:1/-1}.field{margin-bottom:12px}.field label{display:block;color:#b8c0bc;font-size:11px;font-weight:800;margin:0 0 6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.image-row{display:grid;grid-template-columns:170px 1fr;gap:16px}.preview{height:170px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img{max-width:100%;max-height:100%;object-fit:contain}.upload-note{font-size:11px;color:var(--muted);margin-top:6px}
.spec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.spec-row{display:grid;grid-template-columns:1fr 1.3fr 34px;gap:7px}.iconbtn{border:1px solid var(--line);background:#151a18;color:#ccc;border-radius:8px;cursor:pointer}.iconbtn:hover{color:#fff;border-color:#59655f}
.array-wrap{display:grid;gap:7px}.array-row{display:grid;grid-template-columns:1fr 34px;gap:7px}.add{margin-top:8px}.sticky-save{position:sticky;bottom:12px;z-index:20;background:rgba(17,21,19,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 10px 35px #0008}.save-state{font-size:12px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#172019;border:1px solid #39502f;color:#eaffdf;padding:13px 16px;border-radius:11px;box-shadow:0 12px 35px #0008;display:none}
.raw{font-family:monospace;font-size:12px;min-height:260px}
@media(max-width:850px){.layout{display:block}.sidebar{position:relative;top:0;height:360px;border-right:0;border-bottom:1px solid var(--line)}.main{padding:15px}.grid,.two,.three,.spec-grid,.image-row{grid-template-columns:1fr}.editor-head{display:block}.status-row{margin-top:12px}.sticky-save{bottom:7px}}
</style>
</head>
<body>
<header class="top"><div class="brand">NINE <span>PRODUCT CMS</span></div><div class="top-actions"><a class="btn ghost" href="index.html" target="_blank">Lihat Web</a><button class="btn ghost" id="seedBtn">Sinkronkan Seed</button></div></header>
<div class="layout">
<aside class="sidebar">
  <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Cari nama, SKU, brand..."></div>
  <div class="filters"><select id="filter"><option value="all">Semua produk</option><option value="promo">Promo aktif</option><option value="active">Produk aktif</option><option value="hidden">Disembunyikan</option></select><select id="sort"><option value="name">Nama A–Z</option><option value="id">ID</option><option value="promo">Urutan promo</option></select></div>
  <div class="summary"><span id="count">0 produk</span><span id="sync">Memuat...</span></div>
  <div id="productList" class="product-list"></div>
</aside>
<main class="main"><div id="empty" class="empty"><div><i class="fa-solid fa-box-open"></i><h3>Pilih produk untuk mulai mengedit</h3><p>Perubahan yang dipublish akan menjadi sumber data live web utama.</p></div></div><div id="editor" class="editor" hidden></div></main>
</div>


<script src="/js/auth.js"></script>
	
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBkyMCw47sYQb2BBkGMxgfsXppozWw4Cec",authDomain:"apin-web.firebaseapp.com",projectId:"apin-web",storageBucket:"apin-web.firebasestorage.app",messagingSenderId:"733140414417",appId:"1:733140414417:web:b6967fd053ac462b2ffaf0",measurementId:"G-6ZN6TQ1YVE"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const COL="cms_products";
let seed=[], products=[], selectedId=null, draft=null, dirty=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const clone=x=>JSON.parse(JSON.stringify(x));
function normalize(p){
  const x=clone(p);
  if(typeof x.active!=="boolean")x.active=true;
  if(typeof x.deleted!=="boolean")x.deleted=false;
  if(!x.promo||typeof x.promo!=="object")x.promo={active:false,order:9999};
  if(typeof x.promo.active!=="boolean")x.promo.active=false;
  if(!Number.isFinite(Number(x.promo.order)))x.promo.order=9999;
  x.gallery=Array.isArray(x.gallery)?x.gallery:[];
  x.varian=Array.isArray(x.varian)?x.varian:[];
  x.keunggulan=Array.isArray(x.keunggulan)?x.keunggulan:[];
  x.isi_paket=Array.isArray(x.isi_paket)?x.isi_paket:[];
  x.tags=Array.isArray(x.tags)?x.tags:[];
  x.spesifikasi=(x.spesifikasi&&typeof x.spesifikasi==="object")?x.spesifikasi:{};
  x.harga=(x.harga&&typeof x.harga==="object")?x.harga:{normal:0,promo:0,status:""};
  x.stok=(x.stok&&typeof x.stok==="object")?x.stok:{};
  x.garansi=(x.garansi&&typeof x.garansi==="object")?x.garansi:{};
  x.aplikasi=(x.aplikasi&&typeof x.aplikasi==="object")?x.aplikasi:{};
  return x;
}
async function boot(){
  const r=await fetch("produk.json",{cache:"no-store"}); seed=(await r.json()).map(normalize);
  products=seed.map(clone); renderList();
  db.collection(COL).onSnapshot(snap=>{
    const m=new Map(); snap.forEach(d=>m.set(String(d.data().id??d.id),d.data()));
    products=seed.map(s=>normalize(m.has(String(s.id))?{...s,...m.get(String(s.id))}:s));
    m.forEach((v,k)=>{if(!products.some(p=>String(p.id)===k))products.push(normalize(v))});
    $("#sync").textContent="Live • Firestore";
    renderList();
    if(selectedId!==null && !dirty){const p=products.find(x=>String(x.id)===String(selectedId));if(p)openProduct(p.id)}
  },e=>{$("#sync").textContent="Fallback lokal";toast("Firestore belum dapat diakses: "+e.message)});
}
function filtered(){
  const q=$("#search").value.toLowerCase().trim(), f=$("#filter").value, sort=$("#sort").value;
  let a=products.filter(p=>(p.nama+" "+p.sku+" "+p.brand).toLowerCase().includes(q));
  if(f==="promo")a=a.filter(p=>p.promo.active&&!p.deleted);
  if(f==="active")a=a.filter(p=>p.active&&!p.deleted);
  if(f==="hidden")a=a.filter(p=>!p.active||p.deleted);
  a.sort((a,b)=>sort==="id"?Number(a.id)-Number(b.id):sort==="promo"?Number(a.promo.order)-Number(b.promo.order):String(a.nama).localeCompare(String(b.nama)));
  return a;
}
function renderList(){
  const a=filtered(); $("#count").textContent=a.length+" produk";
  $("#productList").innerHTML=a.map(p=>`<div class="pitem ${String(p.id)===String(selectedId)?"active":""}" onclick="openProduct('${esc(p.id)}')"><img src="${esc(p.gambar||"images/no-image.png")}" onerror="this.src='images/no-image.png'"><div><div class="pname">${esc(p.nama)}</div><div class="pmeta">#${esc(p.id)} · ${esc(p.sku||"-")} ${p.promo.active?"· PROMO":""}</div></div><span class="dot ${p.active&&!p.deleted?"on":""}"></span></div>`).join("");
}
function arrEditor(key,title){
 const arr=Array.isArray(draft[key])?draft[key]:[];
 return `<div class="card"><h2>${title}</h2><div class="array-wrap" id="arr-${key}">${arr.map((v,i)=>`<div class="array-row"><input value="${esc(typeof v==="string"?v:JSON.stringify(v))}" oninput="setArray('${key}',${i},this.value)"><button class="iconbtn" onclick="removeArray('${key}',${i})"><i class="fa-solid fa-xmark"></i></button></div>`).join("")}</div><button class="btn ghost add" onclick="addArray('${key}')">+ Tambah</button></div>`;
}
function openProduct(id){
  if(dirty&&!confirm("Ada perubahan belum dipublish. Buang perubahan?"))return;
  selectedId=id; const p=products.find(x=>String(x.id)===String(id)); if(!p)return;
  draft=clone(p); dirty=false; $("#empty").hidden=true; $("#editor").hidden=false; renderEditor(); renderList();
}
function renderEditor(){
 const p=draft, specs=Object.entries(p.spesifikasi||{});
 $("#editor").innerHTML=`
 <div class="editor-head"><div><span class="eyebrow">PRODUCT EDITOR · ID ${esc(p.id)}</span><h1>${esc(p.nama||"Tanpa nama")}</h1><div class="muted">${esc(p.brand||"")} · ${esc(p.kategori||"")}</div></div>
 <div class="status-row"><label class="switchbox"><input type="checkbox" ${p.active?"checked":""} onchange="setPath('active',this.checked)"> Produk aktif</label><label class="switchbox"><input type="checkbox" ${p.promo.active?"checked":""} onchange="setPath('promo.active',this.checked)"> Tampilkan di Promo</label></div></div>
 <div class="grid">
  <div class="card"><h2>Identitas Produk</h2>
   <div class="two"><div class="field"><label>NAMA</label><input value="${esc(p.nama)}" oninput="setPath('nama',this.value)"></div><div class="field"><label>SKU</label><input value="${esc(p.sku)}" oninput="setPath('sku',this.value)"></div></div>
   <div class="two"><div class="field"><label>BRAND</label><input value="${esc(p.brand)}" oninput="setPath('brand',this.value)"></div><div class="field"><label>KATEGORI</label><input value="${esc(p.kategori)}" oninput="setPath('kategori',this.value)"></div></div>
   <div class="field"><label>WHATSAPP</label><input value="${esc(p.whatsapp||"")}" oninput="setPath('whatsapp',this.value)"></div>
  </div>
  <div class="card"><h2>Harga & Promo</h2>
   <div class="three"><div class="field"><label>HARGA NORMAL</label><input type="number" value="${Number(p.harga.normal||0)}" oninput="setPath('harga.normal',Number(this.value))"></div><div class="field"><label>HARGA PROMO</label><input type="number" value="${Number(p.harga.promo||0)}" oninput="setPath('harga.promo',Number(this.value))"></div><div class="field"><label>URUTAN PROMO</label><input type="number" value="${Number(p.promo.order||9999)}" oninput="setPath('promo.order',Number(this.value))"></div></div>
   <div class="field"><label>STATUS HARGA</label><input value="${esc(p.harga.status||"")}" oninput="setPath('harga.status',this.value)"></div>
   <div class="muted">Diskon terhitung otomatis dari harga normal dan promo: <b id="discount">${discount()}%</b></div>
  </div>
  <div class="card full"><h2>Foto Produk — Root Hosting</h2>
  <div class="image-row">
    <div class="preview"><img id="mainPreview" src="${esc(p.gambar||"images/no-image.png")}" onerror="this.src='images/no-image.png'"></div>
    <div>
      <div class="field"><label>PATH GAMBAR UTAMA</label>
        <input id="imageUrl" value="${esc(p.gambar||"")}" placeholder="images/produk/nama-file.jpg"
          oninput="setPath('gambar',normalizeImagePath(this.value));$('#mainPreview').src=normalizeImagePath(this.value)">
      </div>
      <div class="upload-note">Gambar tetap dibaca langsung dari root website. Contoh: <b>images/produk/nama-file.jpg</b>. CMS tidak mengupload atau memindahkan file gambar ke Firebase.</div>
      <button type="button" class="btn ghost add" onclick="testImagePath()">Cek Gambar</button>
    </div>
  </div>
</div>
<div class="card full"><h2>Deskripsi</h2><textarea oninput="setPath('deskripsi',this.value)">${esc(p.deskripsi||"")}</textarea></div>
  <div class="card full"><h2>Spesifikasi — bebas tambah/hapus field</h2><div class="spec-grid" id="specGrid">${specs.map(([k,v],i)=>specRow(k,v,i)).join("")}</div><button class="btn ghost add" onclick="addSpec()">+ Tambah Spesifikasi</button></div>
  ${arrEditor("gallery","Gallery Gambar — path images/produk/")}
  ${arrEditor("varian","Varian")}
  ${arrEditor("keunggulan","Keunggulan")}
  ${arrEditor("isi_paket","Isi Paket")}
  ${arrEditor("tags","Tags")}
  <div class="card"><h2>Aplikasi</h2><textarea class="raw" oninput="setJson('aplikasi',this.value)">${esc(JSON.stringify(p.aplikasi,null,2))}</textarea></div>
  <div class="card"><h2>Garansi</h2><textarea class="raw" oninput="setJson('garansi',this.value)">${esc(JSON.stringify(p.garansi,null,2))}</textarea></div>
  <div class="card"><h2>Stok</h2><textarea class="raw" oninput="setJson('stok',this.value)">${esc(JSON.stringify(p.stok,null,2))}</textarea></div>
  <div class="card full"><h2>Advanced — JSON Produk Lengkap</h2><p class="muted">Untuk field khusus yang belum memiliki form visual. JSON harus valid.</p><textarea id="rawJson" class="raw">${esc(JSON.stringify(p,null,2))}</textarea><button class="btn ghost add" onclick="applyRaw()">Terapkan JSON ke Editor</button></div>
 </div>
 <div class="sticky-save"><div><b>Publish ke web utama</b><div class="save-state" id="saveState">Belum ada perubahan.</div></div><div class="top-actions"><button class="btn danger" onclick="deleteProduct()">Hapus dari Web</button><button class="btn ghost" onclick="resetDraft()">Reset</button><button class="btn" id="saveBtn" onclick="saveProduct()"><i class="fa-solid fa-cloud-arrow-up"></i> Publish</button></div></div>`;
}
function specRow(k,v,i){return `<div class="spec-row"><input value="${esc(k)}" onchange="renameSpec('${esc(k)}',this.value)"><input value="${esc(Array.isArray(v)?v.join(", "):v)}" oninput="setSpec('${esc(k)}',this.value)"><button class="iconbtn" onclick="removeSpec('${esc(k)}')"><i class="fa-solid fa-xmark"></i></button></div>`}
function setPath(path,val){let o=draft,a=path.split(".");a.slice(0,-1).forEach(k=>o=o[k]??(o[k]={}));o[a.at(-1)]=val;markDirty();if(path.startsWith("harga."))$("#discount").textContent=discount()+"%"}
function discount(){let n=Number(draft.harga?.normal||0),p=Number(draft.harga?.promo||0);return n>0&&p>0&&p<n?Math.round((n-p)/n*100):0}
function setArray(k,i,v){draft[k][i]=v;markDirty()} function addArray(k){draft[k].push("");markDirty();renderEditor()} function removeArray(k,i){draft[k].splice(i,1);markDirty();renderEditor()}
function setJson(k,v){try{draft[k]=JSON.parse(v);markDirty()}catch(e){$("#saveState").textContent="JSON "+k+" belum valid."}}
function setSpec(k,v){draft.spesifikasi[k]=v;markDirty()} function addSpec(){draft.spesifikasi["field_baru_"+(Object.keys(draft.spesifikasi).length+1)]="";markDirty();renderEditor()}
function removeSpec(k){delete draft.spesifikasi[k];markDirty();renderEditor()} function renameSpec(oldk,newk){if(!newk||newk===oldk)return;draft.spesifikasi[newk]=draft.spesifikasi[oldk];delete draft.spesifikasi[oldk];markDirty();renderEditor()}
function markDirty(){dirty=true;const s=$("#saveState");if(s)s.textContent="Ada perubahan yang belum dipublish."}
function resetDraft(){const p=products.find(x=>String(x.id)===String(selectedId));draft=clone(p);dirty=false;renderEditor()}
function applyRaw(){try{draft=normalize(JSON.parse($("#rawJson").value));dirty=true;renderEditor();toast("JSON diterapkan. Belum dipublish.")}catch(e){toast("JSON tidak valid: "+e.message)}}

function normalizeImagePath(v){
  v=String(v||"").trim().replace(/\\/g,"/");
  if(!v)return "";
  // URL eksternal dibiarkan jika data lama memang menggunakannya.
  if(/^https?:\/\//i.test(v))return v;
  v=v.replace(/^\/+/,"");
  if(v.startsWith("images/"))return v;
  if(v.startsWith("produk/"))return "images/"+v;
  return "images/produk/"+v;
}
function testImagePath(){
  const path=normalizeImagePath($("#imageUrl").value);
  if(!path){toast("Path gambar masih kosong.");return;}
  const img=new Image();
  img.onload=()=>toast("Gambar ditemukan: "+path);
  img.onerror=()=>toast("Gambar tidak ditemukan di root: "+path);
  img.src=path+"?cms_check="+Date.now();
}

async function saveProduct(){
 try{
  $("#saveBtn").disabled=true; $("#saveState").textContent="Publishing...";
  draft.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  await db.collection(COL).doc(String(draft.id)).set(draft,{merge:false});
  dirty=false; toast("Produk berhasil dipublish ke web utama.");
  $("#saveState").textContent="Tersimpan di Firestore.";
 }catch(e){toast("Publish gagal: "+e.message)}finally{$("#saveBtn").disabled=false}
}
async function deleteProduct(){
 if(!confirm("Sembunyikan produk ini dari seluruh web utama dan promo? Data seed tidak dihapus permanen."))return;
 draft.active=false;draft.deleted=true;draft.promo.active=false;dirty=true;await saveProduct();
}
async function seedAll(){
 if(!confirm("Sinkronkan seluruh produk.json sebagai dokumen awal CMS? Override yang sudah ada tidak akan ditimpa."))return;
 $("#seedBtn").disabled=true;
 try{
  let batch=db.batch(),n=0,total=0;
  for(const p of seed){
   const ref=db.collection(COL).doc(String(p.id));
   const snap=await ref.get();
   if(!snap.exists){batch.set(ref,p);n++;total++}
   if(n>=400){await batch.commit();batch=db.batch();n=0}
  }
  if(n)await batch.commit();
  toast(total+" produk seed ditambahkan ke CMS.");
 }catch(e){toast("Sinkronisasi gagal: "+e.message)}finally{$("#seedBtn").disabled=false}
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display="none",4500)}
$("#search").oninput=renderList;$("#filter").onchange=renderList;$("#sort").onchange=renderList;$("#seedBtn").onclick=seedAll;
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
boot().catch(e=>{$("#sync").textContent="Gagal";toast(e.message)});
</script>
</body></html>
