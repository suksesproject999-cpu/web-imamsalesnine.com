name: ImamStore - Sinkronisasi Preview Produk
on:
  schedule:
    # GitHub schedule minimum 5 menit; waktu eksekusi tidak dijamin tepat.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_share_catalog.py'
      - 'store/produk.json'
      - '.github/workflows/imamstore-share-sync.yml'
permissions:
  contents: write
concurrency:
  group: imamstore-share-snapshot
  cancel-in-progress: false
jobs:
  create-share-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image generator
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'qrcode>=7,<9'
      - name: Prepare static product previews
        run: python scripts/build_share_catalog.py
      - name: Commit only changed Share snapshots
        shell: bash
        run: |
          git add store/p/ store/share-data/ store/images/share/ store/images/share-posters/
          if git diff --cached --quiet; then
            echo 'Nothing changed; no deployment triggered.'
            exit 0
          fi
          git config user.name 'ImamStore Share Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(store): refresh product share previews'
          git push origin HEAD:main
