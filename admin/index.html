<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Imam Sales — Admin Edit</title>


<style>

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================================================
   WEBSITE UTAMA
========================================================= */

#mainFrame{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    background:#111;

}


/* =========================================================
   ADMIN BADGE
========================================================= */

#adminBadge{

    position:fixed;

    left:18px;
    bottom:18px;

    z-index:999999;

    display:flex;

    align-items:center;

    gap:8px;

    padding:11px 16px;

    border-radius:999px;

    background:#111827;

    color:#fff;

    border:1px solid
        rgba(140,198,63,.65);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.35);

    font-size:12px;

    font-weight:700;

    pointer-events:none;

}


#adminBadgeDot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:#8CC63F;

    box-shadow:
        0 0 14px
        #8CC63F;

}


/* =========================================================
   LOADING
========================================================= */

#adminLoading{

    position:fixed;

    inset:0;

    z-index:1000000;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:15px;

    background:#111;

    color:#fff;

}


#adminLoading.hidden{

    display:none;

}


.loaderSpinner{

    width:42px;
    height:42px;

    border-radius:50%;

    border:4px solid
        rgba(255,255,255,.15);

    border-top-color:#8CC63F;

    animation:
        spin .8s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   EDITOR OVERLAY
========================================================= */

#editorOverlay{

    position:fixed;

    inset:0;

    z-index:2000000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(8px);

}


#editorOverlay.show{

    display:flex;

}


#editorPanel{

    width:min(620px,100%);

    max-height:
        calc(100vh - 40px);

    overflow:auto;

    background:#fff;

    color:#111827;

    border-radius:20px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.45);

}


.editorHeader{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:18px 20px;

    border-bottom:
        1px solid #e5e7eb;

}


.editorHeader h2{

    margin:0;

    font-size:18px;

}


.editorClose{

    width:38px;
    height:38px;

    border:0;

    border-radius:50%;

    background:#f3f4f6;

    font-size:22px;

    cursor:pointer;

}


#editorBody{

    padding:20px;

}


.editorField{

    margin-bottom:16px;

}


.editorField label{

    display:block;

    margin-bottom:6px;

    color:#374151;

    font-size:12px;

    font-weight:700;

}


.editorField input,
.editorField textarea,
.editorField select{

    width:100%;

    padding:11px 12px;

    border:1px solid #d1d5db;

    border-radius:10px;

    outline:none;

    background:#fff;

    color:#111827;

}


.editorField textarea{

    min-height:110px;

    resize:vertical;

}


.editorField input:focus,
.editorField textarea:focus,
.editorField select:focus{

    border-color:#8CC63F;

    box-shadow:
        0 0 0 3px
        rgba(140,198,63,.12);

}


.priceGrid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:12px;

}


.editorImage{

    width:100%;

    max-height:220px;

    object-fit:contain;

    border-radius:12px;

    background:#f3f4f6;

    margin-bottom:10px;

}


.editorActions{

    display:flex;

    gap:10px;

    padding:18px 20px;

    border-top:
        1px solid #e5e7eb;

}


.editorButton{

    flex:1;

    min-height:44px;

    border:0;

    border-radius:10px;

    font-weight:700;

    cursor:pointer;

}


.editorCancel{

    background:#e5e7eb;

    color:#111827;

}


.editorSave{

    background:#8CC63F;

    color:#111;

}


/* =========================================================
   ADMIN EDIT MARK
========================================================= */

.adminEditMark{

    position:absolute !important;

    top:5px !important;

    right:5px !important;

    z-index:999999 !important;

    width:32px !important;

    height:32px !important;

    border:0 !important;

    border-radius:50% !important;

    background:#8CC63F !important;

    color:#111 !important;

    font-size:14px !important;

    font-weight:900 !important;

    cursor:pointer !important;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.3) !important;

}


.adminEditable{

    outline:
        2px dashed
        rgba(140,198,63,.7)
        !important;

    outline-offset:4px !important;

}


</style>

</head>


<body>


<!-- =======================================================
     WEBSITE PUBLIK ASLI
======================================================= -->

<iframe
    id="mainFrame"
    src="../index.html"
    title="Website Utama"
></iframe>


<!-- =======================================================
     ADMIN BADGE
======================================================= -->

<div id="adminBadge">

    <span id="adminBadgeDot"></span>

    ADMIN EDIT MODE

</div>


<!-- =======================================================
     LOADING
======================================================= -->

<div id="adminLoading">

    <div class="loaderSpinner"></div>

    <strong>
        Memuat Website Utama...
    </strong>

</div>


<!-- =======================================================
     EDITOR
======================================================= -->

<div id="editorOverlay">

    <div id="editorPanel">


        <div class="editorHeader">

            <h2 id="editorTitle">
                Edit Produk
            </h2>


            <button
                type="button"
                class="editorClose"
                onclick="closeEditor()"
            >
                ×
            </button>

        </div>


        <div id="editorBody"></div>


        <div class="editorActions">

            <button
                type="button"
                class="editorButton editorCancel"
                onclick="closeEditor()"
            >
                Batal
            </button>


            <button
                type="button"
                class="editorButton editorSave"
                onclick="saveEditor()"
            >
                Simpan

            </button>

        </div>


    </div>

</div>


<script>


/* =========================================================
   CONFIG
========================================================= */

const frame =
    document.getElementById(
        "mainFrame"
    );


const loading =
    document.getElementById(
        "adminLoading"
    );


const overlay =
    document.getElementById(
        "editorOverlay"
    );


const editorBody =
    document.getElementById(
        "editorBody"
    );


const editorTitle =
    document.getElementById(
        "editorTitle"
    );


/* =========================================================
   STATE
========================================================= */

let frameDocument = null;

let currentProduct = null;

let currentElement = null;


/* =========================================================
   FRAME READY
========================================================= */

frame.addEventListener(
    "load",
    function(){

        frameDocument =
            frame.contentDocument ||
            frame.contentWindow.document;


        loading.classList.add(
            "hidden"
        );


        initializeAdmin();


    }
);


/* =========================================================
   INITIALIZE
========================================================= */

function initializeAdmin(){

    if(!frameDocument){

        return;

    }


    injectAdminStyles();

    injectAdminProductEditor();

    markEditableStaticElements();

    markProductCards();


    /*
     * Website utama bisa melakukan
     * render ulang produk.
     *
     * Karena itu kita observe DOM.
     */

    const observer =
        new MutationObserver(
            function(){

                markEditableStaticElements();

                markProductCards();

            }
        );


    const target =
        frameDocument.body;


    if(target){

        observer.observe(
            target,
            {
                childList:true,
                subtree:true
            }
        );

    }

}


/* =========================================================
   INJECT STYLE KE WEBSITE UTAMA
========================================================= */

function injectAdminStyles(){

    if(
        frameDocument.getElementById(
            "adminInjectedStyle"
        )
    ){

        return;

    }


    const style =
        frameDocument.createElement(
            "style"
        );


    style.id =
        "adminInjectedStyle";


    style.textContent = `

        .admin-edit-highlight{

            outline:
                2px dashed
                #8CC63F !important;

            outline-offset:4px !important;

            cursor:pointer !important;

        }

        .admin-product-card{

            position:relative !important;

        }

        .admin-product-edit{

            position:absolute !important;

            top:8px !important;

            right:8px !important;

            z-index:999999 !important;

            width:34px !important;

            height:34px !important;

            border:0 !important;

            border-radius:50% !important;

            background:#8CC63F !important;

            color:#111 !important;

            font-weight:900 !important;

            cursor:pointer !important;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,.3) !important;

        }

    `;


    frameDocument.head.appendChild(
        style
    );

}


/* =========================================================
   STATIC ELEMENT
========================================================= */

function markEditableStaticElements(){

    if(!frameDocument){

        return;

    }


    const selectors = [

        ".main-brand",
        ".sub-brand",

        ".hero-content h1",
        ".hero-content p",

        "#shoppingMallHero h1",
        "#shoppingMallHero p",

        "#about h2",
        "#about p",

        "#product h2",
        "#product p",

        "#testimoni h2",

        "#faq h2",

        "#contact h2"

    ];


    selectors.forEach(
        selector => {

            frameDocument
                .querySelectorAll(selector)
                .forEach(
                    element => {

                        if(
                            element.dataset
                                .adminBound
                        ){

                            return;

                        }


                        element.dataset
                            .adminBound =
                            "true";


                        element.classList.add(
                            "admin-edit-highlight"
                        );


                        element.addEventListener(
                            "click",
                            function(event){

                                event.preventDefault();

                                event.stopPropagation();

                                openElementEditor(
                                    element
                                );

                            },
                            true
                        );

                    }
                );

        }
    );

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function markProductCards(){

    if(!frameDocument){

        return;

    }


    frameDocument
        .querySelectorAll(
            ".marketplace-card"
        )
        .forEach(
            card => {

                card.classList.add(
                    "admin-product-card"
                );


                if(
                    card.querySelector(
                        ".admin-product-edit"
                    )
                ){

                    return;

                }


                const button =
                    frameDocument.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "admin-product-edit";


                button.innerHTML =
                    "✎";


                button.title =
                    "Edit produk";


                button.addEventListener(
                    "click",
                    function(event){

                        event.preventDefault();

                        event.stopPropagation();

                        openProductEditor(
                            card
                        );

                    },
                    true
                );


                card.appendChild(
                    button
                );


            }
        );

}


/* =========================================================
   PRODUCT EDITOR
========================================================= */

function openProductEditor(card){

    const productNameElement =
        card.querySelector(
            ".marketplace-product-name"
        );


    const brandElement =
        card.querySelector(
            ".product-brand"
        );


    const imageElement =
        card.querySelector(
            ".marketplace-image-wrap img"
        );


    if(!productNameElement){

        return;

    }


    const nama =
        productNameElement.textContent
            .trim();


    const brand =
        brandElement
        ? brandElement.textContent.trim()
        : "";


    const image =
        imageElement
        ? imageElement.getAttribute("src")
        : "";


    /*
     * Cari data asli dari parent window.
     */

    const products =
        frameWindowProducts();


    currentProduct =
        products.find(
            product =>
                String(product.nama)
                ===
                String(nama)
        );


    if(!currentProduct){

        /*
         * Fallback dari DOM.
         */

        currentProduct = {

            nama: nama,

            brand: brand,

            gambar: image,

            harga: {

                normal: 0,

                promo: 0,

                status: "Nonaktif"

            },

            deskripsi: "",

            kategori: "",

            sku: "",

            varian: [],

            whatsapp: ""

        };

    }


    currentElement =
        card;


    editorTitle.textContent =
        "Edit Produk";


    renderProductEditor();

}


/* =========================================================
   GET PRODUCTS DARI FRAME
========================================================= */

function frameWindowProducts(){

    try{

        const products =
            frame.contentWindow.allProducts;


        if(
            Array.isArray(products)
        ){

            return products;

        }

    }catch(error){

        console.warn(error);

    }


    return [];

}


/* =========================================================
   RENDER PRODUCT EDITOR
========================================================= */

function renderProductEditor(){

    const product =
        currentProduct;


    const harga =
        product.harga || {};


    editorBody.innerHTML = `

        <div class="editorField">

            <label>
                Nama Produk
            </label>

            <input
                id="editNama"
                value="${escapeAttr(
                    product.nama
                )}"
            >

        </div>


        <div class="editorField">

            <label>
                Brand
            </label>

            <input
                id="editBrand"
                value="${escapeAttr(
                    product.brand
                )}"
            >

        </div>


        <div class="editorField">

            <label>
                Kategori
            </label>

            <input
                id="editKategori"
                value="${escapeAttr(
                    product.kategori
                )}"
            >

        </div>


        <div class="editorField">

            <label>
                SKU
            </label>

            <input
                id="editSku"
                value="${escapeAttr(
                    product.sku
                )}"
            >

        </div>


        <div class="editorField">

            <label>
                Foto Produk
            </label>

            ${
                product.gambar
                ?
                `
                <img
                    class="editorImage"
                    src="${escapeAttr(
                        normalizeAdminImage(
                            product.gambar
                        )
                    )}"
                >
                `
                :
                ""
            }

            <input
                id="editGambar"
                value="${escapeAttr(
                    product.gambar
                )}"
                placeholder="images/produk/nama.jpg"
            >

        </div>


        <div class="priceGrid">

            <div class="editorField">

                <label>
                    Harga Normal
                </label>

                <input
                    type="number"
                    id="editHargaNormal"
                    value="${numberValue(
                        harga.normal
                    )}"
                >

            </div>


            <div class="editorField">

                <label>
                    Harga Promo
                </label>

                <input
                    type="number"
                    id="editHargaPromo"
                    value="${numberValue(
                        harga.promo
                    )}"
                >

            </div>

        </div>


        <div class="editorField">

            <label>
                Status Harga
            </label>

            <select id="editHargaStatus">

                <option
                    value="Aktif"
                    ${
                        harga.status ===
                        "Aktif"
                        ? "selected"
                        : ""
                    }
                >
                    Aktif
                </option>


                <option
                    value="Nonaktif"
                    ${
                        harga.status !==
                        "Aktif"
                        ? "selected"
                        : ""
                    }
                >
                    Nonaktif
                </option>

            </select>

        </div>


        <div class="editorField">

            <label>
                Deskripsi Produk
            </label>

            <textarea
                id="editDeskripsi"
            >${escapeHTML(
                product.deskripsi
            )}</textarea>

        </div>


        <div class="editorField">

            <label>
                WhatsApp
            </label>

            <input
                id="editWhatsapp"
                value="${escapeAttr(
                    product.whatsapp
                )}"
            >

        </div>

    `;


    overlay.classList.add(
        "show"
    );

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

function saveEditor(){

    if(!currentProduct){

        closeEditor();

        return;

    }


    currentProduct.nama =
        document
            .getElementById(
                "editNama"
            )
            .value
            .trim();


    currentProduct.brand =
        document
            .getElementById(
                "editBrand"
            )
            .value
            .trim();


    currentProduct.kategori =
        document
            .getElementById(
                "editKategori"
            )
            .value
            .trim();


    currentProduct.sku =
        document
            .getElementById(
                "editSku"
            )
            .value
            .trim();


    currentProduct.gambar =
        document
            .getElementById(
                "editGambar"
            )
            .value
            .trim();


    currentProduct.deskripsi =
        document
            .getElementById(
                "editDeskripsi"
            )
            .value;


    currentProduct.whatsapp =
        document
            .getElementById(
                "editWhatsapp"
            )
            .value
            .trim();


    if(!currentProduct.harga){

        currentProduct.harga = {};

    }


    currentProduct.harga.normal =
        Number(
            document
                .getElementById(
                    "editHargaNormal"
                )
                .value
        ) || 0;


    currentProduct.harga.promo =
        Number(
            document
                .getElementById(
                    "editHargaPromo"
                )
                .value
        ) || 0;


    currentProduct.harga.status =
        document
            .getElementById(
                "editHargaStatus"
            )
            .value;


    /*
     * Update data di website utama
     */

    try{

        const products =
            frameWindowProducts();


        const index =
            products.findIndex(
                product =>
                    String(product.id)
                    ===
                    String(currentProduct.id)
            );


        if(index !== -1){

            products[index] =
                currentProduct;

        }


    }catch(error){

        console.error(error);

    }


    /*
     * Render ulang halaman produk.
     */

    try{

        if(
            typeof frame.contentWindow
                .renderAdminAllProducts
            ===
            "function"
        ){

            frame.contentWindow
                .renderAdminAllProducts();

        }

        else if(
            typeof frame.contentWindow
                .renderProductList
            ===
            "function"
        ){

            frame.contentWindow
                .renderProductList(
                    frameWindowProducts(),
                    "product-grid-auto"
                );

        }

    }catch(error){

        console.error(error);

    }


    /*
     * Simpan sementara browser.
     *
     * JSON asli tidak bisa ditulis
     * langsung oleh JavaScript browser.
     */

    try{

        localStorage.setItem(
            "adminProductDraft",
            JSON.stringify(
                frameWindowProducts()
            )
        );

    }catch(error){

        console.error(error);

    }


    closeEditor();


    alert(
        "Perubahan produk diterapkan di halaman admin."
    );

}


/* =========================================================
   STATIC ELEMENT EDITOR
========================================================= */

function openElementEditor(element){

    currentElement =
        element;


    currentProduct =
        null;


    editorTitle.textContent =
        "Edit Element";


    const isImage =
        element.tagName ===
        "IMG";


    if(isImage){

        editorBody.innerHTML = `

            <div class="editorField">

                <label>
                    URL / Path Gambar
                </label>

                <input
                    id="elementValue"
                    value="${escapeAttr(
                        element.getAttribute(
                            "src"
                        )
                    )}"
                >

            </div>

        `;

    }else{

        editorBody.innerHTML = `

            <div class="editorField">

                <label>
                    Isi Element
                </label>

                <textarea
                    id="elementValue"
                >${escapeHTML(
                    element.textContent
                )}</textarea>

            </div>

        `;

    }


    overlay.classList.add(
        "show"
    );

}


/* =========================================================
   SAVE STATIC
========================================================= */

function saveStaticElement(){

    if(!currentElement){

        return;

    }


    const input =
        document.getElementById(
            "elementValue"
        );


    if(
        currentElement.tagName
        ===
        "IMG"
    ){

        currentElement.src =
            input.value.trim();

    }else{

        currentElement.textContent =
            input.value;

    }

}


/* =========================================================
   CLOSE
========================================================= */

function closeEditor(){

    /*
     * Kalau element biasa
     * sedang diedit.
     */

    if(
        currentElement &&
        !currentProduct
    ){

        saveStaticElement();

    }


    overlay.classList.remove(
        "show"
    );


    currentProduct =
        null;

    currentElement =
        null;

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    );

}


function escapeAttr(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    );

}


function numberValue(value){

    return Number(value) || 0;

}


/* =========================================================
   IMAGE PATH
========================================================= */

function normalizeAdminImage(path){

    if(!path){

        return "";

    }


    if(
        path.startsWith(
            "http://"
        ) ||
        path.startsWith(
            "https://"
        ) ||
        path.startsWith(
            "/"
        )
    ){

        return path;

    }


    return "../" + path;

}


/* =========================================================
   SAVE BUTTON ROUTER
========================================================= */

document
    .querySelector(
        ".editorSave"
    )
    .addEventListener(
        "click",
        function(){

            if(currentProduct){

                saveEditor();

            }else{

                saveStaticElement();

                closeEditor();

            }

        }
    );


/* =========================================================
   OVERLAY CLICK
========================================================= */

overlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            overlay
        ){

            closeEditor();

        }

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeEditor();

        }

    }
);


</script>

</body>

</html>
