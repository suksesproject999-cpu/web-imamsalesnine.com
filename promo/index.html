<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050705"
>

<title>Promo Studio — Imam_salesfr</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
></script>


<style>

/* =========================================================
   PROMO STUDIO
   FULL PREMIUM INDEX
========================================================= */

:root{

    --lime:#8CC63F;
    --lime-bright:#9ADB4A;
    --lime-dark:#70A82F;

    --orange:#FF7A1A;
    --orange-light:#FF9141;
    --orange-dark:#E8610C;

    --bg:#050705;
    --bg-2:#070907;

    --panel:#090D0A;
    --panel-2:#0C120D;
    --panel-3:#101610;

    --white:#F5F7F3;
    --muted:#818981;
    --muted-2:#626A62;

    --border:rgba(255,255,255,.085);
    --border-strong:rgba(255,255,255,.14);
    --border-lime:rgba(140,198,63,.45);

    --shadow:
        0 25px 80px rgba(0,0,0,.42);

    --font:
        Poppins,
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    min-height:100vh;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(140,198,63,.075),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #050705 0%,
            #060906 100%
        );

    color:var(--white);

    font-family:var(--font);

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

button:disabled{
    cursor:wait;
}

img{
    max-width:100%;
}

input{
    outline:none;
}


/* =========================================================
   HEADER
========================================================= */

.topbar{

    position:sticky;
    top:0;
    z-index:1000;

    width:100%;

    min-height:78px;

    padding:
        13px
        clamp(16px,3vw,32px);

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    background:
        rgba(5,7,5,.96);

    border-bottom:
        1px solid rgba(255,255,255,.065);

    backdrop-filter:
        blur(22px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(130%);
}

.brand-name{

    color:#fff;

    font-size:
        clamp(22px,2.7vw,31px);

    line-height:.95;

    font-weight:900;

    letter-spacing:-1.6px;

    white-space:nowrap;
}

.brand-sub{

    margin-top:7px;

    color:var(--lime);

    font-size:
        clamp(8px,1vw,11px);

    line-height:1;

    font-weight:600;

    letter-spacing:
        clamp(.8px,.14vw,1.4px);

    white-space:nowrap;
}

.header-actions{

    display:flex;

    align-items:center;

    gap:9px;

    flex-shrink:0;
}

.header-btn{

    width:49px;
    height:49px;

    display:grid;
    place-items:center;

    border:
        1px solid var(--border);

    border-radius:15px;

    background:#080C09;

    color:#fff;

    transition:
        .18s ease;
}

.header-btn:hover{

    border-color:
        var(--border-lime);

    transform:
        translateY(-1px);
}

.header-btn.primary{

    color:#0B1007;

    background:var(--lime);

    border-color:var(--lime);

    box-shadow:
        0 8px 25px
        rgba(140,198,63,.13);
}

.header-btn.primary:hover{

    background:var(--lime-bright);

    border-color:var(--lime-bright);
}

.header-btn svg{

    width:20px;
    height:20px;
}


/* =========================================================
   MAIN
========================================================= */

main{

    width:100%;

    padding:
        18px
        18px
        90px;
}

.container{

    width:min(100%,1200px);

    margin:0 auto;
}


/* =========================================================
   STAGE
========================================================= */

.preview-wrap{
    width:100%;
}

.stage{

    width:100%;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    position:relative;
}


/* =========================================================
   PROMO CANVAS
========================================================= */

.promo-canvas{

    position:relative;

    width:100%;

    overflow:hidden;

    isolation:isolate;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(140,198,63,.055),
            transparent 34%
        ),
        #070907;

    border:
        1px solid rgba(255,255,255,.095);

    box-shadow:
        var(--shadow);
}


/* =========================================================
   RATIOS
========================================================= */

.stage.ratio-916 .promo-canvas{

    width:min(100%,520px);

    aspect-ratio:9 / 16;
}

.stage.ratio-45 .promo-canvas{

    width:min(100%,760px);

    aspect-ratio:4 / 5;
}

.stage.ratio-169 .promo-canvas{

    width:100%;

    aspect-ratio:16 / 9;
}


/* =========================================================
   PRODUCT VISUAL
========================================================= */

.product-visual{

    position:absolute;

    z-index:1;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.stage.ratio-916 .product-visual{

    top:0;
    left:0;
    right:0;

    height:56%;
}

.stage.ratio-45 .product-visual{

    top:0;
    left:0;
    right:0;

    height:59%;
}

.stage.ratio-169 .product-visual{

    top:0;
    left:0;

    width:57%;

    height:100%;
}


/* =========================================================
   IMAGE
========================================================= */

.product-image{

    width:100%;
    height:100%;

    padding:5%;

    display:block;

    object-fit:contain;
    object-position:center;

    user-select:none;

    -webkit-user-drag:none;
}


/* =========================================================
   GRADIENT
========================================================= */

.visual-gradient{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(5,7,5,0) 48%,
            rgba(5,7,5,.015) 62%,
            rgba(5,7,5,.10) 76%,
            rgba(5,7,5,.42) 91%,
            #070907 100%
        );
}


/* LANDSCAPE */
.stage.ratio-169 .visual-gradient{
    background:
        linear-gradient(
            to right,
            rgba(5,7,5,0) 48%,
            rgba(5,7,5,.015) 61%,
            rgba(5,7,5,.08) 75%,
            rgba(5,7,5,.38) 92%,
            #070907 100%
        );
}


/* =========================================================
   PROMO BADGE
========================================================= */

.promo-badge{

    position:absolute;

    z-index:40;

    width:max-content;

    max-width:32%;

    min-width:96px;

    height:34px;

    padding:
        0 14px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            var(--orange-light),
            var(--orange)
        );

    color:#1B0A02;

    font-size:8px;

    font-weight:950;

    letter-spacing:3px;

    line-height:1;

    white-space:nowrap;

    box-shadow:
        0 10px 30px
        rgba(255,122,26,.18);

    pointer-events:none;
}

.promo-badge::before{

    content:"";

    width:7px;
    height:7px;

    flex:0 0 7px;

    border-radius:50%;

    background:#1B0A02;
}


/* =========================================================
   BADGE PER RATIO
========================================================= */

.stage.ratio-916 .promo-badge{

    top:calc(56% + 12px);

    left:7%;

    height:34px;

    min-width:99px;
}

.stage.ratio-45 .promo-badge{

    top:calc(59% + 12px);

    left:7%;

    height:34px;

    min-width:101px;
}

.stage.ratio-169 .promo-badge{

    top:7%;

    left:61%;

    height:32px;

    min-width:96px;

    max-width:29%;
}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{

    position:absolute;

    z-index:20;

    min-width:0;

    overflow:visible;
}

.stage.ratio-916 .product-info{

    top:calc(56% + 61px);

    left:7%;

    right:6%;
}

.stage.ratio-45 .product-info{

    top:calc(59% + 61px);

    left:7%;

    right:7%;
}

.stage.ratio-169 .product-info{

    top:calc(7% + 52px);

    left:61%;

    right:5%;

    bottom:7%;
}


/* =========================================================
   BRAND
========================================================= */

.product-brand{

    color:var(--lime);

    font-size:
        clamp(8px,1vw,12px);

    line-height:1.1;

    font-weight:950;

    letter-spacing:
        clamp(2px,.3vw,3.5px);

    text-transform:uppercase;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   TITLE
========================================================= */

.product-name{

    margin:
        9px 0 0;

    color:#fff;

    font-weight:950;

    line-height:.98;

    letter-spacing:
        clamp(-1.8px,-.12vw,-.7px);

    max-width:96%;

    overflow:hidden;

    display:-webkit-box;

    -webkit-box-orient:vertical;
}


/* 9:16 */

.stage.ratio-916 .product-name{

    font-size:
        clamp(25px,5.8vw,42px);

    -webkit-line-clamp:2;
}


/* 4:5 */

.stage.ratio-45 .product-name{

    font-size:
        clamp(28px,4.15vw,51px);

    -webkit-line-clamp:2;
}


/* 16:9 */

.stage.ratio-169 .product-name{

    font-size:
        clamp(23px,3.1vw,44px);

    -webkit-line-clamp:3;
}


/* =========================================================
   PRICE
========================================================= */

.price-block{

    margin-top:17px;

    min-width:0;
}

.price-label{

    color:#7C857D;

    font-size:9px;

    line-height:1;

    font-weight:900;

    letter-spacing:3px;

    text-transform:uppercase;
}

.price-promo{

    margin-top:8px;

    color:#fff;

    font-weight:950;

    line-height:.94;

    letter-spacing:-2px;

    white-space:nowrap;
}

.stage.ratio-916 .price-promo{

    font-size:
        clamp(34px,7.8vw,52px);
}

.stage.ratio-45 .price-promo{

    font-size:
        clamp(37px,5.5vw,61px);
}

.stage.ratio-169 .price-promo{

    font-size:
        clamp(30px,3.8vw,54px);
}


/* =========================================================
   PRICE META
========================================================= */

.price-meta{

    margin-top:10px;

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:12px;

    min-height:18px;
}

.price-normal{

    color:#666E67;

    font-size:11px;

    line-height:1;

    white-space:nowrap;
}

.discount{

    color:var(--orange);

    font-size:11px;

    font-weight:950;

    line-height:1;

    white-space:nowrap;
}


/* =========================================================
   CAPTURE
========================================================= */

.capture-hide{
    pointer-events:none;
}

.capture-mode .capture-hide{
    display:none !important;
}


/* =========================================================
   CONTROL STRIP
========================================================= */

.control-strip{

    margin-top:13px;

    padding:14px;

    display:grid;

    grid-template-columns:
        minmax(260px,1.05fr)
        minmax(250px,1fr)
        minmax(190px,.7fr);

    align-items:center;

    gap:12px;

    border:
        1px solid var(--border);

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #0B100C,
            #070A08
        );
}


/* =========================================================
   RATIO
========================================================= */

.ratio-group{

    min-width:0;

    display:grid;

    grid-template-columns:
        auto
        repeat(3,minmax(0,1fr));

    align-items:center;

    gap:7px;
}

.ratio-caption{

    color:#717970;

    font-size:8px;

    font-weight:950;

    letter-spacing:2px;

    line-height:1;

    text-transform:uppercase;

    white-space:nowrap;
}

.ratio-btn{

    min-width:0;

    height:48px;

    padding:0 9px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:#080C09;

    color:#B7BEB7;

    transition:.18s ease;
}

.ratio-btn:hover{

    border-color:
        rgba(140,198,63,.35);

    transform:
        translateY(-1px);
}

.ratio-btn.active{

    color:var(--lime);

    border-color:var(--lime);

    background:
        rgba(140,198,63,.075);

    box-shadow:
        inset 0 0 22px
        rgba(140,198,63,.035);
}

.ratio-icon{

    width:13px;
    height:18px;

    flex:0 0 auto;

    border:
        1.5px solid currentColor;

    border-radius:3px;
}

.ratio-btn[data-ratio="45"] .ratio-icon{

    width:15px;
    height:18px;
}

.ratio-btn[data-ratio="169"] .ratio-icon{

    width:21px;
    height:12px;
}

.ratio-text{

    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:flex-start;
}

.ratio-value{

    font-size:9px;

    font-weight:950;

    white-space:nowrap;
}

.ratio-use{

    margin-top:3px;

    color:#737B73;

    font-size:7px;

    font-weight:600;

    white-space:nowrap;
}


/* =========================================================
   NAV
========================================================= */

.navigation{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;
}

.nav-btn{

    width:48px;
    height:48px;

    flex:0 0 48px;

    display:grid;

    place-items:center;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:#080C09;

    color:#fff;

    transition:.18s ease;
}

.nav-btn:hover{

    border-color:
        rgba(140,198,63,.4);

    transform:
        translateY(-1px);
}

.nav-btn svg{

    width:19px;
    height:19px;
}

.slide-count{

    min-width:45px;

    color:#AAB2AA;

    text-align:center;

    font-size:10px;

    font-weight:800;

    white-space:nowrap;
}


/* =========================================================
   DOWNLOAD BUTTON
========================================================= */

.download-btn{

    min-width:0;

    height:48px;

    padding:
        0 16px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--lime-bright),
            var(--lime)
        );

    color:#0B1007;

    font-size:10px;

    font-weight:950;

    letter-spacing:.35px;

    box-shadow:
        0 10px 25px
        rgba(140,198,63,.1);

    transition:.18s ease;

    touch-action:manipulation;

    user-select:none;
}

.download-btn:hover{

    filter:brightness(1.06);

    transform:
        translateY(-1px);
}

.download-btn:active{

    transform:
        translateY(0);
}

.download-btn:disabled{

    opacity:.72;

    pointer-events:none;

    cursor:wait;
}

.download-btn svg{

    width:18px;
    height:18px;

    flex:0 0 auto;
}

@keyframes promoDownloadSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   MANAGER
========================================================= */

.manager{

    margin-top:13px;

    padding:22px;

    border:
        1px solid var(--border);

    border-radius:20px;

    background:
        radial-gradient(
            circle at 88% 0%,
            rgba(140,198,63,.055),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #0A100B,
            #070A08
        );
}

.section-label{

    color:var(--lime);

    font-size:10px;

    font-weight:950;

    letter-spacing:3.5px;

    line-height:1;

    text-transform:uppercase;
}

.manager-heading{

    margin-top:8px;

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:18px;
}

.manager-title{

    margin:0;

    color:#fff;

    font-size:
        clamp(23px,2.7vw,36px);

    line-height:1;

    font-weight:950;

    letter-spacing:-1.4px;
}

.manager-summary{

    flex-shrink:0;

    color:#707870;

    font-size:11px;

    white-space:nowrap;
}

.manager-summary strong{

    color:var(--lime);
}


/* =========================================================
   TOOLBAR
========================================================= */

.manager-toolbar{

    margin-top:20px;

    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.tool-btn{

    min-height:42px;

    padding:
        0 16px;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:#080D09;

    color:#fff;

    font-size:9px;

    font-weight:850;

    transition:.18s ease;
}

.tool-btn:hover{

    border-color:
        rgba(140,198,63,.4);

    transform:
        translateY(-1px);
}

.tool-btn.primary{

    color:#10140D;

    background:var(--lime);

    border-color:var(--lime);
}

.tool-btn.primary:hover{

    background:var(--lime-bright);

    border-color:var(--lime-bright);
}


/* =========================================================
   SEARCH
========================================================= */

.search-row{

    margin-top:18px;

    display:flex;

    justify-content:flex-end;
}

.search{

    width:min(100%,280px);

    height:42px;

    padding:
        0 14px;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:#080D09;

    color:#fff;

    font-size:10px;

    transition:.18s ease;
}

.search::placeholder{

    color:#596159;
}

.search:focus{

    border-color:
        rgba(140,198,63,.5);

    box-shadow:
        0 0 0 3px
        rgba(140,198,63,.06);
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.product-grid{

    margin-top:14px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px,1fr)
        );

    gap:11px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.select-card{

    position:relative;

    min-width:0;

    min-height:215px;

    overflow:hidden;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #090E0A,
            #070A08
        );

    cursor:pointer;

    transition:.18s ease;
}

.select-card:hover{

    transform:
        translateY(-2px);

    border-color:
        rgba(140,198,63,.35);
}

.select-card.selected{

    border-color:var(--lime);

    box-shadow:
        0 0 0 1px
        rgba(140,198,63,.22);
}


/* =========================================================
   CARD IMAGE
========================================================= */

.select-image{

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:125px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#070A08;
}

.select-image img{

    width:100%;
    height:100%;

    padding:10px;

    object-fit:contain;
}

.select-image::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent 35%,
            #080C09 100%
        );
}


/* =========================================================
   CHECK
========================================================= */

.check{

    position:absolute;

    z-index:5;

    top:10px;
    left:10px;

    width:20px;
    height:20px;

    display:grid;

    place-items:center;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:5px;

    background:
        rgba(0,0,0,.58);

    color:transparent;
}

.select-card.selected .check{

    color:#11150C;

    background:var(--lime);

    border-color:var(--lime);
}

.check svg{

    width:12px;
    height:12px;
}


/* =========================================================
   CARD INFO
========================================================= */

.select-info{

    position:absolute;

    left:11px;
    right:11px;
    bottom:11px;

    z-index:4;

    min-width:0;
}

.select-brand{

    color:var(--lime);

    font-size:7px;

    font-weight:950;

    letter-spacing:1.8px;

    line-height:1.1;

    text-transform:uppercase;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.select-name{

    margin-top:4px;

    color:#fff;

    font-size:10px;

    line-height:1.25;

    font-weight:750;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;

    overflow:hidden;
}

.select-price{

    margin-top:6px;

    color:#fff;

    font-size:11px;

    line-height:1;

    font-weight:950;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.select-old{

/* =========================================================
   CINEMATIC WINDOW REVEAL
========================================================= */

.promo-canvas{
    --transition-duration:620ms;
}


/* panel penutup */

.promo-canvas::after{

    content:"";

    position:absolute;

    z-index:200;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            #050705 0%,
            #0a0e09 48%,
            #050705 100%
        );

    transform:
        scaleX(0);

    transform-origin:
        right center;

    opacity:0;

}


/* keluar */

.promo-canvas.slide-out::after{

    opacity:1;

    transform:
        scaleX(1);

    transform-origin:
        right center;

    transition:
        transform
        260ms
        cubic-bezier(.76,0,.24,1),
        opacity
        180ms
        ease;
}


/* buka dari kiri */

.promo-canvas.slide-in::after{

    opacity:1;

    transform:
        scaleX(0);

    transform-origin:
        left center;

    transition:
        transform
        420ms
        cubic-bezier(.16,1,.3,1),
        opacity
        180ms
        ease;
}


/* isi produk ikut sedikit cinematic movement */

.promo-canvas.slide-content
.product-visual{

    animation:
        promoWindowVisual
        650ms
        cubic-bezier(.16,1,.3,1)
        both;
}


.promo-canvas.slide-content
.product-info{

    animation:
        promoWindowInfo
        580ms
        cubic-bezier(.16,1,.3,1)
        90ms
        both;
}


.promo-canvas.slide-content
.promo-badge{

    animation:
        promoWindowBadge
        500ms
        cubic-bezier(.16,1,.3,1)
        100ms
        both;
}


@keyframes promoWindowVisual{

    from{

        opacity:.45;

        transform:
            scale(1.035)
            translateX(18px);

    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateX(0);

    }

}


@keyframes promoWindowInfo{

    from{

        opacity:0;

        transform:
            translateX(22px);

    }

    to{

        opacity:1;

        transform:
            translateX(0);

    }

}


@keyframes promoWindowBadge{

    from{

        opacity:0;

        transform:
            translateY(-8px)
            scale(.94);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* mobile lebih cepat */

@media(max-width:600px){

        --transition-duration:520ms;
    }

}


/* reduced motion */

@media(prefers-reduced-motion:reduce){

    .promo-canvas::after,
    .promo-canvas.slide-out::after,
    .promo-canvas.slide-in::after{

        transition:none !important;

    }

    .promo-canvas.slide-content
    .product-visual,
    .promo-canvas.slide-content
    .product-info,
    .promo-canvas.slide-content
    .promo-badge{

        animation:none !important;

    }

}

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    JSON:
        "produk.json",

    IMAGE_FOLDER:
        "images/produk/",

    DURATION:
        6500

};


/* =========================================================
   STATE
========================================================= */

let products = [];

let selectedIds = [];

let promoProducts = [];

let currentIndex = 0;

let currentRatio =
    localStorage.getItem(
        "promoRatio"
    ) || "916";

let playing = true;

let autoplay = null;

let downloadBusy = false;


/* =========================================================
   DOM
========================================================= */

const stage =
    document.getElementById(
        "stage"
    );

const productGrid =
    document.getElementById(
        "productGrid"
    );

const slideCount =
    document.getElementById(
        "slideCount"
    );

    document.getElementById(
        "selectedCount"
    );

    document.getElementById(
        "totalCount"
    );

    document.getElementById(
        "footerSelected"
    );

const footerTotal =
    document.getElementById(
        "footerTotal"
    );

const toast =
    document.getElementById(
        "toast"
    );

const downloadBtn =
    document.getElementById(
        "downloadBtn"
    );


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(
    message
){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2600
        );

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    try{

        const response =
            await fetch(
                CONFIG.JSON,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        products =
            Array.isArray(data)
                ? data
                : Array.isArray(data.products)
                    ? data.products
                    : [];


        if(!products.length){

            throw new Error(
                "produk.json kosong atau format tidak dikenali."
            );

        }


        products =
            products.map(
                normalizeProduct
            );


        totalCount.textContent =
            products.length;

        footerTotal.textContent =
            products.length;


        restoreSelection();


        if(!selectedIds.length){

            selectedIds =
                products
                .filter(
                    isPromo
                )
                .map(
                    p=>p.id
                );

        }


        renderManager();

        applyPromo(false);


    }catch(error){

        console.error(
            "[PROMO LOAD]",
            error
        );


        stage.innerHTML = `

            <div class="error">

                <strong>
                    Gagal memuat produk.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <pre>promo/
├── index.html
├── produk.json
└── images/
    └── produk/
        ├── produk-1.jpg
        └── produk-2.jpg</pre>

            </div>

        `;

    }

}


/* =========================================================
   NORMALIZE PRODUCT
========================================================= */

function normalizeProduct(
    p,
    index
){

    const id =
        String(
            p.id ??
            p.kode ??
            p.sku ??
            index + 1
        );


    let normal = 0;
    let promo = 0;


    if(
        p.harga &&
        typeof p.harga === "object"
    ){

        normal =
            Number(
                p.harga.normal
            ) || 0;

        promo =
            Number(
                p.harga.promo
            ) || 0;

    }else{

        normal =
            Number(
                p.harga
            ) || 0;

        promo =
            Number(
                p.hargaPromo
            ) || 0;

    }


    return {

        ...p,

        id,

        brand:
            p.brand ||
            p.merek ||
            "NINE LUXIMOS",

        nama:
            p.nama ||
            p.name ||
            "Produk",

        gambar:
            p.gambar ||
            p.image ||
            p.foto ||
            "",

        harga:{

            normal,

            promo,

            status:
                p.harga?.status ||
                "Aktif"

        }

    };

}


/* =========================================================
   IMAGE PATH
========================================================= */

function imagePath(
    product
){

    let path =
        String(
            product.gambar ||
            ""
        ).trim();


    if(!path){

        return "";

    }


    path =
        path.replace(
            /^\/+/,
            ""
        );


    if(
        path.startsWith(
            "images/"
        )
    ){

        return path;

    }


    return CONFIG.IMAGE_FOLDER + path;

}


/* =========================================================
   PROMO CHECK
========================================================= */

function isPromo(
    product
){

    const normal =
        Number(
            product.harga?.normal
        ) || 0;

    const promo =
        Number(
            product.harga?.promo
        ) || 0;


    return (
        normal > 0 &&
        promo > 0 &&
        promo < normal
    );

}


/* =========================================================
   TITLE ENGINE
========================================================= */

function makeDisplayTitle(
    product
){

    let title =
        String(
            product.nama ||
            ""
        );


    const brand =
        String(
            product.brand ||
            ""
        );


    if(brand){

        const words =
            brand
            .split(/\s+/)
            .filter(Boolean)
            .map(
                escapeRegExp
            )
            .join("\\s+");


        if(words){

            title =
                title.replace(
                    new RegExp(
                        words,
                        "ig"
                    ),
                    ""
                );

        }

    }


    title =
        title
        .replace(
            /\b(NINE|LUXIMOS)\b/gi,
            ""
        )
        .replace(
            /\s*[-–—|:;,]+\s*/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    title =
        title.replace(
            /\b(dengan|with|seri|series|variant|varian)\b.*$/i,
            ""
        ).trim();


    /*
     * Headline jangan kepanjangan.
     */

    if(title.length > 58){

        const words =
            title.split(/\s+/);

        let compact = "";

        for(
            const word of words
        ){

            const candidate =
                compact
                    ? `${compact} ${word}`
                    : word;


            if(
                candidate.length > 58
            ){

                break;

            }


            compact =
                candidate;

        }


        title =
            compact ||
            title.slice(0,58);

    }


    return title
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   ESCAPE REGEXP
========================================================= */

function escapeRegExp(
    value
){

    return String(value)
        .replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );

}

                    String(

            : "0 / 0";

}


let transitionBusy = false;


/* =========================================================
   CINEMATIC SLIDE
========================================================= */

async function changeSlide(
    direction
){

    if(
        transitionBusy ||
        promoProducts.length < 2
    ){

        return;

    }


    transitionBusy = true;

    stopAutoplay();


    const canvas =
        document.getElementById(
            "promoCanvas"
        );


    /*
     * Kalau preview belum tersedia,
     * langsung render.
     */

    if(!canvas){

        currentIndex =
            (
                currentIndex +
                direction +
                promoProducts.length
            )
            %
            promoProducts.length;

        renderPreview();

        transitionBusy = false;

        return;

    }


    /*
     * STEP 1
     * Tutup seperti jendela.
     */

    canvas.classList.remove(
        "slide-in",
        "slide-content"
    );

    canvas.classList.add(
        "slide-out"
    );


    await wait(270);


    /*
     * STEP 2
     * Ganti produk ketika layar
     * sudah tertutup.
     */

    currentIndex =
        (
            currentIndex +
            direction +
            promoProducts.length
        )
        %
        promoProducts.length;


    renderPreview(
        false
    );


    const newCanvas =
        document.getElementById(
            "promoCanvas"
        );


    if(!newCanvas){

        transitionBusy = false;

        return;

    }


    /*
     * STEP 3
     * Buka kembali dari kiri.
     */

    newCanvas.classList.add(
        "slide-in"
    );


    await wait(30);


    newCanvas.classList.add(
        "slide-content"
    );


    await wait(470);


    newCanvas.classList.remove(
        "slide-out"
    );


    transitionBusy = false;


    if(playing){

        startAutoplay();

    }

}






function nextSlide(){

    changeSlide(1);

}


function previousSlide(){

    changeSlide(-1);

}

/* =========================================================
   DOWNLOAD HELPERS
========================================================= */

function wait(
    ms
){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


async function waitForImages(
    root
){

    const images =
        Array.from(
            root.querySelectorAll(
                "img"
            )
        );


    for(
        const img of images
    ){

        if(
            !img.complete
        ){

            await new Promise(
                resolve=>{

                    let finished =
                        false;


                    const done =
                        ()=>{
                            if(finished){
                                return;
                            }

                            finished =
                                true;

                            img.removeEventListener(
                                "load",
                                done
                            );

                            img.removeEventListener(
                                "error",
                                done
                            );

                            resolve();
                        };


                    img.addEventListener(
                        "load",
                        done,
                        {
                            once:true
                        }
                    );

                    img.addEventListener(
                        "error",
                        done,
                        {
                            once:true
                        }
                    );


                    setTimeout(
                        done,
                        6000
                    );

                }
            );

        }


        if(
            typeof img.decode ===
            "function"
        ){

            try{

                await Promise.race(
                    [
                        img.decode(),
                        wait(2500)
                    ]
                );

            }catch{}

        }

    }

}


async function waitForFonts(){

    if(
        document.fonts &&
        document.fonts.ready
    ){

        try{

            await Promise.race(
                [
                    document.fonts.ready,
                    wait(3500)
                ]
            );

        }catch{}

    }

}


/* =========================================================
   SAVE BLOB
========================================================= */

async function saveBlob(
    blob,
    filename
){

    if(
        !blob ||
        blob.size <= 0
    ){

        throw new Error(
            "EMPTY_BLOB"
        );

    }


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;

    link.download =
        filename;

    link.setAttribute(
        "download",
        filename
    );

    link.style.position =
        "fixed";

    link.style.left =
        "-9999px";

    link.style.top =
        "-9999px";

    link.style.opacity =
        "0";


    document.body.appendChild(
        link
    );


    /*
     * Ini sengaja dipanggil langsung
     * dari chain klik tombol.
     */

    link.click();


    await wait(500);


    link.remove();

    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   DOWNLOAD STATUS — FINAL
========================================================= */

async function downloadStatus(){

    if(downloadBusy){

        return;

    }


    const source =
        document.getElementById(
            "promoCanvas"
        );


    const product =
        promoProducts[
            currentIndex
        ];


    if(!source){

        showToast(
            "Preview belum siap."
        );

        return;

    }


    if(!product){

        showToast(
            "Produk belum tersedia."
        );

        return;

    }


    if(
        typeof html2canvas !==
        "function"
    ){

        showToast(
            "Engine export belum siap."
        );

        console.error(
            "[PROMO DOWNLOAD] html2canvas unavailable."
        );

        return;

    }


    downloadBusy =
        true;


    /*
     * PENTING:
     * button didefinisikan di luar try
     * supaya finally selalu aman.
     */

    const button =
        downloadBtn;


    const originalHTML =
        button
            ? button.innerHTML
            : "";


    const wasPlaying =
        playing;


    try{

        /* ---------------------------------------------
           STOP AUTOPLAY
        --------------------------------------------- */

        stopAutoplay();


        /* ---------------------------------------------
           LOCK BUTTON
        --------------------------------------------- */

        if(button){

            button.disabled =
                true;

            button.innerHTML = `

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    style="
                        width:18px;
                        height:18px;
                        animation:
                            promoDownloadSpin
                            .7s linear infinite;
                    "
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="9"
                        stroke-opacity=".25"
                    ></circle>

                    <path
                        d="M21 12a9 9 0 0 0-9-9"
                    ></path>

                </svg>

                MEMBUAT...

            `;

        }


        showToast(
            "Menyiapkan status..."
        );


        /* ---------------------------------------------
           WAIT IMAGE + FONT
        --------------------------------------------- */

        await waitForImages(
            source
        );

        await waitForFonts();


        /* ---------------------------------------------
           STABILKAN LAYOUT
        --------------------------------------------- */

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    ()=>{
                        requestAnimationFrame(
                            resolve
                        );
                    }
                )
        );


        document.body.classList.add(
            "capture-mode"
        );


        await wait(100);


        /* ---------------------------------------------
           SIZE
        --------------------------------------------- */

        const rect =
            source.getBoundingClientRect();


        const width =
            Math.max(
                1,
                Math.round(
                    rect.width
                )
            );


        const height =
            Math.max(
                1,
                Math.round(
                    rect.height
                )
            );


        /*
         * Jangan paksa scale 2.5.
         * Device mobile gampang OOM.
         */

        const scale =
            Math.min(
                2,
                Math.max(
                    1,
                    window.devicePixelRatio || 1
                )
            );


        showToast(
            "Merender status..."
        );


        /* ---------------------------------------------
           HTML2CANVAS
        --------------------------------------------- */

        const canvas =
            await new Promise(
                (
                    resolve,
                    reject
                )=>{

                    let settled =
                        false;


                    const finish =
                        (
                            fn,
                            value
                        )=>{

                            if(settled){
                                return;
                            }

                            settled =
                                true;

                            fn(
                                value
                            );

                        };


                    const timeout =
                        setTimeout(
                            ()=>{
                                finish(
                                    reject,
                                    new Error(
                                        "EXPORT_TIMEOUT"
                                    )
                                );
                            },
                            15000
                        );


                    html2canvas(
                        source,
                        {

                            backgroundColor:
                                "#070907",

                            width,

                            height,

                            scale,

                            useCORS:true,

                            allowTaint:false,

                            imageTimeout:8000,

                            logging:false,

                            foreignObjectRendering:false,

                            removeContainer:true,

                            scrollX:0,

                            scrollY:0

                        }
                    )
                    .then(
                        result=>{

                            clearTimeout(
                                timeout
                            );

                            finish(
                                resolve,
                                result
                            );

                        }
                    )
                    .catch(
                        error=>{

                            clearTimeout(
                                timeout
                            );

                            finish(
                                reject,
                                error
                            );

                        }
                    );

                }
            );


        document.body.classList.remove(
            "capture-mode"
        );


        /* ---------------------------------------------
           VALIDATE
        --------------------------------------------- */

        if(
            !canvas ||
            !canvas.width ||
            !canvas.height
        ){

            throw new Error(
                "INVALID_CANVAS"
            );

        }


        /* ---------------------------------------------
           PNG
        --------------------------------------------- */

        showToast(
            "Menyiapkan file PNG..."
        );


        const blob =
            await new Promise(
                (
                    resolve,
                    reject
                )=>{

                    canvas.toBlob(
                        result=>{

                            if(
                                result &&
                                result.size > 0
                            ){

                                resolve(
                                    result
                                );

                            }else{

                                reject(
                                    new Error(
                                        "PNG_BLOB_FAILED"
                                    )
                                );

                            }

                        },
                        "image/png",
                        1
                    );

                }
            );


        /* ---------------------------------------------
           FILE NAME
        --------------------------------------------- */

        const ratio =
            currentRatio === "916"
                ? "9x16"
                : currentRatio === "45"
                    ? "4x5"
                    : "16x9";


        const filename =
            `PROMO-${slug(
                makeDisplayTitle(
                    product
                )
            )}-${ratio}.png`;


        /* ---------------------------------------------
           ACTUAL DOWNLOAD
        --------------------------------------------- */

        showToast(
            "Mengunduh status..."
        );


        await saveBlob(
            blob,
            filename
        );


        showToast(
            "Status berhasil didownload ✓"
        );


    }catch(error){

        console.error(
            "[PROMO DOWNLOAD ERROR]",
            error
        );


        document.body.classList.remove(
            "capture-mode"
        );


        if(
            error &&
            error.message ===
            "EXPORT_TIMEOUT"
        ){

            showToast(
                "Export terlalu lama. Coba lagi."
            );

        }else if(
            error &&
            error.message ===
            "PNG_BLOB_FAILED"
        ){

            showToast(
                "Browser gagal membuat PNG."
            );

        }else if(
            error &&
            error.message ===
            "EMPTY_BLOB"
        ){

            showToast(
                "File PNG kosong."
            );

        }else{

            showToast(
                "Gagal membuat status."
            );

        }

    }finally{

        /*
         * SELALU bersihkan.
         */

        document.body.classList.remove(
            "capture-mode"
        );


        /*
         * SELALU unlock tombol.
         */

        if(button){

            button.disabled =
                false;

            button.innerHTML =
                originalHTML;

        }


        downloadBusy =
            false;


        /*
         * Kembalikan autoplay
         * hanya jika sebelumnya aktif.
         */

        if(wasPlaying){

            playing =
                true;

            updatePlayIcons();

            startAutoplay();

        }

    }

}

/* =========================================================
   SWIPE
========================================================= */

let touchStartX = 0;


stage.addEventListener(
    "touchstart",
    event=>{

        touchStartX =
            event
            .changedTouches[0]
            .screenX;

    },
    {
        passive:true
    }
);


stage.addEventListener(
    "touchend",
    event=>{

        const endX =
            event
            .changedTouches[0]
            .screenX;


        const distance =
            endX -
            touchStartX;


        if(
            Math.abs(distance) < 45
        ){

            return;

        }


        if(
            distance < 0
        ){

            nextSlide();

        }else{

            previousSlide();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "ArrowRight"
        ){

            nextSlide();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousSlide();

        }


        if(
            event.key === " "
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.key.toLowerCase()
            === "f"
        ){

            fullscreen();

        }


        if(
            event.key.toLowerCase()
            === "d"
        ){

            downloadStatus();

        }

    }
);

/* =========================================================
   RUPIAH
========================================================= */

function rupiah(
    value
){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(
        Number(value) || 0
    );

}


/* =========================================================
   SLUG
========================================================= */

function slug(
    value
){

    return String(
        value
    )
    .toLowerCase()
    .replace(
        /[^a-z0-9]+/g,
        "-"
    )
    .replace(
        /^-+|-+$/g,
        ""
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}
