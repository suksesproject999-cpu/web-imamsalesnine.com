<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050705"
>

<title>Promo Studio — Imam_salesfr</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
></script>


<style>

/* =========================================================
   IMAM_SALESFR — PROMO STUDIO
   PREMIUM FINAL
========================================================= */

:root{

    --lime:#8CC63F;
    --lime-bright:#A1DD51;
    --lime-dark:#6EA52F;

    --orange:#FF7A1A;
    --orange-light:#FF9344;
    --orange-dark:#E45F08;

    --black:#030503;
    --bg:#050705;
    --panel:#090D0A;
    --panel-2:#0D120E;

    --white:#F7F9F5;
    --soft:#DCE2DA;

    --muted:#858E84;
    --muted-dark:#626A62;

    --line:rgba(255,255,255,.085);
    --line-soft:rgba(255,255,255,.055);

    --shadow:
        0 32px 90px rgba(0,0,0,.48);

    --display:
        "Manrope",
        Inter,
        system-ui,
        sans-serif;

    --body:
        "Plus Jakarta Sans",
        Inter,
        system-ui,
        sans-serif;

}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:var(--bg);
}

body{

    margin:0;
    min-height:100vh;

    overflow-x:hidden;

    color:var(--white);

    font-family:var(--body);

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(140,198,63,.085),
            transparent 34%
        ),
        linear-gradient(
            180deg,
            #050705 0%,
            #060806 100%
        );

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;

}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

img{
    max-width:100%;
}


/* =========================================================
   HEADER
========================================================= */

.topbar{

    position:sticky;
    top:0;
    z-index:1000;

    min-height:86px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:24px;

    padding:
        16px
        clamp(18px,4vw,40px);

    background:
        rgba(4,6,4,.93);

    border-bottom:
        1px solid var(--line);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

}

.header-brand{
    min-width:0;
}

.brand-name{

    margin:0;

    color:#fff;

    font-family:var(--display);

    font-size:
        clamp(23px,3vw,33px);

    line-height:1;

    font-weight:800;

    letter-spacing:
        -.9px;

    white-space:nowrap;

}

.brand-sub{

    margin-top:7px;

    color:var(--lime);

    font-size:
        clamp(10px,1.2vw,13px);

    line-height:1;

    font-weight:700;

    letter-spacing:.3px;

}

.header-actions{

    display:flex;
    align-items:center;
    gap:10px;

    flex:0 0 auto;

}

.header-btn{

    width:56px;
    height:56px;

    display:grid;
    place-items:center;

    color:#fff;

    background:
        rgba(10,14,10,.92);

    border:
        1px solid rgba(255,255,255,.11);

    border-radius:17px;

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;

}

.header-btn:hover{

    transform:translateY(-2px);

    border-color:
        rgba(140,198,63,.5);

}

.header-btn.primary{

    color:#101509;

    background:var(--lime);

    border-color:var(--lime);

}

.header-btn.primary:hover{
    background:var(--lime-bright);
}

.header-btn svg{
    width:21px;
    height:21px;
}


/* =========================================================
   MAIN
========================================================= */

main{

    width:100%;

    padding:
        18px
        18px
        90px;

}

.container{

    width:min(100%,1180px);

    margin:auto;

}


/* =========================================================
   STAGE
========================================================= */

.stage{

    width:100%;

    display:flex;
    justify-content:center;

    position:relative;

    transition:
        opacity .2s ease;

}

.promo-canvas{

    position:relative;

    overflow:hidden;

    isolation:isolate;

    width:100%;

    background:
        #070907;

    border:
        1px solid rgba(255,255,255,.09);

    box-shadow:var(--shadow);

    transition:
        transform 1.15s cubic-bezier(.22,.61,.36,1),
        opacity 1.05s ease,
        filter 1.05s ease;

}


/* =========================================================
   RATIO CANVAS
========================================================= */

.stage.ratio-916 .promo-canvas{

    width:min(100%,520px);

    aspect-ratio:9 / 16;

}

.stage.ratio-45 .promo-canvas{

    width:min(100%,760px);

    aspect-ratio:4 / 5;

}

.stage.ratio-169 .promo-canvas{

    width:100%;

    aspect-ratio:16 / 9;

}


/* =========================================================
   TRANSITION
========================================================= */

.promo-canvas.slide-out{

    opacity:0;

    transform:
        translateX(-4.5%)
        scale(.985);

    filter:
        brightness(.55)
        blur(1.2px);

}

.promo-canvas.slide-in{

    opacity:0;

    transform:
        translateX(4.5%)
        scale(1.012);

    filter:
        brightness(.58)
        blur(1.2px);

}

.promo-canvas.slide-content{

    opacity:1;

    transform:
        translateX(0)
        scale(1);

    filter:
        brightness(1)
        blur(0);

}


/* =========================================================
   VISUAL AREA
========================================================= */

.product-visual{

    position:absolute;

    z-index:1;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255,255,255,.035),
            transparent 55%
        ),
        #020302;

}


/* 9:16 */

.stage.ratio-916 .product-visual{

    inset:
        0 0 auto 0;

    height:55%;

}


/* 4:5 */

.stage.ratio-45 .product-visual{

    inset:
        0 0 auto 0;

    height:58%;

}


/* 16:9 */

.stage.ratio-169 .product-visual{

    inset:
        0 auto 0 0;

    width:57%;

}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{

    display:block;

    width:100%;
    height:100%;

    padding:
        clamp(18px,4.5%,42px);

    object-fit:contain;
    object-position:center;

    opacity:1;

    filter:none;

    mix-blend-mode:normal;

    user-select:none;

    -webkit-user-drag:none;

}


/* =========================================================
   VISUAL GRADIENT
========================================================= */

.visual-gradient{

    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent 48%,
            rgba(7,9,7,.05) 60%,
            rgba(7,9,7,.32) 78%,
            rgba(7,9,7,.9) 96%,
            #070907 100%
        );

}

.stage.ratio-169 .visual-gradient{

    background:
        linear-gradient(
            to right,
            transparent 35%,
            rgba(7,9,7,.08) 47%,
            rgba(7,9,7,.4) 62%,
            rgba(7,9,7,.9) 78%,
            #070907 100%
        );

}


/* =========================================================
   LOWER INFORMATION AREA
========================================================= */

.info-zone{

    position:absolute;

    z-index:15;

    overflow:hidden;

}


/* 9:16 */

.stage.ratio-916 .info-zone{

    left:0;
    right:0;
    bottom:0;

    height:45%;

    padding:
        18px 8% 7%;

}


/* 4:5 */

.stage.ratio-45 .info-zone{

    left:0;
    right:0;
    bottom:0;

    height:42%;

    padding:
        17px 7% 6%;

}


/* 16:9 */

.stage.ratio-169 .info-zone{

    top:0;
    right:0;
    bottom:0;

    width:43%;

    padding:
        8% 6% 7% 4%;

}


/* =========================================================
   INFO CONTENT
========================================================= */

.product-info{

    position:relative;

    z-index:20;

    width:100%;

    min-width:0;

}


/* =========================================================
   BADGE AREA
========================================================= */

.badge-stack{

    position:relative;

    z-index:40;

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:11px;

}


/* =========================================================
   PROMO BADGE
========================================================= */

.promo-badge{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    height:31px;

    min-width:91px;

    padding:
        0 13px;

    border-radius:999px;

    color:#190A03;

    background:
        linear-gradient(
            135deg,
            var(--orange-light),
            var(--orange) 60%,
            var(--orange-dark)
        );

    font-size:8px;

    line-height:1;

    font-weight:800;

    letter-spacing:2.6px;

    white-space:nowrap;

    box-shadow:
        0 9px 22px
        rgba(255,122,26,.16);

}

.promo-badge::before{

    content:"";

    width:6px;
    height:6px;

    margin-right:7px;

    border-radius:50%;

    background:#190A03;

}


/* =========================================================
   EXTRA BADGE
========================================================= */

.extra-discount-badge{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    height:26px;

    padding:
        0 11px;

    border-radius:999px;

    color:var(--orange-light);

    background:
        rgba(255,122,26,.08);

    border:
        1px solid
        rgba(255,122,26,.35);

    font-size:7px;

    line-height:1;

    font-weight:800;

    letter-spacing:1.3px;

    white-space:nowrap;

}


/* =========================================================
   BRAND
========================================================= */

.product-brand{

    margin:0;

    color:var(--lime);

    font-size:
        clamp(9px,1.05vw,12px);

    line-height:1.1;

    font-weight:800;

    letter-spacing:
        clamp(1.8px,.32vw,3px);

    text-transform:uppercase;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================================================
   PRODUCT TITLE
========================================================= */

.product-name{

    margin:
        7px 0 0;

    color:#fff;

    font-family:var(--display);

    font-size:
        clamp(24px,3.2vw,43px);

    line-height:
        1.02;

    font-weight:800;

    letter-spacing:
        -.65px;

    max-width:100%;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;

    overflow:hidden;

    text-wrap:balance;

}


/* 9:16 */

.stage.ratio-916 .product-name{

    font-size:
        clamp(25px,6.1vw,37px);

    line-height:
        1.01;

    letter-spacing:
        -.55px;

}


/* 4:5 */

.stage.ratio-45 .product-name{

    font-size:
        clamp(27px,5.1vw,42px);

    line-height:
        1.02;

}


/* 16:9 */

.stage.ratio-169 .product-name{

    font-size:
        clamp(20px,2.65vw,34px);

    line-height:
        1.03;

}


/* =========================================================
   PRICE
========================================================= */

.price-block{

    margin-top:
        clamp(13px,2vw,19px);

}

.price-label{

    margin-bottom:6px;

    color:#7D867D;

    font-size:
        clamp(8px,.85vw,10px);

    line-height:1;

    font-weight:800;

    letter-spacing:
        2.4px;

    text-transform:uppercase;

}

.price-promo{

    color:#fff;

    font-family:var(--display);

    font-size:
        clamp(31px,4.4vw,56px);

    line-height:.95;

    font-weight:800;

    letter-spacing:
        -1.5px;

    white-space:nowrap;

}


/* 9:16 */

.stage.ratio-916 .price-promo{

    font-size:
        clamp(31px,7.1vw,46px);

}


/* 4:5 */

.stage.ratio-45 .price-promo{

    font-size:
        clamp(33px,6.2vw,52px);

}


/* 16:9 */

.stage.ratio-169 .price-promo{

    font-size:
        clamp(24px,4vw,40px);

}


/* =========================================================
   PRICE META
========================================================= */

.price-meta{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-top:9px;

}

.price-normal{

    color:#707970;

    font-size:
        clamp(9px,.9vw,12px);

    line-height:1;

    font-weight:500;

}

.price-normal s{
    text-decoration-thickness:1px;
}

.discount{

    color:var(--lime);

    font-size:
        clamp(9px,.95vw,12px);

    line-height:1;

    font-weight:800;

}

.extra-price-note{

    margin-top:8px;

    color:var(--orange-light);

    font-size:
        clamp(8px,.85vw,10px);

    line-height:1;

    font-weight:800;

    letter-spacing:1px;

    text-transform:uppercase;

}


/* =========================================================
   WATERMARK
========================================================= */

.capture-hide{

    position:absolute;

    right:5%;
    bottom:3.5%;

    z-index:80;

    color:
        rgba(190,196,188,.55);

    font-size:7px;

    font-weight:500;

}


/* =========================================================
   CONTROL STRIP
========================================================= */

.control-strip{

    margin-top:12px;

    padding:14px;

    display:grid;

    grid-template-columns:
        1.35fr
        1fr;

    gap:13px;

    background:
        linear-gradient(
            145deg,
            rgba(16,22,17,.96),
            rgba(8,11,9,.98)
        );

    border:
        1px solid var(--line);

    border-radius:21px;

}


/* =========================================================
   RATIO
========================================================= */

.ratio-group{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:9px;

}

.ratio-caption{

    grid-column:1/-1;

    color:#737C73;

    font-size:8px;

    line-height:1;

    font-weight:800;

    letter-spacing:1.7px;

    text-transform:uppercase;

}

.ratio-btn{

    min-width:0;

    min-height:60px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    padding:
        8px 10px;

    color:#A4ACA3;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:16px;

    transition:
        transform .16s ease,
        border-color .16s ease,
        background .16s ease,
        color .16s ease;

}

.ratio-btn:hover{

    transform:translateY(-1px);

    border-color:
        rgba(140,198,63,.3);

}

.ratio-btn.active{

    color:var(--lime);

    background:
        rgba(140,198,63,.075);

    border-color:
        rgba(140,198,63,.68);

}

.ratio-icon{

    width:13px;
    height:21px;

    border:
        2px solid currentColor;

    border-radius:3px;

    flex:0 0 auto;

}

.ratio-btn[data-ratio="45"] .ratio-icon{

    width:17px;
    height:21px;

}

.ratio-btn[data-ratio="169"] .ratio-icon{

    width:25px;
    height:14px;

}

.ratio-text{

    display:flex;
    flex-direction:column;

    align-items:flex-start;

    gap:3px;

    min-width:0;

}

.ratio-value{

    font-size:12px;

    line-height:1;

    font-weight:800;

}

.ratio-use{

    color:#687067;

    font-size:7px;

    line-height:1;

    font-weight:600;

}

.ratio-btn.active .ratio-use{
    color:rgba(140,198,63,.78);
}


/* =========================================================
   NAV
========================================================= */

.navigation{

    display:grid;

    grid-template-columns:
        repeat(3,1fr)
        auto;

    align-items:center;

    gap:9px;

}

.nav-btn{

    min-width:56px;
    height:60px;

    display:grid;
    place-items:center;

    color:#fff;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:16px;

}

.nav-btn:hover{

    border-color:
        rgba(140,198,63,.35);

}

.nav-btn svg{

    width:21px;
    height:21px;

}

.slide-count{

    min-width:47px;

    color:#858D85;

    text-align:center;

    font-size:11px;

    font-weight:800;

}


/* =========================================================
   DOWNLOAD
========================================================= */

.download-btn{

    min-height:60px;

    padding:
        0 19px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    color:#0D1409;

    background:
        linear-gradient(
            135deg,
            #8CC63F,
            #9BDD4A
        );

    border-radius:16px;

    font-size:11px;

    font-weight:800;

    letter-spacing:.3px;

    transition:
        transform .16s ease,
        filter .16s ease,
        opacity .16s ease;

}

.download-btn:hover{

    transform:translateY(-1px);

    filter:brightness(1.05);

}

.download-btn:disabled{

    opacity:.62;

    cursor:wait;

}

.download-btn svg{

    width:19px;
    height:19px;

}

.download-spinner{

    width:18px;
    height:18px;

    border:
        2px solid rgba(13,20,9,.2);

    border-top-color:#0D1409;

    border-radius:50%;

    animation:
        spin .7s linear infinite;

}

@keyframes spin{
    to{transform:rotate(360deg);}
}


/* =========================================================
   MANAGER
========================================================= */

.manager{

    margin-top:12px;

    padding:26px;

    background:
        linear-gradient(
            145deg,
            rgba(8,14,9,.98),
            rgba(6,10,7,.98)
        );

    border:
        1px solid var(--line);

    border-radius:23px;

}

.section-label{

    color:var(--lime);

    font-size:10px;

    line-height:1;

    font-weight:800;

    letter-spacing:3px;

    text-transform:uppercase;

}

.manager-heading{

    margin-top:9px;

    display:flex;

    align-items:flex-end;
    justify-content:space-between;

    gap:20px;

}

.manager-title{

    margin:0;

    color:#fff;

    font-family:var(--display);

    font-size:
        clamp(23px,3vw,36px);

    line-height:1;

    font-weight:800;

    letter-spacing:-.8px;

}

.manager-summary{

    color:#7D857D;

    font-size:11px;

    font-weight:600;

    white-space:nowrap;

}

.manager-summary strong{
    color:var(--lime);
}


/* =========================================================
   TOOLBAR
========================================================= */

.manager-toolbar{

    margin-top:21px;

    display:grid;

    grid-template-columns:
        repeat(6,minmax(0,1fr));

    gap:9px;

}

.tool-btn{

    min-height:47px;

    padding:
        0 13px;

    color:#E4E9E3;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:13px;

    font-size:10px;

    font-weight:700;

}

.tool-btn:hover{

    border-color:
        rgba(140,198,63,.35);

}

.tool-btn.primary{

    color:#0D1409;

    background:var(--lime);

    border-color:var(--lime);

}

.tool-btn.primary:hover{
    background:var(--lime-bright);
}


/* =========================================================
   SEARCH
========================================================= */

.search-row{
    margin-top:11px;
}

.search{

    width:100%;
    height:47px;

    padding:
        0 15px;

    color:#fff;

    outline:none;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:13px;

    font-size:11px;

}

.search::placeholder{
    color:#5F675F;
}

.search:focus{

    border-color:
        rgba(140,198,63,.55);

    box-shadow:
        0 0 0 3px
        rgba(140,198,63,.065);

}


/* =========================================================
   PRODUCT GRID
========================================================= */

.product-grid{

    margin-top:13px;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:9px;

}


/* =========================================================
   PRODUCT CARD
========================================================= */

.select-card{

    position:relative;

    min-width:0;

    height:274px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #0B100C,
            #070A08
        );

    border:
        1px solid rgba(255,255,255,.075);

    border-radius:15px;

    cursor:pointer;

    transition:
        transform .16s ease,
        border-color .16s ease,
        box-shadow .16s ease;

}

.select-card:hover{

    transform:translateY(-2px);

    border-color:
        rgba(140,198,63,.3);

}

.select-card.selected{

    border-color:
        rgba(140,198,63,.72);

    box-shadow:
        0 0 0 1px
        rgba(140,198,63,.13);

}


/* =========================================================
   CARD IMAGE
========================================================= */

.select-image{

    position:absolute;

    inset:
        0 0 auto 0;

    height:146px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#050705;

}

.select-image img{

    width:100%;
    height:100%;

    padding:9px;

    object-fit:contain;

}

.select-image::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent 42%,
            #090D0A 100%
        );

}

<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    JSON:
        "produk.json",

    IMAGE_FOLDER:
        "images/produk/",

    DURATION:
        8500,

    TRANSITION:
        1200

};


/* =========================================================
   STORAGE
========================================================= */

const STORAGE = {

    SELECTION:
        "promoSelection",

    RATIO:
        "promoRatio",

    PRICES:
        "promoPriceOverrides"

};


/* =========================================================
   STATE
========================================================= */

let products = [];

let selectedIds = [];

let promoProducts = [];

let currentIndex = 0;

let currentRatio =
    localStorage.getItem(
        STORAGE.RATIO
    ) || "916";

let playing = true;

let autoplay = null;

let transitionBusy = false;

let downloadBusy = false;

let searchQuery = "";

let priceOverrides =
    loadPriceOverrides();


/* =========================================================
   DOM
========================================================= */

const stage =
    document.getElementById(
        "stage"
    );

const productGrid =
    document.getElementById(
        "productGrid"
    );

const slideCount =
    document.getElementById(
        "slideCount"
    );

const selectedCount =
    document.getElementById(
        "selectedCount"
    );

const totalCount =
    document.getElementById(
        "totalCount"
    );

const footerSelected =
    document.getElementById(
        "footerSelected"
    );

const footerTotal =
    document.getElementById(
        "footerTotal"
    );

const toast =
    document.getElementById(
        "toast"
    );

const downloadBtn =
    document.getElementById(
        "downloadBtn"
    );


/* =========================================================
   HELPERS
========================================================= */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function rupiah(value){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            minimumFractionDigits:0,
            maximumFractionDigits:0
        }
    ).format(
        Number(value) || 0
    );

}


function slug(value){

    return String(
        value || "produk"
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[^a-z0-9]+/g,
        "-"
    )
    .replace(
        /^-+|-+$/g,
        ""
    );

}


function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2400
        );

}


/* =========================================================
   STORAGE
========================================================= */

function loadPriceOverrides(){

    try{

        return JSON.parse(
            localStorage.getItem(
                STORAGE.PRICES
            ) || "{}"
        ) || {};

    }catch{

        return {};

    }

}


function savePriceOverrides(){

    localStorage.setItem(
        STORAGE.PRICES,
        JSON.stringify(
            priceOverrides
        )
    );

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeProduct(
    raw,
    index
){

    const id =
        String(
            raw.id ??
            raw.kode ??
            raw.sku ??
            `product-${index}`
        );


    const brand =
        String(
            raw.brand ??
            raw.merek ??
            "Nine Luximos"
        )
        .trim();


    const name =
        String(
            raw.nama ??
            raw.name ??
            raw.judul ??
            raw.title ??
            "Produk"
        )
        .trim();


    const harga =
        raw.harga || {};


    const normal =
        Number(
            harga.normal ??
            raw.hargaNormal ??
            raw.normal ??
            0
        ) || 0;


    const promo =
        Number(
            harga.promo ??
            raw.hargaPromo ??
            raw.promo ??
            normal
        ) || normal;


    return {

        ...raw,

        id,

        brand,

/* =========================================================
   IMAGE
========================================================= */

function imagePath(product){

    const explicit =
        product.gambar ??
        product.image ??
        product.foto ??
        product.imagePath;


    if(explicit){

        const value =
            String(
                explicit
            ).trim();


        if(
            value.startsWith(
                "http://"
            ) ||
            value.startsWith(
                "https://"
            ) ||
            value.startsWith("/")
        ){

            return value;

        }


        return value;

    }


    const filename =
        product.file ??
        product.filename ??
        product.imageName ??
        product.namaFile;


    if(filename){

        return (
            CONFIG.IMAGE_FOLDER +
            String(filename)
        );

    }


    return "";

}


/* =========================================================
   DISPLAY TITLE
========================================================= */

function makeDisplayTitle(
    product
){

    let title =
        String(
            product.nama ??
            product.name ??
            product.judul ??
            product.title ??
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    const brand =
        String(
            product.brand || ""
        )
        .trim();


    if(
        brand &&
        title
            .toLowerCase()
            .startsWith(
                brand.toLowerCase()
            )
    ){

        title =
            title
            .slice(
                brand.length
            )
            .replace(
                /^[-–—:|•\s]+/,
                ""
            )
            .trim();

    }


    title =
        title
        .replace(
            /\s*[-–—|]+\s*/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    return title ||
        "Produk Promo";

}


/* =========================================================
   PRICE DATA
========================================================= */

function getPriceData(
    product
){

    const baseNormal =
        Number(
            product.harga?.normal
        ) || 0;


    const basePromo =
        Number(
            product.harga?.promo
        ) || baseNormal;


    const override =
        priceOverrides[
            String(product.id)
        ] || {};


    const normal =
        Number(
            override.normal ??
            baseNormal
        ) || 0;


    const promo =
        Number(
            override.promo ??
            basePromo
        ) || 0;


    const extraEnabled =
        Boolean(
            override.extraEnabled
        );


    const extraPercent =
        Math.min(
            99,
            Math.max(
                0,
                Number(
                    override.extraPercent
                ) || 0
            )
        );


    const manualEnabled =
        Boolean(
            override.manualEnabled
        );


    const manualFinal =
        Number(
            override.manualFinal
        ) || 0;


    let calculatedFinal =
        promo;


    if(
        extraEnabled &&
        extraPercent > 0
    ){

        calculatedFinal =
            Math.round(
                promo *
                (
                    1 -
                    extraPercent / 100
                )
            );

    }


    const final =
        manualEnabled &&
        manualFinal > 0

            ?

            manualFinal

            :

            calculatedFinal;


    /*
     * Diskon badge utama:
     * NORMAL → PROMO DASAR
     */

    const baseDiscount =
        normal > 0
            ?
            Math.max(
                0,
                Math.round(
                    (
                        (normal - promo) /
                        normal
                    ) * 100
                )
            )
            :
            0;


    /*
     * Total diskon aktual:
     * NORMAL → FINAL
     */

    const finalDiscount =
        normal > 0
            ?
            Math.max(
                0,
                Math.round(
                    (
                        (normal - final) /
                        normal
                    ) * 100
                )
            )
            :
            0;


    return {

        normal,
        promo,
        final,

        extraEnabled,
        extraPercent,

        manualEnabled,
        manualFinal,

        baseDiscount,
        finalDiscount

    };

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    try{

        const response =
            await fetch(
                CONFIG.JSON,
                {
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                `produk.json HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        const source =
            Array.isArray(data)
                ?
                data
                :
                Array.isArray(
                    data.products
                )
                    ?
                    data.products
                    :
                    Array.isArray(
                        data.produk
                    )
                        ?
                        data.produk
                        :
                        [];


        if(
            !source.length
        ){

            throw new Error(
                "produk.json kosong atau format tidak dikenali."
            );

        }


        products =
            source.map(
                normalizeProduct
            );


        totalCount.textContent =
            products.length;

        footerTotal.textContent =
            products.length;


        restoreSelection();


        if(
            !selectedIds.length
        ){

            selectedIds =
                products
                .filter(
                    product =>
                        isPromo(product)
                )
                .map(
                    product =>
                        String(
                            product.id
                        )
                );

        }


        renderManager();

        updateCounts();

        applyPromo(false);


    }catch(error){

        console.error(
            "[PROMO]",
            error
        );


        stage.innerHTML = `

            <div class="error">

                <strong>
                    Gagal memuat produk.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                Pastikan
                <strong>produk.json</strong>
                berada di folder yang sama
                dengan index.html promo.

            </div>

        `;

    }

}


/* =========================================================
   PROMO DETECTOR
========================================================= */

function isPromo(product){

    const value =
        product.promo ??
        product.isPromo ??
        product.promosi ??
        product.statusPromo ??
        false;


    if(value === true){
        return true;
    }


    if(typeof value === "string"){

        return [
            "true",
            "promo",
            "yes",
            "1"
        ].includes(
            value.toLowerCase()
        );

    }


    return false;

}

/* =========================================================
   IMAGE WAIT
========================================================= */

async function waitForImage(
    img
){

    if(
        !img
    ){

        return;

    }


    if(
        img.complete
    ){

        if(
            typeof img.decode ===
            "function"
        ){

            try{
                await img.decode();
            }catch{}

        }

        return;

    }


    await new Promise(
        resolve => {

            let doneCalled =
                false;


            const done =
                ()=>{
                    if(
                        doneCalled
                    ){
                        return;
                    }

                    doneCalled =
                        true;

                    img.removeEventListener(
                        "load",
                        done
                    );

                    img.removeEventListener(
                        "error",
                        done
                    );

                    resolve();

                };


            img.addEventListener(
                "load",
                done,
                {
                    once:true
                }
            );

            img.addEventListener(
                "error",
                done,
                {
                    once:true
                }
            );


            setTimeout(
                done,
                7000
            );

        }
    );


    if(
        typeof img.decode ===
        "function"
    ){

        try{

            await Promise.race(
                [
                    img.decode(),
                    wait(3000)
                ]
            );

        }catch{}

    }

}


async function waitForImages(root){

    const images =
        Array.from(
            root.querySelectorAll(
                "img"
            )
        );


    await Promise.all(
        images.map(
            image =>
                waitForImage(
                    image
                )
        )
    );

}


async function waitForCurrentImage(){

    const image =
        stage.querySelector(
            ".product-image"

    if(image){

        await waitForImage(

}

/* =========================================================
   AUTOPLAY
========================================================= */

function startAutoplay(){

    stopAutoplay();


    if(
        !playing ||
        promoProducts.length < 2
    ){

        return;

    }


    autoplay =
        setTimeout(
            ()=>{
                nextSlide();
            },
            CONFIG.DURATION
        );

}


function stopAutoplay(){

    if(autoplay){

        clearTimeout(
            autoplay
        );

        autoplay = null;

    }

}


/* =========================================================
   SLIDE
========================================================= */

async function changeSlide(
    direction
){

    if(
        transitionBusy ||
        promoProducts.length < 2
    ){

        return;

    }


    transitionBusy = true;

    stopAutoplay();


    const oldCanvas =
        document.getElementById(
            "promoCanvas"
        );


    if(oldCanvas){

        oldCanvas.classList.remove(
            "slide-content"
        );

        oldCanvas.classList.add(
            "slide-out"
        );


        await wait(
            620
        );

    }


    currentIndex =
        (
            currentIndex +
            direction +
            promoProducts.length
        )
        %
        promoProducts.length;


    renderPreview(
        false
    );


    const newCanvas =
        document.getElementById(
            "promoCanvas"
        );


    if(newCanvas){

        newCanvas.classList.remove(
            "slide-content"
        );

        newCanvas.classList.add(
            "slide-in"
        );


        await new Promise(
            resolve =>
                requestAnimationFrame(
                    ()=>{
                        requestAnimationFrame(
                            ()=>{
                                newCanvas.classList.remove(
                                    "slide-in"
                                );

                                newCanvas.classList.add(
                                    "slide-content"
                                );

                                resolve();

                            }
                        );
                    }
                )
        );


        await wait(
            580
        );

    }


    transitionBusy = false;


    if(playing){
        startAutoplay();
    }

}


function nextSlide(){
    changeSlide(1);
}


function previousSlide(){
    changeSlide(-1);
}

                        product.id,
                        product.sku

                    .toLowerCase()

            const editor =

            function updateCalculated(){

                const normal =
                    Number(
                        normalInput.value

                const promo =
                    Number(
                        promoInput.value
                    ) || 0;


                const extra =
                    extraEnabledInput.checked
                        ?
                        Math.min(
                            99,
                            Math.max(
                                0,
                                Number(
                                    extraPercentInput.value
                                ) || 0
                            )
                        )
                        :
                        0;


                let final =
                    promo;


                if(extra > 0){

                    final =
                        Math.round(
                            promo *
                            (
                                1 -
                                extra / 100
                            )
                        );

                }


                if(
                    manualEnabledInput.checked &&
                    Number(
                        manualFinalInput.value
                    ) > 0
                ){

                    final =
                        Number(
                            manualFinalInput.value
                        );

                }


                calculated.textContent =
                    `Harga akhir: ${rupiah(final)}`;

            }


            [
                normalInput,
                promoInput,
                extraEnabledInput,
                extraPercentInput,
                manualEnabledInput,
                manualFinalInput
            ]
            .forEach(
                input => {

                    input.addEventListener(
                        "input",
                        updateCalculated
                    );

                    input.addEventListener(
                        "change",
                        updateCalculated
                    );

                }
            );


            editor.querySelector(
                ".price-save-btn"
            )
            .addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    priceOverrides[id] = {

                        normal:
                            Number(
                                normalInput.value
                            ) || 0,

                        promo:
                            Number(
                                promoInput.value
                            ) || 0,

                        extraEnabled:
                            extraEnabledInput.checked,

                        extraPercent:
                            Math.min(
                                99,
                                Math.max(
                                    0,
                                    Number(
                                        extraPercentInput.value
                                    ) || 0
                                )
                            ),

                        manualEnabled:
                            manualEnabledInput.checked,

                        manualFinal:
                            Number(
                                manualFinalInput.value
                            ) || 0

                    };


                    savePriceOverrides();


                    card.classList.remove(
                        "editing"
                    );


                    renderManager();


                    /*
                     * Refresh current preview
                     * tanpa pindah produk.
                     */

                    if(
                        promoProducts.length
                    ){

                        renderPreview(
                            false
                        );

                    }


                    showToast(
                        "Harga promo berhasil diterapkan ✓"
                    );

                }
            );


            editor.querySelector(
                ".price-reset-btn"
            )
            .addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    delete priceOverrides[id];


                    savePriceOverrides();


                    card.classList.remove(
                        "editing"
                    );


                    renderManager();


                    if(
                        promoProducts.length
                    ){

                        renderPreview(
                            false
                        );

                    }


                    showToast(
                        "Harga dikembalikan ke JSON ✓"
                    );

                }
            );


            card.addEventListener(
                "click",
                event => {

                    if(
                        event.target.closest(
                            ".edit-price-btn"
                        ) ||
                        event.target.closest(
                            ".price-editor"
                        )
                    ){

                        return;

                    }


                    toggleProduct(
                        id
                    );

                }
            );


            fragment.appendChild(
                card
            );

        }
    );


    productGrid.appendChild(
        fragment
    );


    updateCounts();

}

/* =========================================================
   TOGGLE PRODUCT
========================================================= */

function toggleProduct(id){

    id =
        String(id);


    if(
        selectedIds.includes(id)
    ){

        selectedIds =
            selectedIds.filter(
                value =>
                    value !== id
            );

    }else{

        selectedIds.push(id);

    }


    saveSelection();

    renderManager();

}


/* =========================================================
   SAVE BLOB
========================================================= */

async function saveBlob(
    blob,
    filename
){

    if(
        !blob ||
        blob.size <= 0
    ){

        throw new Error(
            "EMPTY_BLOB"
        );

    }


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;

    link.download =
        filename;

    link.style.position =
        "fixed";

    link.style.left =
        "-9999px";

    link.style.top =
        "-9999px";

    link.style.opacity =
        "0";

    document.body.appendChild(
        link
    );


    link.click();


    await wait(500);


    link.remove();


    setTimeout(
        ()=>{
            URL.revokeObjectURL(
                url
            );
        },
        1500
    );

}


/* =========================================================
   DOWNLOAD STATUS
========================================================= */

async function downloadStatus(){

    if(downloadBusy){
        return;
    }


    const canvas =
        document.getElementById(
            "promoCanvas"
        );


    const product =
        promoProducts[
            currentIndex
        ];


    if(!canvas){

        showToast(
            "Preview belum siap."
        );

        return;

    }


    if(!product){

        showToast(
            "Produk belum tersedia."
        );

        return;

    }


    if(
        typeof html2canvas !==
        "function"
    ){

        showToast(
            "Engine download belum tersedia."
        );

        return;

    }


    downloadBusy =
        true;


    const wasPlaying =
        playing;


    const originalHTML =
        downloadBtn.innerHTML;


    stopAutoplay();


    downloadBtn.disabled =
        true;


    downloadBtn.innerHTML = `

        <span
            class="download-spinner"
        ></span>

        MEMBUAT STATUS...

    `;


    try{

        showToast(
            "Menyiapkan status..."
        );


        /*
         * Hilangkan animasi sebelum
         * mengambil gambar.
         */

        document.body.classList.add(
            "capture-mode"
        );


        /*
         * Pastikan gambar benar-benar
         * selesai load + decode.
         */

        await waitForImages(
            canvas
        );


        await waitForFonts();


        /*
         * Tunggu dua frame browser.
         */

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    ()=>{
                        requestAnimationFrame(
                            resolve
                        );
                    }
                )
        );


        await wait(120);


        showToast(
            "Merender status..."
        );


        const width =
            canvas.offsetWidth;


        const height =
            canvas.offsetHeight;


        /*
         * Export lebih tinggi dari
         * screenshot viewport.
         */

        const scale =
            currentRatio === "916"
                ?
                2.5
                :
                currentRatio === "45"
                    ?
                    2.35
                    :
                    2.15;


        const capturePromise =
            html2canvas(
                canvas,
                {

                    backgroundColor:
                        "#070907",

                    width,
                    height,

                    scale,

                    useCORS:true,

                    allowTaint:false,

                    imageTimeout:15000,

                    logging:false,

                    foreignObjectRendering:false,

                    removeContainer:true,

                    scrollX:0,

                    scrollY:0

                }
            );


        const timeoutPromise =
            new Promise(
                (
                    resolve,
                    reject
                )=>{

                    setTimeout(
                        ()=>{
                            reject(
                                new Error(
                                    "EXPORT_TIMEOUT"
                                )
                            );
                        },
                        20000
                    );

                }
            );


        const output =
            await Promise.race(
                [
                    capturePromise,
                    timeoutPromise
                ]
            );


        if(
            !output ||
            !output.width ||
            !output.height
        ){

            throw new Error(
                "INVALID_CANVAS"
            );

        }


        showToast(
            "Menyiapkan file PNG..."
        );


        const blob =
            await new Promise(
                (
                    resolve,
                    reject
                )=>{

                    output.toBlob(
                        result => {

                            if(
                                result &&
                                result.size > 0
                            ){

                                resolve(
                                    result
                                );

                            }else{

                                reject(
                                    new Error(
                                        "PNG_BLOB_FAILED"
                                    )
                                );

                            }

                        },
                        "image/png",
                        1
                    );

                }
            );


        const ratioName =
            currentRatio === "916"
                ?
                "9x16"
                :
                currentRatio === "45"
                    ?
                    "4x5"
                    :
                    "16x9";


        const filename =
            `PROMO-${slug(
                makeDisplayTitle(
                    product
                )
            )}-${ratioName}.png`;


        await saveBlob(
            blob,
            filename
        );


        showToast(
            "Status berhasil didownload ✓"
        );


    }catch(error){

        console.error(
            "[PROMO DOWNLOAD]",
            error
        );


        if(
            error?.message ===
            "EXPORT_TIMEOUT"
        ){

            showToast(
                "Export terlalu lama. Coba lagi."
            );

        }else{

            showToast(
                "Gagal membuat status."
            );

        }

    }finally{

        document.body.classList.remove(
            "capture-mode"
        );


        downloadBusy =
            false;


        downloadBtn.disabled =
            false;


        downloadBtn.innerHTML =
            originalHTML;


        if(
            wasPlaying
        ){

            playing =
                true;

            updatePlayIcons();

            startAutoplay();

        }

    }

}


/* =========================================================
   DOWNLOAD JSON
========================================================= */

async function downloadJSON(){

    try{

        const selected =
            products.filter(
                product =>
                    selectedIds.includes(
                        String(
                            product.id
                        )
                    )
            );


        const output =
            selected.map(
                product => {

                    const price =
                        getPriceData(
                            product
                        );


                    return {

                        ...product,

                        harga:{

                            ...product.harga,

                            normal:
                                price.normal,

                            promo:
                                price.final,

                            hargaDasarPromo:
                                price.promo,

                            diskonExtraAktif:
                                price.extraEnabled,

                            diskonExtra:
                                price.extraPercent

                        }

                    };

                }
            );


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        output,
                        null,
                        4
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        await saveBlob(
            blob,
            "produk-promo-final.json"
        );


        showToast(
            "produk-promo-final.json berhasil dibuat ✓"
        );

    }catch(error){

        console.error(
            error
        );

        showToast(
            "Gagal download JSON."
        );

    }

}

async function fullscreen(){

            !document.fullscreenElement

                .requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(error){

            "[FULLSCREEN]",
            error
        );

    }

}

/* =========================================================
   SWIPE
========================================================= */

let touchStartX = 0;
let touchStartY = 0;


stage.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.screenX;

        touchStartY =
            touch.screenY;

    },
    {
        passive:true
    }
);


stage.addEventListener(
    "touchend",
    event => {

        if(
            transitionBusy
        ){

            return;

        }


        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.screenX -
            touchStartX;


        const deltaY =
            touch.screenY -
            touchStartY;


        if(
            Math.abs(deltaX) <
            Math.abs(deltaY)
        ){

            return;

        }


        if(
            Math.abs(deltaX) <
            45
        ){

            return;

        }


        if(
            deltaX < 0
        ){

            nextSlide();

        }else{

            previousSlide();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;


        if(
            target &&
            (
                target.tagName === "INPUT" ||
                target.tagName === "TEXTAREA" ||
                target.isContentEditable
            )
        ){

            return;

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            nextSlide();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousSlide();

        }


        if(
            event.key ===
            " "
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.key.toLowerCase()
            === "f"
        ){

            fullscreen();

        }


        if(
            event.key.toLowerCase()
            === "d"
        ){

            downloadStatus();

        }

    }
);
