<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050705"
>

<title>
    Promo Studio — Imam_salesfr
</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
></script>


<style>

/* =========================================================
   IMAM_SALESFR — PROMO STUDIO FINAL
========================================================= */

:root{

    --lime:#8CC63F;
    --lime-bright:#A5E14E;
    --lime-dark:#6EA52F;

    --orange:#FF7612;
    --orange-light:#FF974A;
    --orange-dark:#E45D08;

    --blue:#2998E8;
    --blue-light:#67C9FF;

    --black:#020302;
    --bg:#050705;
    --panel:#090D0A;
    --panel-2:#0D120E;

    --white:#F7F9F5;
    --soft:#DCE2DA;

    --muted:#7D867D;
    --muted-dark:#626A62;

    --line:
        rgba(255,255,255,.085);

    --line-soft:
        rgba(255,255,255,.055);

    --shadow:
        0 32px 90px rgba(0,0,0,.50);

    --display:
        "Manrope",
        Inter,
        system-ui,
        sans-serif;

    --body:
        "Plus Jakarta Sans",
        Inter,
        system-ui,
        sans-serif;

}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:var(--bg);
}

body{

    margin:0;

    min-height:100vh;

    overflow-x:hidden;

    color:var(--white);

    font-family:var(--body);

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(140,198,63,.08),
            transparent 35%
        ),
        #050705;

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;

}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

img{
    display:block;
    max-width:100%;
}

svg{
    display:block;
}


/* =========================================================
   HEADER
========================================================= */

.topbar{

    position:sticky;
    top:0;
    z-index:1000;

    min-height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    padding:
        13px
        clamp(16px,4vw,40px);

    background:
        rgba(4,6,4,.95);

    border-bottom:
        1px solid var(--line);

    backdrop-filter:
        blur(18px);

}

.header-brand{
    min-width:0;
}

.brand-name{

    color:#fff;

    font-family:var(--display);

    font-size:
        clamp(23px,3vw,34px);

    line-height:1;

    font-weight:900;

    letter-spacing:-1.1px;

}

.brand-sub{

    margin-top:6px;

    color:var(--lime);

    font-size:
        clamp(8px,1vw,11px);

    line-height:1;

    font-weight:800;

}

.header-actions{

    display:flex;

    gap:9px;

}

.header-btn{

    width:54px;
    height:54px;

    display:grid;
    place-items:center;

    color:#fff;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:17px;

}

.header-btn.primary{

    color:#071006;

    background:
        linear-gradient(
            135deg,
            var(--lime),
            var(--lime-bright)
        );

    border-color:
        var(--lime);

}

.header-btn svg{

    width:22px;
    height:22px;

}


/* =========================================================
   MAIN
========================================================= */

main{

    width:100%;

    padding:
        18px
        18px
        90px;

}

.container{

    width:
        min(100%,1180px);

    margin:auto;

}


/* =========================================================
   STAGE
========================================================= */

.stage{

    width:100%;

    display:flex;
    justify-content:center;

    position:relative;

}

.promo-canvas{

    position:relative;

    overflow:hidden;

    isolation:isolate;

    width:100%;

    background:#070907;

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:var(--shadow);

}


/* =========================================================
   RATIO CANVAS
========================================================= */

.stage.ratio-916
.promo-canvas{

    width:
        min(100%,520px);

    aspect-ratio:
        9 / 16;

}

.stage.ratio-45
.promo-canvas{

    width:
        min(100%,760px);

    aspect-ratio:
        4 / 5;

}

.stage.ratio-169
.promo-canvas{

    width:100%;

    aspect-ratio:
        16 / 9;

}


/* =========================================================
   TEMPLATE COLOR SYSTEM
========================================================= */

.template-modern{

    --accent:
        var(--lime);

    --accent-light:
        var(--lime-bright);

    --template-glow:
        rgba(140,198,63,.16);

    --template-bg:
        #050705;

}

.template-orange{

    --accent:
        var(--orange);

    --accent-light:
        var(--orange-light);

    --template-glow:
        rgba(255,118,18,.18);

    --template-bg:
        #080604;

}

.template-neon{

    --accent:
        #A6E84D;

    --accent-light:
        #D1FF8A;

    --template-glow:
        rgba(166,232,77,.19);

    --template-bg:
        #020502;

}

.template-blue{

    --accent:
        var(--blue);

    --accent-light:
        var(--blue-light);

    --template-glow:
        rgba(41,152,232,.18);

    --template-bg:
        #03080B;

}


/* =========================================================
   TEMPLATE BACKGROUND
========================================================= */

.template-bg{

    position:absolute;

    inset:0;

    z-index:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 75% 20%,
            var(--template-glow),
            transparent 42%
        ),
        var(--template-bg);

}

.template-bg::before{

    content:"";

    position:absolute;

    inset:-20%;

    background:
        repeating-linear-gradient(
            125deg,
            transparent 0 32px,
            color-mix(
                in srgb,
                var(--accent) 5%,
                transparent
            )
            32px 34px,
            transparent 34px 72px
        );

    opacity:.45;

}

.template-orange
.template-bg::after{

    content:"";

    position:absolute;

    top:-25%;

    right:-12%;

    width:47%;

    height:150%;

    background:
        linear-gradient(
            135deg,
            transparent 9%,
            rgba(255,91,0,.94) 9%,
            rgba(255,118,18,.74) 74%,
            transparent 74%
        );

    transform:
        skewX(-13deg);

    opacity:.82;

}

.template-blue
.template-bg::after{

    content:"";

    position:absolute;

    right:-5%;

    top:10%;

    width:54%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--accent)
        );

    box-shadow:
        0 90px 0
        color-mix(
            in srgb,
            var(--accent) 28%,
            transparent
        ),
        0 180px 0
        color-mix(
            in srgb,
            var(--accent) 15%,
            transparent
        );

}


/* =========================================================
   PROVENANCE WATERMARK
========================================================= */

.brand-watermark{

    position:absolute;

    inset:0;

    z-index:4;

    pointer-events:none;

    overflow:hidden;

    user-select:none;

    mix-blend-mode:screen;

    opacity:1;

}


/*
 * Large diagonal identity.
 * Sangat samar agar tidak mengganggu produk.
 */

.brand-watermark::before{

    content:
        "imamsalesnine.com   •   imamsalesnine.com   •   imamsalesnine.com";

    position:absolute;

    width:170%;

    left:-35%;

    top:41%;

    transform:
        rotate(-25deg);

    color:
        rgba(190,220,170,.035);

    font-family:
        var(--display);

    font-size:
        clamp(18px,4.5vw,58px);

    line-height:1.9;

    font-weight:900;

    letter-spacing:
        4px;

    white-space:
        nowrap;

}


/*
 * Secondary provenance pattern.
 */

.brand-watermark::after{

    content:
        "IMAM_SALESFR  /  NINE AUTOSERIES  /  imamsalesnine.com";

    position:absolute;

    left:7%;

    right:7%;

    bottom:3.5%;

    color:
        rgba(190,220,170,.075);

    font-family:
        var(--display);

    font-size:
        clamp(5px,.72vw,9px);

    line-height:1;

    font-weight:800;

    letter-spacing:
        2.1px;

    text-align:center;

}


/*
 * Dedicated micro watermark layer.
 * Ini tetap tertangkap html2canvas.
 */

.watermark-micro{

    position:absolute;

    z-index:5;

    pointer-events:none;

    color:
        rgba(190,220,170,.042);

    font-family:
        var(--display);

    font-size:
        clamp(6px,.7vw,9px);

    font-weight:800;

    letter-spacing:
        1.8px;

    white-space:nowrap;

    transform:
        rotate(-25deg);

}


/* =========================================================
   PRODUCT VISUAL
========================================================= */

.product-visual{

    position:absolute;

    z-index:10;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255,255,255,.035),
            transparent 55%
        ),
        #020302;

}


/* 9:16 */

.stage.ratio-916
.product-visual{

    inset:
        0 0 auto 0;

    height:55%;

}


/* 4:5
 *
 * Sedikit diturunkan dari versi sebelumnya
 * supaya commercial zone punya ruang yang
 * cukup tanpa membuat artwork kehilangan
 * dominasi.
 */

.stage.ratio-45
.product-visual{

    inset:
        0 0 auto 0;

    height:56.5%;

}


/* 16:9
 *
 * Artwork dibuat sedikit lebih besar.
 */

.stage.ratio-169
.product-visual{

    inset:
        0 auto 0 0;

    width:58%;

}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{

    display:block;

    width:100%;
    height:100%;

    padding:
        clamp(16px,4%,40px);

    object-fit:contain;

    object-position:center;

    opacity:1;

    filter:none;

    mix-blend-mode:normal;

    user-select:none;

    -webkit-user-drag:none;

}


/* =========================================================
   VISUAL GRADIENT
========================================================= */

.visual-gradient{

    position:absolute;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent 46%,
            rgba(7,9,7,.05) 58%,
            rgba(7,9,7,.22) 73%,
            rgba(7,9,7,.72) 90%,
            #070907 100%
        );

}

.stage.ratio-169
.visual-gradient{

    background:
        linear-gradient(
            to right,
            transparent 35%,
            rgba(7,9,7,.04) 46%,
            rgba(7,9,7,.22) 61%,
            rgba(7,9,7,.74) 82%,
            #070907 100%
        );

}


/* =========================================================
   COMMERCIAL INFORMATION ZONE
========================================================= */

.info-zone{

    position:absolute;

    z-index:20;

    overflow:hidden;

}


/* 9:16 */

.stage.ratio-916
.info-zone{

    left:0;
    right:0;
    bottom:0;

    height:45%;

    padding:
        18px 8% 7%;

}


/* 4:5 */

.stage.ratio-45
.info-zone{

    left:0;
    right:0;
    bottom:0;

    height:43.5%;

    padding:
        18px 7% 6%;

}


/* 16:9 */

.stage.ratio-169
.info-zone{

    top:0;
    right:0;
    bottom:0;

    width:42%;

    padding:
        6.8% 5.4% 6% 4.4%;

}


/* =========================================================
   COMMERCIAL PANEL
========================================================= */

.product-info{

    position:relative;

    z-index:30;

    width:100%;

    min-width:0;

}


/*
 * Soft separator.
 */

.product-info::before{

    content:"";

    position:absolute;

    left:0;

    top:-11px;

    width:46px;

    height:2px;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            transparent
        );

    opacity:.75;

}


/* =========================================================
   BADGES
========================================================= */

.badge-stack{

    position:relative;

    z-index:40;

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:11px;

}

.promo-badge{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    height:31px;

    min-width:91px;

    padding:
        0 13px;

    border-radius:999px;

    color:#190A03;

    background:
        linear-gradient(
            135deg,
            var(--orange-light),
            var(--orange) 62%,
            var(--orange-dark)
        );

    font-size:8px;

    line-height:1;

    font-weight:900;

    letter-spacing:2.5px;

    white-space:nowrap;

    box-shadow:
        0 9px 22px
        rgba(255,122,26,.15);

}

.promo-badge::before{

    content:"";

    width:6px;
    height:6px;

    margin-right:7px;

    border-radius:50%;

    background:#190A03;

}

.extra-discount-badge{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-height:26px;

    padding:
        0 11px;

    border-radius:999px;

    color:var(--orange-light);

    background:
        rgba(255,118,18,.055);

    border:
        1px solid
        rgba(255,118,18,.50);

    font-size:7px;

    line-height:1;

    font-weight:900;

    letter-spacing:1px;

    white-space:nowrap;

}

.warranty-badge{

    position:absolute;

    top:0;

    right:0;

    z-index:50;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    max-width:45%;

    min-height:26px;

    padding:
        0 10px;

    color:var(--accent);

    background:
        rgba(0,0,0,.30);

    border:
        1px solid
        color-mix(
            in srgb,
            var(--accent) 65%,
            transparent
        );

    border-radius:999px;

    font-size:6.5px;

    line-height:1;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================================================
   PRODUCT COPY
========================================================= */

.product-brand{

    margin-top:11px;

    color:var(--accent);

    font-size:
        clamp(8px,1vw,11px);

    line-height:1;

    font-weight:900;

    letter-spacing:2.1px;

    text-transform:uppercase;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.product-name{

    margin:
        7px 0 0;

    color:#fff;

    font-family:var(--display);

    font-size:
        clamp(24px,3.4vw,42px);

    line-height:1.02;

    font-weight:900;

    letter-spacing:-1.05px;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;

    overflow:hidden;

}

.price-block{

    margin-top:
        clamp(13px,2vw,19px);

}

.price-label{

    margin-bottom:6px;

    color:#7D867D;

    font-size:
        clamp(8px,.85vw,10px);

    line-height:1;

    font-weight:900;

    letter-spacing:2.3px;

    text-transform:uppercase;

}

.price-promo{

    color:#fff;

    font-family:var(--display);

    font-size:
        clamp(31px,4.4vw,56px);

    line-height:.95;

    font-weight:900;

    letter-spacing:-1.5px;

    white-space:nowrap;

}

.price-meta{

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-top:9px;

}

.price-normal{

    color:#707970;

    font-size:
        clamp(9px,.9vw,12px);

    line-height:1;

}

.discount{

    color:var(--lime);

    font-size:
        clamp(9px,.95vw,12px);

    line-height:1;

    font-weight:900;

}

.extra-price-note{

    margin-top:8px;

    color:var(--orange-light);

    font-size:
        clamp(8px,.85vw,10px);

    line-height:1;

    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;

}


/* =========================================================
   RATIO MARK
========================================================= */

.ratio-mark{

    position:absolute;

    z-index:90;

    top:3%;

    right:3%;

    padding:
        5px 7px;

    color:#fff;

    background:
        rgba(0,0,0,.70);

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:6px;

    font-size:7px;

    line-height:1;

    font-weight:900;

}


/* =========================================================
   SIGNATURE
========================================================= */

.signature{

    position:absolute;

    z-index:90;

    right:3.5%;

    bottom:2.5%;

    color:
        rgba(205,211,203,.48);

    font-size:7px;

    font-weight:500;

}


/* =========================================================
   RATIO 9:16
========================================================= */

.stage.ratio-916
.product-name{

    font-size:
        clamp(23px,6.2vw,35px);

}

.stage.ratio-916
.price-promo{

    font-size:
        clamp(30px,7.2vw,46px);

}


/* =========================================================
   RATIO 4:5 — FINAL BALANCED
========================================================= */

.stage.ratio-45
.product-visual{

    height:56.5%;

}

.stage.ratio-45
.info-zone{

    height:43.5%;

    padding:
        17px 7% 6%;

}

.stage.ratio-45
.product-name{

    font-size:
        clamp(24px,5.7vw,39px);

}

.stage.ratio-45
.price-promo{

    font-size:
        clamp(31px,6.7vw,49px);

}

.stage.ratio-45
.product-brand{

    margin-top:9px;

}


/* =========================================================
   RATIO 16:9 — FINAL BALANCED
========================================================= */

.stage.ratio-169
.product-visual{

    width:58%;

}

.stage.ratio-169
.info-zone{

    width:42%;

    padding:
        6.8% 5.4% 6% 4.4%;

}

.stage.ratio-169
.product-name{

    margin-top:5px;

    font-size:
        clamp(17px,3vw,30px);

    line-height:1.04;

}

.stage.ratio-169
.product-brand{

    margin-top:8px;

    font-size:6.5px;

    letter-spacing:1.4px;

}

.stage.ratio-169
.price-block{

    margin-top:10px;

}

.stage.ratio-169
.price-promo{

    font-size:
        clamp(22px,4vw,38px);

}

.stage.ratio-169
.price-meta{

    margin-top:6px;

    gap:5px;

}

.stage.ratio-169
.price-normal,
.stage.ratio-169
.discount{

    font-size:6.5px;

}

.stage.ratio-169
.promo-badge{

    height:26px;

    min-width:76px;

    padding:
        0 9px;

    font-size:6px;

    letter-spacing:1.8px;

}

.stage.ratio-169
.extra-discount-badge{

    min-height:22px;

    padding:
        0 7px;

    font-size:5.3px;

}

.stage.ratio-169
.warranty-badge{

    min-height:23px;

    max-width:44%;

    padding:
        0 8px;

    font-size:5.2px;

}


/* =========================================================
   CONTROL STRIP
========================================================= */

.control-strip{

    margin-top:12px;

    padding:14px;

    display:grid;

    grid-template-columns:
        1.35fr
        1fr;

    gap:13px;

    background:
        linear-gradient(
            145deg,
            rgba(16,22,17,.96),
            rgba(8,11,9,.98)
        );

    border:
        1px solid var(--line);

    border-radius:21px;

}

.section-label{

    color:#747E75;

    font-size:9px;

    line-height:1;

    font-weight:900;

    letter-spacing:2.5px;

    text-transform:uppercase;

}


/* =========================================================
   RATIO CONTROLS
========================================================= */

.ratio-grid{

    margin-top:10px;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:8px;

}

.ratio-btn{

    min-height:63px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    color:#919991;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:15px;

}

.ratio-btn.active{

    color:var(--lime);

    background:
        rgba(140,198,63,.065);

    border-color:
        rgba(140,198,63,.70);

}

.ratio-icon{

    display:block;

    flex:0 0 auto;

    border:
        2px solid currentColor;

    border-radius:4px;

}

.ratio-btn[data-ratio="916"]
.ratio-icon{

    width:13px;
    height:22px;

}

.ratio-btn[data-ratio="45"]
.ratio-icon{

    width:17px;
    height:22px;

}

.ratio-btn[data-ratio="169"]
.ratio-icon{

    width:27px;
    height:15px;

}

.ratio-value{

    display:block;

    font-size:12px;

    line-height:1;

    font-weight:900;

}

.ratio-use{

    display:block;

    margin-top:4px;

    color:#5E675F;

    font-size:7px;

    line-height:1;

}


/* =========================================================
   NAVIGATION
========================================================= */

.navigation{

    margin-top:10px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr)

    gap:8px;

.nav-btn{

    min-height:60px;

    color:#fff;

    background:#080C09;

        1px solid rgba(255,255,255,.075);

.nav-btn svg{

    width:21px;
    height:21px;

}

.slide-count{

    min-width:47px;

    display:grid;

    place-items:center;

    color:#858D85;

    font-size:11px;

    font-weight:900;

/* =========================================================
   DOWNLOAD
========================================================= */

.download-btn{

    width:100%;

    min-height:60px;

    margin-top:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    color:#0D1409;

    background:
        linear-gradient(
            135deg,
            var(--lime),
            var(--lime-bright)
        );

    border-radius:16px;

    font-size:11px;

    font-weight:900;

}

.download-btn:disabled{

    opacity:.62;

    cursor:wait;

}

.download-btn svg{

    width:19px;
    height:19px;

}

.download-spinner{

    width:18px;
    height:18px;

    border:

    border-top-color:#0D1409;

    border-radius:50%;

        spin .7s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   TEMPLATE ENGINE
========================================================= */

.template-engine{

    margin-top:12px;

    padding:26px;

    background:
        linear-gradient(
            145deg,
            rgba(8,14,9,.98),
            rgba(6,10,7,.98)

    border:
        1px solid var(--line);

    border-radius:23px;

}

.template-title{

    margin:
        9px 0 0;

    color:#fff;

    font-family:var(--display);

    font-size:
        clamp(25px,3vw,37px);

    line-height:1;

    font-weight:900;

    letter-spacing:-1px;

}

.template-active{

    margin-top:8px;

    color:#707970;

    font-size:10px;

}

.template-active strong{

    color:var(--lime);

}

.template-grid{

    margin-top:19px;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:13px;

}

.template-card{

    min-width:0;

    padding:12px;

    color:#fff;

    text-align:left;

    background:#060A07;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:17px;

}

.template-card.active{

    border-color:
        var(--template-accent);

    box-shadow:
        0 0 0 1px
        color-mix(
            in srgb,
            var(--template-accent) 13%,
            transparent
        );

}

.template-card[data-template="modern"]{

    --template-accent:
        #8CC63F;

}

.template-card[data-template="orange"]{

    --template-accent:
        #FF7612;

}

.template-card[data-template="neon"]{

    --template-accent:
        #A6E84D;

}

.template-card[data-template="blue"]{

    --template-accent:
        #2998E8;

}

.template-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.template-name{

    font-size:13px;

    line-height:1;

    font-weight:900;

}

.template-number{

    margin-right:5px;

    color:

    font-size:16px;

}

.template-check{

    width:24px;
    height:24px;

    display:grid;
    place-items:center;

    color:transparent;

    background:#101510;

    border-radius:50%;

    font-size:12px;

}

.template-card.active

    color:#071006;

    background:

}


/* =========================================================
   TEMPLATE PREVIEW
========================================================= */

.template-thumb{

    position:relative;

    width:100%;

}

.thumb{

}

}

.thumb.orange{

            rgba(255,118,18,.24),

}

.thumb.neon{

    --ta:#A6E84D;

    background:
        radial-gradient(
            circle at 56% 28%,
            rgba(166,232,77,.26),
            transparent 48%
        ),
        #020402;

}

.thumb.blue{

    --ta:#2998E8;

    background:
        radial-gradient(
            circle at 72% 30%,
            rgba(41,152,232,.27),

}

.thumb-sweep{

    position:absolute;

    z-index:1;

    top:-15%;
    right:-8%;

    width:43%;
    height:140%;

    opacity:.76;

}

.thumb-copy{

    position:absolute;

    z-index:12;

    top:8%;

}

.thumb-brand{

    font-size:6px;

    line-height:1;

    font-weight:900;

}

.thumb-title{

    height:7px;

    margin-top:5px;

    background:var(--ta);

    border-radius:2px;

}

.thumb-sub{

    width:57%;
    height:5px;

    margin-top:4px;

    background:#fff;

    opacity:.9;

    border-radius:2px;

}

.thumb-product{

    position:absolute;

    z-index:7;

    right:7%;
    top:17%;

    width:48%;
    height:51%;

    background:
        linear-gradient(
            145deg,
            #D3D8D2,
            #737B73 45%,
            #242824
        );

    border-radius:7px;

    transform:
        rotate(-5deg);

    box-shadow:
        -18px 22px 0 -7px
        #535B53;

}

.thumb-commercial{

    position:absolute;

    z-index:20;

    left:4%;
    right:4%;
    bottom:4%;

    height:23%;

    background:
        rgba(0,0,0,.80);

    border:
        1px solid rgba(255,255,255,.07);

    border-radius:5px;

}

.thumb-promo{

    position:absolute;

    left:4%;
    top:18%;

    width:24%;
    height:15%;

    background:#FF7612;

    border-radius:99px;

}

.thumb-extra{

    position:absolute;

    left:31%;
    top:18%;

    width:29%;
    height:15%;

    border:
        1px solid #FF7612;

    border-radius:99px;

}

.thumb-price{

    position:absolute;

    left:4%;
    bottom:16%;

    width:34%;
    height:11%;

    background:#fff;

    border-radius:2px;

}

.thumb-badge{

    position:absolute;

    right:4%;
    top:18%;

    width:22%;
    height:15%;

    border:
        1px solid var(--ta);

    border-radius:99px;

}

.thumb-watermark{

    position:absolute;

    inset:0;

    z-index:30;

    display:grid;

    place-items:center;

    color:
        rgba(255,255,255,.055);

    font-size:6px;

    font-weight:900;

    letter-spacing:1.2px;

    transform:
        rotate(-18deg);

    pointer-events:none;

}

.thumb-ratio{

    position:absolute;

    z-index:40;

    top:4%;
    right:3%;

    padding:
        3px 5px;

    color:#fff;

    background:
        rgba(0,0,0,.72);

    border-radius:4px;

    font-size:6px;

    line-height:1;

    font-weight:900;

}


/* =========================================================
   PRODUCT MANAGER
========================================================= */

.manager{

    margin-top:12px;

    padding:26px;

    background:
        linear-gradient(
            145deg,
            rgba(8,14,9,.98),
            rgba(6,10,7,.98)
        );

    border:
        1px solid var(--line);

    border-radius:23px;

}

.manager-heading{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

}

.manager-title{

    margin:

    color:#fff;

    font-size:

    line-height:1;

    font-weight:900;

    letter-spacing:-1px;

}

.manager-summary{

    color:#747D74;

    font-size:10px;

}

.manager-summary strong{

    color:var(--lime);

}

.manager-toolbar{

    margin-top:19px;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:8px;

}

.tool-btn{

    min-height:45px;

    color:#DCE4DC;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:11px;

    font-size:8px;

    font-weight:900;

}

.tool-btn.primary{

    color:#071006;

    background:var(--lime);

    border-color:var(--lime);

}

.search{

    width:100%;

    height:46px;

    margin-top:10px;

    padding:
        0 14px;

    color:#fff;

    outline:none;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:11px;

    font-size:10px;

}

.search:focus{

    border-color:
        rgba(140,198,63,.48);

}


/* =========================================================
   PRODUCT CARDS
========================================================= */

.product-grid{

    margin-top:12px;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:9px;

}

.select-card{

    position:relative;

    height:270px;

    min-width:0;

    overflow:hidden;

    background:#080D09;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:15px;

}

.select-card.selected{

    border-color:
        rgba(140,198,63,.72);

}

.select-image{

    position:absolute;

    inset:
        0 0 auto 0;

    height:137px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:#050705;

}

.select-image img{

    width:100%;
    height:100%;

    padding:8px;

    object-fit:contain;

}

.card-check{

    position:absolute;

    z-index:25;

    top:8px;
    left:8px;

    width:21px;
    height:21px;

    display:grid;
    place-items:center;

    color:transparent;

    background:
        rgba(0,0,0,.72);

    border:
        1px solid rgba(255,255,255,.14);

    border-radius:6px;

    font-size:11px;

    font-weight:900;

}

.select-card.selected
.card-check{

    color:#071006;

    background:var(--lime);

    border-color:var(--lime);

}

.edit-price-btn{

    position:absolute;

    z-index:30;

    top:8px;
    right:8px;

    width:32px;
    height:32px;

    display:grid;
    place-items:center;

    color:#fff;

    background:
        rgba(0,0,0,.72);

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:8px;

}

.edit-price-btn svg{

    width:14px;
    height:14px;

}

.select-info{

    position:absolute;

    z-index:10;

    left:12px;
    right:12px;
    bottom:12px;

    min-width:0;

}

.select-brand{

    color:var(--lime);

    font-size:7px;

    line-height:1;

    font-weight:900;

    letter-spacing:1.5px;

    text-transform:uppercase;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.select-name{

    margin-top:6px;

    color:#fff;

    font-size:10px;

    line-height:1.25;

    font-weight:800;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;

    overflow:hidden;

}

.select-price{

    margin-top:7px;

    color:#fff;

    font-size:10px;

    line-height:1;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.select-old{

    margin-left:4px;

    color:#687168;

    font-size:7px;

}

.select-discount{

    margin-left:5px;

    color:var(--lime);

    font-size:7px;

    font-weight:900;

}


/* =========================================================
   PRICE EDITOR
========================================================= */

.price-editor{

    position:absolute;

    z-index:60;

    inset:6px;

    display:none;

    overflow-y:auto;

    overscroll-behavior:contain;

    padding:11px;

    background:
        rgba(6,10,7,.99);

    border:
        1px solid rgba(140,198,63,.48);

    border-radius:11px;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.68);

}

.select-card.editing
.price-editor{

    display:block;

}

.price-editor::-webkit-scrollbar{

    width:5px;

}

.price-editor::-webkit-scrollbar-track{

    background:#050805;

}

.price-editor::-webkit-scrollbar-thumb{

    background:#46652E;

    border-radius:99px;

}

.price-editor-title{

    position:sticky;

    top:-11px;

    z-index:5;

    margin:
        -11px -11px 10px;

    padding:11px;

    color:#fff;

    background:
        rgba(6,10,7,.99);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    font-size:9px;

    font-weight:900;

}

.price-field{

    margin-bottom:8px;

}

.price-field label{

    display:block;

    margin-bottom:4px;

    color:#737C73;

    font-size:6.5px;

    line-height:1;

    font-weight:900;

    letter-spacing:.9px;

    text-transform:uppercase;

}

.price-field input{

    width:100%;

    height:32px;

    padding:
        0 8px;

    color:#fff;

    outline:none;

    background:#080C09;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:8px;

    font-size:9px;

}

.price-field input:focus{

    border-color:
        rgba(140,198,63,.58);

}

.price-check{

    display:flex;

    align-items:center;

    gap:6px;

    margin:8px 0;

    color:#C6CCC4;

    font-size:7px;

    line-height:1.25;

    font-weight:700;

}

.price-check input{

    accent-color:var(--lime);

}

.calculated-final{

    margin:8px 0;

    padding:8px;

    color:var(--lime);

    background:
        rgba(140,198,63,.06);

    border:
        1px solid rgba(140,198,63,.15);

    border-radius:8px;

    font-size:8px;

    font-weight:900;

}

.price-actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px;

}

.price-save-btn,
.price-reset-btn{

    height:32px;

    border-radius:8px;

    font-size:7px;

    font-weight:900;

}

.price-save-btn{

    color:#071006;

    background:var(--lime);

}

.price-reset-btn{

    color:#C3CAC3;

    background:#101510;

    border:
        1px solid rgba(255,255,255,.09);

}


/* =========================================================
   ERROR
========================================================= */

.error{

    width:100%;

    min-height:280px;

    display:grid;

    place-items:center;

    padding:30px;

    text-align:center;

    color:#FF9A9A;

    background:
        rgba(50,8,8,.35);

    border:
        1px solid rgba(255,80,80,.22);

    border-radius:18px;

    font-size:11px;

    line-height:1.7;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    z-index:5000;

    left:50%;
    bottom:22px;

    transform:
        translate(-50%,20px);

    padding:
        11px 17px;

    color:#071006;

    background:var(--lime);

    border-radius:999px;

    font-size:9px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;

}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   CAPTURE
========================================================= */

.capture-mode
.promo-canvas{

    transform:none !important;

    filter:none !important;

    opacity:1 !important;

}

.capture-mode
.product-image{

    opacity:1 !important;

    filter:none !important;

}

            14px
            75px;

    }

/* =========================================================

const CONFIG = {

        "imamPromo.selection",

    PRICES:
        "imamPromo.priceOverrides"

};


const TEMPLATES = {

            "template-modern"

    orange:{
        name:
            "Dynamic Orange",

        className:

        name:
            "Neon Green",

        className:
            "template-neon"
    },

    blue:{
        name:
            "Carbon Blue",

        className:
            "template-blue"
    }

};


/* =========================================================
   STATE
========================================================= */

let products = [];

let selectedIds = [];

let promoProducts = [];

let priceOverrides = {};

let currentIndex = 0;

let currentRatio =
    localStorage.getItem(
        STORAGE.RATIO
    ) || "169";

let currentTemplate =
    localStorage.getItem(
        STORAGE.TEMPLATE
    ) || "modern";

let searchQuery = "";

let playing = true;

let autoplay = null;

let transitionBusy = false;

let downloadBusy = false;


/* =========================================================
   DOM
========================================================= */

const stage =
    document.getElementById(
        "stage"
    );

const productGrid =
    document.getElementById(
        "productGrid"
    );

const selectedCount =
    document.getElementById(
        "selectedCount"
    );

const totalCount =
    document.getElementById(
        "totalCount"
    );

const slideCount =
    document.getElementById(
        "slideCount"
    );

const activeTemplate =
    document.getElementById(
        "activeTemplate"
    );

const downloadBtn =
    document.getElementById(
        "downloadBtn"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   HELPERS
========================================================= */

function text(
    value,
    fallback=""
){

    if(
        value === null ||
        value === undefined
    ){

        return fallback;

    }

    if(
        typeof value ===
        "string" ||
        typeof value ===
        "number"
    ){

        return String(value);

    }

    if(
        typeof value ===
        "object"
    ){

        return String(

            value.text ??
            value.label ??
            value.title ??
            value.name ??
            value.nama ??
            value.value ??
            fallback

        );

    }

    return fallback;

}


function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function rupiah(
    value
){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            minimumFractionDigits:0,
            maximumFractionDigits:0
        }
    ).format(
        Number(value) || 0
    );

}


function slug(
    value
){

    return String(
        value || "produk"
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[^a-z0-9]+/g,
        "-"
    )
    .replace(
        /^-+|-+$/g,
        ""
    );

}


function wait(
    ms
){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function showToast(
    message
){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2200
        );

}


/* =========================================================
   NORMALIZE PRODUCT
========================================================= */

function normalizeProduct(
    raw,
    index
){

    const id = String(

        raw.id ??
        raw.kode ??
        raw.sku ??
        `product-${index+1}`

    );


    const brand =
        text(
            raw.brand ??
            raw.merek ??
            raw.brandName,
            "Nine Luximos"
        ).trim();


    const name =
        text(
            raw.nama ??
            raw.name ??
            raw.judul ??
            raw.title ??
            raw.productName,
            "Produk Promo"
        ).trim();


    const harga =
        raw.harga &&
        typeof raw.harga ===
        "object"

            ?

            raw.harga

            :

            {};


    const normal =
        Number(
            harga.normal ??
            raw.hargaNormal ??
            raw.normal ??
            raw.priceNormal ??
            0
        ) || 0;


    const promo =
        Number(
            harga.promo ??
            raw.hargaPromo ??
            raw.promoPrice ??
            raw.pricePromo ??
            normal
        ) || normal;


    return {

        ...raw,

        id,

        brand,

        nama:name,

        harga:{

            ...harga,

            normal,

            promo

        }

    };

}


/* =========================================================
   IMAGE
========================================================= */

function imagePath(
    product
){

    const explicit =

        product.gambar ??
        product.image ??
        product.foto ??
        product.imagePath ??
        product.image_url ??
        product.imageUrl;


    if(explicit){

        return text(
            explicit
        ).trim();

    }


    const filename =

        product.file ??
        product.filename ??
        product.imageName ??
        product.namaFile;


    if(filename){

        return (
            CONFIG.IMAGE_FOLDER +
            text(filename).trim()
        );

    }


    return "";

}


/* =========================================================
   DISPLAY TITLE
========================================================= */

function makeDisplayTitle(
    product
){

    let title =
        text(
            product.nama ??
            product.name ??
            product.judul ??
            product.title,
            "Produk Promo"
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    const brand =
        text(
            product.brand
        ).trim();


    if(
        brand &&
        title
            .toLowerCase()
            .startsWith(
                brand.toLowerCase()
            )
    ){

        title =
            title
            .slice(
                brand.length
            )
            .replace(
                /^[-–—:|•\s]+/,
                ""
            )
            .trim();

    }


    return (
        title ||
        "Produk Promo"
    );

}


/* =========================================================
   WARRANTY
========================================================= */

function warrantyText(
    product
){

    return text(

        product.garansi ??
        product.warranty ??
        product.badgeWarranty ??
        product.warrantyBadge ??
        product.badge ??
        "GARANSI 1 TAHUN",

        "GARANSI 1 TAHUN"

    ).trim();

}


/* =========================================================
   PROMO
========================================================= */

function isPromo(
    product
){

    const value =

        product.promo ??
        product.isPromo ??
        product.promosi ??
        product.statusPromo ??
        false;


    if(
        value === true
    ){

        return true;

    }


    if(
        typeof value ===
        "string"
    ){

        return [

            "true",
            "promo",
            "yes",
            "1"

        ].includes(
            value.toLowerCase()
        );

    }


    return false;

}


/* =========================================================
   PRICE ENGINE
========================================================= */

function getPriceData(
    product
){

    const baseNormal =
        Number(
            product.harga?.normal
        ) || 0;


    const basePromo =
        Number(
            product.harga?.promo
        ) || baseNormal;


    const override =
        priceOverrides[
            String(product.id)
        ] || {};


    const normal =
        Number(
            override.normal ??
            baseNormal
        ) || 0;


    const promo =
        Number(
            override.promo ??
            basePromo
        ) || 0;


    const extraEnabled =
        Boolean(
            override.extraEnabled
        );


    const extraPercent =
        Math.min(
            99,
            Math.max(
                0,
                Number(
                    override.extraPercent
                ) || 0
            )
        );


    const manualEnabled =
        Boolean(
            override.manualEnabled
        );


    const manualFinal =
        Number(
            override.manualFinal
        ) || 0;


    let calculatedFinal =
        promo;


    if(
        extraEnabled &&
        extraPercent > 0
    ){

        calculatedFinal =
            Math.round(
                promo *
                (
                    1 -
                    extraPercent / 100
                )
            );

    }


    const final =

        manualEnabled &&
        manualFinal > 0

            ?

            manualFinal

            :

            calculatedFinal;


    const baseDiscount =

        normal > 0

            ?

            Math.max(
                0,
                Math.round(
                    (
                        (normal - promo) /
                        normal
                    ) * 100
                )
            )

            :

            0;


    const finalDiscount =

        normal > 0

            ?

            Math.max(
                0,
                Math.round(
                    (
                        (normal - final) /
                        normal
                    ) * 100
                )
            )

            :

            0;


    return {

        normal,
        promo,
        final,

        extraEnabled,
        extraPercent,

        manualEnabled,
        manualFinal,

        baseDiscount,
        finalDiscount

    };

}


/* =========================================================
   STORAGE
========================================================= */

function loadPriceOverrides(){

    try{

        return JSON.parse(
            localStorage.getItem(
                STORAGE.PRICES
            ) || "{}"
        );

    }catch{

        return {};

    }

}


function savePriceOverrides(){

    localStorage.setItem(
        STORAGE.PRICES,
        JSON.stringify(
            priceOverrides
        )
    );

}


function restoreSelection(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    STORAGE.SELECTION
                ) || "[]"
            );


        selectedIds =
            Array.isArray(saved)

                ?

                saved.map(
                    value =>
                        String(value)
                )

                :

                [];

    }catch{

        selectedIds = [];

    }

}


function saveSelection(){

    localStorage.setItem(
        STORAGE.SELECTION,
        JSON.stringify(
            selectedIds
        )
    );

}


/* =========================================================
   UI
========================================================= */

function updateCounts(){

    selectedCount.textContent =
        selectedIds.length;

    totalCount.textContent =
        products.length;

}


function updateSlideCount(){

    slideCount.textContent =
        promoProducts.length

            ?

            `${currentIndex+1} / ${promoProducts.length}`

            :

            "0 / 0";

}


function syncUI(){

    document
    .querySelectorAll(
        ".ratio-btn"
    )
    .forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.ratio ===
                currentRatio
            );

        }
    );


    document
    .querySelectorAll(
        ".template-card"
    )
    .forEach(
        card => {

            card.classList.toggle(
                "active",
                card.dataset.template ===
                currentTemplate
            );

        }
    );


    activeTemplate.textContent =
        TEMPLATES[
            currentTemplate
        ].name;


    document
    .querySelectorAll(
        "[data-thumb-ratio]"
    )
    .forEach(
        element => {

            element.textContent =
                currentRatio === "916"

                    ?
                    "9:16"

                    :
                    currentRatio === "45"

                        ?
                        "4:5"

                        :
                        "16:9";

        }
    );

}


/* =========================================================
   RENDER PREVIEW
========================================================= */

function renderPreview(){

    ){

        stage.innerHTML = `

                    <strong>

        );

        ];

    const extraBadge =

                class="extra-discount-badge"

                EXTRA

    stage.className =

    stage.innerHTML = `

/* =========================================================
   LOAD IMAGE
========================================================= */

function waitForImage(
    image
){

    if(!image){

        return Promise.resolve();

    }


    if(
        image.complete
    ){

        if(
            typeof image.decode ===
            "function"
        ){

            return image
                .decode()
                .catch(
                    ()=>{}
                );

        }

        return Promise.resolve();

    }


    return new Promise(
        resolve => {

            let finished =
                false;


            const done =
                ()=>{

                    if(
                        finished
                    ){
                        return;
                    }


                    finished =
                        true;


                    resolve();

                };


            image.addEventListener(
                "load",
                done,
                {
                    once:true
                }
            );


            image.addEventListener(
                "error",
                done,
                {
                    once:true
                }
            );


            setTimeout(
                done,
                7000
            );

        }
    );

}


async function waitForCurrentImage(){

    const image =
        stage.querySelector(
            ".product-image"
        );


    if(image){

        await waitForImage(
            image
        );

    }

}


async function waitForImages(
    root
){

    const images =
        [
            ...root.querySelectorAll(
                "img"
            )
        ];


    await Promise.all(
        images.map(
            waitForImage
        )
    );

}


async function waitForFonts(){

    if(
        document.fonts &&
        document.fonts.ready
    ){

        try{

            await Promise.race(
                [
                    document.fonts.ready,
                    wait(4000)
                ]
            );

        }catch{}

    }

}


/* =========================================================
   AUTOPLAY
========================================================= */

function startAutoplay(){

    stopAutoplay();


    if(
        !playing ||
        promoProducts.length < 2
    ){

        return;

    }


    autoplay =
        setTimeout(
            ()=>{
                nextSlide();
            },
            CONFIG.DURATION
        );

}


function stopAutoplay(){

    if(autoplay){

        clearTimeout(
            autoplay
        );

        autoplay = null;

    }

}


/* =========================================================
   SLIDE
========================================================= */

async function changeSlide(
    direction
){

    if(
        transitionBusy ||
        promoProducts.length < 2
    ){

        return;

    }


    transitionBusy =
        true;


    stopAutoplay();


    const oldCanvas =
        document.getElementById(
            "promoCanvas"
        );


    if(oldCanvas){

        oldCanvas.style.opacity =
            "0";

        await wait(230);

    }


    currentIndex =
        (
            currentIndex +
            direction +
            promoProducts.length
        )
        %
        promoProducts.length;


    renderPreview();


    const newCanvas =
        document.getElementById(
            "promoCanvas"
        );


    if(newCanvas){

        newCanvas.style.opacity =
            "1";

    }


    await wait(180);


    transitionBusy =
        false;


    if(playing){

        startAutoplay();

    }

}


function nextSlide(){

    changeSlide(1);

}


function previousSlide(){

    changeSlide(-1);

}

   PRODUCT MANAGER
========================================================= */

function renderManager(){

    const filtered =
        products.filter(
            product => {

                if(!searchQuery){

                    return true;

                }


                const haystack =

                    [
                        product.brand,
                        product.nama,
                        product.name,
                        product.id,
                        product.sku
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(
                        /[\u0300-\u036f]/g,
                        ""
                    );


                return haystack.includes(
                    searchQuery
                );

            }
        );


    productGrid.innerHTML =
        "";


    if(
        !filtered.length
    ){

        productGrid.innerHTML = `

            <div
                class="error"
                style="
                    grid-column:1/-1;
                "
            >
                Produk tidak ditemukan.
            </div>

        `;

        updateCounts();

        return;

    }


    const fragment =
        document.createDocumentFragment();


    filtered.forEach(
        product => {

            fragment.appendChild(
                createProductCard(
                    product
                )
            );

        }
    );


    productGrid.appendChild(
        fragment
    );


    updateCounts();

}

/* =========================================================
   DOWNLOAD BLOB
========================================================= */

async function saveBlob(
    blob,
    filename
){

    if(
        !blob ||
        blob.size <= 0
    ){

        throw new Error(
            "EMPTY_BLOB"
        );

    }

    const url =
        URL.createObjectURL(
            blob
        );

    let link = null;

    try{

        link =
            document.createElement("a");

        link.href =
            url;

        link.download =
            filename;

        link.rel =
            "noopener";

        link.style.position =
            "fixed";

        link.style.left =
            "-9999px";

        link.style.top =
            "-9999px";

        link.style.width =
            "1px";

        link.style.height =
            "1px";

        link.style.opacity =
            "0";

        document.body.appendChild(
            link
        );

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );

        link.click();

        await wait(1000);

        return true;

    }catch(error){

        console.warn(
            "[DOWNLOAD] Direct download failed:",
            error
        );

        /*
         * Fallback mobile/browser.
         */

        try{

            if(
                navigator.share &&
                typeof File === "function"
            ){

                const file =
                    new File(
                        [blob],
                        filename,
                        {
                            type:
                                blob.type ||
                                "image/png"
                        }
                    );

                if(
                    !navigator.canShare ||
                    navigator.canShare({
                        files:[file]
                    })
                ){

                    await navigator.share({
                        files:[file],
                        title:filename
                    });

                    return true;

                }

            }

        }catch(shareError){

            if(
                shareError?.name ===
                "AbortError"
            ){

                return true;

            }

            console.warn(
                "[DOWNLOAD] Share fallback failed:",
                shareError
            );

        }

        /*
         * Last fallback.
         */

        try{

            const opened =
                window.open(
                    url,
                    "_blank"
                );

            if(opened){

                showToast(
                    "Gambar dibuka. Simpan gambar dari browser."
                );

                return true;

            }

        }catch(fallbackError){

            console.warn(
                "[DOWNLOAD] Final fallback failed:",
                fallbackError
            );

        }

        throw new Error(
            "BROWSER_DOWNLOAD_BLOCKED"
        );

    }finally{

        if(link){

            try{
                link.remove();
            }catch{}

        }

        setTimeout(
            ()=>{
                try{
                    URL.revokeObjectURL(url);
                }catch{}
            },
            5000
        );

    }

}







/* =========================================================
   CAPTURE COLOR COMPATIBILITY
   html2canvas tidak support beberapa CSS color function.
   Hanya aktif selama proses capture.
========================================================= */

function prepareCaptureStyles(root){

    const restore = [];

    const elements = [
        root,
        ...root.querySelectorAll("*")
    ];

    elements.forEach(element => {

        const computed =
            getComputedStyle(element);

        const properties = [
            "color",
            "backgroundColor",
            "borderTopColor",
            "borderRightColor",
            "borderBottomColor",
            "borderLeftColor",
            "outlineColor",
            "boxShadow",
            "textShadow"
        ];

        properties.forEach(property => {

            const value =
                computed[property];

            if(
                !value ||
                (
                    !value.includes("color(") &&
                    !value.includes("color-mix(")
                )
            ){

                return;

            }

            restore.push({
                element,
                property,
                value:
                    element.style[property]
            });

            if(
                property ===
                "backgroundColor"
            ){

                element.style[property] =
                    "#080C09";

            }else if(
                property ===
                "color"
            ){

                element.style[property] =
                    "#FFFFFF";

            }else if(
                property.includes("border") ||
                property === "outlineColor"
            ){

                element.style[property] =
                    "rgba(255,255,255,.15)";

            }else{

                element.style[property] =
                    "none";

            }

        });

    });

    return function restoreCaptureStyles(){

        restore.forEach(item => {

            item.element.style[
                item.property
            ] =
                item.value;

        });

    };

}

   DOWNLOAD STATUS
========================================================= */

async function downloadStatus(){

    if(downloadBusy){
        return;
    }

    const canvas =
        document.getElementById(
            "promoCanvas"
        );

    const product =
        promoProducts[currentIndex];

    if(
        !canvas ||
        !product
    ){

        showToast(
            "Preview belum siap."
        );

        return;

    }

    if(
        typeof html2canvas !==
        "function"
    ){

        showToast(
            "Engine download belum tersedia."
        );

        return;

    }

    downloadBusy =
        true;

    const oldHTML =
        downloadBtn.innerHTML;

    const wasPlaying =
        playing;

    stopAutoplay();

    downloadBtn.disabled =
        true;

    downloadBtn.innerHTML =
        "MEMBUAT STATUS...";

    document.body.classList.add(
        "capture-mode"
    );

    let restoreCaptureStyles =
        null;

    try{

        await waitForImages(
            canvas
        );

        await waitForFonts();

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    ()=>{
                        requestAnimationFrame(
                            resolve
                        );
                    }
                )
        );

        await wait(150);

        /*
         * FIX UTAMA:
         * color-mix()/color() hanya diganti
         * sementara selama html2canvas bekerja.
         *
         * Setelah capture selesai semuanya
         * dikembalikan.
         */

        restoreCaptureStyles =
            prepareCaptureStyles(
                canvas
            );

        const rect =
            canvas.getBoundingClientRect();

        const width =
            Math.max(
                1,
                Math.round(
                    rect.width
                )
            );

        const height =
            Math.max(
                1,
                Math.round(
                    rect.height
                )
            );

        const MAX_PIXELS =
            8000000;

        const requestedScale =

            currentRatio === "916"
                ? 2.5
                : currentRatio === "45"
                    ? 2.35
                    : 2.15;

        const safeScale =
            Math.sqrt(
                MAX_PIXELS /
                (
                    width *
                    height
                )
            );

        const scale =
            Math.max(
                1,
                Math.min(
                    requestedScale,
                    safeScale
                )
            );

        console.log(
            "[DOWNLOAD] Capture:",
            {
                width,
                height,
                scale
            }
        );

        let rendered;

        try{

            rendered =
                await html2canvas(
                    canvas,
                    {
                        backgroundColor:
                            "#050705",

                        scale,

                        width,

                        height,

                        useCORS:
                            true,

                        allowTaint:
                            false,

                        imageTimeout:
                            15000,

                        logging:
                            false,

                        foreignObjectRendering:
                            false,

                        removeContainer:
                            true,

                        scrollX:
                            0,

                        scrollY:
                            0
                    }
                );

        }catch(firstError){

            console.warn(
                "[DOWNLOAD] Capture pertama gagal, retry scale 1:",
                firstError
            );

            rendered =
                await html2canvas(
                    canvas,
                    {
                        backgroundColor:
                            "#050705",

                        scale:1,

                        width,

                        height,

                        useCORS:
                            true,

                        allowTaint:
                            false,

                        imageTimeout:
                            10000,

                        logging:
                            false,

                        foreignObjectRendering:
                            false,

                        removeContainer:
                            true,

                        scrollX:
                            0,

                        scrollY:
                            0
                    }
                );

        }

        /*
         * Restore SEGERA setelah html2canvas selesai.
         */

        if(
            restoreCaptureStyles
        ){

            restoreCaptureStyles();

            restoreCaptureStyles =
                null;

        }

        if(
            !rendered ||
            !rendered.width ||
            !rendered.height
        ){

            throw new Error(
                "CANVAS_RENDER_FAILED"
            );

        }

        let blob = null;

        /*
         * PRIMARY: toBlob
         */

        try{

            blob =
                await new Promise(
                    (
                        resolve,
                        reject
                    )=>{

                        let done =
                            false;

                        const finish =
                            result=>{

                                if(done){
                                    return;
                                }

                                done =
                                    true;

                                if(
                                    result &&
                                    result.size > 0
                                ){

                                    resolve(
                                        result
                                    );

                                }else{

                                    reject(
                                        new Error(
                                            "TOBLOB_EMPTY"
                                        )
                                    );

                                }

                            };

                        try{

                            rendered.toBlob(
                                finish,
                                "image/png",
                                1
                            );

                        }catch(error){

                            reject(error);

                        }

                        setTimeout(
                            ()=>{

                                if(!done){

                                    reject(
                                        new Error(
                                            "TOBLOB_TIMEOUT"
                                        )
                                    );

                                }

                            },
                            8000
                        );

                    }
                );

        }catch(blobError){

            console.warn(
                "[DOWNLOAD] toBlob failed:",
                blobError
            );

            /*
             * FALLBACK: toDataURL
             */

            const dataURL =
                rendered.toDataURL(
                    "image/png"
                );

            if(
                !dataURL ||
                !dataURL.includes(",")
            ){

                throw new Error(
                    "PNG_GENERATION_FAILED"
                );

            }

            const base64 =
                dataURL.split(",")[1];

            const binary =
                atob(base64);

            const bytes =
                new Uint8Array(
                    binary.length
                );

            for(
                let i = 0;
                i < binary.length;
                i++
            ){

                bytes[i] =
                    binary.charCodeAt(i);

            }

            blob =
                new Blob(
                    [bytes],
                    {
                        type:
                            "image/png"
                    }
                );

        }

        if(
            !blob ||
            blob.size <= 0
        ){

            throw new Error(
                "PNG_EMPTY"
            );

        }

        const ratioName =

            currentRatio === "916"
                ? "9x16"
                : currentRatio === "45"
                    ? "4x5"
                    : "16x9";

        const filename =
            `PROMO-${slug(
                makeDisplayTitle(
                    product
                )
            )}-${slug(
                TEMPLATES[
                    currentTemplate
                ].name
            )}-${ratioName}.png`;

        await saveBlob(
            blob,
            filename
        );

        showToast(
            "Status berhasil didownload ✓"
        );

    }catch(error){

        console.error(
            "[DOWNLOAD STATUS ERROR]",
            error
        );

        showToast(
            "Gagal membuat status: " +
            (
                error?.message ||
                "unknown error"
            )
        );

    }finally{

        /*
         * Safety restore kalau capture throw
         * sebelum restore normal dipanggil.
         */

        if(
            restoreCaptureStyles
        ){

            try{
                restoreCaptureStyles();
            }catch{}

            restoreCaptureStyles =
                null;

        }

        document.body.classList.remove(
            "capture-mode"
        );

        downloadBusy =
            false;

        downloadBtn.disabled =
            false;

        downloadBtn.innerHTML =
            oldHTML;

        if(wasPlaying){

            playing =
                true;

            updatePlayIcons();

            startAutoplay();

        }

    }

    }


  
/* =========================================================
   DOWNLOAD JSON
========================================================= */

async function downloadJSON(){

    try{

        const selected =
            products.filter(
                product =>
                    selectedIds.includes(
                        String(
                            product.id
                        )
                    )
            );


        const output =
            selected.map(
                product => {

                    const price =
                        getPriceData(
                            product
                        );


                    return {

                        ...product,

                        harga:{

                            ...product.harga,

                            normal:
                                price.normal,

                            promo:
                                price.final,

                            hargaDasarPromo:
                                price.promo,

                            diskon:
                                price.finalDiscount,

                            diskonExtraAktif:
                                price.extraEnabled,

                            diskonExtra:
                                price.extraPercent,

                            hargaFinalCustomAktif:
                                price.manualEnabled,

                            hargaFinalCustom:
                                price.manualFinal

                        }

                    };

                }
            );


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        output,
                        null,
                        4
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        await saveBlob(
            blob,
            "produk-promo-final.json"
        );


        showToast(
            "produk-promo-final.json berhasil dibuat ✓"
        );

    }catch(error){

        console.error(
            error
        );

        showToast(
            "Gagal download JSON."
        );

    }

}

/* =========================================================
   TOUCH SWIPE
========================================================= */

let touchStartX = 0;
let touchStartY = 0;


stage.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.screenX;

        touchStartY =
            touch.screenY;

    },
    {
        passive:true
    }
);


stage.addEventListener(
    "touchend",
    event => {

        if(
            transitionBusy
        ){

            return;

        }


        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.screenX -
            touchStartX;


        const deltaY =
            touch.screenY -
            touchStartY;


        if(
            Math.abs(deltaX) <
            Math.abs(deltaY)
        ){

            return;

        }


        if(
            Math.abs(deltaX) < 45
        ){

            return;

        }


        if(
            deltaX < 0
        ){

            nextSlide();

        }else{

            previousSlide();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;


        if(
            target &&
            (
                target.tagName ===
                "INPUT" ||
                target.tagName ===
                "TEXTAREA" ||
                target.isContentEditable
            )
        ){

            return;

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            nextSlide();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousSlide();

        }


        if(
            event.key ===
            " "
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.key.toLowerCase() ===
            "f"
        ){

            document
                .getElementById(
                    "fullscreenBtn"
                )
                .click();

        }


        if(
            event.key.toLowerCase() ===
            "d"
        ){

            downloadStatus();

        }

    }
);


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    try{

        priceOverrides =
            loadPriceOverrides();


        const response =
            await fetch(
                CONFIG.JSON,
                {
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                `produk.json HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        const source =

            Array.isArray(data)

                ?

                data

                :

                Array.isArray(
                    data.products
                )

                    ?

                    data.products

                    :

                    Array.isArray(
                        data.produk
                    )

                        ?

                        data.produk

                        :

                        [];


        if(
            !source.length
        ){

            throw new Error(
                "produk.json kosong atau format tidak dikenali."
            );

        }


        products =
            source.map(
                normalizeProduct
            );


        restoreSelection();


        const validIds =
            new Set(
                products.map(
                    product =>
                        String(
                            product.id
                        )
                )
            );


        selectedIds =
            selectedIds.filter(
                id =>
                    validIds.has(id)
            );


        if(
            !selectedIds.length
        ){

            selectedIds =
                products
                .filter(
                    isPromo
                )
                .map(
                    product =>
                        String(
                            product.id
                        )
                );

        }


        syncUI();

        renderManager();

        applyPromo(false);


    }catch(error){

        console.error(
            "[PROMO]",
            error
        );


        stage.innerHTML = `

            <div class="error">

                <div>

                    <strong>
                        Gagal memuat produk.
                    </strong>

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                    <br><br>

                    Pastikan
                    <strong>
                        produk.json
                    </strong>

                    berada di folder yang sama
                    dengan index.html.

                </div>

            </div>

        `;

    }

}
