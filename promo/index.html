<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705">
<title>Promo Studio — Imam_salesfr</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* =========================================================
   CORE
========================================================= */

:root{
    --lime:#8CC63F;
    --lime-dark:#72A82F;
    --lime-soft:rgba(140,198,63,.12);

    --orange:#FF7A1A;
    --orange-dark:#E95D0C;

    --bg:#050705;
    --panel:#0A0D0A;
    --panel-2:#0D120E;

    --white:#F5F7F3;
    --muted:#858D84;
    --muted-2:#646C63;

    --border:rgba(255,255,255,.09);

    --shadow:
        0 30px 90px rgba(0,0,0,.42);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    background:var(--bg);
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(140,198,63,.07),
            transparent 35%
        ),
        var(--bg);

    color:var(--white);

    font-family:
        Poppins,
        Arial,
        sans-serif;

    -webkit-font-smoothing:antialiased;
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   HEADER
========================================================= */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;

    width:100%;

    padding:
        14px
        clamp(18px,3vw,32px);

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        rgba(5,7,5,.94);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.brand-name{
    color:#fff;

    font-size:
        clamp(21px,2.6vw,29px);

    line-height:1;

    font-weight:800;

    letter-spacing:-1.2px;
}

.brand-sub{
    margin-top:7px;

    color:var(--lime);

    font-size:
        clamp(9px,1vw,11px);

    line-height:1;

    font-weight:600;

    letter-spacing:1.3px;
}

.header-actions{
    display:flex;
    gap:9px;
}

.header-btn{
    width:48px;
    height:48px;

    display:grid;
    place-items:center;

    border:
        1px solid var(--border);

    border-radius:15px;

    background:#090D0A;

    color:#fff;

    cursor:pointer;

    transition:.2s ease;
}

.header-btn:hover{
    border-color:
        rgba(140,198,63,.4);
}

.header-btn.primary{
    color:#10150C;
    background:var(--lime);
    border-color:var(--lime);
}

.header-btn svg{
    width:20px;
    height:20px;
}


/* =========================================================
   MAIN
========================================================= */

main{
    width:100%;
    padding:
        18px
        18px
        100px;
}

.container{
    width:min(100%,1200px);
    margin:auto;
}


/* =========================================================
   PREVIEW
========================================================= */

.preview-wrap{
    width:100%;
}

.stage{
    width:100%;
    display:flex;
    justify-content:center;
}

.promo-canvas{
    position:relative;

    width:100%;

    overflow:hidden;
    isolation:isolate;

    background:#070907;

    border:
        1px solid var(--border);

    box-shadow:var(--shadow);
}


/* =========================================================
   RATIO
========================================================= */

.stage.ratio-916 .promo-canvas{
    width:min(100%,520px);
    aspect-ratio:9 / 16;
}

.stage.ratio-45 .promo-canvas{
    width:min(100%,760px);
    aspect-ratio:4 / 5;
}

.stage.ratio-169 .promo-canvas{
    width:100%;
    aspect-ratio:16 / 9;
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-visual{
    position:absolute;
    z-index:1;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.stage.ratio-916 .product-visual{
    top:0;
    left:0;
    right:0;
    height:57%;
}

.stage.ratio-45 .product-visual{
    top:0;
    left:0;
    right:0;
    height:61%;
}

.stage.ratio-169 .product-visual{
    top:0;
    left:0;
    width:58%;
    height:100%;
}

.product-image{
    width:100%;
    height:100%;

    padding:5%;

    object-fit:contain;
    object-position:center;

    display:block;
}

.visual-gradient{
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent 48%,
            rgba(5,7,5,.06) 60%,
            rgba(5,7,5,.72) 88%,
            #070907 100%
        );
}

.stage.ratio-169 .visual-gradient{
    background:
        linear-gradient(
            to right,
            transparent 38%,
            rgba(5,7,5,.2) 52%,
            #070907 100%
        );
}



/* =========================================================
   FINAL PROMO BADGE SYSTEM
   Ratio-aware / No overlap / No collision
========================================================= */

.promo-badge{
    position:absolute;
    z-index:30;

    width:max-content;
    max-width:calc(100% - 40px);

    height:44px;

    padding:0 21px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            #FF9141 0%,
            #FF7A1A 55%,
            #F36A0D 100%
        );

    color:#170A02;

    font-size:11px;
    font-weight:900;

    line-height:1;

    letter-spacing:4px;

    white-space:nowrap;

    box-shadow:
        0 12px 30px rgba(255,122,26,.20);

    pointer-events:none;

    /*
      Jangan pakai transform untuk posisi badge.
      Posisi dikontrol penuh per ratio.
    */
}


/* DOT */

.promo-badge::before{
    content:"";

    width:9px;
    height:9px;

    flex:0 0 9px;

    border-radius:50%;

    background:#170A02;
}


/* =========================================================
   9:16 — STORY
=========================================================

   PHOTO
   ─────────────────
   0%
   │
   │ image
   │
   57%
   ├────────────────
   │
   │ badge zone
   │
   66%
   ├────────────────
   │
   │ brand
   │ title
   │ price
   │
========================================================= */

.stage.ratio-916 .promo-badge{

    top:calc(57% + 14px);

    left:8%;

}


/*
   Product info TIDAK lagi menggunakan bottom.
   Kita kasih posisi TOP supaya benar-benar
   punya zona sendiri setelah badge.
*/

.stage.ratio-916 .product-info{

    top:calc(57% + 76px);

    left:8%;
    right:7%;

    bottom:auto;

}


/*
   Brand punya jarak aman dari badge.
*/

.stage.ratio-916 .product-brand{

    margin-top:0;

}


/*
   Judul
*/

.stage.ratio-916 .product-name{

    margin-top:10px;

    max-width:94%;

}


/*
   Harga
*/

.stage.ratio-916 .price-block{

    margin-top:19px;

}


/* =========================================================
   4:5 — FEED
=========================================================

   PHOTO
   ─────────────────
   0%
   │
   │ image
   │
   61%
   ├────────────────
   │
   │ badge
   │
   69%
   ├────────────────
   │
   │ brand
   │ title
   │ price
========================================================= */

.stage.ratio-45 .promo-badge{

    top:calc(61% + 13px);

    left:7%;

}


/*
   Ini bagian penting.

   Screenshot lo sebelumnya:
   badge masuk ke area judul.

   Sekarang product-info dimulai SETELAH
   zona badge.
*/

.stage.ratio-45 .product-info{

    top:calc(61% + 74px);

    left:7%;
    right:7%;

    bottom:auto;

}


.stage.ratio-45 .product-brand{

    margin-top:0;

}


.stage.ratio-45 .product-name{

    margin-top:10px;

    max-width:93%;

}


.stage.ratio-45 .price-block{

    margin-top:18px;

}


/* =========================================================
   16:9 — LANDSCAPE
=========================================================

   FOTO                     INFO
   ┌──────────────────┐     ┌───────────────┐
   │                  │     │    PROMO      │
   │      IMAGE       │     │               │
   │                  │     │ NINE LUXIMOS  │
   │                  │     │ PRODUCT       │
   │                  │     │               │
   └──────────────────┘     │ PRICE         │
                            └───────────────┘

   Badge TIDAK lagi masuk area foto.
========================================================= */

.stage.ratio-169 .promo-badge{

    top:8%;

    left:60%;

}


/*
   Info dimulai di bawah badge.
*/

.stage.ratio-169 .product-info{

    top:calc(8% + 65px);

    left:60%;
    right:6%;

    bottom:auto;

}


.stage.ratio-169 .product-brand{

    margin-top:0;

}


.stage.ratio-169 .product-name{

    margin-top:10px;

    max-width:91%;

}


.stage.ratio-169 .price-block{

    margin-top:18px;

}


/* =========================================================
   BADGE RESPONSIVE
========================================================= */

@media(max-width:600px){

    .promo-badge{

        height:38px;

        padding:0 16px;

        gap:8px;

        font-size:8px;

        letter-spacing:3px;

        box-shadow:
            0 10px 25px
            rgba(255,122,26,.18);

    }


    .promo-badge::before{

        width:8px;
        height:8px;

        flex-basis:8px;

    }


    /* -----------------------------------------------
       9:16 MOBILE
    ----------------------------------------------- */

    .stage.ratio-916 .promo-badge{

        top:calc(57% + 10px);

        left:8%;

    }


    .stage.ratio-916 .product-info{

        top:calc(57% + 62px);

        left:8%;
        right:7%;

    }


    .stage.ratio-916 .product-name{

        margin-top:8px;

    }


    .stage.ratio-916 .price-block{

        margin-top:16px;

    }


    /* -----------------------------------------------
       4:5 MOBILE
    ----------------------------------------------- */

    .stage.ratio-45 .promo-badge{

        top:calc(61% + 9px);

        left:7%;

    }


    .stage.ratio-45 .product-info{

        top:calc(61% + 60px);

        left:7%;
        right:7%;

    }


    .stage.ratio-45 .product-name{

        margin-top:8px;

    }


    .stage.ratio-45 .price-block{

        margin-top:15px;

    }


    /* -----------------------------------------------
       16:9 MOBILE
    ----------------------------------------------- */

    .stage.ratio-169 .promo-badge{

        top:7%;

        left:60%;

        height:34px;

        padding:0 13px;

        font-size:7px;

        letter-spacing:2.5px;

    }


    .stage.ratio-169 .promo-badge::before{

        width:7px;
        height:7px;

        flex-basis:7px;

    }


    .stage.ratio-169 .product-info{

        top:calc(7% + 54px);

        left:60%;

        right:5%;

    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:380px){

    .stage.ratio-916 .promo-badge{

        top:calc(57% + 8px);

        left:7%;

        height:35px;

        padding:0 14px;

        font-size:7px;

        letter-spacing:2.5px;

    }


    .stage.ratio-916 .product-info{

        top:calc(57% + 55px);

        left:7%;
        right:6%;

    }


    .stage.ratio-45 .promo-badge{

        top:calc(61% + 7px);

        left:7%;

        height:35px;

        padding:0 14px;

        font-size:7px;

        letter-spacing:2.5px;

    }


    .stage.ratio-45 .product-info{

        top:calc(61% + 53px);

        left:7%;
        right:6%;

    }

}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{
    position:absolute;
    z-index:20;
}


/* 9:16 */

.stage.ratio-916 .product-info{
    left:8%;
    right:7%;
    bottom:12%;
}


/* 4:5 */

.stage.ratio-45 .product-info{
    left:7%;
    right:7%;
    bottom:11%;
}


/* 16:9 */

.stage.ratio-169 .product-info{
    left:58%;
    right:6%;
    bottom:13%;
}


/* =========================================================
   BRAND
========================================================= */

.product-brand{
    color:var(--lime);

    font-size:
        clamp(9px,1vw,12px);

    font-weight:900;

    letter-spacing:3.4px;

    text-transform:uppercase;

    line-height:1.1;
}


/* =========================================================
   TITLE
========================================================= */

.product-name{
    margin-top:10px;

    color:#fff;

    font-weight:900;

    letter-spacing:-1.8px;

    line-height:1.02;

    text-wrap:balance;

    max-width:100%;
}


/*
    Judul tidak lagi bebas membesar.

    Setiap ratio punya batas sendiri.
*/

.stage.ratio-916 .product-name{
    font-size:
        clamp(27px,6vw,48px);

    max-width:96%;
}

.stage.ratio-45 .product-name{
    font-size:
        clamp(30px,5vw,52px);

    max-width:94%;
}

.stage.ratio-169 .product-name{
    font-size:
        clamp(26px,3.4vw,48px);

    max-width:92%;
}


/*
    Batasi maksimal 2 baris.
*/

.product-name{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;

    overflow:hidden;
}


/* =========================================================
   PRICE
========================================================= */

.price-block{
    margin-top:21px;
}

.price-label{
    color:#7E877D;

    font-size:10px;

    font-weight:900;

    letter-spacing:2.8px;

    text-transform:uppercase;
}

.price-promo{
    margin-top:5px;

    color:#fff;

    font-weight:900;

    line-height:.95;

    letter-spacing:-2.6px;
}

.stage.ratio-916 .price-promo{
    font-size:
        clamp(36px,7vw,57px);
}

.stage.ratio-45 .price-promo{
    font-size:
        clamp(38px,6vw,59px);
}

.stage.ratio-169 .price-promo{
    font-size:
        clamp(32px,4.2vw,54px);
}

.price-meta{
    display:flex;
    align-items:center;
    gap:15px;

    margin-top:9px;
}

.price-normal{
    color:#717970;
    font-size:11px;
}

.discount{
    color:var(--orange);

    font-size:11px;

    font-weight:900;
}


/* =========================================================
   CONTROL STRIP
   INI YANG MENGHINDARI TOMBOL RASIO KETUMPUK
========================================================= */

.control-strip{
    width:100%;

    margin-top:12px;

    padding:
        13px 15px;

    display:grid;

    grid-template-columns:
        1fr
        auto
        auto;

    align-items:center;

    gap:16px;

    border:
        1px solid var(--border);

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );
}


/* =========================================================
   RATIO GROUP
========================================================= */

.ratio-group{
    display:flex;
    align-items:center;
    gap:7px;
}

.ratio-caption{
    margin-right:4px;

    color:#707970;

    font-size:8px;

    font-weight:800;

    letter-spacing:1.2px;

    text-transform:uppercase;
}

.ratio-btn{
    min-width:76px;
    height:48px;

    padding:0 12px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:#080C09;

    color:#D5DAD2;

    cursor:pointer;

    transition:.2s ease;
}

.ratio-btn:hover{
    border-color:
        rgba(140,198,63,.4);
}

.ratio-btn.active{
    color:var(--lime);

    border-color:var(--lime);

    background:
        rgba(140,198,63,.06);

    box-shadow:
        inset 0 0 0 1px
        rgba(140,198,63,.15);
}

.ratio-icon{
    width:14px;
    height:17px;

    border:
        1.5px solid currentColor;

    border-radius:2px;
}

.ratio-btn[data-ratio="45"] .ratio-icon{
    width:15px;
    height:18px;
}

.ratio-btn[data-ratio="169"] .ratio-icon{
    width:18px;
    height:11px;
}

.ratio-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.1;
}

.ratio-value{
    font-size:10px;
    font-weight:900;
}

.ratio-use{
    margin-top:3px;

    color:#777F77;

    font-size:7px;
}


/* =========================================================
   NAVIGATION
========================================================= */

.navigation{
    display:flex;
    align-items:center;
    gap:7px;
}

.nav-btn{
    width:48px;
    height:48px;

    display:grid;
    place-items:center;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:#080C09;

    color:#fff;

    cursor:pointer;
}

.nav-btn:hover{
    border-color:
        rgba(140,198,63,.4);
}

.nav-btn svg{
    width:19px;
    height:19px;
}

.slide-count{
    min-width:44px;

    text-align:center;

    color:#B0B7AE;

    font-size:10px;
    font-weight:700;
}


/* =========================================================
   DOWNLOAD
========================================================= */

.download-btn{
    height:48px;

    padding:
        0 18px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    border:0;

    border-radius:12px;

    background:var(--lime);

    color:#11150C;

    font-size:10px;
    font-weight:900;

    cursor:pointer;

    white-space:nowrap;

    transition:.2s ease;
}

.download-btn:hover{
    background:#9AD74A;
    transform:translateY(-1px);
}

.download-btn svg{
    width:17px;
    height:17px;
}


/* =========================================================
   PROMO MANAGER
========================================================= */

.manager{
    margin-top:12px;

    padding:
        26px 22px 22px;

    border:
        1px solid var(--border);

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(8,15,9,.98),
            rgba(5,9,6,.98)
        );
}

.section-label{
    color:var(--lime);

    font-size:10px;

    font-weight:900;

    letter-spacing:3px;

    text-transform:uppercase;
}

.manager-heading{
    margin-top:7px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.manager-title{
    color:#fff;

    font-size:
        clamp(22px,3vw,31px);

    font-weight:800;

    letter-spacing:-1.2px;
}

.manager-summary{
    color:#757E75;

    font-size:10px;
}

.manager-summary strong{
    color:var(--lime);
}


/* =========================================================
   MANAGER TOOLBAR
========================================================= */

.manager-toolbar{
    margin-top:20px;

    display:flex;
    flex-wrap:wrap;

    gap:8px;
}

.tool-btn{
    height:42px;

    padding:
        0 16px;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:#080D09;

    color:#fff;

    font-size:9px;
    font-weight:800;

    cursor:pointer;

    transition:.2s ease;
}

.tool-btn:hover{
    border-color:
        rgba(140,198,63,.4);
}

.tool-btn.primary{
    color:#10140D;

    background:var(--lime);

    border-color:var(--lime);
}


/* =========================================================
   SEARCH
========================================================= */

.search-row{
    margin-top:18px;

    display:flex;
    justify-content:flex-end;
}

.search{
    width:min(100%,280px);

    height:42px;

    padding:
        0 14px;

    outline:none;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:#080D09;

    color:#fff;

    font-size:10px;
}

.search:focus{
    border-color:
        rgba(140,198,63,.5);
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.product-grid{
    margin-top:14px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px,1fr)
        );

    gap:11px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.select-card{
    position:relative;

    min-height:215px;

    overflow:hidden;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:#080C09;

    cursor:pointer;

    transition:.2s ease;
}

.select-card:hover{
    transform:translateY(-2px);

    border-color:
        rgba(140,198,63,.35);
}

.select-card.selected{
    border-color:var(--lime);

    box-shadow:
        0 0 0 1px var(--lime);
}

.select-image{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:125px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#080B08;
}

.select-image img{
    width:100%;
    height:100%;

    padding:10px;

    object-fit:contain;
}

.select-image::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent 40%,
            #080C09 100%
        );
}

.check{
    position:absolute;

    z-index:5;

    top:10px;
    left:10px;

    width:20px;
    height:20px;

    display:grid;
    place-items:center;

    border:
        1px solid rgba(255,255,255,.18);

    border-radius:5px;

<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    JSON:
        "produk.json",

    IMAGE_FOLDER:
        "images/produk/",

    DURATION:
        6500

};


/* =========================================================
   STATE
========================================================= */

let products = [];

let selectedIds = [];

let promoProducts = [];

let currentIndex = 0;

let currentRatio =
    localStorage.getItem(
        "promoRatio"
    ) || "916";

let playing = true;

let autoplay = null;

let progress = null;


/* =========================================================
   DOM
========================================================= */

const stage =
    document.getElementById(
        "stage"
    );

const productGrid =
    document.getElementById(
        "productGrid"
    );

const slideCount =
    document.getElementById(
        "slideCount"
    );

const selectedCount =
    document.getElementById(
        "selectedCount"
    );

const totalCount =
    document.getElementById(
        "totalCount"
    );

const footerSelected =
    document.getElementById(
        "footerSelected"
    );

const footerTotal =
    document.getElementById(
        "footerTotal"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   LOAD
========================================================= */

async function loadProducts(){

    try{

        const response =
            await fetch(
                CONFIG.JSON,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        products =
            Array.isArray(data)
            ? data
            : Array.isArray(data.products)
                ? data.products
                : [];


        if(!products.length){

            throw new Error(
                "produk.json kosong atau format tidak dikenali."
            );

        }


        products =
            products.map(
                normalizeProduct
            );


        totalCount.textContent =
            products.length;

        footerTotal.textContent =
            products.length;


        restoreSelection();


        if(!selectedIds.length){

            selectedIds =
                products
                .filter(
                    isPromo
                )
                .map(
                    p=>p.id
                );

        }


        renderManager();


        applyPromo(
            false
        );


    }catch(error){

        console.error(
            "[PROMO]",
            error
        );


        stage.innerHTML = `

            <div class="error">

                <strong>
                    Gagal memuat produk.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <pre>promo/
├── index.html
├── produk.json
└── images/
    └── produk/
        ├── produk-1.jpg
        └── produk-2.jpg</pre>

            </div>

        `;

    }

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeProduct(
    p,
    index
){

    const id =
        String(
            p.id ??
            p.kode ??
            p.sku ??
            index + 1
        );


    let normal = 0;
    let promo = 0;


    if(
        p.harga &&
        typeof p.harga === "object"
    ){

        normal =
            Number(
                p.harga.normal
            ) || 0;

        promo =
            Number(
                p.harga.promo
            ) || 0;

    }else{

        normal =
            Number(
                p.harga
            ) || 0;

        promo =
            Number(
                p.hargaPromo
            ) || 0;

    }


    return {

        ...p,

        id,

        brand:
            p.brand ||
            p.merek ||
            "NINE LUXIMOS",

        nama:
            p.nama ||
            p.name ||
            "Produk",

        gambar:
            p.gambar ||
            p.image ||
            p.foto ||
            "",

        harga:{
            normal,
            promo,

            status:
                p.harga?.status ||
                "Aktif"
        }

    };

}


/* =========================================================
   IMAGE
========================================================= */

function imagePath(
    product
){

    let path =
        String(
            product.gambar ||
            ""
        ).trim();


    if(!path){

        return "";

    }


    path =
        path.replace(
            /^\/+/,
            ""
        );


    if(
        path.startsWith(
            "images/"
        )
    ){

        return path;

    }


    return CONFIG.IMAGE_FOLDER + path;

}


/* =========================================================
   PROMO
========================================================= */

function isPromo(
    p
){

    const normal =
        Number(
            p.harga?.normal
        ) || 0;

    const promo =
        Number(
            p.harga?.promo
        ) || 0;


    return (
        normal > 0 &&
        promo > 0 &&
        promo < normal
    );

}


/* =========================================================
   TITLE ENGINE
   Tidak menggunakan nama JSON mentah sebagai headline.
========================================================= */

function makeDisplayTitle(
    product
){

    let title =
        String(
            product.nama ||
            ""
        );


    const brand =
        String(
            product.brand ||
            ""
        );


    /*
     * Hilangkan brand yang muncul
     * di dalam nama produk.
     */

    if(brand){

        const brandWords =
            brand
            .split(/\s+/)
            .filter(Boolean)
            .map(
                escapeRegExp
            )
            .join("\\s+");


        if(brandWords){

            title =
                title.replace(
                    new RegExp(
                        brandWords,
                        "ig"
                    ),
                    ""
                );

        }

    }


    /*
     * Bersihkan noise.
     */

    title =
        title
        .replace(
            /\b(NINE|LUXIMOS)\b/gi,
            ""
        )
        .replace(
            /\s*[-–—|:;,]+\s*/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    /*
     * Buang phrase yang biasanya
     * membuat headline terlalu panjang.
     */

    title =
        title.replace(
            /\b(dengan|with|seri|series|variant|varian)\b.*$/i,
            ""
        ).trim();


    /*
     * Kalau terlalu panjang,
     * ambil bagian terpenting.
     */

    if(title.length > 58){

        const words =
            title.split(/\s+/);

        let compact = "";

        for(
            const word of words
        ){

            const candidate =
                compact
                ? compact + " " + word
                : word;


            if(
                candidate.length > 58
            ){

                break;

            }


            compact =
                candidate;

        }


        title =
            compact ||
            title.slice(0,58);

    }


    /*
     * Title case visual.
     * Tidak memaksa semua huruf kecil.
     */

    return title
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   ESCAPE REGEXP
========================================================= */

function escapeRegExp(
    value
){

    return String(value)
        .replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );

}


/* =========================================================
   RENDER MANAGER
========================================================= */

function renderManager(){

    const query =
        document
        .getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    productGrid.innerHTML =
        "";


    const filtered =
        products.filter(
            p=>{

                if(!query){

                    return true;

                }


                return (

                    p.nama
                    .toLowerCase()
                    .includes(query)

                    ||

                    p.brand
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    filtered.forEach(
        product=>{

            const selected =
                selectedIds.includes(
                    product.id
                );


            const normal =
                product.harga.normal;

            const promo =
                product.harga.promo;


            const discount =
                normal > 0
                ? Math.round(
                    (
                        (normal-promo)
                        /
                        normal
                    ) * 100
                )
                : 0;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "select-card" +
                (
                    selected
                    ? " selected"
                    : ""
                );


            card.innerHTML = `

                <div class="select-image">

                    ${
                        imagePath(product)

                        ?

                        `
                        <img
                            src="${escapeAttribute(
                                imagePath(product)
                            )}"
                            alt=""
                            onerror="
                                this.style.display='none'
                            "
                        >
                        `

                        :

                        ""

                    }

                </div>


                <div class="check">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                    >
                        <path d="m5 12 4 4L19 6"/>
                    </svg>

                </div>


                <div class="select-info">

                    <div class="select-brand">

                        ${escapeHTML(
                            product.brand
                        )}

                    </div>


                    <div class="select-name">

                        ${escapeHTML(
                            makeDisplayTitle(
                                product
                            )
                        )}

                    </div>


                    <div class="select-price">

                        ${rupiah(promo)}

                        <span class="select-old">

                            ${rupiah(normal)}

                        </span>

                        ${
                            discount > 0

                            ?

                            `
                            <span class="select-discount">
                                ${discount}%
                            </span>
                            `

                            :

                            ""

                        }

                    </div>

                </div>

            `;


            card.onclick =
                ()=>{
                    toggleProduct(
                        product.id
                    );
                };


            productGrid.appendChild(
                card
            );

        }
    );


    updateCounts();

}


/* =========================================================
   TOGGLE
========================================================= */

function toggleProduct(
    id
){

    id =
        String(id);


    if(
        selectedIds.includes(id)
    ){

        selectedIds =
            selectedIds.filter(
                x=>x !== id
            );

    }else{

        selectedIds.push(id);

    }


    renderManager();

}


/* =========================================================
   APPLY
========================================================= */

function applyPromo(
    notify=true
){

    promoProducts =
        products.filter(
            p =>
                selectedIds.includes(
                    p.id
                )
        );


    currentIndex = 0;


    localStorage.setItem(
        "promoSelection",
        JSON.stringify(
            selectedIds
        )
    );


    renderPreview();


    if(notify){

        showToast(
            `${promoProducts.length} produk diterapkan.`
        );

    }

}


/* =========================================================
   PREVIEW
========================================================= */

function renderPreview(){

    if(
        !promoProducts.length
    ){

        stage.innerHTML = `

            <div class="error">

                <strong>
                    Belum ada produk promo.
                </strong>

                <br><br>

                Pilih produk dari Promo Manager,
                kemudian tekan Terapkan Promo.

            </div>

        `;


        stopAutoplay();

        updateSlideCount();

        return;

    }


    const product =
        promoProducts[
            currentIndex
        ];


    const normal =
        product.harga.normal;

    const promo =
        product.harga.promo;


    const discount =
        normal > 0
        ? Math.round(
            (
                (normal-promo)
                /
                normal
            ) * 100
        )
        : 0;


    const title =
        makeDisplayTitle(
            product
        );


    stage.className =
        `stage ratio-${currentRatio}`;


    stage.innerHTML = `

        <article
            class="promo-canvas"
            id="promoCanvas"
        >


            <div
                class="product-visual"
            >

                ${
                    imagePath(product)

                    ?

                    `
                    <img
                        class="product-image"
                        src="${escapeAttribute(
                            imagePath(product)
                        )}"
                        alt=""
                        crossorigin="anonymous"
                    >
                    `

                    :

                    `
                    <div class="error">
                        IMAGE NOT FOUND
                    </div>
                    `

                }


                <div
                    class="visual-gradient"
                ></div>

            </div>


            <div class="promo-badge">

                PROMO

            </div>


            <div class="product-info">


                <div class="product-brand">

                    ${escapeHTML(
                        product.brand
                    )}

                </div>


                <h1 class="product-name">

                    ${escapeHTML(
                        title
                    )}

                </h1>


                <div class="price-block">

                    <div class="price-label">
                        Harga Promo
                    </div>


                    <div class="price-promo">

                        ${rupiah(
                            promo
                        )}

                    </div>


                    <div class="price-meta">

                        <div class="price-normal">

                            <s>
                                ${rupiah(
                                    normal
                                )}
                            </s>

                        </div>


                        ${
                            discount > 0

                            ?

                            `
                            <div class="discount">
                                Hemat ${discount}%
                            </div>
                            `

                            :

                            ""

                        }

                    </div>

                </div>

            </div>


            <div
                class="capture-hide"
                style="
                    position:absolute;
                    right:5%;
                    bottom:4%;
                    z-index:100;
                    color:#8C948A;
                    font-size:8px;
                "
            >
                Imam_salesfr
            </div>


        </article>

    `;


    updateSlideCount();


    startAutoplay();

}


/* =========================================================
   COUNTER
========================================================= */

function updateSlideCount(){

    slideCount.textContent =
        promoProducts.length

        ?

        `${currentIndex+1} / ${promoProducts.length}`

        :

        "0 / 0";

}


/* =========================================================
   NEXT
========================================================= */

function nextSlide(){

    if(
        promoProducts.length < 2
    ){

        return;

    }


    currentIndex =
        (
            currentIndex + 1
        )
        %
        promoProducts.length;


    renderPreview();

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSlide(){

    if(
        promoProducts.length < 2
    ){

        return;

    }


    currentIndex =
        (
            currentIndex - 1 +
            promoProducts.length
        )
        %
        promoProducts.length;


    renderPreview();

}


/* =========================================================
   PLAY
========================================================= */

function togglePlay(){

    playing =
        !playing;


    updatePlayIcons();


    if(playing){

        startAutoplay();

    }else{

        stopAutoplay();

    }

}


function updatePlayIcons(){

    const path =
        playing

        ?

        `
        <path d="M7 5h4v14H7z"/>
        <path d="M13 5h4v14h-4z"/>
        `

        :

        `
        <path d="M8 5v14l11-7z"/>
        `;


    document.getElementById(
        "playIcon"
    ).innerHTML = path;


    document.getElementById(
        "headerPlayIcon"
    ).innerHTML = path;

}


/* =========================================================
   AUTOPLAY
========================================================= */

function startAutoplay(){

    stopAutoplay();


    if(
        !playing ||
        promoProducts.length < 2
    ){

        return;

    }


    autoplay =
        setTimeout(
            ()=>{
                nextSlide();
            },
            CONFIG.DURATION
        );

}


function stopAutoplay(){

    if(autoplay){

        clearTimeout(
            autoplay
        );

        autoplay = null;

    }

}


/* =========================================================
   RATIO
========================================================= */

document
.querySelectorAll(
    ".ratio-btn"
)
.forEach(
    btn=>{

        btn.onclick =
            ()=>{

                currentRatio =
                    btn.dataset.ratio;


                localStorage.setItem(
                    "promoRatio",
                    currentRatio
                );


                document
                .querySelectorAll(
                    ".ratio-btn"
                )
                .forEach(
                    b =>
                        b.classList.toggle(
                            "active",
                            b === btn
                        )
                );


                renderPreview();

            };

    }
);


/* =========================================================
   PREV / NEXT / PLAY
========================================================= */

document
.getElementById(
    "prevBtn"
)
.onclick =
    previousSlide;


document
.getElementById(
    "nextBtn"
)
.onclick =
    nextSlide;


document
.getElementById(
    "playBtn"
)
.onclick =
    togglePlay;


document
.getElementById(
    "headerPlay"
)
.onclick =
    togglePlay;


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreen(){

    const canvas =
        document.getElementById(
            "promoCanvas"
        );


    if(!canvas){

        return;

    }


    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }else{

            await canvas.requestFullscreen();

        }

    }catch(error){

        console.warn(error);

    }

}


document
.getElementById(
    "headerFullscreen"
)
.onclick =
    fullscreen;


/* =========================================================
   DOWNLOAD STATUS
========================================================= */

async function downloadStatus(){

    const canvas =
        document.getElementById(
            "promoCanvas"
        );


    if(!canvas){

        showToast(
            "Preview belum siap."
        );

        return;

    }


    if(
        typeof html2canvas ===
        "undefined"
    ){

        showToast(
            "Engine download belum tersedia."
        );

        return;

    }


    showToast(
        "Membuat gambar status..."
    );


    try{

        document.body.classList.add(
            "capture-mode"
        );


        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );


        const result =
            await html2canvas(
                canvas,
                {

                    backgroundColor:
                        "#070907",

                    scale:2.5,

                    useCORS:true,

                    allowTaint:false,

                    logging:false,

                    imageTimeout:15000

                }
            );


        document.body.classList.remove(
            "capture-mode"
        );


        const product =
            promoProducts[
                currentIndex
            ];


        const ratio =
            currentRatio === "916"
            ? "9x16"
            : currentRatio === "45"
                ? "4x5"
                : "16x9";


        const filename =
            `PROMO-${slug(
                makeDisplayTitle(product)
            )}-${ratio}.png`;


        const link =
            document.createElement(
                "a"
            );


        link.download =
            filename;


        link.href =
            result.toDataURL(
                "image/png"
            );


        link.click();


        showToast(
            "Status berhasil didownload."
        );


    }catch(error){

        document.body.classList.remove(
            "capture-mode"
        );


        console.error(error);


        showToast(
            "Gagal membuat gambar."
        );

    }

}


document
.getElementById(
    "downloadBtn"
)
.onclick =
    downloadStatus;


/* =========================================================
   SELECT ALL
========================================================= */

document
.getElementById(
    "selectAll"
)
.onclick =
    ()=>{

        selectedIds =
            products.map(
                p=>p.id
            );


        renderManager();

    };


/* =========================================================
   CLEAR
========================================================= */

document
.getElementById(
    "clearAll"
)
.onclick =
    ()=>{

        selectedIds = [];

        renderManager();

    };


/* =========================================================
   APPLY
========================================================= */

document
.getElementById(
    "applyPromo"
)
.onclick =
    ()=>{
        applyPromo(true);
    };


/* =========================================================
   SAVE
========================================================= */

document
.getElementById(
    "saveConfig"
)
.onclick =
    ()=>{

        localStorage.setItem(
            "promoSelection",
            JSON.stringify(
                selectedIds
            )
        );


        localStorage.setItem(
            "promoRatio",
            currentRatio
        );


        showToast(
            "Konfigurasi promo tersimpan."
        );

    };


/* =========================================================
   RESTORE
========================================================= */

document
.getElementById(
    "restoreConfig"
)
.onclick =
    ()=>{

        restoreSelection();

        renderManager();

        applyPromo(false);

        showToast(
            "Konfigurasi dipulihkan."
        );

    };


/* =========================================================
   RESTORE SELECTION
========================================================= */

function restoreSelection(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "promoSelection"
                ) || "[]"
            );


        if(
            Array.isArray(saved)
        ){

            selectedIds =
                saved.map(
                    String
                );

        }

    }catch{

        selectedIds = [];

    }

}


/* =========================================================
   DOWNLOAD JSON
========================================================= */

document
.getElementById(
    "downloadJSON"
)
.onclick =
    ()=>{

        const selected =
            products.filter(
                p =>
                    selectedIds.includes(
                        p.id
                    )
            );


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        selected,
                        null,
                        4
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href = url;

        link.download =
            "produk-promo.json";

        link.click();


        URL.revokeObjectURL(
            url
        );


        showToast(
            "produk-promo.json berhasil dibuat."
        );

    };


/* =========================================================
   SEARCH
========================================================= */

document
.getElementById(
    "search"
)
.addEventListener(
    "input",
    renderManager
);


/* =========================================================
   SWIPE
========================================================= */

let touchStart = 0;


stage.addEventListener(
    "touchstart",
    event=>{

        touchStart =
            event.changedTouches[0]
            .screenX;

    },
    {
        passive:true
    }
);


stage.addEventListener(
    "touchend",
    event=>{

        const end =
            event.changedTouches[0]
            .screenX;


        const distance =
            end - touchStart;


        if(
            Math.abs(distance) < 45
        ){

            return;

        }


        if(distance < 0){

            nextSlide();

        }else{

            previousSlide();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "ArrowRight"
        ){

            nextSlide();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousSlide();

        }


        if(
            event.key === " "
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.key.toLowerCase()
            === "f"
        ){

            fullscreen();

        }


        if(
            event.key.toLowerCase()
            === "d"
        ){

            downloadStatus();

        }

    }
);


/* =========================================================
   COUNTS
========================================================= */

function updateCounts(){

    selectedCount.textContent =
        selectedIds.length;

    footerSelected.textContent =
        selectedIds.length;

}


/* =========================================================
   RUPIAH
========================================================= */

function rupiah(
    value
){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(
        Number(value) || 0
    );

}


/* =========================================================
   SLUG
========================================================= */

function slug(
    value
){

    return String(
        value
    )
    .toLowerCase()
    .replace(
        /[^a-z0-9]+/g,
        "-"
    )
    .replace(
        /^-+|-+$/g,
        "");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}


/* =========================================================
   INIT
========================================================= */

updatePlayIcons();

loadProducts();

</script>
