<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705">
<title>Promo Studio — Imam_salesfr</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>



<style>



/* =========================================================
   IMAM_SALESFR — PROMO STUDIO
   PREMIUM FULL STYLE
   MATCHED TO EXISTING index.html
   ========================================================= */

:root{
    --lime:#8CC63F;
    --lime-dark:#72A82F;
    --lime-soft:rgba(140,198,63,.12);
    --lime-glow:rgba(140,198,63,.18);

    --orange:#FF7A1A;
    --orange-light:#FF9141;
    --orange-dark:#E9630C;

    --bg:#050705;
    --bg-2:#070907;
    --panel:#090D0A;
    --panel-2:#0C120D;
    --panel-3:#101610;

    --white:#F5F7F3;
    --white-soft:#DCE1DA;

    --muted:#7D857C;
    --muted-2:#626A62;

    --border:rgba(255,255,255,.085);
    --border-strong:rgba(255,255,255,.14);
    --border-lime:rgba(140,198,63,.42);

    --radius-sm:10px;
    --radius-md:14px;
    --radius-lg:20px;

    --shadow:
        0 25px 80px rgba(0,0,0,.42);

    --font:
        Poppins,
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    margin:0;
    padding:0;

    min-height:100%;

    background:var(--bg);

    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;

    min-height:100vh;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(140,198,63,.075),
            transparent 34%
        ),
        linear-gradient(
            180deg,
            #050705 0%,
            #060906 100%
        );

    color:var(--white);

    font-family:var(--font);

    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

button,
select{
    cursor:pointer;
}

img{
    max-width:100%;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =========================================================
   HEADER
========================================================= */

.topbar{
    position:sticky;

    top:0;

    z-index:1000;

    width:100%;

    min-height:78px;

    padding:
        13px
        clamp(16px,3vw,32px);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    background:
        rgba(5,7,5,.95);

    border-bottom:
        1px solid rgba(255,255,255,.065);

    backdrop-filter:
        blur(22px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(130%);
}


/* =========================================================
   HEADER BRAND
========================================================= */

.brand-name{
    color:#fff;

    font-size:
        clamp(21px,2.5vw,30px);

    line-height:.95;

    font-weight:900;

    letter-spacing:-1.5px;

    white-space:nowrap;
}

.brand-sub{
    margin-top:7px;

    color:var(--lime);

    font-size:
        clamp(8px,1vw,11px);

    line-height:1;

    font-weight:600;

    letter-spacing:
        clamp(.7px,.15vw,1.4px);

    white-space:nowrap;
}


/* =========================================================
   HEADER ACTIONS
========================================================= */

.header-actions{
    display:flex;

    align-items:center;

    gap:9px;

    flex-shrink:0;
}

.header-btn{
    width:49px;
    height:49px;

    display:grid;

    place-items:center;

    border:
        1px solid var(--border);

    border-radius:15px;

    background:#080C09;

    color:#fff;

    transition:
        border-color .18s ease,
        background .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
}

.header-btn:hover{
    border-color:
        var(--border-lime);

    transform:
        translateY(-1px);
}

.header-btn.primary{
    color:#0B1007;

    background:var(--lime);

    border-color:var(--lime);

    box-shadow:
        0 8px 25px
        rgba(140,198,63,.12);
}

.header-btn.primary:hover{
    background:#98D848;

    border-color:#98D848;
}

.header-btn svg{
    width:20px;
    height:20px;
}


/* =========================================================
   MAIN
========================================================= */

main{
    width:100%;

    padding:
        18px
        18px
        100px;
}

.container{
    width:min(100%,1200px);

    margin:0 auto;
}


/* =========================================================
   PREVIEW
========================================================= */

.preview-wrap{
    width:100%;
}

.stage{
    width:100%;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    position:relative;
}


/* =========================================================
   PROMO CANVAS BASE
========================================================= */

.promo-canvas{
    position:relative;

    width:100%;

    overflow:hidden;

    isolation:isolate;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(140,198,63,.055),
            transparent 34%
        ),
        #070907;

    border:
        1px solid rgba(255,255,255,.095);

    box-shadow:
        var(--shadow);
}


/* =========================================================
   RATIOS
========================================================= */

.stage.ratio-916 .promo-canvas{
    width:min(100%,520px);

    aspect-ratio:9 / 16;
}

.stage.ratio-45 .promo-canvas{
    width:min(100%,760px);

    aspect-ratio:4 / 5;
}

.stage.ratio-169 .promo-canvas{
    width:100%;

    aspect-ratio:16 / 9;
}


/* =========================================================
   PRODUCT VISUAL
========================================================= */

.product-visual{
    position:absolute;

    z-index:1;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}


/* 9:16 */

.stage.ratio-916 .product-visual{
    top:0;

    left:0;
    right:0;

    height:57%;
}


/* 4:5 */

.stage.ratio-45 .product-visual{
    top:0;

    left:0;
    right:0;

    height:61%;
}


/* 16:9 */

.stage.ratio-169 .product-visual{
    top:0;

    left:0;

    width:58%;

    height:100%;
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{
    width:100%;
    height:100%;

    padding:5%;

    display:block;

    object-fit:contain;

    object-position:center;

    user-select:none;

    -webkit-user-drag:none;
}


/* =========================================================
   VISUAL GRADIENT
========================================================= */

.visual-gradient{
    position:absolute;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent 45%,
            rgba(5,7,5,.05) 58%,
            rgba(5,7,5,.55) 82%,
            #070907 100%
        );
}

.stage.ratio-169 .visual-gradient{
    background:
        linear-gradient(
            to right,
            transparent 34%,
            rgba(5,7,5,.12) 48%,
            rgba(5,7,5,.65) 70%,
            #070907 100%
        );
}


/* =========================================================
   PROMO BADGE
   SMALL + PREMIUM + RATIO SAFE
========================================================= */

.promo-badge{
    position:absolute;

    z-index:40;

    width:max-content;

    max-width:34%;

    height:36px;

    min-width:108px;

    padding:
        0 16px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            var(--orange-light) 0%,
            var(--orange) 58%,
            var(--orange-dark) 100%
        );

    color:#190B03;

    font-size:9px;

    font-weight:950;

    line-height:1;

    letter-spacing:3.4px;

    white-space:nowrap;

    box-shadow:
        0 10px 28px
        rgba(255,122,26,.19);

    pointer-events:none;
}

.promo-badge::before{
    content:"";

    width:7px;
    height:7px;

    flex:0 0 7px;

    border-radius:50%;

    background:#190B03;
}


/* =========================================================
   BADGE — 9:16
========================================================= */

.stage.ratio-916 .promo-badge{
    top:calc(57% + 13px);

    left:8%;

    height:34px;

    min-width:106px;
}


/* =========================================================
   BADGE — 4:5
========================================================= */

.stage.ratio-45 .promo-badge{
    top:calc(61% + 13px);

    left:7%;

    height:35px;

    min-width:108px;
}


/* =========================================================
   BADGE — 16:9
========================================================= */

.stage.ratio-169 .promo-badge{
    top:8%;

    left:62%;

    height:34px;

    min-width:104px;

    max-width:30%;
}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{
    position:absolute;

    z-index:20;

    min-width:0;

    overflow:visible;
}


/* =========================================================
   INFO — 9:16
========================================================= */

.stage.ratio-916 .product-info{
    top:calc(57% + 67px);

    left:8%;

    right:7%;

    bottom:auto;
}


/* =========================================================
   INFO — 4:5
========================================================= */

.stage.ratio-45 .product-info{
    top:calc(61% + 67px);

    left:7%;

    right:7%;

    bottom:auto;
}


/* =========================================================
   INFO — 16:9
========================================================= */

.stage.ratio-169 .product-info{
    top:calc(8% + 54px);

    left:62%;

    right:6%;

    bottom:7%;
}


/* =========================================================
   BRAND
========================================================= */

.product-brand{
    margin:0;

    color:var(--lime);

    font-size:
        clamp(9px,1vw,12px);

    line-height:1.1;

    font-weight:950;

    letter-spacing:
        clamp(2.4px,.3vw,3.6px);

    text-transform:uppercase;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   PRODUCT TITLE
========================================================= */

.product-name{
    margin:
        9px 0 0;

    color:#fff;

    font-weight:950;

    letter-spacing:
        clamp(-1.8px,-.14vw,-.8px);

    line-height:.98;

    max-width:100%;

    text-wrap:balance;

    overflow:hidden;

    word-break:normal;

    overflow-wrap:normal;
}


/* 9:16 */

.stage.ratio-916 .product-name{
    font-size:
        clamp(26px,5.8vw,43px);

    max-width:95%;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;
}


/* 4:5 */

.stage.ratio-45 .product-name{
    font-size:
        clamp(29px,4.15vw,52px);

    max-width:95%;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;
}


/* 16:9 */

.stage.ratio-169 .product-name{
    font-size:
        clamp(24px,3.15vw,45px);

    max-width:96%;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:3;
}


/* =========================================================
   PRICE BLOCK
========================================================= */

.price-block{
    margin-top:18px;

    min-width:0;
}

.price-label{
    margin:0;

    color:#7C857D;

    font-size:9px;

    line-height:1;

    font-weight:900;

    letter-spacing:3px;

    text-transform:uppercase;
}


/* =========================================================
   PROMO PRICE
========================================================= */

.price-promo{
    margin-top:8px;

    color:#fff;

    font-weight:950;

    letter-spacing:-2px;

    line-height:.94;

    white-space:nowrap;
}


/* 9:16 */

.stage.ratio-916 .price-promo{
    font-size:
        clamp(35px,7.8vw,52px);
}


/* 4:5 */

.stage.ratio-45 .price-promo{
    font-size:
        clamp(38px,5.5vw,62px);
}


/* 16:9 */

.stage.ratio-169 .price-promo{
    font-size:
        clamp(31px,3.9vw,55px);
}


/* =========================================================
   PRICE META
========================================================= */

.price-meta{
    margin-top:10px;

    min-height:18px;

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:12px;

    overflow:visible;
}

.price-normal{
    color:#666E67;

    font-size:11px;

    line-height:1;

    white-space:nowrap;
}

.price-normal s{
    text-decoration-thickness:1px;
}

.discount{
    color:var(--orange);

    font-size:11px;

    font-weight:950;

    line-height:1;

    white-space:nowrap;
}


/* =========================================================
   CAPTURE BRAND
========================================================= */

.capture-hide{
    pointer-events:none;
}

.capture-mode .capture-hide{
    display:none !important;
}


/* =========================================================
   CONTROL STRIP
========================================================= */

.control-strip{
    margin-top:13px;

    padding:14px;

    display:grid;

    grid-template-columns:
        minmax(260px,1.05fr)
        minmax(260px,1fr)
        minmax(190px,.7fr);

    align-items:center;

    gap:12px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius-lg);

    background:
        linear-gradient(
            145deg,
            #0B100C,
            #070A08
        );

    box-shadow:
        0 18px 45px rgba(0,0,0,.18);
}


/* =========================================================
   RATIO GROUP
========================================================= */

.ratio-group{
    min-width:0;

    display:grid;

    grid-template-columns:
        auto
        repeat(3,minmax(0,1fr));

    align-items:center;

    gap:7px;
}

.ratio-caption{
    color:#717970;

    font-size:8px;

    font-weight:950;

    letter-spacing:2px;

    line-height:1;

    text-transform:uppercase;

    white-space:nowrap;
}


/* =========================================================
   RATIO BUTTON
========================================================= */

.ratio-btn{
    min-width:0;

    height:48px;

    padding:
        0 9px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:#080C09;

    color:#B7BEB7;

    transition:
        border-color .18s ease,
        background .18s ease,
        color .18s ease,
        transform .18s ease;
}

.ratio-btn:hover{
    border-color:
        rgba(140,198,63,.35);

    transform:
        translateY(-1px);
}

.ratio-btn.active{
    color:var(--lime);

    border-color:var(--lime);

    background:
        rgba(140,198,63,.075);

    box-shadow:
        inset 0 0 22px
        rgba(140,198,63,.035);
}


/* =========================================================
   RATIO ICON
========================================================= */

.ratio-icon{
    width:13px;
    height:18px;

    flex:0 0 auto;

    border:
        1.5px solid currentColor;

    border-radius:3px;
}

.ratio-btn[data-ratio="45"] .ratio-icon{
    width:15px;
    height:18px;
}

.ratio-btn[data-ratio="169"] .ratio-icon{
    width:21px;
    height:12px;
}


/* =========================================================
   RATIO TEXT
========================================================= */

.ratio-text{
    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    line-height:1.05;
}

.ratio-value{
    font-size:9px;

    font-weight:950;

    white-space:nowrap;
}

.ratio-use{
    margin-top:3px;

    color:#737B73;

    font-size:7px;

    font-weight:600;

    white-space:nowrap;
}


/* =========================================================
   NAVIGATION
========================================================= */

.navigation{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;
}

.nav-btn{
    width:48px;
    height:48px;

    flex:0 0 48px;

    display:grid;

    place-items:center;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:#080C09;

    color:#fff;

    transition:
        border-color .18s ease,
        transform .18s ease,
        background .18s ease;
}

.nav-btn:hover{
    border-color:
        rgba(140,198,63,.4);

    transform:
        translateY(-1px);
}

.nav-btn svg{
    width:19px;
    height:19px;
}

.slide-count{
    min-width:46px;

    color:#AAB2AA;

    text-align:center;

    font-size:10px;

    font-weight:800;

    white-space:nowrap;
}


/* =========================================================
   DOWNLOAD
========================================================= */

.download-btn{
    min-width:0;

    height:48px;

    padding:
        0 17px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #98D848,
            var(--lime)
        );

    color:#0B1007;

    font-size:10px;

    font-weight:950;

    letter-spacing:.4px;

    box-shadow:
        0 10px 25px
        rgba(140,198,63,.10);

    transition:
        filter .18s ease,
        transform .18s ease;
}

.download-btn:hover{
    filter:brightness(1.06);

    transform:
        translateY(-1px);
}

.download-btn:active{
    transform:
        translateY(0);
}

.download-btn svg{
    width:18px;
    height:18px;
}


/* =========================================================
   PROMO MANAGER
========================================================= */

.manager{
    margin-top:13px;

    padding:
        22px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius-lg);

    background:
        radial-gradient(
            circle at 88% 0%,
            rgba(140,198,63,.055),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #0A100B,
            #070A08
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,.20);
}


/* =========================================================
   SECTION LABEL
========================================================= */

.section-label{
    color:var(--lime);

    font-size:10px;

    font-weight:950;

    letter-spacing:3.5px;

    line-height:1;

    text-transform:uppercase;
}


/* =========================================================
   MANAGER HEADING
========================================================= */

.manager-heading{
    margin-top:8px;

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:18px;
}

.manager-title{
    margin:0;

    color:#fff;

    font-size:
        clamp(23px,2.7vw,36px);

    line-height:1;

    font-weight:950;

    letter-spacing:-1.4px;
}

.manager-summary{
    flex-shrink:0;

    color:#707870;

    font-size:11px;

    line-height:1.2;

    white-space:nowrap;
}

.manager-summary strong{
    color:var(--lime);
}


/* =========================================================
   MANAGER TOOLBAR
========================================================= */

.manager-toolbar{
    margin-top:20px;

    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.tool-btn{
    min-height:42px;

    padding:
        0 16px;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:#080D09;

    color:#fff;

    font-size:9px;

    font-weight:850;

    line-height:1;

    transition:
        border-color .18s ease,
        background .18s ease,
        transform .18s ease;
}

.tool-btn:hover{
    border-color:
        rgba(140,198,63,.4);

    transform:
        translateY(-1px);
}

.tool-btn.primary{
    color:#10140D;

    background:var(--lime);

    border-color:var(--lime);
}

.tool-btn.primary:hover{
    background:#98D848;

    border-color:#98D848;
}


/* =========================================================
   SEARCH
========================================================= */

.search-row{
    margin-top:18px;

    display:flex;

    justify-content:flex-end;
}

.search{
    width:min(100%,280px);

    height:42px;

    padding:
        0 14px;

    outline:none;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:#080D09;

    color:#fff;

    font-size:10px;

    transition:
        border-color .18s ease,
        box-shadow .18s ease;
}

.search::placeholder{
    color:#596159;
}

.search:focus{
    border-color:
        rgba(140,198,63,.5);

    box-shadow:
        0 0 0 3px
        rgba(140,198,63,.06);
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.product-grid{
    margin-top:14px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px,1fr)
        );

    gap:11px;
}


/* =========================================================
   PRODUCT SELECT CARD
========================================================= */

.select-card{
    position:relative;

    min-width:0;

    min-height:215px;

    overflow:hidden;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #090E0A,
            #070A08
        );

    cursor:pointer;

    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

.select-card:hover{
    transform:
        translateY(-2px);

    border-color:
        rgba(140,198,63,.35);
}

.select-card.selected{
    border-color:var(--lime);

    box-shadow:
        0 0 0 1px
        rgba(140,198,63,.22),
        0 12px 28px
        rgba(0,0,0,.18);
}


/* =========================================================
   SELECT IMAGE
========================================================= */

.select-image{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:125px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:#070A08;
}

.select-image img{
    width:100%;
    height:100%;

    padding:10px;

    object-fit:contain;
}

.select-image::after{
    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent 40%,
            #080C09 100%
        );
}


/* =========================================================
   CHECK
========================================================= */

.check{
    position:absolute;

    z-index:5;

    top:10px;
    left:10px;

    width:20px;
    height:20px;

    display:grid;

    place-items:center;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:5px;

    background:
        rgba(0,0,0,.58);

    color:transparent;

    transition:
        background .18s ease,
        border-color .18s ease;
}

.select-card.selected .check{
    color:#11150C;

    background:var(--lime);

    border-color:var(--lime);
}

.check svg{
    width:12px;
    height:12px;
}


/* =========================================================
   SELECT INFO
========================================================= */

.select-info{
    position:absolute;

    left:11px;
    right:11px;

    bottom:11px;

    z-index:4;

    min-width:0;
}


/* =========================================================
   SELECT BRAND
========================================================= */

.select-brand{
    color:var(--lime);

    font-size:7px;

    font-weight:950;

    letter-spacing:1.8px;

    line-height:1.1;

    text-transform:uppercase;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   SELECT NAME
========================================================= */

.select-name{
    margin-top:4px;

    color:#fff;

    font-size:10px;

    line-height:1.25;

    font-weight:750;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;

    overflow:hidden;
}


/* =========================================================
   SELECT PRICE
========================================================= */

.select-price{
    margin-top:6px;

    color:#fff;

    font-size:11px;

    line-height:1;

    font-weight:950;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

    font-size:8px;

    font-weight:500;

    text-decoration:line-through;
}

.select-discount{
    margin-left:5px;

    font-weight:950;

/* =========================================================
   MANAGER FOOTER
========================================================= */

.manager-footer{

    padding-top:17px;

    border-top:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    color:#757E75;

    font-size:10px;
}

.manager-footer strong{
    color:var(--lime);
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    width:100%;

    min-height:500px;

    display:grid;

    place-items:center;

    border:
        1px solid var(--border);

    background:
        #070907;
}

.spinner{
    width:34px;
    height:34px;

    margin:auto;

    border:
        3px solid
        rgba(255,255,255,.08);

    border-top-color:
        var(--lime);

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.error{
    width:100%;

    padding:30px;

    color:#FF9B9B;

    border:
        1px solid
        rgba(255,100,100,.2);

    border-radius:18px;

    background:
        rgba(50,5,5,.25);

    line-height:1.55;
}

.error strong{
    font-size:18px;
}

.error pre{
    margin-top:14px;

    overflow:auto;

    padding:14px;

    border-radius:10px;

    background:#030503;

    color:#CCC;

    font-size:10px;

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:24px;

    z-index:5000;

    max-width:
        calc(100vw - 30px);

    padding:
        11px 17px;

    border:

    border-radius:999px;

    background:
        rgba(8,12,9,.97);

    color:#fff;

    font-size:10px;

    font-weight:700;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.toast.show{
    transform:

    opacity:1;

========================================================= */

/* =========================================================
   LOAD
========================================================= */

async function loadProducts(){

    try{

        const response =
            await fetch(
                CONFIG.JSON,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        products =
            Array.isArray(data)
            ? data
            : Array.isArray(data.products)
                ? data.products
                : [];


        if(!products.length){

            throw new Error(
                "produk.json kosong atau format tidak dikenali."
            );

        }


        products =
            products.map(
                normalizeProduct
            );


        totalCount.textContent =
            products.length;

        footerTotal.textContent =
            products.length;


        restoreSelection();


        if(!selectedIds.length){

            selectedIds =
                products
                .filter(
                    isPromo
                )
                .map(
                    p=>p.id
                );

        }


        renderManager();


        applyPromo(
            false
        );


    }catch(error){

        console.error(
            "[PROMO]",
            error
        );


        stage.innerHTML = `

            <div class="error">

                <strong>
                    Gagal memuat produk.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <pre>promo/
├── index.html
├── produk.json
└── images/
    └── produk/
        ├── produk-1.jpg
        └── produk-2.jpg</pre>

            </div>

        `;

    }

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeProduct(
    p,
    index
){

    const id =
        String(
            p.id ??
            p.kode ??
            p.sku ??
            index + 1
        );


    let normal = 0;
    let promo = 0;


    if(
        p.harga &&
        typeof p.harga === "object"
    ){

        normal =
            Number(
                p.harga.normal
            ) || 0;

        promo =
            Number(
                p.harga.promo
            ) || 0;

    }else{

        normal =
            Number(
                p.harga
            ) || 0;

        promo =
            Number(
                p.hargaPromo
            ) || 0;

    }


    return {

        ...p,

        id,

        brand:
            p.brand ||
            p.merek ||
            "NINE LUXIMOS",

        nama:
            p.nama ||
            p.name ||
            "Produk",

        gambar:
            p.gambar ||
            p.image ||
            p.foto ||
            "",

        harga:{
            normal,
            promo,

            status:
                p.harga?.status ||
                "Aktif"
        }

    };

}


/* =========================================================
   IMAGE
========================================================= */

function imagePath(
    product
){

    let path =
        String(
            product.gambar ||
            ""
        ).trim();


    if(!path){

        return "";

    }


    path =
        path.replace(
            /^\/+/,
            ""
        );


    if(
        path.startsWith(
            "images/"
        )
    ){

        return path;

    }


    return CONFIG.IMAGE_FOLDER + path;

}


/* =========================================================
   PROMO
========================================================= */

function isPromo(
    p
){

    const normal =
        Number(
            p.harga?.normal
        ) || 0;

    const promo =
        Number(
            p.harga?.promo
        ) || 0;


    return (
        normal > 0 &&
        promo > 0 &&
        promo < normal
    );

}


/* =========================================================
   TITLE ENGINE
   Tidak menggunakan nama JSON mentah sebagai headline.
========================================================= */

function makeDisplayTitle(
    product
){

    let title =
        String(
            product.nama ||
            ""
        );


    const brand =
        String(
            product.brand ||
            ""
        );


    /*
     * Hilangkan brand yang muncul
     * di dalam nama produk.
     */

    if(brand){

        const brandWords =
            brand
            .split(/\s+/)
            .filter(Boolean)
            .map(
                escapeRegExp
            )
            .join("\\s+");


        if(brandWords){

            title =
                title.replace(
                    new RegExp(
                        brandWords,
                        "ig"
                    ),
                    ""
                );

        }

    }


    /*
     * Bersihkan noise.
     */

    title =
        title
        .replace(
            /\b(NINE|LUXIMOS)\b/gi,
            ""
        )
        .replace(
            /\s*[-–—|:;,]+\s*/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    /*
     * Buang phrase yang biasanya
     * membuat headline terlalu panjang.
     */

    title =
        title.replace(
            /\b(dengan|with|seri|series|variant|varian)\b.*$/i,
            ""
        ).trim();


    /*
     * Kalau terlalu panjang,
     * ambil bagian terpenting.
     */

    if(title.length > 58){

        const words =
            title.split(/\s+/);

        let compact = "";

        for(
            const word of words
        ){

            const candidate =
                compact
                ? compact + " " + word
                : word;


            if(
                candidate.length > 58
            ){

                break;

            }


            compact =
                candidate;

        }


        title =
            compact ||
            title.slice(0,58);

    }


    /*
     * Title case visual.
     * Tidak memaksa semua huruf kecil.
     */

    return title
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   ESCAPE REGEXP
========================================================= */

function escapeRegExp(
    value
){

    return String(value)
        .replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );

}


/* =========================================================
   RENDER MANAGER
========================================================= */

function renderManager(){

    const query =
        document
        .getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    productGrid.innerHTML =
        "";


    const filtered =
        products.filter(
            p=>{

                if(!query){

                    return true;

                }


                return (

                    p.nama
                    .toLowerCase()
                    .includes(query)

                    ||

                    p.brand
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    filtered.forEach(
        product=>{

            const selected =
                selectedIds.includes(
                    product.id
                );


            const normal =
                product.harga.normal;

            const promo =
                product.harga.promo;


            const discount =
                normal > 0
                ? Math.round(
                    (
                        (normal-promo)
                        /
                        normal
                    ) * 100
                )
                : 0;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "select-card" +
                (
                    selected
                    ? " selected"
                    : ""
                );


            card.innerHTML = `

                <div class="select-image">

                    ${
                        imagePath(product)

                        ?

                        `
                        <img
                            src="${escapeAttribute(
                                imagePath(product)
                            )}"
                            alt=""
                            onerror="
                                this.style.display='none'
                            "
                        >
                        `

                        :

                        ""

                    }

                </div>


                <div class="check">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                    >
                        <path d="m5 12 4 4L19 6"/>
                    </svg>

                </div>


                <div class="select-info">

                    <div class="select-brand">

                        ${escapeHTML(
                            product.brand
                        )}

                    </div>


                    <div class="select-name">

                        ${escapeHTML(
                            makeDisplayTitle(
                                product
                            )
                        )}

                    </div>


                    <div class="select-price">

                        ${rupiah(promo)}

                        <span class="select-old">

                            ${rupiah(normal)}

                        </span>

                        ${
                            discount > 0

                            ?

                            `
                            <span class="select-discount">
                                ${discount}%
                            </span>
                            `

                            :

                            ""

                        }

                    </div>

                </div>

            `;


            card.onclick =
                ()=>{
                    toggleProduct(
                        product.id
                    );
                };


            productGrid.appendChild(
                card
            );

        }
    );


    updateCounts();

}


/* =========================================================
   TOGGLE
========================================================= */

function toggleProduct(
    id
){

    id =
        String(id);


    if(
        selectedIds.includes(id)
    ){

        selectedIds =
            selectedIds.filter(
                x=>x !== id
            );

    }else{

        selectedIds.push(id);

    }


    renderManager();

}


/* =========================================================
   APPLY
========================================================= */

function applyPromo(
    notify=true
){

    promoProducts =
        products.filter(
            p =>
                selectedIds.includes(
                    p.id
                )
        );


    currentIndex = 0;


    localStorage.setItem(
        "promoSelection",
        JSON.stringify(
            selectedIds
        )
    );


    renderPreview();


    if(notify){

        showToast(
            `${promoProducts.length} produk diterapkan.`
        );

    }

}

========================================================= */

function updateSlideCount(){

        `${currentIndex+1} / ${promoProducts.length}`

        "0 / 0";

/* =========================================================
   NEXT
========================================================= */

function nextSlide(){

    if(
        promoProducts.length < 2
    ){

        return;

    }


    currentIndex =
        (
            currentIndex + 1
        )
        %
        promoProducts.length;


    renderPreview();

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSlide(){

    if(
        promoProducts.length < 2
    ){

        return;

    }


    currentIndex =
        (
            currentIndex - 1 +
            promoProducts.length
        )
        %
        promoProducts.length;


    renderPreview();

}


/* =========================================================
   PLAY
========================================================= */

function togglePlay(){

    playing =
        !playing;


    updatePlayIcons();


    if(playing){

        startAutoplay();

    }else{

        stopAutoplay();

    }

}


function updatePlayIcons(){

    const path =
        playing

        ?

        `
        <path d="M7 5h4v14H7z"/>
        <path d="M13 5h4v14h-4z"/>
        `

        :

        `
        <path d="M8 5v14l11-7z"/>
        `;


    document.getElementById(
        "playIcon"
    ).innerHTML = path;


    document.getElementById(
        "headerPlayIcon"
    ).innerHTML = path;

}


/* =========================================================
   AUTOPLAY
========================================================= */

function startAutoplay(){

    stopAutoplay();


    if(
        !playing ||
        promoProducts.length < 2
    ){

        return;

    }


    autoplay =
        setTimeout(
            ()=>{
                nextSlide();
            },
            CONFIG.DURATION
        );

}


function stopAutoplay(){

    if(autoplay){

        clearTimeout(
            autoplay
        );

        autoplay = null;

    }

}

/* =========================================================
   DOWNLOAD STATUS — STABLE VERSION
========================================================= */

let isDownloadingStatus = false;

async function downloadStatus(){

    /* =========================================
       PREVENT DOUBLE CLICK / DOUBLE CAPTURE
    ========================================= */

    if(isDownloadingStatus){

        return;

    }


    const canvas =
        document.getElementById(
            "promoCanvas"
        );


    if(!canvas){

        showToast(
            "Preview belum siap."
        );

        return;

    }


    if(
        typeof html2canvas !==
        "function"
    ){

        showToast(
            "Engine download belum tersedia."
        );

        console.error(
            "[PROMO] html2canvas tidak ditemukan."
        );

        return;

    }


    const product =
        promoProducts[
            currentIndex
        ];


    if(!product){

        showToast(
            "Produk promo belum tersedia."
        );

        return;

    }


    /* =========================================
       LOCK
    ========================================= */

    isDownloadingStatus = true;


    const button =
        document.getElementById(
            "downloadBtn"
        );


    const originalHTML =
        button
        ? button.innerHTML
        : "";


    if(button){

        button.disabled = true;

        button.style.pointerEvents =
            "none";

        button.innerHTML = `
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                style="
                    width:17px;
                    height:17px;
                    animation:promoSpin .8s linear infinite;
                "
            >
                <circle
                    cx="12"
                    cy="12"
                    r="9"
                    stroke-opacity=".25"
                ></circle>

                <path
                    d="M21 12a9 9 0 0 0-9-9"
                ></path>
            </svg>

            MEMBUAT...
        `;

    }


    showToast(
        "Membuat status..."
    );


    try{

        /* =====================================
           PASTIKAN IMAGE SUDAH SELESAI
        ===================================== */

        const images =
            Array.from(
                canvas.querySelectorAll(
                    "img"
                )
            );


        await Promise.all(

            images.map(
                img => {

                    if(
                        img.complete
                    ){

                        return Promise.resolve();

                    }


                    return new Promise(
                        resolve => {

                            const finish =
                                ()=>{
                                    resolve();
                                };


                            img.addEventListener(
                                "load",
                                finish,
                                {
                                    once:true
                                }
                            );


                            img.addEventListener(
                                "error",
                                finish,
                                {
                                    once:true
                                }
                            );

                        }
                    );

                }
            )

        );


        /* =====================================
           FONT READY
        ===================================== */

        if(
            document.fonts &&
            document.fonts.ready
        ){

            await document.fonts.ready;

        }


        /* =====================================
           PAINT
        ===================================== */

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    ()=>{
                        requestAnimationFrame(
                            resolve
                        );
                    }
                )
        );


        /* =====================================
           CAPTURE
        ===================================== */

        const capturePromise =
            html2canvas(
                canvas,
                {

                    backgroundColor:
                        "#070907",

                    scale:
                        Math.min(
                            2,
                            window.devicePixelRatio || 1
                        ),

                    useCORS:true,

                    allowTaint:false,

                    imageTimeout:8000,

                    logging:false,

                    removeContainer:true,

                    foreignObjectRendering:false,

                    scrollX:0,

                    scrollY:0

                }
            );


        /* =====================================
           HARD TIMEOUT
           Jangan pernah muter selamanya
        ===================================== */

        const timeoutPromise =
            new Promise(
                (
                    _,
                    reject
                ) => {

                    setTimeout(
                        ()=>{

                            reject(
                                new Error(
                                    "EXPORT_TIMEOUT"
                                )
                            );

                        },
                        12000
                    );

                }
            );


        const result =
            await Promise.race(
                [
                    capturePromise,
                    timeoutPromise
                ]
            );


        /* =====================================
           FILE NAME
        ===================================== */

        const ratio =
            currentRatio === "916"
                ? "9x16"
                : currentRatio === "45"
                    ? "4x5"
                    : "16x9";


        const filename =
            `PROMO-${slug(
                makeDisplayTitle(
                    product
                )
            )}-${ratio}.png`;


        /* =====================================
           CANVAS → BLOB
        ===================================== */

        const blob =
            await new Promise(
                (
                    resolve,
                    reject
                ) => {

                    result.toBlob(
                        blob => {

                            if(blob){

                                resolve(
                                    blob
                                );

                            }else{

                                reject(
                                    new Error(
                                        "BLOB_FAILED"
                                    )
                                );

                            }

                        },
                        "image/png",
                        1
                    );

                }
            );


        /* =====================================
           DOWNLOAD
        ===================================== */

        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;

        link.download =
            filename;

        link.style.display =
            "none";


        document.body.appendChild(
            link
        );


        link.click();


        /* =====================================
           CLEANUP
        ===================================== */

        setTimeout(
            ()=>{

                link.remove();

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        showToast(
            "Status berhasil didownload ✓"
        );


    }catch(error){

        console.error(
            "[PROMO DOWNLOAD]",
            error
        );


        if(
            error.message ===
            "EXPORT_TIMEOUT"
        ){

            showToast(
                "Export terlalu lama. Coba ulang."
            );

        }else{

            showToast(
                "Gagal membuat status."
            );

        }

    }finally{

        /* =====================================
           UNLOCK
        ===================================== */

        isDownloadingStatus =
            false;


        if(button){

            button.disabled =
                false;

            button.style.pointerEvents =
                "";

            button.innerHTML =
                originalHTML;

        }

    }

}

document
.getElementById(
    "downloadJSON"
)
.onclick =
    ()=>{

        const selected =
            products.filter(
                p =>
                    selectedIds.includes(
                        p.id
                    )
            );


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        selected,
                        null,
                        4
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href = url;

        link.download =
            "produk-promo.json";

        link.click();


        URL.revokeObjectURL(
            url
        );


        showToast(
            "produk-promo.json berhasil dibuat."
        );

    };

/* =========================================================
   SWIPE
========================================================= */

let touchStart = 0;


stage.addEventListener(
    "touchstart",
    event=>{

        touchStart =
            event.changedTouches[0]
            .screenX;

    },
    {
        passive:true
    }
);


stage.addEventListener(
    "touchend",
    event=>{

        const end =
            event.changedTouches[0]
            .screenX;


        const distance =
            end - touchStart;


        if(
            Math.abs(distance) < 45
        ){

            return;

        }


        if(distance < 0){

            nextSlide();

        }else{

            previousSlide();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "ArrowRight"
        ){

            nextSlide();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousSlide();

        }


        if(
            event.key === " "
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.key.toLowerCase()
            === "f"
        ){

            fullscreen();

        }


        if(
            event.key.toLowerCase()
            === "d"
        ){

            downloadStatus();

        }

    }
);

/* =========================================================
   RUPIAH
========================================================= */

function rupiah(
    value
){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(
        Number(value) || 0
    );

}


/* =========================================================
   SLUG
========================================================= */

function slug(
    value
){

    return String(
        value
    )
    .toLowerCase()
    .replace(
        /[^a-z0-9]+/g,
        "-"
    )
    .replace(
        /^-+|-+$/g,
        "");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}
