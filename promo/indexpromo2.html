<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050705"
>

<title>
    Promo Studio — Imam_salesfr
</title>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>


<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
></script>


<style>

/* =========================================================
   IMAM_SALESFR — PROMO STUDIO
   FULL PREMIUM VERSION
========================================================= */

:root{

    --lime:#8CC63F;
    --lime-bright:#98D848;
    --lime-dark:#72A82F;

    --orange:#FF7A1A;
    --orange-light:#FF9141;
    --orange-dark:#E9630C;

    --bg:#050705;
    --bg-2:#070907;

    --panel:#090D0A;
    --panel-2:#0C120D;
    --panel-3:#101610;

    --white:#F5F7F3;
    --white-soft:#DCE1DA;

    --muted:#7D857C;
    --muted-2:#626A62;

    --border:
        rgba(255,255,255,.085);

    --border-strong:
        rgba(255,255,255,.14);

    --border-lime:
        rgba(140,198,63,.42);

    --shadow:
        0 30px 90px
        rgba(0,0,0,.42);

    --font:
        Poppins,
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{

    box-sizing:border-box;

}


html{

    margin:0;
    padding:0;

    min-height:100%;

    background:
        var(--bg);

    scroll-behavior:smooth;

}


body{

    margin:0;
    padding:0;

    min-height:100vh;

    overflow-x:hidden;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(140,198,63,.075),
            transparent 34%
        ),

        linear-gradient(
            180deg,
            #050705 0%,
            #060906 100%
        );

    color:
        var(--white);

    font-family:
        var(--font);

    -webkit-font-smoothing:
        antialiased;

    -moz-osx-font-smoothing:
        grayscale;

}


button,
input{

    font:inherit;

}


button{

    cursor:pointer;

    -webkit-tap-highlight-color:
        transparent;

}


button:disabled{

    cursor:wait;

}


img{

    max-width:100%;

}


input{

    outline:none;

}


/* =========================================================
   HEADER
========================================================= */

.topbar{

    position:sticky;

    top:0;

    z-index:1000;

    width:100%;

    min-height:78px;

    padding:
        13px
        clamp(16px,3vw,32px);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    background:
        rgba(5,7,5,.96);

    border-bottom:
        1px solid
        rgba(255,255,255,.065);

    backdrop-filter:
        blur(22px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(130%);

}


.brand-name{

    color:#fff;

    font-size:
        clamp(22px,2.7vw,31px);

    line-height:.95;

    font-weight:900;

    letter-spacing:-1.6px;

    white-space:nowrap;

}


.brand-sub{

    margin-top:7px;

    color:
        var(--lime);

    font-size:
        clamp(8px,1vw,11px);

    line-height:1;

    font-weight:600;

    letter-spacing:
        clamp(.8px,.14vw,1.4px);

    white-space:nowrap;

}


.header-actions{

    display:flex;

    align-items:center;

    gap:9px;

    flex-shrink:0;

}


.header-btn{

    width:49px;

    height:49px;

    display:grid;

    place-items:center;

    border:
        1px solid
        var(--border);

    border-radius:15px;

    background:#080C09;

    color:#fff;

    transition:
        .18s ease;

}


.header-btn:hover{

    border-color:
        var(--border-lime);

    transform:
        translateY(-1px);

}


.header-btn.primary{

    color:#0B1007;

    background:
        var(--lime);

    border-color:
        var(--lime);

    box-shadow:
        0 8px 25px
        rgba(140,198,63,.13);

}


.header-btn.primary:hover{

    background:
        var(--lime-bright);

    border-color:
        var(--lime-bright);

}


.header-btn svg{

    width:20px;

    height:20px;

}


/* =========================================================
   MAIN
========================================================= */

main{

    width:100%;

    padding:
        18px
        18px
        90px;

}


.container{

    width:
        min(100%,1200px);

    margin:
        0 auto;

}


/* =========================================================
   STAGE
========================================================= */

.preview-wrap{

    width:100%;

}


.stage{

    width:100%;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    position:relative;

}


/* =========================================================
   PROMO CANVAS
========================================================= */

.promo-canvas{

    position:relative;

    width:100%;

    overflow:hidden;

    isolation:isolate;

    background:

        radial-gradient(
            circle at 50% 10%,
            rgba(140,198,63,.055),
            transparent 34%
        ),

        #070907;

    border:
        1px solid
        rgba(255,255,255,.095);

    box-shadow:
        var(--shadow);

}


/* =========================================================
   RATIO
========================================================= */

.stage.ratio-916
.promo-canvas{

    width:
        min(100%,520px);

    aspect-ratio:
        9 / 16;

}


.stage.ratio-45
.promo-canvas{

    width:
        min(100%,760px);

    aspect-ratio:
        4 / 5;

}


.stage.ratio-169
.promo-canvas{

    width:100%;

    aspect-ratio:
        16 / 9;

}


/* =========================================================
   PRODUCT VISUAL
========================================================= */

.product-visual{

    position:absolute;

    z-index:1;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


.stage.ratio-916
.product-visual{

    top:0;

    left:0;

    right:0;

    height:57%;

}


.stage.ratio-45
.product-visual{

    top:0;

    left:0;

    right:0;

    height:61%;

}


.stage.ratio-169
.product-visual{

    top:0;

    left:0;

    width:58%;

    height:100%;

}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{

    width:100%;

    height:100%;

    padding:5%;

    display:block;

    object-fit:contain;

    object-position:center;

    user-select:none;

    -webkit-user-drag:none;

    opacity:1 !important;

    filter:none !important;

    mix-blend-mode:normal !important;

}


/* =========================================================
   VISUAL GRADIENT
   SUBTLE — TIDAK MEMUDARKAN FOTO
========================================================= */

.visual-gradient{

    position:absolute;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:

        linear-gradient(
            to bottom,
            rgba(5,7,5,0) 48%,
            rgba(5,7,5,.015) 62%,
            rgba(5,7,5,.08) 76%,
            rgba(5,7,5,.42) 91%,
            #070907 100%
        );

}


.stage.ratio-169
.visual-gradient{

    background:

        linear-gradient(
            to right,
            rgba(5,7,5,0) 48%,
            rgba(5,7,5,.015) 61%,
            rgba(5,7,5,.08) 75%,
            rgba(5,7,5,.38) 92%,
            #070907 100%
        );

}


/* =========================================================
   PROMO BADGE
========================================================= */

.promo-badge{

    position:absolute;

    z-index:40;

    width:max-content;

    max-width:30%;

    min-width:96px;

    height:34px;

    padding:
        0 14px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    border-radius:999px;

    background:

        linear-gradient(
            135deg,
            var(--orange-light),
            var(--orange)
        );

    color:#1B0A02;

    font-size:8px;

    font-weight:950;

    letter-spacing:3px;

    line-height:1;

    white-space:nowrap;

    box-shadow:

        0 10px 30px
        rgba(255,122,26,.18);

    pointer-events:none;

}


.promo-badge::before{

    content:"";

    width:7px;

    height:7px;

    flex:0 0 7px;

    border-radius:50%;

    background:#1B0A02;

}


/* =========================================================
   BADGE PER RATIO
========================================================= */

.stage.ratio-916
.promo-badge{

    top:
        calc(57% + 12px);

    left:7%;

}


.stage.ratio-45
.promo-badge{

    top:
        calc(61% + 12px);

    left:7%;

}


.stage.ratio-169
.promo-badge{

    top:7%;

    left:60%;

    height:32px;

    min-width:94px;

    max-width:28%;

}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{

    position:absolute;

    z-index:20;

    min-width:0;

    overflow:visible;

}


/* 9:16 */

.stage.ratio-916
.product-info{

    top:
        calc(57% + 60px);

    left:7%;

    right:6%;

}


/* 4:5 */

.stage.ratio-45
.product-info{

    top:
        calc(61% + 60px);

    left:7%;

    right:7%;

}


/* 16:9 */

.stage.ratio-169
.product-info{

    top:
        calc(7% + 51px);

    left:60%;

    right:5%;

}


/* =========================================================
   BRAND
========================================================= */

.product-brand{

    color:
        var(--lime);

    font-size:
        clamp(8px,1vw,12px);

    line-height:1.1;

    font-weight:950;

    letter-spacing:
        clamp(2px,.3vw,3.5px);

    text-transform:uppercase;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================================================
   TITLE
========================================================= */

.product-name{

    margin:
        9px 0 0;

    color:#fff;

    font-weight:950;

    line-height:.98;

    letter-spacing:
        clamp(-1.8px,-.12vw,-.7px);

    max-width:96%;

    overflow:hidden;

    display:-webkit-box;

    -webkit-box-orient:vertical;

}


/* 9:16 */

.stage.ratio-916
.product-name{

    font-size:
        clamp(25px,5.8vw,42px);

    -webkit-line-clamp:2;

}


/* 4:5 */

.stage.ratio-45
.product-name{

    font-size:
        clamp(28px,4.15vw,51px);

    -webkit-line-clamp:2;

}


/* 16:9 */

.stage.ratio-169
.product-name{

    font-size:
        clamp(23px,3.1vw,44px);

    -webkit-line-clamp:3;

}


/* =========================================================
   PRICE
========================================================= */

.price-block{

    margin-top:17px;

    min-width:0;

}


.price-label{

    color:#7C857D;

    font-size:9px;

    line-height:1;

    font-weight:900;

    letter-spacing:3px;

    text-transform:uppercase;

}


.price-promo{

    margin-top:8px;

    color:#fff;

    font-weight:950;

    line-height:.94;

    letter-spacing:-2px;

    white-space:nowrap;

}


.stage.ratio-916
.price-promo{

    font-size:
        clamp(34px,7.8vw,52px);

}


.stage.ratio-45
.price-promo{

    font-size:
        clamp(37px,5.5vw,61px);

}


.stage.ratio-169
.price-promo{

    font-size:
        clamp(30px,3.8vw,54px);

}


/* =========================================================
   PRICE META
========================================================= */

.price-meta{

    margin-top:10px;

    display:flex;

    align-items:center;

    flex-wrap:wrap;

    gap:12px;

    min-height:18px;

}


.price-normal{

    color:#666E67;

    font-size:11px;

    line-height:1;

    white-space:nowrap;

}


.discount{

    color:
        var(--orange);

    font-size:11px;

    font-weight:950;

    line-height:1;

    white-space:nowrap;

}


/* =========================================================
   CINEMATIC WINDOW TRANSITION
========================================================= */

.promo-canvas::after{

    content:"";

    position:absolute;

    inset:0;

    z-index:200;

    pointer-events:none;

    background:

        linear-gradient(
            90deg,
            #050705 0%,
            #080C08 50%,
            #050705 100%
        );

    transform:
        scaleX(0);

    transform-origin:
        right center;

    opacity:0;

}


.promo-canvas.slide-out::after{

    opacity:1;

    transform:
        scaleX(1);

    transform-origin:
        right center;

    transition:

        transform
        620ms
        cubic-bezier(.76,0,.24,1),

        opacity
        260ms
        ease;

}


.promo-canvas.slide-in::after{

    opacity:1;

    transform:
        scaleX(0);

    transform-origin:
        left center;

    transition:

        transform
        730ms
        cubic-bezier(.16,1,.3,1),

        opacity
        300ms
        ease;

}


.promo-canvas.slide-content
.product-visual{

    animation:

        promoVisualReveal
        1050ms
        cubic-bezier(.16,1,.3,1)
        both;

}


.promo-canvas.slide-content
.product-info{

    animation:

        promoInfoReveal
        850ms
        cubic-bezier(.16,1,.3,1)
        180ms
        both;

}


.promo-canvas.slide-content
.promo-badge{

    animation:

        promoBadgeReveal
        700ms
        cubic-bezier(.16,1,.3,1)
        220ms
        both;

}


@keyframes promoVisualReveal{

    0%{

        opacity:.15;

        transform:
            scale(1.045)
            translateX(35px);

    }

    55%{

        opacity:.82;

    }

    100%{

        opacity:1;

        transform:
            scale(1)
            translateX(0);

    }

}


@keyframes promoInfoReveal{

    0%{

        opacity:0;

        transform:
            translateX(30px);

    }

    100%{

        opacity:1;

        transform:
            translateX(0);

    }

}


@keyframes promoBadgeReveal{

    0%{

        opacity:0;

        transform:
            translateY(-12px)
            scale(.92);

    }

    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   CAPTURE
========================================================= */

.capture-mode
.promo-canvas::after{

    display:none !important;

}


.capture-mode
.promo-canvas
.product-visual,
.capture-mode
.promo-canvas
.product-info,
.capture-mode
.promo-canvas
.promo-badge{

    animation:none !important;

    opacity:1 !important;

    transform:none !important;

}


/* =========================================================
   CONTROL STRIP
========================================================= */

.control-strip{

    margin-top:13px;

    padding:14px;

    display:grid;

    grid-template-columns:

        minmax(260px,1.05fr)
        minmax(250px,1fr)
        minmax(190px,.7fr);

    align-items:center;

    gap:12px;

    border:
        1px solid
        var(--border);

    border-radius:20px;

    background:

        linear-gradient(
            145deg,
            #0B100C,
            #070A08
        );

}


/* =========================================================
   RATIO GROUP
========================================================= */

.ratio-group{

    min-width:0;

    display:grid;

    grid-template-columns:

        auto
        repeat(3,minmax(0,1fr));

    align-items:center;

    gap:7px;

}


.ratio-caption{

    color:#717970;

    font-size:8px;

    font-weight:950;

    letter-spacing:2px;

    line-height:1;

    text-transform:uppercase;

    white-space:nowrap;

}


.ratio-btn{

    min-width:0;

    height:48px;

    padding:
        0 9px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    border:
        1px solid
        var(--border);

    border-radius:12px;

    background:#080C09;

    color:#B7BEB7;

    transition:.18s ease;

}


.ratio-btn:hover{

    border-color:
        rgba(140,198,63,.35);

    transform:
        translateY(-1px);

}


.ratio-btn.active{

    color:
        var(--lime);

    border-color:
        var(--lime);

    background:
        rgba(140,198,63,.075);

}


.ratio-icon{

    width:13px;

    height:18px;

    flex:0 0 auto;

    border:
        1.5px solid
        currentColor;

    border-radius:3px;

}


.ratio-btn[data-ratio="45"]
.ratio-icon{

    width:15px;

    height:18px;

}


.ratio-btn[data-ratio="169"]
.ratio-icon{

    width:21px;

    height:12px;

}


.ratio-text{

    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

}


.ratio-value{

    font-size:9px;

    font-weight:950;

    white-space:nowrap;

}


.ratio-use{

    margin-top:3px;

    color:#737B73;

    font-size:7px;

    font-weight:600;

    white-space:nowrap;

}


/* =========================================================
   NAVIGATION
========================================================= */

.navigation{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

}


.nav-btn{

    width:48px;

    height:48px;

    flex:0 0 48px;

    display:grid;

    place-items:center;

    border:
        1px solid
        var(--border);

    border-radius:13px;

    background:#080C09;

    color:#fff;

    transition:.18s ease;

}


.nav-btn:hover{

    border-color:
        rgba(140,198,63,.4);

    transform:
        translateY(-1px);

}


.nav-btn svg{

    width:19px;

    height:19px;

}


.slide-count{

    min-width:45px;

    color:#AAB2AA;

    text-align:center;

    font-size:10px;

    font-weight:800;

    white-space:nowrap;

}


/* =========================================================
   DOWNLOAD
========================================================= */

.download-btn{

    min-width:0;

    height:48px;

    padding:
        0 16px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    border:0;

    border-radius:12px;

    background:

        linear-gradient(
            135deg,
            var(--lime-bright),
            var(--lime)
        );

    color:#0B1007;

    font-size:10px;

    font-weight:950;

    letter-spacing:.35px;

    box-shadow:

        0 10px 25px
        rgba(140,198,63,.1);

    transition:.18s ease;

    touch-action:manipulation;

    user-select:none;

}


.download-btn:hover{

    filter:
        brightness(1.06);

    transform:
        translateY(-1px);

}


.download-btn:active{

    transform:
        translateY(0);

}


.download-btn:disabled{

    opacity:.72;

    pointer-events:none;

}


.download-btn svg{

    width:18px;

    height:18px;

}


@keyframes promoDownloadSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   MANAGER
========================================================= */

.manager{

    margin-top:13px;

    padding:22px;

    border:
        1px solid
        var(--border);

    border-radius:20px;

    background:

        radial-gradient(
            circle at 88% 0%,
            rgba(140,198,63,.055),
            transparent 32%
        ),

        linear-gradient(
            145deg,
            #0A100B,
            #070A08
        );

}


.section-label{

    color:
        var(--lime);

    font-size:10px;

    font-weight:950;

    letter-spacing:3.5px;

    line-height:1;

    text-transform:uppercase;

}


.manager-heading{

    margin-top:8px;

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:18px;

}


.manager-title{

    margin:0;

    color:#fff;

    font-size:
        clamp(23px,2.7vw,36px);

    line-height:1;

    font-weight:950;

    letter-spacing:-1.4px;

}


.manager-summary{

    flex-shrink:0;

    color:#707870;

    font-size:11px;

    white-space:nowrap;

}


.manager-summary strong{

    color:
        var(--lime);

}


/* =========================================================
   TOOLBAR
========================================================= */

.manager-toolbar{

    margin-top:20px;

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}


.tool-btn{

    min-height:42px;

    padding:
        0 16px;

    border:
        1px solid
        var(--border);

    border-radius:11px;

    background:#080D09;

    color:#fff;

    font-size:9px;

    font-weight:850;

    transition:.18s ease;

}


.tool-btn:hover{

    border-color:
        rgba(140,198,63,.4);

    transform:
        translateY(-1px);

}


.tool-btn.primary{

    color:#10140D;

    background:
        var(--lime);

    border-color:
        var(--lime);

}


.tool-btn.primary:hover{

    background:
        var(--lime-bright);

    border-color:
        var(--lime-bright);

}


/* =========================================================
   SEARCH
========================================================= */

.search-row{

    margin-top:18px;

    display:flex;

    justify-content:flex-end;

}


.search{

    width:
        min(100%,280px);

    height:42px;

    padding:
        0 14px;

    border:
        1px solid
        var(--border);

    border-radius:11px;

    background:#080D09;

    color:#fff;

    font-size:10px;

    transition:
        border-color .12s ease,
        box-shadow .12s ease;

}


.search::placeholder{

    color:#596159;

}


.search:focus{

    border-color:
        rgba(140,198,63,.5);

    box-shadow:

        0 0 0 3px
        rgba(140,198,63,.06);

}

========================================================= */

.product-grid{

            minmax(170px,1fr)

    gap:11px;

}


/* =========================================================
   SELECT CARD
========================================================= */

.select-card{

    position:relative;

    min-width:0;

    min-height:250px;

    overflow:hidden;

    border:

        var(--border);

    border-radius:14px;

    background:

        linear-gradient(
            145deg,
            #090E0A,
            #070A08

    cursor:pointer;

    transition:.16s ease;

}


.select-card:hover{

    transform:
        translateY(-2px);

    border-color:
        rgba(140,198,63,.35);

}


.select-card.selected{

    border-color:
        var(--lime);

    box-shadow:

        0 0 0 1px
        rgba(140,198,63,.22);

}


/* =========================================================
   CARD IMAGE
========================================================= */

.select-image{

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:125px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:#070A08;

}


.select-image img{

    width:100%;

    height:100%;

    padding:10px;

    object-fit:contain;

}


.select-image::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

        linear-gradient(
            to bottom,
            transparent 35%,
            #080C09 100%
        );

}

========================================================= */

    left:10px;

    background:

let searchIndex = [];

    loadPriceOverrides();


/* =========================================================
   DOM
========================================================= */

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    message
){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2600
        );

}


/* =========================================================
   WAIT
========================================================= */

function wait(
    ms
){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    try{

        const response =
            await fetch(
                CONFIG.JSON,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        products =
            Array.isArray(data)

                ?

                data

                :

                Array.isArray(
                    data.products
                )

                    ?

                    data.products

                    :

                    [];


        if(!products.length){

            throw new Error(
                "produk.json kosong atau format tidak dikenali."
            );

        }


        products =
            products.map(
                normalizeProduct
            );


        totalCount.textContent =
            products.length;

        footerTotal.textContent =
            products.length;


        restoreSelection();


        /*
         * Kalau belum pernah ada
         * selection tersimpan,
         * otomatis ambil produk
         * yang memang punya promo.
         */

        if(!selectedIds.length){

            selectedIds =
                products
                .filter(
                    isPromo
                )
                .map(
                    p=>p.id
                );

        }


        buildSearchIndex();


        renderManager();


        applyPromo(
            false
        );


    }catch(error){

        console.error(
            "[PROMO LOAD]",
            error
        );


        stage.innerHTML = `

            <div class="error">

                <strong>
                    Gagal memuat produk.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <pre>promo/
├── index.html
├── produk.json
└── images/
    └── produk/
        ├── produk-1.jpg
        └── produk-2.jpg</pre>

            </div>

        `;

    }

}


/* =========================================================
   NORMALIZE PRODUCT
========================================================= */

function normalizeProduct(
    p,
    index
){

    const id =
        String(
            p.id ??
            p.kode ??
            p.sku ??
            index + 1
        );


    let normal = 0;

    let promo = 0;


    if(
        p.harga &&
        typeof p.harga ===
        "object"
    ){

        normal =
            Number(
                p.harga.normal
            ) || 0;

        promo =
            Number(
                p.harga.promo
            ) || 0;

    }else{

        normal =
            Number(
                p.harga
            ) || 0;

        promo =
            Number(
                p.hargaPromo
            ) || 0;

    }


    return {

        ...p,

        id,

        brand:
            p.brand ||
            p.merek ||
            "NINE LUXIMOS",

        nama:
            p.nama ||
            p.name ||
            "Produk",

        gambar:
            p.gambar ||
            p.image ||
            p.foto ||
            "",

        harga:{

            normal,

            promo,

            status:
                p.harga?.status ||
                "Aktif"

        }

    };

}


/* =========================================================
   IMAGE PATH
========================================================= */

function imagePath(
    product
){

    let path =
        String(
            product.gambar ||
            ""
        ).trim();


    if(!path){

        return "";

    }


    path =
        path.replace(
            /^\/+/,
            ""
        );


    if(
        path.startsWith(
            "images/"
        )
    ){

        return path;

    }


    return (
        CONFIG.IMAGE_FOLDER +
        path
    );

}


/* =========================================================
   PRICE OVERRIDES
========================================================= */

function loadPriceOverrides(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    STORAGE.PRICES
                ) || "{}"
            );


        if(
            saved &&
            typeof saved ===
            "object"
        ){

            return saved;

        }

    }catch(error){

        console.warn(
            "[PROMO PRICE]",
            error
        );

    }


    return {};

}


function savePriceOverrides(){

    localStorage.setItem(
        STORAGE.PRICES,
        JSON.stringify(
            priceOverrides
        )
    );

}


function getPriceKey(
    product
){

    return String(
        product.id ??
        product.kode ??
        product.sku ??
        product.nama
    );

}


function getPriceData(
    product
){

    const key =
        getPriceKey(
            product
        );


    const override =
        priceOverrides[
            key
        ];


    const originalNormal =
        Number(
            product.harga?.normal
        ) || 0;


    const originalPromo =
        Number(
            product.harga?.promo
        ) || 0;


    if(!override){

        return {

            normal:
                originalNormal,

            promo:
                originalPromo

        };

    }


    return {

        normal:
            override.normal == null

                ?

                originalNormal

                :

                Number(
                    override.normal
                ) || 0,

        promo:
            override.promo == null

                ?

                originalPromo

                :

                Number(
                    override.promo
                ) || 0

    };

}


function saveCustomPrice(
    productId,
    normal,
    promo
){

    const key =
        String(
            productId
        );


    const cleanNormal =
        normal === ""
            ? null
            : Math.max(
                0,
                Number(normal) || 0
            );


    const cleanPromo =
        promo === ""
            ? null
            : Math.max(
                0,
                Number(promo) || 0
            );


    if(
        cleanNormal === null &&
        cleanPromo === null
    ){

        delete priceOverrides[
            key
        ];

    }else{

        priceOverrides[
            key
        ] = {

            normal:
                cleanNormal,

            promo:
                cleanPromo

        };

    }


    savePriceOverrides();


    /*
     * Refresh manager + preview.
     */

    renderManager();

    renderPreview(
        false
    );


    showToast(
        "Harga custom diterapkan ✓"
    );

}


/* =========================================================
   PROMO CHECK
========================================================= */

function isPromo(
    product
){

    const price =
        getPriceData(
            product
        );


    return (

        price.normal > 0 &&

        price.promo > 0 &&

        price.promo <
        price.normal

    );

}


/* =========================================================
   TITLE ENGINE
========================================================= */

function makeDisplayTitle(
    product
){

    let title =
        String(
            product.nama ||
            ""
        );


    const brand =
        String(
            product.brand ||
            ""
        );


    if(brand){

        const words =
            brand
            .split(/\s+/)
            .filter(Boolean)
            .map(
                escapeRegExp
            )
            .join("\\s+");


        if(words){

            title =
                title.replace(
                    new RegExp(
                        words,
                        "ig"
                    ),
                    ""
                );

        }

    }


    title =
        title

        .replace(
            /\b(NINE|LUXIMOS)\b/gi,
            ""
        )

        .replace(
            /\s*[-–—|:;,]+\s*/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();


    title =
        title

        .replace(
            /\b(dengan|with|seri|series|variant|varian)\b.*$/i,
            ""
        )

        .trim();


    /*
     * Jangan biarkan headline
     * terlalu panjang.
     */

    if(
        title.length > 58
    ){

        const words =
            title.split(
                /\s+/
            );


        let compact = "";


        for(
            const word
            of words
        ){

            const candidate =
                compact

                    ?

                    `${compact} ${word}`

                    :

                    word;


            if(
                candidate.length >
                58
            ){

                break;

            }


            compact =
                candidate;

        }


        title =
            compact ||
            title.slice(
                0,
                58
            );

    }


    return title

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   SEARCH INDEX
========================================================= */

function buildSearchIndex(){

    searchIndex =
        products.map(
            (
                product,
                index
            )=>{

                const title =
                    makeDisplayTitle(
                        product
                    );


                const searchable = [

                    product.brand,

                    product.nama,

                    product.name,

                    product.kode,

                    product.sku,

                    title

                ]

                .filter(Boolean)

                .join(" ")

                .toLowerCase()

                .normalize("NFD")

                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                );


                return {

                    index,

                    product,

                    searchable

                };

            }
        );

}


/* =========================================================
   SEARCH
========================================================= */

function getFilteredProducts(){

    if(!searchQuery){

        return products;

    }


    const terms =
        searchQuery
        .split(/\s+/)
        .filter(Boolean);


    return searchIndex

        .filter(
            item => {

                return terms.every(
                    term =>
                        item.searchable
                        .includes(
                            term
                        )
                );

            }
        )

        .map(
            item =>
                item.product
        );

}


/* =========================================================
   RENDER MANAGER
========================================================= */

function renderManager(){

    const filtered =
        getFilteredProducts();


    const fragment =
        document.createDocumentFragment();


    filtered.forEach(
        product => {

            fragment.appendChild(
                createProductCard(
                    product
                )
            );

        }
    );


    productGrid.replaceChildren(
        fragment
    );


    updateCounts();

}


/* =========================================================
   CREATE PRODUCT CARD
========================================================= */

function createProductCard(
    product
){

    const selected =
        selectedIds.includes(
            product.id
        );


    const price =
        getPriceData(
            product
        );


    const normal =
        price.normal;


    const promo =
        price.promo;


    const discount =
        normal > 0

            ?

            Math.round(
                (
                    (
                        normal -
                        promo
                    )
                    /
                    normal
                )
                * 100
            )

            :

            0;


    const hasCustomPrice =
        Object.prototype
        .hasOwnProperty
        .call(
            priceOverrides,
            getPriceKey(product)
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "select-card" +
        (
            selected
                ? " selected"
                : ""
        );


    if(hasCustomPrice){

        card.dataset.customPrice =
            "1";

    }


    card.innerHTML = `

        <div class="select-image">

            ${
                imagePath(product)

                    ?

                    `
                    <img
                        src="${escapeAttribute(
                            imagePath(product)
                        )}"
                        alt=""
                        loading="lazy"
                    >
                    `

                    :

                    ""

            }

        </div>


        <button
            type="button"
            class="edit-price-btn"
            title="Edit harga"
            data-edit-price
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >

                <path
                    d="M12 20h9"
                />

                <path
                    d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"
                />

            </svg>

        </button>


        <div class="check">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
            >

                <path
                    d="m5 12 4 4L19 6"
                />

            </svg>

        </div>


        <div class="select-info">

            <div class="select-brand">

                ${escapeHTML(
                    product.brand
                )}

            </div>


            <div class="select-name">

                ${escapeHTML(
                    makeDisplayTitle(
                        product
                    )
                )}

            </div>


            <div class="select-price">

                ${rupiah(promo)}

                <span class="select-old">

                    ${rupiah(normal)}

                </span>

                ${
                    discount > 0

                        ?

                        `
                        <span class="select-discount">
                            ${discount}%
                        </span>
                        `

                        :

                        ""

                }

            </div>

        </div>


        <div class="price-editor">

            <label>
                Harga normal
            </label>

            <input
                class="price-input"
                data-price-type="normal"
                type="number"
                min="0"
                inputmode="numeric"
                value="${
                    hasCustomPrice &&
                    priceOverrides[
                        getPriceKey(product)
                    ]?.normal != null

                        ?

                        priceOverrides[
                            getPriceKey(product)
                        ].normal

                        :

                        normal
                }"
            >


            <label>
                Harga promo
            </label>

            <input
                class="price-input"
                data-price-type="promo"
                type="number"
                min="0"
                inputmode="numeric"
                value="${
                    hasCustomPrice &&
                    priceOverrides[
                        getPriceKey(product)
                    ]?.promo != null

                        ?

                        priceOverrides[
                            getPriceKey(product)
                        ].promo

                        :

                        promo
                }"
            >


            <button
                type="button"
                class="price-save-btn"
                data-save-price
            >
                TERAPKAN HARGA
            </button>

        </div>

    `;


    /*
     * Card click = select.
     */

    card.addEventListener(
        "click",
        event => {

            if(
                event.target.closest(
                    "[data-edit-price]"
                ) ||
                event.target.closest(
                    ".price-editor"
                )
            ){

                return;

            }


            toggleProduct(
                product.id
            );

        }
    );


    /*
     * Edit harga.
     */

    const editButton =
        card.querySelector(
            "[data-edit-price]"
        );


    editButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();


            /*
             * Tutup card lain.
             */

            document
            .querySelectorAll(
                ".select-card.editing"
            )
            .forEach(
                item => {

                    if(item !== card){

                        item.classList.remove(
                            "editing"
                        );

                    }

                }
            );


            card.classList.toggle(
                "editing"
            );

        }
    );


    /*
     * Save harga.
     */

    const saveButton =
        card.querySelector(
            "[data-save-price]"
        );


    saveButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();


            const normalInput =
                card.querySelector(
                    '[data-price-type="normal"]'
                );


            const promoInput =
                card.querySelector(
                    '[data-price-type="promo"]'
                );


            const normal =
                normalInput.value;


            const promo =
                promoInput.value;


            if(
                Number(promo) >
                Number(normal)
            ){

                showToast(
                    "Harga promo tidak boleh lebih besar dari harga normal."
                );

                return;

            }


            saveCustomPrice(
                product.id,
                normal,
                promo
            );

        }
    );


    return card;

}


/* =========================================================
   TOGGLE PRODUCT
========================================================= */

function toggleProduct(
    id
){

    id =
        String(id);


    if(
        selectedIds.includes(
            id
        )
    ){

        selectedIds =
            selectedIds.filter(
                value =>
                    value !== id
            );

    }else{

        selectedIds.push(
            id
        );

    }


    renderManager();

}


/* =========================================================
   APPLY PROMO
========================================================= */

function applyPromo(
    notify=true
){

    promoProducts =
        products.filter(
            product =>
                selectedIds.includes(
                    product.id
                )
        );


    currentIndex = 0;


    localStorage.setItem(
        STORAGE.SELECTION,
        JSON.stringify(
            selectedIds
        )
    );


    renderPreview(
        true
    );


    if(notify){

        showToast(
            `${promoProducts.length} produk diterapkan.`
        );

    }

}


/* =========================================================
   PREVIEW
========================================================= */

function renderPreview(
    restartAutoplay=true
){

    if(
        !promoProducts.length
    ){

        stage.className =
            `stage ratio-${currentRatio}`;


        stage.innerHTML = `

            <div class="error">

                <strong>
                    Belum ada produk promo.
                </strong>

                <br><br>

                Pilih produk dari Promo Manager,
                kemudian tekan Terapkan Promo.

            </div>

        `;


        stopAutoplay();

        updateSlideCount();

        return;

    }


    if(
        currentIndex >=
        promoProducts.length
    ){

        currentIndex = 0;

    }


    const product =
        promoProducts[

        ];


    const price =
        getPriceData(
            product
        );


    const normal =
        price.normal;


    const promo =
        price.promo;


    const discount =
        normal > 0

            ?

            Math.max(
                0,
                Math.round(
                    (
                        (
                            normal -
                            promo
                        )
                        /
                        normal
                    )
                    * 100
                )
            )

            :

            0;

        makeDisplayTitle(
            product
        );


    stage.className =
        `stage ratio-${currentRatio}`;


    stage.innerHTML = `

        <article
            class="promo-canvas"
            id="promoCanvas"
        >


            <div
                class="product-visual"
            >

                ${
                    imagePath(product)

                        ?

                        `
                        <img
                            class="product-image"
                            src="${escapeAttribute(
                                imagePath(product)
                            )}"
                            alt="${escapeAttribute(
                                title
                            )}"
                            crossorigin="anonymous"
                            decoding="async"
                        >
                        `

                        :

                        `
                        <div class="error">
                            IMAGE NOT FOUND
                        </div>
                        `

                }


                <div
                    class="visual-gradient"
                ></div>

            </div>


            <div
                class="promo-badge"
            >
                PROMO
            </div>


            <div
                class="product-info"
            >

                <div
                    class="product-brand"
                >

                    ${escapeHTML(
                        product.brand
                    )}

                </div>


                <h1
                    class="product-name"
                >

                    ${escapeHTML(
                        title
                    )}

                </h1>


                <div
                    class="price-block"
                >

                    <div
                        class="price-label"
                    >
                        Harga Promo
                    </div>


                    <div
                        class="price-promo"
                    >

                        ${rupiah(
                            promo
                        )}

                    </div>


                    <div
                        class="price-meta"
                    >

                        <div
                            class="price-normal"
                        >

                            <s>
                                ${rupiah(
                                    normal
                                )}
                            </s>

                        </div>


                        ${
                            discount > 0

                                ?

                                `

                                    Hemat ${discount}%
                                </div>
                                `

                                :

                        }

                    color:#8C948A;

/* =========================================================
   SLIDE COUNT
========================================================= */

function updateSlideCount(){

    slideCount.textContent =
        promoProducts.length

            ?

            `${currentIndex + 1} / ${promoProducts.length}`

            :

            "0 / 0";

}


/* =========================================================
   CINEMATIC SLIDE
========================================================= */

async function changeSlide(
    direction
){

    if(
        transitionBusy ||
        promoProducts.length < 2
    ){

        return;

    }


    transitionBusy = true;


    stopAutoplay();


    const oldCanvas =
        document.getElementById(
            "promoCanvas"
        );


    if(!oldCanvas){

        currentIndex =
            (
                currentIndex +
                direction +
                promoProducts.length
            )
            %
            promoProducts.length;


        renderPreview(
            false
        );


        transitionBusy = false;

        return;

    }


    /*
     * CLOSE
     */

    oldCanvas.classList.remove(
        "slide-in",
        "slide-content"
    );


    oldCanvas.classList.add(
        "slide-out"
    );


    await wait(
        620
    );


    /*
     * CHANGE PRODUCT
     */

    currentIndex =
        (
            currentIndex +
            direction +
            promoProducts.length
        )
        %
        promoProducts.length;


    renderPreview(
        false
    );


    const newCanvas =
        document.getElementById(
            "promoCanvas"
        );


    if(!newCanvas){

        transitionBusy = false;

        return;

    }


    /*
     * OPEN
     */

    newCanvas.classList.add(
        "slide-in"
    );


    await wait(
        40
    );


    newCanvas.classList.add(
        "slide-content"
    );


    await wait(
        760
    );


    newCanvas.classList.remove(
        "slide-in",
        "slide-out"
    );


    transitionBusy = false;


    if(playing){

        startAutoplay();

    }

}


function nextSlide(){

    changeSlide(
        1
    );

}


function previousSlide(){

    changeSlide(
        -1
    );

}


/* =========================================================
   PLAY
========================================================= */

function togglePlay(){

    if(
        transitionBusy
    ){

        return;

    }


    playing =
        !playing;


    updatePlayIcons();


    if(playing){

        startAutoplay();

    }else{

        stopAutoplay();

    }

}


/* =========================================================
   PLAY ICONS
========================================================= */

function updatePlayIcons(){

    const path =
        playing

            ?

            `
            <path d="M7 5h4v14H7z"/>
            <path d="M13 5h4v14h-4z"/>
            `

            :

            `
            <path d="M8 5v14l11-7z"/>
            `;


    document.getElementById(
        "playIcon"
    ).innerHTML =
        path;


    document.getElementById(
        "headerPlayIcon"
    ).innerHTML =
        path;

}


/* =========================================================
   AUTOPLAY
========================================================= */

function startAutoplay(){

    stopAutoplay();


    if(
        !playing ||
        transitionBusy ||
        promoProducts.length < 2
    ){

        return;

    }


    autoplay =
        setTimeout(
            ()=>{
                nextSlide();
            },
            CONFIG.DURATION
        );

}


function stopAutoplay(){

    if(autoplay){

        clearTimeout(
            autoplay
        );

        autoplay = null;

    }

/* =========================================================
   IMAGE WAIT
========================================================= */

function waitForImage(
    img
){

    return new Promise(
        resolve => {

            if(
                img.complete &&
                img.naturalWidth > 0
            ){

                resolve();

                return;

            }


            let finished =
                false;


            const done =
                ()=>{
                    if(finished){

                        return;

                    }


                    finished =
                        true;


                    img.removeEventListener(
                        "load",
                        done
                    );


                    img.removeEventListener(
                        "error",
                        done
                    );


                    resolve();

                };


            img.addEventListener(
                "load",
                done,
                {
                    once:true
                }
            );


            img.addEventListener(
                "error",
                done,
                {
                    once:true
                }
            );


            setTimeout(
                done,
                6000
            );

        }
    );

}


/* =========================================================
   WAIT IMAGES
========================================================= */

async function waitForImages(
    root
){

    const images =
        Array.from(
            root.querySelectorAll(
                "img"
            )
        );


    for(
        const img
        of images
    ){

        await waitForImage(
            img
        );


        if(
            typeof img.decode ===
            "function"
        ){

            try{

                await Promise.race(
                    [
                        img.decode(),
                        wait(2500)
                    ]
                );

            }catch{}

        }

    }

}


/* =========================================================
   WAIT FONTS
========================================================= */

async function waitForFonts(){

    if(
        document.fonts &&
        document.fonts.ready
    ){

        try{

            await Promise.race(
                [
                    document.fonts.ready,
                    wait(3500)
                ]
            );

        }catch{}

    }

}


/* =========================================================
   SAVE BLOB
========================================================= */

async function saveBlob(
    blob,
    filename
){

    if(
        !blob ||
        blob.size <= 0
    ){

        throw new Error(
            "EMPTY_BLOB"
        );

    }


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;

    link.download =
        filename;

    link.setAttribute(
        "download",
        filename
    );

    link.style.position =
        "fixed";

    link.style.left =
        "-9999px";

    link.style.top =
        "-9999px";

    link.style.opacity =
        "0";


    document.body.appendChild(
        link
    );


    link.click();


    await wait(
        500
    );


    link.remove();

    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   DOWNLOAD STATUS — FINAL
========================================================= */

async function downloadStatus(){

    if(downloadBusy){

        return;

    }


    const source =
        document.getElementById(
            "promoCanvas"
        );


    const product =
        promoProducts[
            currentIndex
        ];


    if(!source){

        showToast(
            "Preview belum siap."
        );

        return;

    }


    if(!product){

        showToast(
            "Produk belum tersedia."
        );

        return;

    }


    if(
        typeof html2canvas !==
        "function"
    ){

        showToast(
            "Engine export belum tersedia."
        );

        return;

    }


    downloadBusy =
        true;


    const button =
        downloadBtn;


    const originalHTML =
        button
            ? button.innerHTML
            : "";


    const wasPlaying =
        playing;


    try{

        stopAutoplay();


        if(button){

            button.disabled =
                true;

            button.innerHTML = `

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    style="
                        width:18px;
                        height:18px;
                        animation:
                            promoDownloadSpin
                            .7s linear infinite;
                    "
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="9"
                        stroke-opacity=".25"
                    ></circle>

                    <path
                        d="M21 12a9 9 0 0 0-9-9"
                    ></path>

                </svg>

                MEMBUAT...

            `;

        }


        showToast(
            "Menyiapkan status..."
        );


        await waitForImages(
            source
        );


        await waitForFonts();


        await new Promise(
            resolve =>
                requestAnimationFrame(
                    ()=>{
                        requestAnimationFrame(
                            resolve
                        );
                    }
                )
        );


        /*
         * Disable active transition.
         */

        document.body.classList.add(
            "capture-mode"
        );


        await wait(
            100
        );


        const rect =
            source.getBoundingClientRect();


        const width =
            Math.max(
                1,
                Math.round(
                    rect.width
                )
            );


        const height =
            Math.max(
                1,
                Math.round(
                    rect.height
                )
            );


        /*
         * Safe adaptive scale.
         */

        const scale =
            Math.min(
                2,
                Math.max(
                    1,
                    window.devicePixelRatio || 1
                )
            );


        showToast(
            "Merender status..."
        );


        const canvas =
            await new Promise(
                (
                    resolve,
                    reject
                )=>{

                    let settled =
                        false;


                    const finish =
                        (
                            fn,
                            value
                        )=>{

                            if(settled){

                                return;

                            }


                            settled =
                                true;


                            fn(
                                value
                            );

                        };


                    const timeout =
                        setTimeout(
                            ()=>{

                                finish(
                                    reject,
                                    new Error(
                                        "EXPORT_TIMEOUT"
                                    )
                                );

                            },
                            15000
                        );


                    html2canvas(
                        source,
                        {

                            backgroundColor:
                                "#070907",

                            width,

                            height,

                            scale,

                            useCORS:true,

                            allowTaint:false,

                            imageTimeout:8000,

                            logging:false,

                            foreignObjectRendering:false,

                            removeContainer:true,

                            scrollX:0,

                            scrollY:0

                        }

                    )

                    .then(
                        result=>{

                            clearTimeout(
                                timeout
                            );


                            finish(
                                resolve,
                                result
                            );

                        }
                    )

                    .catch(
                        error=>{

                            clearTimeout(
                                timeout
                            );


                            finish(
                                reject,
                                error
                            );

                        }
                    );

                }
            );


        document.body.classList.remove(
            "capture-mode"
        );


        if(
            !canvas ||
            !canvas.width ||
            !canvas.height
        ){

            throw new Error(
                "INVALID_CANVAS"
            );

        }


        showToast(
            "Menyiapkan file PNG..."
        );


        const blob =
            await new Promise(
                (
                    resolve,
                    reject
                )=>{

                    canvas.toBlob(
                        result=>{

                            if(
                                result &&
                                result.size > 0
                            ){

                                resolve(
                                    result
                                );

                            }else{

                                reject(
                                    new Error(
                                        "PNG_BLOB_FAILED"
                                    )
                                );

                            }

                        },
                        "image/png",
                        1
                    );

                }
            );


        const ratio =
            currentRatio === "916"

                ?

                "9x16"

                :

                currentRatio === "45"

                    ?

                    "4x5"

                    :

                    "16x9";


        const filename =
            `PROMO-${slug(
                makeDisplayTitle(
                    product
                )
            )}-${ratio}.png`;


        await saveBlob(
            blob,
            filename
        );


        showToast(
            "Status berhasil didownload ✓"
        );


    }catch(error){

        console.error(
            "[PROMO DOWNLOAD]",
            error
        );


        document.body.classList.remove(
            "capture-mode"
        );


        if(
            error?.message ===
            "EXPORT_TIMEOUT"
        ){

            showToast(
                "Export terlalu lama. Coba lagi."
            );

        }else if(
            error?.message ===
            "PNG_BLOB_FAILED"
        ){

            showToast(
                "Browser gagal membuat PNG."
            );

        }else{

            showToast(
                "Gagal membuat status."
            );

        }

    }finally{

        document.body.classList.remove(
            "capture-mode"
        );


        if(button){

            button.disabled =
                false;

            button.innerHTML =
                originalHTML;

        }


        downloadBusy =
            false;


        if(wasPlaying){

            playing =
                true;

            updatePlayIcons();

            startAutoplay();

        }

    }

}

/* =========================================================
   SWIPE
========================================================= */

let touchStartX = 0;

let touchStartY = 0;


stage.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.screenX;


        touchStartY =
            touch.screenY;

    },
    {
        passive:true
    }
);


stage.addEventListener(
    "touchend",
    event => {

        if(
            transitionBusy
        ){

            return;

        }


        const touch =
            event.changedTouches[0];


        const endX =
            touch.screenX;


        const endY =
            touch.screenY;


        const deltaX =
            endX -
            touchStartX;


        const deltaY =
            endY -
            touchStartY;


        /*
         * Abaikan swipe vertikal.
         */

        if(
            Math.abs(deltaX) <
            Math.abs(deltaY)
        ){

            return;

        }


        if(
            Math.abs(deltaX) <
            45
        ){

            return;

        }


        if(
            deltaX < 0
        ){

            nextSlide();

        }else{

            previousSlide();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Jangan ambil shortcut
         * ketika user sedang mengetik.
         */

        if(
            event.target &&
            (
                event.target.tagName ===
                "INPUT" ||

                event.target.tagName ===
                "TEXTAREA"
            )
        ){

            return;

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            nextSlide();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousSlide();

        }


        if(
            event.key ===
            " "
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.key.toLowerCase()
            === "f"
        ){

            fullscreen();

        }


        if(
            event.key.toLowerCase()
            === "d"
        ){

            downloadStatus();

        }

    }
);

/* =========================================================
   RUPIAH
========================================================= */

function rupiah(
    value
){

    return new Intl.NumberFormat(
        "id-ID",
        {

            style:"currency",

            currency:"IDR",

            maximumFractionDigits:0

        }
    ).format(
        Number(value) || 0
    );

}


/* =========================================================
   SLUG
========================================================= */

function slug(
    value
){

    return String(
        value
    )

    .toLowerCase()

    .replace(
        /[^a-z0-9]+/g,
        "-"
    )

    .replace(
        /^-+|-+$/g,
        ""
    );

}


/* =========================================================
   ESCAPE REGEXP
========================================================= */

function escapeRegExp(
    value
){

    return String(
        value
    )

    .replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}
