<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin-V5 Dashboard</title>
<link rel="stylesheet" href="/admin-v5/style.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



<style>



/* =========================================================
   IMAM SALES ADMIN — FINAL VISUAL POLISH
   UI ONLY — NO JS / FUNCTION / DATA MODIFICATION
   ========================================================= */

:root{
  --admin-bg:#f4f7fb;
  --admin-surface:#ffffff;
  --admin-surface-soft:#f8fafc;
  --admin-border:#e2e8f0;
  --admin-border-dark:#cbd5e1;

  --admin-text:#172033;
  --admin-text-soft:#64748b;
  --admin-text-muted:#94a3b8;

  --admin-blue:#153d7a;
  --admin-blue-dark:#0b2d61;
  --admin-blue-soft:#eff6ff;

  --admin-pink:#e54770;
  --admin-pink-dark:#d63861;

  --admin-lime:#8CC63F;
  --admin-lime-light:#a6e34b;
  --admin-lime-soft:rgba(140,198,63,.12);

  --admin-red:#ef4444;
  --admin-yellow:#f59e0b;
  --admin-green:#16a34a;

  --admin-radius:10px;
  --admin-radius-sm:7px;

  --admin-shadow:
    0 4px 18px rgba(15,23,42,.06);

  --admin-shadow-hover:
    0 10px 28px rgba(15,23,42,.10);
}


/* =========================================================
   BASE
   ========================================================= */

html{
  background:var(--admin-bg);
}

body{
  margin:0;
  background:var(--admin-bg);
  color:var(--admin-text);
  font-family:
    "Segoe UI",
    Inter,
    Roboto,
    Arial,
    sans-serif;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

*,
*::before,
*::after{
  box-sizing:border-box;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.erp-layout{
  display:flex;
  min-height:100vh;
  width:100%;
  background:var(--admin-bg);
}

.erp-main{
  flex:1;
  min-width:0;
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  background:
    linear-gradient(
      180deg,
      #f8fafc 0,
      var(--admin-bg) 260px
    );
  padding-bottom:78px;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.erp-sidebar{
  width:58px;
  min-width:58px;
  min-height:100vh;

  position:relative;
  z-index:1000;

  display:flex;
  flex-direction:column;
  align-items:center;

  background:
    linear-gradient(
      180deg,
      var(--admin-blue) 0%,
      var(--admin-blue-dark) 100%
    );

  border-right:1px solid rgba(255,255,255,.08);

  box-shadow:
    4px 0 18px rgba(11,45,97,.10);

  overflow:visible;
}

.erp-logo{
  width:100%;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:19px;

  border-bottom:
    1px solid rgba(255,255,255,.10);
}

.erp-logo i{
  transition:
    transform .25s ease,
    color .25s ease;
}

.erp-logo:hover i{
  color:var(--admin-lime-light);
  transform:rotate(25deg);
}

.erp-menu{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  padding:12px 6px;
}

.erp-menu .menu-btn,
.erp-sidebar-bottom .menu-btn{
  position:relative;

  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid transparent;
  border-radius:9px;

  background:transparent;
  color:#fff;

  cursor:pointer;

  transition:
    background .2s ease,
    border-color .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.erp-menu .menu-btn i,
.erp-sidebar-bottom .menu-btn i{
  font-size:17px;
  color:#fff;
  transition:
    transform .2s ease,
    color .2s ease;
}

.erp-menu .menu-btn:hover{
  background:rgba(255,255,255,.10);
  border-color:rgba(255,255,255,.10);
}

.erp-menu .menu-btn:hover i{
  transform:scale(1.08);
}

.erp-menu .menu-btn.active{
  background:
    linear-gradient(
      135deg,
      var(--admin-pink),
      var(--admin-pink-dark)
    );

  border-color:rgba(255,255,255,.12);

  box-shadow:
    0 5px 14px rgba(229,71,112,.25);
}

.erp-menu .menu-btn.active::after{
  content:"";

  position:absolute;
  left:-7px;
  top:9px;

  width:3px;
  height:28px;

  border-radius:0 4px 4px 0;

  background:var(--admin-lime-light);
}

.erp-sidebar-bottom{
  margin-top:auto;
  width:100%;
  padding:10px 6px 14px;
}

.logout-btn:hover{
  background:rgba(239,68,68,.16)!important;
  border-color:rgba(239,68,68,.25)!important;
}

.logout-btn:hover i{
  color:#fff!important;
}


/* =========================================================
   SIDEBAR TOOLTIP
   ========================================================= */

.erp-menu .menu-btn::after{
  content:attr(title);

  position:absolute;
  left:calc(100% + 12px);
  top:50%;

  transform:
    translateY(-50%)
    translateX(-5px);

  padding:7px 10px;

  background:#fff;
  color:#334155;

  border:1px solid var(--admin-border);

  border-radius:7px;

  font-size:12px;
  font-weight:600;

  line-height:1;
  white-space:nowrap;

  box-shadow:
    0 8px 22px rgba(15,23,42,.14);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  z-index:99999;

  transition:
    opacity .18s ease,
    transform .18s ease,
    visibility .18s ease;
}

.erp-menu .menu-btn:hover::after{
  opacity:1;
  visibility:visible;

  transform:
    translateY(-50%)
    translateX(0);
}


/* =========================================================
   TOP TABS
   ========================================================= */

.erp-tabs{
  height:42px;

  display:flex;
  align-items:stretch;

  overflow-x:auto;
  overflow-y:hidden;

  white-space:nowrap;

  background:#fff;

  border-bottom:1px solid var(--admin-border);

  box-shadow:
    0 1px 4px rgba(15,23,42,.03);

  scrollbar-width:none;
}

.erp-tabs::-webkit-scrollbar{
  display:none;
}

.erp-tab{
  position:relative;

  display:flex;
  align-items:center;

  padding:0 17px;

  color:#64748b;
  background:transparent;

  border-right:1px solid #edf0f4;

  font-size:12px;
  font-weight:600;

  cursor:pointer;

  transition:
    color .2s ease,
    background .2s ease;
}

.erp-tab:hover{
  color:var(--admin-pink);
  background:#fff8fa;
}

.erp-tab.active{
  color:#fff;
  background:var(--admin-pink);
}

.erp-tab.active::after{
  content:"";

  position:absolute;
  left:14px;
  right:14px;
  bottom:0;

  height:3px;

  border-radius:3px 3px 0 0;

  background:var(--admin-lime-light);
}


/* =========================================================
   PAGE HEADER
   ========================================================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;

  min-height:76px;

  padding:16px 22px;

  background:transparent;

  border-bottom:1px solid rgba(226,232,240,.7);
}

.header h1{
  margin:0;

  color:var(--admin-text);

  font-size:20px;
  font-weight:700;
  letter-spacing:-.3px;

  display:flex;
  align-items:center;
  gap:8px;
}

.header h1 i{
  color:var(--admin-lime);

  filter:
    drop-shadow(
      0 3px 7px
      rgba(140,198,63,.25)
    );
}

#live-clock{
  white-space:pre-line;

  color:var(--admin-text-soft);

  font-size:11px;
  font-weight:500;

  line-height:1.45;

  text-align:right;
}


/* =========================================================
   PAGE / CARD
   ========================================================= */

.page-section{
  display:none;

  padding:
    16px 18px 20px;
}

.page-section.active{
  display:block;
}

.card{
  background:var(--admin-surface);

  border:
    1px solid var(--admin-border);

  border-radius:var(--admin-radius);

  box-shadow:var(--admin-shadow);

  overflow:hidden;
}

.card > h3{
  margin:0;

  padding:15px 17px;

  color:var(--admin-text);

  font-size:14px;
  font-weight:700;

  border-bottom:1px solid var(--admin-border);

  background:
    linear-gradient(
      180deg,
      #fff,
      #fbfcfe
    );
}

.card > h3 i{
  color:var(--admin-lime);
  margin-right:7px;

  filter:
    drop-shadow(
      0 3px 5px
      rgba(140,198,63,.20)
    );
}


/* =========================================================
   DASHBOARD — ACTIVE USERS
   ========================================================= */

#vip-active-list{
  background:#0f172a;
}

#vip-active-title{
  display:flex;
  align-items:center;
  gap:2px;
}

#vip-active-list > div{
  min-height:62px;

  padding:10px 14px!important;

  background:
    linear-gradient(
      90deg,
      #0f172a,
      #111c30
    )!important;

  border-bottom:
    1px solid rgba(255,255,255,.055)!important;

  transition:
    background .2s ease;
}

#vip-active-list > div:hover{
  background:#162238!important;
}

.vip-active-name{
  color:#fff!important;
  font-size:13px!important;
  font-weight:700!important;
}


/* =========================================================
   INPUTS / SELECTS
   ========================================================= */

input[type="text"],
select,
textarea{
  border:1px solid var(--admin-border-dark);

  border-radius:7px;

  background:#fff;

  color:var(--admin-text);

  outline:none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input[type="text"]:focus,
select:focus,
textarea:focus{
  border-color:
    rgba(140,198,63,.85);

  box-shadow:
    0 0 0 3px
    rgba(140,198,63,.12);

  background:#fff;
}

input::placeholder,
textarea::placeholder{
  color:#a0aec0;
}


/* =========================================================
   STOCK
   ========================================================= */

.stok-card{
  overflow:hidden;
}

.stok-card > input[type="text"]{
  width:100%;
  height:38px;

  margin:16px 16px 0;
  width:calc(100% - 32px);

  padding:0 12px;

  font-size:12px;
}

.stok-card > label{
  display:flex;
  align-items:center;
  gap:7px;

  margin:
    12px 16px;

  color:var(--admin-text-soft);

  font-size:12px;
  font-weight:600;
}

#stok-list{
  padding:0 16px 8px;
}

.stok-item > div{
  min-height:48px!important;

  padding:7px 4px!important;

  border-bottom:
    1px solid #edf1f5!important;
}

.stok-item:hover > div{
  background:#fafcff;
}

.stok-item span{
  font-size:12px!important;
  font-weight:600;
}

.stok-footer{
  display:flex;
  gap:10px;

  padding:14px 16px;

  border-top:1px solid var(--admin-border);

  background:#f8fafc;
}

.stok-footer button{
  min-height:38px;

  padding:0 14px;

  border:1px solid transparent;
  border-radius:7px;

  font-size:11px;
  font-weight:700;

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.stok-footer button:first-child{
  background:var(--admin-lime);
  color:#fff;

  box-shadow:
    0 4px 10px rgba(140,198,63,.20);
}

.stok-footer button:last-child{
  background:#fee2e2;
  color:#b91c1c;

  border-color:#fecaca;
}

.stok-footer button:hover{
  transform:translateY(-1px);
  filter:brightness(.98);
}


/* =========================================================
   STOCK TOGGLE
   ========================================================= */

.toggle{
  width:40px!important;
  height:22px!important;

  border-radius:20px!important;

  background:#cbd5e1!important;

  transition:
    background .2s ease;
}

.toggle.active{
  background:var(--admin-lime)!important;
}

.toggle .circle{
  width:16px!important;
  height:16px!important;

  margin:3px!important;

  background:#fff;

  border-radius:50%;

  box-shadow:
    0 2px 5px rgba(0,0,0,.18);

  transition:
    transform .2s ease;
}

.toggle .circle.on{
  transform:translateX(18px);
}


/* =========================================================
   ORDER CONTROL
   ========================================================= */

.control{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;

  margin-bottom:12px;

  padding:10px;

  background:#fff;

  border:
    1px solid var(--admin-border);

  border-radius:9px;

  box-shadow:
    0 2px 10px rgba(15,23,42,.04);
}

.control select,
.control input{
  height:36px;

  padding:0 10px;

  font-size:11px;
}

.control select{
  min-width:115px;
}

.control #search{
  flex:1;
  min-width:160px;
}

.control button{
  height:36px;

  padding:0 14px;

  border:none;
  border-radius:7px;

  background:var(--admin-blue);

  color:#fff;

  font-size:11px;
  font-weight:700;

  cursor:pointer;

  transition:
    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.control button:hover{
  background:#194a91;

  transform:translateY(-1px);

  box-shadow:
    0 5px 12px rgba(21,61,122,.18);
}


/* =========================================================
   ORDER CARD
   ========================================================= */

.order-card{
  overflow:visible;
}

#data{
  padding:12px;
  padding-bottom:30px;
}


/* =========================================================
   INVOICE
   ========================================================= */

.invoice-group{
  margin-bottom:10px;

  overflow:hidden;

  background:#fff;

  border:
    1px solid var(--admin-border);

  border-radius:9px;

  box-shadow:
    0 2px 9px rgba(15,23,42,.045);

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.invoice-group:hover{
  border-color:#d7dee8;

  box-shadow:
    0 5px 16px rgba(15,23,42,.07);
}

.invoice-header{
  min-height:64px;

  padding:11px 13px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #f8fafc
    );

  border-bottom:1px solid var(--admin-border);
}

.invoice-header-left{
  min-width:0;

  display:flex;
  flex-direction:column;
  gap:5px;
}

.invoice-title{
  display:flex;
  align-items:center;

  color:var(--admin-text);

  font-size:12px;
  font-weight:800;

  word-break:break-word;
}

.invoice-title i{
  flex:none;
  color:var(--admin-lime);
  margin-right:6px;
}

.invoice-info{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.invoice-info .vip-name{
  color:#475569;
  font-size:11px;
  font-weight:700;
}

.invoice-info .vip-date{
  color:#94a3b8;
  font-size:10px;
}

.collapse-btn{
  flex:none;

  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:
    1px solid var(--admin-border-dark);

  border-radius:7px;

  background:#fff;
  color:#64748b;

  cursor:pointer;

  transition:
    color .2s ease,
    background .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.collapse-btn:hover{
  color:#fff;
  background:var(--admin-blue);
  border-color:var(--admin-blue);
  transform:translateY(-1px);
}


/* =========================================================
   INVOICE SUMMARY
   ========================================================= */

.invoice-summary{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  margin:0;

  padding:10px 12px;

  background:#fbfcfe;

  border-bottom:1px solid #edf1f5;
}

.summary-box{
  min-height:29px;

  display:inline-flex;
  align-items:center;
  gap:4px;

  padding:4px 8px;

  background:#fff;

  border:1px solid var(--admin-border);

  border-radius:6px;

  color:#64748b;

  font-size:10px;
  font-weight:700;
}

.summary-box i{
  font-size:11px!important;
  color:var(--admin-lime)!important;
  margin-right:1px!important;
}

.invoice-summary .summary-ready,
.invoice-summary .summary-proses,
.invoice-summary .summary-pending{
  color:var(--admin-text)!important;
  font-weight:800;
}


/* =========================================================
   INVOICE ITEMS
   ========================================================= */

.invoice-content{
  margin:0!important;
  background:#fff;
}

.invoice-item{
  position:relative;

  padding:12px!important;
  margin:0!important;

  background:#fff!important;

  border-bottom:
    1px solid #edf1f5!important;

  border-radius:0!important;
}

.invoice-item:last-child{
  border-bottom:none!important;
}

.invoice-item:hover{
  background:#fbfdff!important;
}

.invoice-order{
  display:flex;
  align-items:flex-start;
  gap:5px;

  color:#334155!important;

  font-size:12px!important;
  font-weight:650!important;

  line-height:1.5!important;

  word-break:break-word;
}

.invoice-order i{
  flex:none;
  color:var(--admin-lime)!important;
  margin-top:3px!important;
  margin-right:1px!important;
}

.status-text{
  display:inline-flex;
  align-items:center;
  gap:5px;

  margin-top:7px;

  font-size:10px!important;
  font-weight:800!important;
  letter-spacing:.25px;
}

.status-text i{
  font-size:10px;
}

.status-text.pending{
  color:var(--admin-red)!important;
}

.status-text.proses{
  color:var(--admin-yellow)!important;
}

.status-text.ready{
  color:var(--admin-green)!important;
}


/* =========================================================
   STATUS ACTION
   ========================================================= */

.action-wrapper{
  display:flex!important;
  align-items:flex-end!important;
  justify-content:space-between!important;
  gap:15px!important;

  margin-top:10px;
}

.status-btn{
  display:flex!important;
  gap:6px!important;
}

.status-btn .btn{
  width:31px!important;
  height:31px!important;

  display:flex!important;
  align-items:center!important;
  justify-content:center!important;

  padding:0!important;

  border:
    1px solid var(--admin-border-dark)!important;

  border-radius:7px!important;

  background:#f8fafc!important;

  color:#94a3b8!important;

  opacity:1!important;

  cursor:pointer;

  transition:
    transform .18s ease,
    color .18s ease,
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.status-btn .btn:hover{
  transform:translateY(-1px)!important;

  background:#fff!important;

  box-shadow:
    0 4px 10px rgba(15,23,42,.10);
}

.status-btn .btn i{
  font-size:11px!important;
}

.status-btn .btn.active-red{
  background:#fee2e2!important;
  border-color:#fecaca!important;
  color:var(--admin-red)!important;
}

.status-btn .btn.active-yellow{
  background:#fef3c7!important;
  border-color:#fde68a!important;
  color:#d97706!important;
}

.status-btn .btn.active-green{
  background:#ecfdf5!important;
  border-color:#bbf7d0!important;
  color:var(--admin-green)!important;
}


/* =========================================================
   DELETE ACTION
   ========================================================= */

.delete-side{
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  gap:4px!important;
}

.delete-label{
  color:#94a3b8!important;

  font-size:9px!important;
  font-weight:800!important;

  letter-spacing:.7px;
}

.delete-btn-admin{
  width:31px!important;
  height:31px!important;

  display:flex!important;
  align-items:center!important;
  justify-content:center!important;

  padding:0!important;

  border:
    1px solid #fecaca!important;

  border-radius:7px!important;

  background:#fff!important;

  color:var(--admin-red)!important;

  cursor:pointer;

  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.delete-btn-admin i{
  color:var(--admin-red)!important;
}

.delete-btn-admin:hover{
  background:var(--admin-red)!important;
  border-color:var(--admin-red)!important;
  color:#fff!important;

  transform:translateY(-1px);
}

.delete-btn-admin:hover i{
  color:#fff!important;
}


/* =========================================================
   DELETE REQUEST ALERT
   ========================================================= */

.invoice-delete-alert{
  margin:10px 12px;

  padding:12px;

  background:
    linear-gradient(
      135deg,
      #fff1f2,
      #fff7f7
    )!important;

  border:
    1px solid #fecdd3!important;

  border-left:
    4px solid var(--admin-red)!important;

  border-radius:8px!important;

  color:#991b1b!important;

  font-size:11px!important;
  font-weight:800!important;

  line-height:1.5!important;
}

.invoice-delete-alert > i{
  color:var(--admin-red)!important;
}

.invoice-delete-alert .btn{
  min-height:31px;

  padding:0 11px;

  border:none;
  border-radius:6px;

  font-size:10px;
  font-weight:800;

  cursor:pointer;

/* =========================================================
   SIDEBAR TOOLTIP — FINAL FIX
   IMPORTANT:
   ::after = TEXT TOOLTIP
   ::before = ARROW
   ACTIVE STATE = NO PSEUDO ELEMENT
   ========================================================= */


/* SIDEBAR */

.erp-sidebar{
  position:relative !important;
  z-index:10000 !important;
  overflow:visible !important;
}

.erp-menu{
  position:relative !important;
  overflow:visible !important;
}

.erp-menu .menu-btn{
  position:relative !important;
  overflow:visible !important;
  isolation:auto !important;
}


/* =========================================================
   REMOVE OLD ACTIVE ::AFTER CONFLICT
   ========================================================= */

.erp-menu .menu-btn.active::after{
  content:attr(title) !important;
}


/* =========================================================
   TOOLTIP TEXT
   ========================================================= */

.erp-menu .menu-btn::after{

  content:attr(title) !important;

  position:absolute !important;

  left:calc(100% + 10px) !important;
  top:50% !important;

  width:max-content !important;
  min-width:max-content !important;

  transform:
    translateY(-50%)
    translateX(-6px) !important;

  padding:8px 12px !important;

  background:#fff8d8 !important;
  color:#3f3a20 !important;

  border:1px solid #e4d88f !important;
  border-radius:7px !important;

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif !important;

  font-size:12px !important;
  font-weight:600 !important;

  line-height:1.2 !important;

  white-space:nowrap !important;

  box-shadow:
    0 5px 16px
    rgba(0,0,0,.18) !important;

  opacity:0 !important;
  visibility:hidden !important;

  pointer-events:none !important;

  z-index:999999 !important;

  transition:
    opacity .18s ease,
    transform .18s ease,
    visibility .18s ease !important;
}


/* =========================================================
   TOOLTIP ARROW
   ========================================================= */

.erp-menu .menu-btn::before{

  content:"" !important;

  position:absolute !important;

  left:calc(100% + 4px) !important;
  top:50% !important;

  width:0 !important;
  height:0 !important;

  transform:
    translateY(-50%) !important;

  border-top:
    6px solid transparent !important;

  border-bottom:
    6px solid transparent !important;

  border-right:
    6px solid #e4d88f !important;

  opacity:0 !important;
  visibility:hidden !important;

  pointer-events:none !important;

  z-index:999999 !important;

  transition:
    opacity .18s ease,
    visibility .18s ease !important;
}


/* =========================================================
   HOVER — SHOW TITLE
   ========================================================= */

.erp-menu .menu-btn:hover::after{

  opacity:1 !important;
  visibility:visible !important;

  transform:
    translateY(-50%)
    translateX(0) !important;
}

.erp-menu .menu-btn:hover::before{

  opacity:1 !important;
  visibility:visible !important;
}


/* =========================================================
   ACTIVE BUTTON
   Tidak lagi memakai ::after
   supaya tooltip tetap aman.
   ========================================================= */

.erp-menu .menu-btn.active{

  background:
    linear-gradient(
      135deg,
      #e54770,
      #d93661
    ) !important;

  border-radius:9px !important;

  box-shadow:
    0 5px 14px
    rgba(229,71,112,.28) !important;
}


/* =========================================================
   ACTIVE + HOVER
   Tooltip tetap muncul normal
   ========================================================= */

.erp-menu .menu-btn.active:hover::after{

  opacity:1 !important;
  visibility:visible !important;

  transform:
    translateY(-50%)
    translateX(0) !important;
}

.erp-menu .menu-btn.active:hover::before{

  opacity:1 !important;
  visibility:visible !important;
}


/* =========================================================
   MOBILE
   Tooltip tetap aktif
   ========================================================= */

@media(max-width:600px){

  .erp-menu .menu-btn::after{
    display:block !important;
  }

  .erp-menu .menu-btn::before{
    display:block !important;
  }

}

// ================= UPDATE STATUS =================
async function updateStatus(row,status){

  const card =
  document.querySelector(
    `[data-row='${row}']`
  );

  if(card){

    card.querySelectorAll(".btn")
    .forEach(b=>{

      b.classList.remove(
        "active-red",
        "active-yellow",
        "active-green"
      );

    });

    if(status==="pending"){

      card.querySelectorAll(".btn")[0]
      .classList.add("active-red");

    }

    if(status==="proses"){

      card.querySelectorAll(".btn")[1]
      .classList.add("active-yellow");

    }

    if(status==="ready"){

      card.querySelectorAll(".btn")[2]
      .classList.add("active-green");

    }

    let txt =
    card.querySelector(".status-text");

    if(txt){

      txt.className =
      "status-text " + status;

      if(status==="pending"){
  txt.innerHTML='<i class="fa-solid fa-circle-exclamation"></i> PENDING';
}

else if(status==="proses"){
  txt.innerHTML='<i class="fa-solid fa-spinner status-icon-spin"></i> PROSES';
}

else if(status==="ready"){
  txt.innerHTML='<i class="fa-solid fa-circle-check"></i> READY';
}
      
      const invoiceCard =
card.closest(".invoice-group");

  let ready =
invoiceCard.querySelectorAll(
'.status-text.ready'
).length;

let proses =
invoiceCard.querySelectorAll(
'.status-text.proses'
).length;

invoiceCard.querySelectorAll(
'.status-text.pending'
).length;

".invoice-summary"
).innerHTML = `

    ${proses}
  </span>

<div class="summary-box">
  <i class="fa-solid fa-circle-exclamation"></i>
  PENDING
  <span class="summary-pending">
    ${pending}
  </span>
</div>

`;

  }

}

// ==========================
// UPDATE STATUS FIRESTORE

await db.collection("pesanan")
.doc(row)
.update({

});

// Ambil data terbaru

// HAPUS TIMER
// ==========================
if (status === "pending") {

    if (timerSnap.exists) {

        console.log("🗑 Timer dihapus :", item.invoice);

    }

}

// ==========================
// JIKA STATUS = PROSES
// BUAT TIMER
// ==========================
else if (status === "proses") {

    const timerSnap = await timerRef.get();

    if (!timerSnap.exists) {

        await timerRef.set({

            faktur: item.invoice,

            nama: item.nama,

            created_at:

            hari_kadaluwarsa: 7,

        });

        console.log("✅ Timer dibuat :", item.invoice);

    }

}

// ==========================

await db
.collection("invoice")
.doc(item.invoice)
.update({

});

}



async function cekPengaturWaktuDelete(){

    const now = new Date();

    const snap = await db
    .collection("pengatur_waktu_delete")
    .where("status","==","running")
    .get();

    for(const doc of snap.docs){

        const data = doc.data();

        if(!data.created_at) continue;

        const mulai = data.created_at.toDate();

        const expired = new Date(mulai);

        expired.setDate(
            expired.getDate() + (data.hari_kadaluwarsa || 7)
        );

        if(now >= expired){

            console.log(
                "Timer habis:",
                data.faktur
            );

            // nanti STEP 3 isi di sini
            const invoiceId = data.faktur;
            
            
            // ===========================
        // CEK DULU INVOICE
        // ===========================
        const invoiceRef = db.collection("invoice").doc(invoiceId);
        const invoiceSnap = await invoiceRef.get();

        if (!invoiceSnap.exists) {

            await doc.ref.update({
                status: "not_found"
            });

            continue;
        }

        const invoiceData = invoiceSnap.data();

        if (invoiceData.request_delete === true) {

            await doc.ref.update({
                status: "finished",
                finished_at: firebase.firestore.FieldValue.serverTimestamp()
            });

            continue;
        }
            
            

// ===========================
// UPDATE INVOICE
// ===========================
await db
.collection("invoice")
.doc(invoiceId)
.set({

    request_delete: true,

    request_delete_at:
    firebase.firestore.FieldValue.serverTimestamp(),

    request_delete_by: "SYSTEM AUTO"

},{
    merge:true
});

// ===========================
// UPDATE SEMUA ITEM PESANAN
// ===========================
const pesananSnap = await db
.collection("pesanan")
.where("invoice","==",invoiceId)
.get();

const batch = db.batch();

pesananSnap.forEach(itemDoc=>{

    batch.update(itemDoc.ref,{

        request_delete:true,

        request_delete_invoice:true,

        request_delete_at:
        firebase.firestore.FieldValue.serverTimestamp(),

        request_delete_by:"SYSTEM AUTO"

    });

});

await batch.commit();

// ===========================
// TIMER SELESAI
// ===========================
await doc.ref.update({

    status:"finished",

    finished_at:
    firebase.firestore.FieldValue.serverTimestamp()

});

console.log(
    "✅ AUTO DELETE REQUEST:",
    invoiceId
);

        }

    }

}

// ================= LOAD DATA =================
function loadData(){

  const currentVIP =
  document.getElementById("filterVIP").value;

  const currentStatus =
  document.getElementById("filterStatus").value;

  const currentSearch =
  document.getElementById("search").value;

  const bulanFilter =
  document.getElementById("filterBulan").value;

  if(unsubscribePesanan){

  unsubscribePesanan();

}

unsubscribePesanan = db
.collection("pesanan")
.orderBy("waktu","desc")
.onSnapshot(snapshot => {

    clearTimeout(renderTimer);

    renderTimer = setTimeout(() => {

        allData = [];

        snapshot.forEach(doc => {

            let item = doc.data();

            const existingCard =
            document.querySelector(
            `[data-row='${doc.id}']`
            );

            if(existingCard){

                const statusText =
                existingCard.querySelector(".status-text");

                if(statusText){

                    statusText.className =
                    "status-text " + item.status;

                    statusText.innerText =

                    item.status === "ready"

                    ? "🟢 READY"

                    :

                    item.status === "proses"

                    ? "🟡 PROSES"

                    :

                    "🔴 PENDING";

                }

            }

            if(!item.waktu) return;

            if(bulanFilter){

                const bulanData =
                item.waktu
                .toDate()
                .getMonth()+1;

                if(parseInt(bulanFilter)!==bulanData){

                    return;

                }

            }

            allData.push({

                ...item,

                rowIndex:doc.id

            });

        });

        let vipSet =
        new Set(
            allData.map(x=>x.nama)
        );

        let vipSelect =
        document.getElementById("filterVIP");

        vipSelect.innerHTML =
        `<option value="all">
        Semua VIP
        </option>`;

        vipSet.forEach(v=>{

            vipSelect.innerHTML +=
            `<option value="${v}">
            ${v}
            </option>`;

        });

        vipSelect.value =
        currentVIPFilter;

        document.getElementById(
        "filterStatus"
        ).value =
        currentStatusFilter;

        document.getElementById(
        "search"
        ).value =
        currentSearchKeyword;

        render();

        firstLoad = false;

    },100);

});

}

// BULK UPDATE
async function bulkUpdate(status){

  let selected =
  getSelected();

  if(selected.length === 0){

    alert(
      "Pilih produk dulu bro 😏"
    );

    return;

  }

  let kosong =
  status === "kosong";

  let namaProduk = [];

  for(const id of selected){

    const ref =
    db.collection("stok")
    .doc(id);

    const snap =
    await ref.get();

    const data =
    snap.data();

    namaProduk.push(
      data.nama
    );

    await ref.update({

      kosong: kosong

    });

  }

  // 🔥 NOTIF WA
  fetch(

    URL +
    "?mode=notifStokBulk" +
    "&status=" +
    status +
    "&produk=" +
    encodeURIComponent(
      JSON.stringify(
        namaProduk
      )
    )

  );

  alert(
    "Bulk update berhasil 😎🔥"
  );

}

async function cancelDelete(id){

  .collection("pesanan")
  .doc(id)
  .get();

  const data = doc.data();

  if(!data.invoice) return;

  const snap = await db
  .collection("pesanan")
  .where("invoice","==",data.invoice)
  .get();

  let batch = db.batch();

  snap.forEach(d => {

    batch.update(d.ref,{

      request_delete:false,
      request_delete_invoice:false

    });

  });

  await batch.commit();

  // 🔥 HILANGKAN UI LANGSUNG TANPA RENDER
  document.querySelectorAll(
    ".invoice-delete-alert"
  ).forEach(el=>{

    el.remove();

  });

  document.querySelectorAll(

).forEach(card=>{

  const redNotif =
  [...card.querySelectorAll("div")]
  .find(el =>

    el.innerText.includes(
      "VIP REQUEST DELETE"
    )

  );

  if(redNotif){

    redNotif.remove();

  }

  const rejectBtn =
  card.querySelector(
    "button[onclick*='cancelDelete']"
  );

  if(rejectBtn){

    rejectBtn.remove();

  }

});

}

      ${tab}
    </div>
  `;

});

  if(pageId==='page-vip'){
    renderVIPControl();
  }
  
}

showPage(
  'page-dashboard',
  document.querySelector('.menu-btn')
);

function handleTopTab(pageId, tab, el){

  document
  .querySelectorAll('#top-tabs .erp-tab')
  .forEach(t=>t.classList.remove('active'));

  el.classList.add('active');

  // ORDER
  if(pageId === 'page-order'){

    if(tab === 'Semua Order'){
      currentStatusFilter = 'all';
    }

    else if(tab === 'Pending'){
      currentStatusFilter = 'pending';
    }

    else if(tab === 'Proses'){
      currentStatusFilter = 'proses';
    }

    else if(tab === 'Ready'){
      currentStatusFilter = 'ready';
    }

    document.getElementById(
      'filterStatus'
    ).value = currentStatusFilter;

    render();
  }

  // STOK
  if(pageId === 'page-stok'){

    if(tab === 'Produk'){

      document
      .querySelectorAll('.stok-item')
      .forEach(item=>{
        item.style.display='block';
      });

    }

    else if(tab === 'Stok Tersedia'){

      document
      .querySelectorAll('.stok-item')
      .forEach(item=>{

        item.style.display =
        item.dataset.status === 'tersedia'
        ? 'block'
        : 'none';

      });

    }

    else if(tab === 'Stok Kosong'){

      document
      .querySelectorAll('.stok-item')
      .forEach(item=>{

        item.style.display =
        item.dataset.status === 'kosong'
        ? 'block'
        : 'none';

      });

    }

  }

}

    confirmButtonText: "Ya, Logout",

      title:"admin-swal-title",
      htmlContainer:"admin-swal-text",
      confirmButton:"admin-swal-confirm",
      cancelButton:"admin-swal-cancel"
    }

  });

  if(!result.isConfirmed) return;


  /* Loading */

  Swal.fire({

    title:"Logging out...",

    text:"Mohon tunggu sebentar.",

    allowOutsideClick:false,

    allowEscapeKey:false,

    showConfirmButton:false,

    didOpen:()=>{

      Swal.showLoading();

    }

  });


  try{

    /*
      Jika Firebase Auth tersedia,

    */

    if(
      typeof firebase !== "undefined" &&
      firebase.auth
    ){

      await firebase.auth().signOut();

    }


    /*
      Redirect setelah logout
    */

    window.location.href = "/login.html";


  }catch(error){

    console.error(
      "Logout error:",
      error
    );

    Swal.fire({

      icon:"error",

      title:"Logout Gagal",

      text:
        "Sesi gagal diakhiri. Silakan coba lagi.",

      confirmButtonText:"OK",

      confirmButtonColor:"#8CC63F"

    });

  }

		}
