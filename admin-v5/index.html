<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin-V5 Dashboard</title>
<link rel="stylesheet" href="/admin-v5/style.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



<style>



/* =========================================================
   IMAM SALES ADMIN — FINAL VISUAL POLISH
   UI ONLY — NO JS / FUNCTION / DATA MODIFICATION
   ========================================================= */

:root{
  --admin-bg:#f4f7fb;
  --admin-surface:#ffffff;
  --admin-surface-soft:#f8fafc;
  --admin-border:#e2e8f0;
  --admin-border-dark:#cbd5e1;

  --admin-text:#172033;
  --admin-text-soft:#64748b;
  --admin-text-muted:#94a3b8;

  --admin-blue:#153d7a;
  --admin-blue-dark:#0b2d61;
  --admin-blue-soft:#eff6ff;

  --admin-pink:#e54770;
  --admin-pink-dark:#d63861;

  --admin-lime:#8CC63F;
  --admin-lime-light:#a6e34b;
  --admin-lime-soft:rgba(140,198,63,.12);

  --admin-red:#ef4444;
  --admin-yellow:#f59e0b;
  --admin-green:#16a34a;

  --admin-radius:10px;
  --admin-radius-sm:7px;

  --admin-shadow:
    0 4px 18px rgba(15,23,42,.06);

  --admin-shadow-hover:
    0 10px 28px rgba(15,23,42,.10);
}


/* =========================================================
   BASE
   ========================================================= */

html{
  background:var(--admin-bg);
}

body{
  margin:0;
  background:var(--admin-bg);
  color:var(--admin-text);
  font-family:
    "Segoe UI",
    Inter,
    Roboto,
    Arial,
    sans-serif;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

*,
*::before,
*::after{
  box-sizing:border-box;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.erp-layout{
  display:flex;
  min-height:100vh;
  width:100%;
  background:var(--admin-bg);
}

.erp-main{
  flex:1;
  min-width:0;
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  background:
    linear-gradient(
      180deg,
      #f8fafc 0,
      var(--admin-bg) 260px
    );
  padding-bottom:78px;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.erp-sidebar{
  width:58px;
  min-width:58px;
  min-height:100vh;

  position:relative;
  z-index:1000;

  display:flex;
  flex-direction:column;
  align-items:center;

  background:
    linear-gradient(
      180deg,
      var(--admin-blue) 0%,
      var(--admin-blue-dark) 100%
    );

  border-right:1px solid rgba(255,255,255,.08);

  box-shadow:
    4px 0 18px rgba(11,45,97,.10);

  overflow:visible;
}

.erp-logo{
  width:100%;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:19px;

  border-bottom:
    1px solid rgba(255,255,255,.10);
}

.erp-logo i{
  transition:
    transform .25s ease,
    color .25s ease;
}

.erp-logo:hover i{
  color:var(--admin-lime-light);
  transform:rotate(25deg);
}

.erp-menu{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  padding:12px 6px;
}

.erp-menu .menu-btn,
.erp-sidebar-bottom .menu-btn{
  position:relative;

  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid transparent;
  border-radius:9px;

  background:transparent;
  color:#fff;

  cursor:pointer;

  transition:
    background .2s ease,
    border-color .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.erp-menu .menu-btn i,
.erp-sidebar-bottom .menu-btn i{
  font-size:17px;
  color:#fff;
  transition:
    transform .2s ease,
    color .2s ease;
}

.erp-menu .menu-btn:hover{
  background:rgba(255,255,255,.10);
  border-color:rgba(255,255,255,.10);
}

.erp-menu .menu-btn:hover i{
  transform:scale(1.08);
}

.erp-menu .menu-btn.active{
  background:
    linear-gradient(
      135deg,
      var(--admin-pink),
      var(--admin-pink-dark)
    );

  border-color:rgba(255,255,255,.12);

  box-shadow:
    0 5px 14px rgba(229,71,112,.25);
}

.erp-menu .menu-btn.active::after{
  content:"";

  position:absolute;
  left:-7px;
  top:9px;

  width:3px;
  height:28px;

  border-radius:0 4px 4px 0;

  background:var(--admin-lime-light);
}

.erp-sidebar-bottom{
  margin-top:auto;
  width:100%;
  padding:10px 6px 14px;
}

.logout-btn:hover{
  background:rgba(239,68,68,.16)!important;
  border-color:rgba(239,68,68,.25)!important;
}

.logout-btn:hover i{
  color:#fff!important;
}


/* =========================================================
   SIDEBAR TOOLTIP
   ========================================================= */

.erp-menu .menu-btn::after{
  content:attr(title);

  position:absolute;
  left:calc(100% + 12px);
  top:50%;

  transform:
    translateY(-50%)
    translateX(-5px);

  padding:7px 10px;

  background:#fff;
  color:#334155;

  border:1px solid var(--admin-border);

  border-radius:7px;

  font-size:12px;
  font-weight:600;

  line-height:1;
  white-space:nowrap;

  box-shadow:
    0 8px 22px rgba(15,23,42,.14);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  z-index:99999;

  transition:
    opacity .18s ease,
    transform .18s ease,
    visibility .18s ease;
}

.erp-menu .menu-btn:hover::after{
  opacity:1;
  visibility:visible;

  transform:
    translateY(-50%)
    translateX(0);
}


/* =========================================================
   TOP TABS
   ========================================================= */

.erp-tabs{
  height:42px;

  display:flex;
  align-items:stretch;

  overflow-x:auto;
  overflow-y:hidden;

  white-space:nowrap;

  background:#fff;

  border-bottom:1px solid var(--admin-border);

  box-shadow:
    0 1px 4px rgba(15,23,42,.03);

  scrollbar-width:none;
}

.erp-tabs::-webkit-scrollbar{
  display:none;
}

.erp-tab{
  position:relative;

  display:flex;
  align-items:center;

  padding:0 17px;

  color:#64748b;
  background:transparent;

  border-right:1px solid #edf0f4;

  font-size:12px;
  font-weight:600;

  cursor:pointer;

  transition:
    color .2s ease,
    background .2s ease;
}

.erp-tab:hover{
  color:var(--admin-pink);
  background:#fff8fa;
}

.erp-tab.active{
  color:#fff;
  background:var(--admin-pink);
}

.erp-tab.active::after{
  content:"";

  position:absolute;
  left:14px;
  right:14px;
  bottom:0;

  height:3px;

  border-radius:3px 3px 0 0;

  background:var(--admin-lime-light);
}


/* =========================================================
   PAGE HEADER
   ========================================================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;

  min-height:76px;

  padding:16px 22px;

  background:transparent;

  border-bottom:1px solid rgba(226,232,240,.7);
}

.header h1{
  margin:0;

  color:var(--admin-text);

  font-size:20px;
  font-weight:700;
  letter-spacing:-.3px;

  display:flex;
  align-items:center;
  gap:8px;
}

.header h1 i{
  color:var(--admin-lime);

  filter:
    drop-shadow(
      0 3px 7px
      rgba(140,198,63,.25)
    );
}

#live-clock{
  white-space:pre-line;

  color:var(--admin-text-soft);

  font-size:11px;
  font-weight:500;

  line-height:1.45;

  text-align:right;
}


/* =========================================================
   PAGE / CARD
   ========================================================= */

.page-section{
  display:none;

  padding:
    16px 18px 20px;
}

.page-section.active{
  display:block;
}

.card{
  background:var(--admin-surface);

  border:
    1px solid var(--admin-border);

  border-radius:var(--admin-radius);

  box-shadow:var(--admin-shadow);

  overflow:hidden;
}

.card > h3{
  margin:0;

  padding:15px 17px;

  color:var(--admin-text);

  font-size:14px;
  font-weight:700;

  border-bottom:1px solid var(--admin-border);

  background:
    linear-gradient(
      180deg,
      #fff,
      #fbfcfe
    );
}

.card > h3 i{
  color:var(--admin-lime);
  margin-right:7px;

  filter:
    drop-shadow(
      0 3px 5px
      rgba(140,198,63,.20)
    );
}


/* =========================================================
   DASHBOARD — ACTIVE USERS
   ========================================================= */

#vip-active-list{
  background:#0f172a;
}

#vip-active-title{
  display:flex;
  align-items:center;
  gap:2px;
}

#vip-active-list > div{
  min-height:62px;

  padding:10px 14px!important;

  background:
    linear-gradient(
      90deg,
      #0f172a,
      #111c30
    )!important;

  border-bottom:
    1px solid rgba(255,255,255,.055)!important;

  transition:
    background .2s ease;
}

#vip-active-list > div:hover{
  background:#162238!important;
}

.vip-active-name{
  color:#fff!important;
  font-size:13px!important;
  font-weight:700!important;
}


/* =========================================================
   INPUTS / SELECTS
   ========================================================= */

input[type="text"],
select,
textarea{
  border:1px solid var(--admin-border-dark);

  border-radius:7px;

  background:#fff;

  color:var(--admin-text);

  outline:none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input[type="text"]:focus,
select:focus,
textarea:focus{
  border-color:
    rgba(140,198,63,.85);

  box-shadow:
    0 0 0 3px
    rgba(140,198,63,.12);

  background:#fff;
}

input::placeholder,
textarea::placeholder{
  color:#a0aec0;
}


/* =========================================================
   STOCK
   ========================================================= */

.stok-card{
  overflow:hidden;
}

.stok-card > input[type="text"]{
  width:100%;
  height:38px;

  margin:16px 16px 0;
  width:calc(100% - 32px);

  padding:0 12px;

  font-size:12px;
}

.stok-card > label{
  display:flex;
  align-items:center;
  gap:7px;

  margin:
    12px 16px;

  color:var(--admin-text-soft);

  font-size:12px;
  font-weight:600;
}

#stok-list{
  padding:0 16px 8px;
}

.stok-item > div{
  min-height:48px!important;

  padding:7px 4px!important;

  border-bottom:
    1px solid #edf1f5!important;
}

.stok-item:hover > div{
  background:#fafcff;
}

.stok-item span{
  font-size:12px!important;
  font-weight:600;
}

.stok-footer{
  display:flex;
  gap:10px;

  padding:14px 16px;

  border-top:1px solid var(--admin-border);

  background:#f8fafc;
}

.stok-footer button{
  min-height:38px;

  padding:0 14px;

  border:1px solid transparent;
  border-radius:7px;

  font-size:11px;
  font-weight:700;

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.stok-footer button:first-child{
  background:var(--admin-lime);
  color:#fff;

  box-shadow:
    0 4px 10px rgba(140,198,63,.20);
}

.stok-footer button:last-child{
  background:#fee2e2;
  color:#b91c1c;

  border-color:#fecaca;
}

.stok-footer button:hover{
  transform:translateY(-1px);
  filter:brightness(.98);
}


/* =========================================================
   STOCK TOGGLE
   ========================================================= */

.toggle{
  width:40px!important;
  height:22px!important;

  border-radius:20px!important;

  background:#cbd5e1!important;

  transition:
    background .2s ease;
}

.toggle.active{
  background:var(--admin-lime)!important;
}

.toggle .circle{
  width:16px!important;
  height:16px!important;

  margin:3px!important;

  background:#fff;

  border-radius:50%;

  box-shadow:
    0 2px 5px rgba(0,0,0,.18);

  transition:
    transform .2s ease;
}

.toggle .circle.on{
  transform:translateX(18px);
}


/* =========================================================
   ORDER CONTROL
   ========================================================= */

.control{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;

  margin-bottom:12px;

  padding:10px;

  background:#fff;

  border:
    1px solid var(--admin-border);

  border-radius:9px;

  box-shadow:
    0 2px 10px rgba(15,23,42,.04);
}

.control select,
.control input{
  height:36px;

  padding:0 10px;

  font-size:11px;
}

.control select{
  min-width:115px;
}

.control #search{
  flex:1;
  min-width:160px;
}

.control button{
  height:36px;

  padding:0 14px;

  border:none;
  border-radius:7px;

  background:var(--admin-blue);

  color:#fff;

  font-size:11px;
  font-weight:700;

  cursor:pointer;

  transition:
    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.control button:hover{
  background:#194a91;

  transform:translateY(-1px);

  box-shadow:
    0 5px 12px rgba(21,61,122,.18);
}


/* =========================================================
   ORDER CARD
   ========================================================= */

.order-card{
  overflow:visible;
}

#data{
  padding:12px;
  padding-bottom:30px;
}


/* =========================================================
   INVOICE
   ========================================================= */

.invoice-group{
  margin-bottom:10px;

  overflow:hidden;

  background:#fff;

  border:
    1px solid var(--admin-border);

  border-radius:9px;

  box-shadow:
    0 2px 9px rgba(15,23,42,.045);

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.invoice-group:hover{
  border-color:#d7dee8;

  box-shadow:
    0 5px 16px rgba(15,23,42,.07);
}

.invoice-header{
  min-height:64px;

  padding:11px 13px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #f8fafc
    );

  border-bottom:1px solid var(--admin-border);
}

.invoice-header-left{
  min-width:0;

  display:flex;
  flex-direction:column;
  gap:5px;
}

.invoice-title{
  display:flex;
  align-items:center;

  color:var(--admin-text);

  font-size:12px;
  font-weight:800;

  word-break:break-word;
}

.invoice-title i{
  flex:none;
  color:var(--admin-lime);
  margin-right:6px;
}

.invoice-info{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.invoice-info .vip-name{
  color:#475569;
  font-size:11px;
  font-weight:700;
}

.invoice-info .vip-date{
  color:#94a3b8;
  font-size:10px;
}

.collapse-btn{
  flex:none;

  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:
    1px solid var(--admin-border-dark);

  border-radius:7px;

  background:#fff;
  color:#64748b;

  cursor:pointer;

  transition:
    color .2s ease,
    background .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.collapse-btn:hover{
  color:#fff;
  background:var(--admin-blue);
  border-color:var(--admin-blue);
  transform:translateY(-1px);
}


/* =========================================================
   INVOICE SUMMARY
   ========================================================= */

.invoice-summary{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  margin:0;

  padding:10px 12px;

  background:#fbfcfe;

  border-bottom:1px solid #edf1f5;
}

.summary-box{
  min-height:29px;

  display:inline-flex;
  align-items:center;
  gap:4px;

  padding:4px 8px;

  background:#fff;

  border:1px solid var(--admin-border);

  border-radius:6px;

  color:#64748b;

  font-size:10px;
  font-weight:700;
}

.summary-box i{
  font-size:11px!important;
  color:var(--admin-lime)!important;
  margin-right:1px!important;
}

.invoice-summary .summary-ready,
.invoice-summary .summary-proses,
.invoice-summary .summary-pending{
  color:var(--admin-text)!important;
  font-weight:800;
}


/* =========================================================
   INVOICE ITEMS
   ========================================================= */

.invoice-content{
  margin:0!important;
  background:#fff;
}

.invoice-item{
  position:relative;

  padding:12px!important;
  margin:0!important;

  background:#fff!important;

  border-bottom:
    1px solid #edf1f5!important;

  border-radius:0!important;
}

.invoice-item:last-child{
  border-bottom:none!important;
}

.invoice-item:hover{
  background:#fbfdff!important;
}

.invoice-order{
  display:flex;
  align-items:flex-start;
  gap:5px;

  color:#334155!important;

  font-size:12px!important;
  font-weight:650!important;

  line-height:1.5!important;

  word-break:break-word;
}

.invoice-order i{
  flex:none;
  color:var(--admin-lime)!important;
  margin-top:3px!important;
  margin-right:1px!important;
}

.status-text{
  display:inline-flex;
  align-items:center;
  gap:5px;

  margin-top:7px;

  font-size:10px!important;
  font-weight:800!important;
  letter-spacing:.25px;
}

.status-text i{
  font-size:10px;
}

.status-text.pending{
  color:var(--admin-red)!important;
}

.status-text.proses{
  color:var(--admin-yellow)!important;
}

.status-text.ready{
  color:var(--admin-green)!important;
}


/* =========================================================
   STATUS ACTION
   ========================================================= */

.action-wrapper{
  display:flex!important;
  align-items:flex-end!important;
  justify-content:space-between!important;
  gap:15px!important;

  margin-top:10px;
}

.status-btn{
  display:flex!important;
  gap:6px!important;
}

.status-btn .btn{
  width:31px!important;
  height:31px!important;

  display:flex!important;
  align-items:center!important;
  justify-content:center!important;

  padding:0!important;

  border:
    1px solid var(--admin-border-dark)!important;

  border-radius:7px!important;

  background:#f8fafc!important;

  color:#94a3b8!important;

  opacity:1!important;

  cursor:pointer;

  transition:
    transform .18s ease,
    color .18s ease,
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.status-btn .btn:hover{
  transform:translateY(-1px)!important;

  background:#fff!important;

  box-shadow:
    0 4px 10px rgba(15,23,42,.10);
}

.status-btn .btn i{
  font-size:11px!important;
}

.status-btn .btn.active-red{
  background:#fee2e2!important;
  border-color:#fecaca!important;
  color:var(--admin-red)!important;
}

.status-btn .btn.active-yellow{
  background:#fef3c7!important;
  border-color:#fde68a!important;
  color:#d97706!important;
}

.status-btn .btn.active-green{
  background:#ecfdf5!important;
  border-color:#bbf7d0!important;
  color:var(--admin-green)!important;
}


/* =========================================================
   DELETE ACTION
   ========================================================= */

.delete-side{
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  gap:4px!important;
}

.delete-label{
  color:#94a3b8!important;

  font-size:9px!important;
  font-weight:800!important;

  letter-spacing:.7px;
}

.delete-btn-admin{
  width:31px!important;
  height:31px!important;

  display:flex!important;
  align-items:center!important;
  justify-content:center!important;

  padding:0!important;

  border:
    1px solid #fecaca!important;

  border-radius:7px!important;

  background:#fff!important;

  color:var(--admin-red)!important;

  cursor:pointer;

  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.delete-btn-admin i{
  color:var(--admin-red)!important;
}

.delete-btn-admin:hover{
  background:var(--admin-red)!important;
  border-color:var(--admin-red)!important;
  color:#fff!important;

  transform:translateY(-1px);
}

.delete-btn-admin:hover i{
  color:#fff!important;
}


/* =========================================================
   DELETE REQUEST ALERT
   ========================================================= */

.invoice-delete-alert{
  margin:10px 12px;

  padding:12px;

  background:
    linear-gradient(
      135deg,
      #fff1f2,
      #fff7f7
    )!important;

  border:
    1px solid #fecdd3!important;

  border-left:
    4px solid var(--admin-red)!important;

  border-radius:8px!important;

  color:#991b1b!important;

  font-size:11px!important;
  font-weight:800!important;

  line-height:1.5!important;
}

.invoice-delete-alert > i{
  color:var(--admin-red)!important;
}

.invoice-delete-alert .btn{
  min-height:31px;

  padding:0 11px;

  border:none;
  border-radius:6px;

  font-size:10px;
  font-weight:800;

  cursor:pointer;

/* =========================================================
   SIDEBAR TOOLTIP — FINAL FIX
   IMPORTANT:
   ::after = TEXT TOOLTIP
   ::before = ARROW
   ACTIVE STATE = NO PSEUDO ELEMENT
   ========================================================= */


/* SIDEBAR */

.erp-sidebar{
  position:relative !important;
  z-index:10000 !important;
  overflow:visible !important;
}

.erp-menu{
  position:relative !important;
  overflow:visible !important;
}

.erp-menu .menu-btn{
  position:relative !important;
  overflow:visible !important;
  isolation:auto !important;
}


/* =========================================================
   REMOVE OLD ACTIVE ::AFTER CONFLICT
   ========================================================= */

.erp-menu .menu-btn.active::after{
  content:attr(title) !important;
}


/* =========================================================
   TOOLTIP TEXT
   ========================================================= */

.erp-menu .menu-btn::after{

  content:attr(title) !important;

  position:absolute !important;

  left:calc(100% + 10px) !important;
  top:50% !important;

  width:max-content !important;
  min-width:max-content !important;

  transform:
    translateY(-50%)
    translateX(-6px) !important;

  padding:8px 12px !important;

  background:#fff8d8 !important;
  color:#3f3a20 !important;

  border:1px solid #e4d88f !important;
  border-radius:7px !important;

  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif !important;

  font-size:12px !important;
  font-weight:600 !important;

  line-height:1.2 !important;

  white-space:nowrap !important;

  box-shadow:
    0 5px 16px
    rgba(0,0,0,.18) !important;

  opacity:0 !important;
  visibility:hidden !important;

  pointer-events:none !important;

  z-index:999999 !important;

  transition:
    opacity .18s ease,
    transform .18s ease,
    visibility .18s ease !important;
}


/* =========================================================
   TOOLTIP ARROW
   ========================================================= */

.erp-menu .menu-btn::before{

  content:"" !important;

  position:absolute !important;

  left:calc(100% + 4px) !important;
  top:50% !important;

  width:0 !important;
  height:0 !important;

  transform:
    translateY(-50%) !important;

  border-top:
    6px solid transparent !important;

  border-bottom:
    6px solid transparent !important;

  border-right:
    6px solid #e4d88f !important;

  opacity:0 !important;
  visibility:hidden !important;

  pointer-events:none !important;

  z-index:999999 !important;

  transition:
    opacity .18s ease,
    visibility .18s ease !important;
}


/* =========================================================
   HOVER — SHOW TITLE
   ========================================================= */

.erp-menu .menu-btn:hover::after{

  opacity:1 !important;
  visibility:visible !important;

  transform:
    translateY(-50%)
    translateX(0) !important;
}

.erp-menu .menu-btn:hover::before{

  opacity:1 !important;
  visibility:visible !important;
}


/* =========================================================
   ACTIVE BUTTON
   Tidak lagi memakai ::after
   supaya tooltip tetap aman.
   ========================================================= */

.erp-menu .menu-btn.active{

  background:
    linear-gradient(
      135deg,
      #e54770,
      #d93661
    ) !important;

  border-radius:9px !important;

  box-shadow:
    0 5px 14px
    rgba(229,71,112,.28) !important;
}


/* =========================================================
   ACTIVE + HOVER
   Tooltip tetap muncul normal
   ========================================================= */

.erp-menu .menu-btn.active:hover::after{

  opacity:1 !important;
  visibility:visible !important;

  transform:
    translateY(-50%)
    translateX(0) !important;
}

.erp-menu .menu-btn.active:hover::before{

  opacity:1 !important;
  visibility:visible !important;
}


/* =========================================================
   MOBILE
   Tooltip tetap aktif
   ========================================================= */

@media(max-width:600px){

  .erp-menu .menu-btn::after{
    display:block !important;
  }

  .erp-menu .menu-btn::before{
    display:block !important;
  }

}

else if(status==="proses"){

async function cekPengaturWaktuDelete(){

    const now = new Date();

    const snap = await db
    .collection("pengatur_waktu_delete")
    .where("status","==","running")
    .get();

    for(const doc of snap.docs){

        const data = doc.data();

        if(!data.created_at) continue;

        const mulai = data.created_at.toDate();

        const expired = new Date(mulai);

        expired.setDate(
            expired.getDate() + (data.hari_kadaluwarsa || 7)
        );

        if(now >= expired){

            console.log(
                "Timer habis:",
                data.faktur
            );

            // nanti STEP 3 isi di sini
            const invoiceId = data.faktur;
            
            
            // ===========================
        // CEK DULU INVOICE
        // ===========================
        const invoiceRef = db.collection("invoice").doc(invoiceId);
        const invoiceSnap = await invoiceRef.get();

        if (!invoiceSnap.exists) {

            await doc.ref.update({
                status: "not_found"
            });

            continue;
        }

        const invoiceData = invoiceSnap.data();

        if (invoiceData.request_delete === true) {

            await doc.ref.update({
                status: "finished",
                finished_at: firebase.firestore.FieldValue.serverTimestamp()
            });

            continue;
        }
            
            

// ===========================
// UPDATE INVOICE
// ===========================
await db
.collection("invoice")
.doc(invoiceId)
.set({

    request_delete: true,

    request_delete_at:
    firebase.firestore.FieldValue.serverTimestamp(),

    request_delete_by: "SYSTEM AUTO"

},{
    merge:true
});

// ===========================
// UPDATE SEMUA ITEM PESANAN
// ===========================
const pesananSnap = await db
.collection("pesanan")
.where("invoice","==",invoiceId)
.get();

const batch = db.batch();

pesananSnap.forEach(itemDoc=>{

    batch.update(itemDoc.ref,{

        request_delete:true,

        request_delete_invoice:true,

        request_delete_at:
        firebase.firestore.FieldValue.serverTimestamp(),

        request_delete_by:"SYSTEM AUTO"

    });

});

await batch.commit();

// ===========================
// TIMER SELESAI
// ===========================
await doc.ref.update({

    status:"finished",

    finished_at:
    firebase.firestore.FieldValue.serverTimestamp()

});

console.log(
    "✅ AUTO DELETE REQUEST:",
    invoiceId
);

        }

    }

}

// BULK UPDATE
async function bulkUpdate(status){

  let selected =
  getSelected();

  if(selected.length === 0){

    alert(
      "Pilih produk dulu bro 😏"
    );

    return;

  }

  let kosong =
  status === "kosong";

  let namaProduk = [];

  for(const id of selected){

    const ref =
    db.collection("stok")
    .doc(id);

    const snap =
    await ref.get();

    const data =
    snap.data();

    namaProduk.push(
      data.nama
    );

    await ref.update({

      kosong: kosong

    });

  }

  // 🔥 NOTIF WA
  fetch(

    URL +
    "?mode=notifStokBulk" +
    "&status=" +
    status +
    "&produk=" +
    encodeURIComponent(
      JSON.stringify(
        namaProduk
      )
    )

  );

  alert(
    "Bulk update berhasil 😎🔥"
  );

}

function toggleStok(
  id,
  nama,
  kosong
){

  let newKosong =
  !kosong;

  // 🔥 UPDATE FIREBASE
  db.collection("stok")
  .doc(id)
  .update({

    kosong:newKosong

  });

  // 🔥 STATUS TEXT
  let statusText =
  newKosong
  ? "kosong"
  : "tersedia";

  // 🔥 KIRIM NOTIF WA
  fetch(

    URL +
    "?mode=notifStok" +
    "&produk=" +
    encodeURIComponent(nama) +
    "&status=" +
    statusText

  );

}

async function streamText(
  element,
  text
){

  let current = "";

  for(
    let i = 0;
    i < text.length;
    i++
  ){

    current += text[i];

    element.innerHTML =
    marked.parse(current);

    await new Promise(
      resolve =>
      setTimeout(resolve, 1)
    );

  }

}

function handleTopTab(pageId, tab, el){

  document
  .querySelectorAll('#top-tabs .erp-tab')
  .forEach(t=>t.classList.remove('active'));

  el.classList.add('active');

  // ORDER
  if(pageId === 'page-order'){

    if(tab === 'Semua Order'){
      currentStatusFilter = 'all';
    }

    else if(tab === 'Pending'){
      currentStatusFilter = 'pending';
    }

    else if(tab === 'Proses'){
      currentStatusFilter = 'proses';
    }

    else if(tab === 'Ready'){
      currentStatusFilter = 'ready';
    }

    document.getElementById(
      'filterStatus'
    ).value = currentStatusFilter;

    render();
  }

  // STOK
  if(pageId === 'page-stok'){

    if(tab === 'Produk'){

      document
      .querySelectorAll('.stok-item')
      .forEach(item=>{
        item.style.display='block';
      });

    }

    else if(tab === 'Stok Tersedia'){

      document
      .querySelectorAll('.stok-item')
      .forEach(item=>{

        item.style.display =
        item.dataset.status === 'tersedia'
        ? 'block'
        : 'none';

      });

    }

    else if(tab === 'Stok Kosong'){

      document
      .querySelectorAll('.stok-item')
      .forEach(item=>{

        item.style.display =
        item.dataset.status === 'kosong'
        ? 'block'
        : 'none';

      });

    }

  }

}

/* =========================================================
   TOP RIGHT MENU
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {

  const menuToggle =
    document.getElementById("site-menu-toggle");

  const menuDropdown =
    document.getElementById("site-menu-dropdown");

  if(!menuToggle || !menuDropdown) return;


  menuToggle.addEventListener("click", (event) => {

    event.stopPropagation();

    const isOpen =
      menuDropdown.classList.toggle("is-open");

    menuToggle.classList.toggle(
      "is-open",
      isOpen
    );

    menuToggle.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );

    const icon =
      menuToggle.querySelector("i");

    if(icon){

      icon.classList.toggle(
        "fa-bars",
        !isOpen
      );

      icon.classList.toggle(
        "fa-xmark",
        isOpen
      );

    }

  });


  document.addEventListener("click", (event) => {

    if(
      !menuToggle.contains(event.target) &&
      !menuDropdown.contains(event.target)
    ){

      menuDropdown.classList.remove("is-open");

      menuToggle.classList.remove("is-open");

      menuToggle.setAttribute(
        "aria-expanded",
        "false"
      );

      const icon =
        menuToggle.querySelector("i");

      if(icon){

        icon.classList.remove("fa-xmark");

        icon.classList.add("fa-bars");

      }

    }

  });

});

/* =========================================================
   LOAD CHECKBOX TERPILIH
   ========================================================= */

async function infoProdukLoadSelected(ids){

  const products = [];


  for(const id of ids){

    const snap =
      await db
      .collection("stok")
      .doc(id)
      .get();


    if(!snap.exists)
      continue;


    const data =
      snap.data();


    products.push({

      id:id,

      nama:data.nama || "",

      kosong:!!data.kosong

    });

  }


  if(products.length === 0){

    throw new Error(
      "Produk yang dipilih tidak ditemukan."
    );

  }


  window.infoProdukSelected =
    products;


  infoProdukForm();

}

async function infoProdukOpenPicker(){

  const snap =
    await db

      doc.data();


    if(!data.nama)

    products.push({

      id:doc.id,

      kosong:!!data.kosong

  let selected = [];


  Swal.fire({

      <button

        "

        LANJUT →
      </button>

    `

  });


  const search =
    document.getElementById(
      "info-search"
    );


  const list =
    document.getElementById(
      "info-product-list"
    );


  const count =
    document.getElementById(
      "info-count"
    );


  function render(){

    const keyword =
      search.value
      .toLowerCase()
      .trim();


    const results =
      products.filter(product=>

        product.nama
        .toLowerCase()
        .includes(keyword)

      );


    list.innerHTML = "";


    results.forEach(product=>{

      const checked =
        selected.some(
          p => p.id === product.id
        );


      const row =
        document.createElement("label");


      row.style.cssText = `

        display:flex;
        align-items:center;
        gap:9px;
        padding:11px 12px;
        border-bottom:1px solid #f1f5f9;
        cursor:pointer;
        font-size:11px;

      `;


      row.innerHTML = `

        <input
          type="checkbox"
          ${checked ? "checked" : ""}
        >

        <span
          style="
            flex:1;
            font-weight:600;
            color:#334155;
          "
        >
          ${infoEscape(product.nama)}
        </span>

      `;


      const cb =
        row.querySelector("input");


      cb.addEventListener(
        "change",
        ()=>{

          if(cb.checked){

            if(
              !selected.some(
                p => p.id === product.id
              )
            ){

              selected.push(product);

            }

          }else{

            selected =
              selected.filter(
                p => p.id !== product.id
              );

          }


          count.textContent =
            selected.length;

        }
      );


      list.appendChild(row);

    });

  }


  search.addEventListener(
    "input",
    render
  );


  document
    .getElementById("info-select-all")
    .onclick = ()=>{

      const keyword =
        search.value
        .toLowerCase()
        .trim();


      products
        .filter(p=>
          p.nama
          .toLowerCase()
          .includes(keyword)
        )
        .forEach(product=>{

          if(
            !selected.some(
              p => p.id === product.id
            )
          ){

            selected.push(product);

          }

        });


      count.textContent =
        selected.length;


      render();

    };


  document
    .getElementById("info-next")
    .onclick = ()=>{

      if(selected.length === 0){

        alert(
          "Pilih minimal satu produk dulu bro 😏"
        );

        return;

      }


      window.infoProdukSelected =
        selected;


      Swal.close();


      setTimeout(
        infoProdukForm,
        150
      );

    };


  render();

}

window.formatInfoHarga = function(value){

  const angka = String(value || "")
    .replace(/[^\d]/g, "");

  if(!angka){
    return "";
  }

  return "Rp " + Number(angka).toLocaleString("id-ID");
};

/* =========================================================
   ESCAPE
   ========================================================= */

function infoEscape(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}





function formatInfoRupiah(value){

  const number =
    Number(value || 0);

  return "Rp " +
    number.toLocaleString(
      "id-ID"
    );

}

	/* =========================================================
   SMART CAMPAIGN — LOAD SELECTED
   ========================================================= */

async function smartCampaignLoadSelected(ids){

  const products = [];


  for(const id of ids){

    const snap =
      await db
      .collection("stok")
      .doc(id)
      .get();


    if(!snap.exists)
      continue;


    const data =
      snap.data();


    products.push({

      id:id,

      nama:
        data.nama || "",

      kosong:
        !!data.kosong

    });

  }


  if(products.length === 0){

    throw new Error(
      "Produk yang dipilih tidak ditemukan."
    );

  }


  window.smartCampaignProducts =
    products;


  smartCampaignForm();

}

    `

  });


  const search =
    document.getElementById(
      "smart-search"
    );


  const list =
    document.getElementById(
      "smart-product-list"
    );


  const count =
    document.getElementById(
      "smart-count"
    );


  function render(){

    const keyword =
      search.value
      .toLowerCase()
      .trim();


    const results =
      products.filter(p=>
        p.nama
        .toLowerCase()
        .includes(keyword)
      );


    list.innerHTML = "";


    results.forEach(product=>{

      const checked =
        selected.some(
          p => p.id === product.id
        );


      const row =
        document.createElement("label");


      row.style.cssText = `

        display:flex;
        align-items:center;
        gap:9px;
        padding:11px 12px;
        border-bottom:1px solid #f1f5f9;
        cursor:pointer;
        font-size:11px;

          type="checkbox"

        >

        <span
          style="
            flex:1;
            font-weight:600;
            color:#334155;
          "
        >
          ${infoEscape(product.nama)}
        </span>

      `;


      const cb =
        row.querySelector("input");


      cb.addEventListener(
        "change",
        ()=>{

          if(cb.checked){

            if(
              !selected.some(
                p => p.id === product.id
              )
            ){

              selected.push(product);

            }

          }else{

            selected =
              selected.filter(
                p => p.id !== product.id
              );

          }


          count.textContent =
            selected.length;

        }
      );


      list.appendChild(row);

    });

  }


  search.addEventListener(
    "input",
    render
  );


  document
    .getElementById("smart-select-all")
    .onclick = ()=>{

      const keyword =
        search.value
        .toLowerCase()
        .trim();


      products
        .filter(p=>
          p.nama
          .toLowerCase()
          .includes(keyword)
        )
        .forEach(product=>{

          if(
            !selected.some(
              p => p.id === product.id
            )
          ){

            selected.push(product);

          }

        });


      count.textContent =
        selected.length;


      render();

    };


  document
    .getElementById("smart-next")
    .onclick = ()=>{

      if(selected.length === 0){

        alert(
          "Pilih minimal satu produk dulu bro 😏"
        );

        return;

      }


      window.smartCampaignProducts =
        selected;


      Swal.close();


      setTimeout(
        smartCampaignForm,
        150
      );

    };


  render();

}

          %
        </span>

      </div>


      <label class="info-field-label">
        Periode
      </label>

      <input
        id="smart-periode-${index}"
        class="info-field"
        placeholder="1 - 30 September 2026"
      >

    `;

  }

};






	/* =========================================================
   SMART CAMPAIGN — COLLECT
   ========================================================= */

function smartCampaignCollect(){

  const products =
    window.smartCampaignProducts || [];


  const judul =
    document.getElementById(
      "smart-judul"
    )?.value.trim() || "";


  const deskripsi =
    document.getElementById(
      "smart-deskripsi"
    )?.value.trim() || "";


  const rows =
    products.map((p,index)=>{

      const type =
        document.getElementById(
          `smart-type-${index}`
        )?.value || "";


      return {

        id:p.id,

        nama:
          p.nama ||
          "-",

        jenis:type,

        deskripsi:
          document.getElementById(
            `smart-desc-${index}`
          )?.value.trim() || "",

        harga:
          document.getElementById(
            `smart-harga-${index}`
          )?.value || "",

        hargaNormal:
          document.getElementById(
            `smart-harga-normal-${index}`
          )?.value || "",

        hargaPromo:
          document.getElementById(
            `smart-harga-promo-${index}`
          )?.value || "",

        diskon:
          document.getElementById(
            `smart-diskon-${index}`
          )?.value || "",

        periode:
          document.getElementById(
            `smart-periode-${index}`
          )?.value || ""

      };

    });


  return {

    judul,

    deskripsi,

    products:rows

  };

		}






	/* =========================================================
   SMART CAMPAIGN — MESSAGE BUILDER
   ========================================================= */

function smartCampaignBuildMessage(data){

  const groups = {

    produk_baru:[],

    promo:[],

    diskon:[]

  };


  data.products.forEach(p=>{

    if(groups[p.jenis]){

      groups[p.jenis].push(p);

    }

  });


  const lines = [];


  lines.push(
    "⌁ SMART CAMPAIGN"
  );

  lines.push("");

  lines.push(
    "────────────────────"
  );

  lines.push("");

  lines.push(
    "Halo bosku,"
  );

  lines.push("");

  if(data.judul)
    lines.push(data.judul);

  lines.push("");


  function addGroup(
    type,
    title,
    icon
  ){

    const list =
      groups[type];


    if(!list.length)
      return;


    lines.push(
      `${icon} ${title}`
    );

    lines.push("");


    list.forEach((p,i)=>{

      lines.push(
        `${i+1}. ▸ ${p.nama}`
      );


      if(p.deskripsi){

        lines.push("");

        lines.push(
          p.deskripsi
        );

      }


      if(type === "produk_baru"){

        if(p.harga){

          lines.push("");

          lines.push(
            `Harga : ${p.harga}`
          );

        }

      }


      if(type === "promo"){

        if(p.hargaNormal){

          lines.push("");

          lines.push(
            `Harga Normal : ${p.hargaNormal}`
          );

        }

        if(p.hargaPromo){

          lines.push(
            `Harga Promo  : ${p.hargaPromo}`
          );

        }

      }


      if(type === "diskon"){

        if(p.hargaNormal){

          lines.push("");

          lines.push(
            `Harga Normal : ${p.hargaNormal}`
          );

        }

        if(p.diskon){

          lines.push(
            `Diskon       : ${p.diskon}%`
          );

        }

      }


      if(p.periode){

        lines.push(
          `◷ Periode     : ${p.periode}`
        );

      }


      lines.push("");

    });

  }


  addGroup(
    "produk_baru",
    "PRODUK BARU",
    "🆕"
  );


  addGroup(
    "promo",
    "PROMO",
    "🔥"
  );


  addGroup(
    "diskon",
    "DISKON",
    "🏷️"
  );


  if(data.deskripsi){

    lines.push(
      data.deskripsi
    );

    lines.push("");

  }


  lines.push(
    "────────────────────"
  );

  lines.push("");

  lines.push(
    "Pemesanan dapat dilakukan melalui aplikasi VIP."
  );

  lines.push("");

  lines.push(
    "Terima kasih atas kepercayaan dan kerja samanya."
  );

  lines.push("");

  lines.push(
    "Hormat saya,"
  );

  lines.push(
    "Imamsalesnine.com"
  );

  


  return lines.join("\n");

	}





	/* =========================================================
   SMART CAMPAIGN — PREVIEW
   ========================================================= */

window.smartCampaignPreview = function(){

  const data =
    smartCampaignCollect();


  if(!data.judul){

    alert(
      "Judul campaign belum diisi."
    );

    return;

  }


  if(!data.products.length){

    alert(
      "Belum ada produk."
    );

    return;

  }


  const invalid =
    data.products.find(
      p => !p.jenis
    );


  if(invalid){

    alert(
      `Jenis campaign untuk "${invalid.nama}" belum dipilih.`
    );

    return;

  }


  const message =
    smartCampaignBuildMessage(
      data
    );


  Swal.fire({

    title:"Preview Smart Campaign",

    width:650,

    html:`

      <div
        style="
          text-align:left;
          background:#f8fafc;
          border:1px solid #e2e8f0;

  });

};





	/* =========================================================
   SMART CAMPAIGN — SEND
   ========================================================= */

window.smartCampaignSend = async function(){

  const data =
    smartCampaignCollect();


  if(!data.judul){

    alert(
      "Judul campaign belum diisi."
    );

    return;

  }


  if(!data.products.length){

    alert(
      "Belum ada produk."
    );

    return;

  }


  const invalid =
    data.products.find(
      p => !p.jenis
    );


  if(invalid){

    alert(
      `Jenis campaign "${invalid.nama}" belum dipilih.`
    );

    return;

  }


  const confirm =
    await Swal.fire({

      icon:"question",

      title:"Kirim Smart Campaign?",

      html:`

        <div style="font-size:12px;line-height:1.7;">

          <b>
            ${data.products.length}
          </b>
          produk akan digabung menjadi

          <b>
            1 pesan WhatsApp per VIP.
          </b>

          <br><br>

          Tidak ada satu pesan terpisah
          untuk setiap produk.

        </div>

      `,

      showCancelButton:true,

      confirmButtonText:"KIRIM",

      cancelButtonText:"BATAL",

      confirmButtonColor:"#8CC63F"

    });


  if(!confirm.isConfirmed)
    return;


  const payload = {

    mode:
      "notifProdukSmart",

    judul:
      data.judul,

    deskripsi:
      data.deskripsi,

    products:
      data.products

  };


  Swal.fire({

    title:"Mengirim Smart Campaign...",

    text:
      "Admin → AppScript → Gabung → Semua VIP → Fonnte",

    allowOutsideClick:false,

    showConfirmButton:false,

    didOpen:()=>{

      Swal.showLoading();

    }

  });


  try{

    await fetch(

      URL,

      {

        method:"POST",

        mode:"no-cors",

        headers:{

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(payload)

      }

    );


    Swal.fire({

      icon:"success",

      title:"Smart Campaign Terkirim",

      html:`

        <b>
          ${data.products.length}
        </b>
        produk berhasil diteruskan sebagai

        <b>
          satu campaign gabungan
        </b>

        ke seluruh VIP.

      `,

      confirmButtonColor:"#8CC63F"

    });


  }catch(error){

    console.error(
      "SMART SEND ERROR:",
      error
    );


    Swal.fire({

      icon:"error",

      title:"Pengiriman Gagal",

      text:
        error.message ||
        "Smart Campaign gagal dikirim.",

      confirmButtonColor:"#8CC63F"

    });

  }

};
