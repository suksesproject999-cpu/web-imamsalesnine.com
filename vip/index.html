<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Dashboard</title>


<style>

:root{

--navy:#0f2d6b;
--navy-dark:#081c4f;

--primary:#1976d2;
--primary-hover:#1565c0;

--success:#8CC63F;
--warning:#ff9800;
--danger:#f44336;

--bg:#eceff3;
--surface:#ffffff;

--border:#d6dbe3;

--text:#2d3748;
--text-light:#718096;

--shadow:
0 2px 10px rgba(0,0,0,.08);

--radius:10px;

}

body{

margin:0;

font-family:
"Segoe UI",
sans-serif;

background:var(--bg);

color:var(--text);

overflow:hidden;

}

/* HEADER */
.header {
  text-align: center;
  padding: 20px;
}

/* MENU */
.menu-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.menu-bar button,
.menu-bar a {
  background: rgba(255,255,255,0.08);
  border: none;
  padding: 10px 14px;
  border-radius: 12px;
  color: white;
  font-size: 13px;
  text-decoration: none;
}

/* CARD */
.card{

background:white;

border:1px solid var(--border);

border-radius:8px;

padding:20px;

margin:0;

max-width:none;

box-shadow:var(--shadow);

color:var(--text);

}

.card h1{

font-size:28px;

font-weight:600;

margin-bottom:10px;

}

.card p{

  max-width: 550px;

  margin: 0 auto;

  line-height: 1.6;

  font-size: 18px;

}

.badge{

background:#e3f2fd;

color:#1976d2;

padding:6px 12px;

font-size:12px;

border-radius:4px;

}

#live-clock{

  margin-top: 15px;

  opacity: .8;

  font-size: 14px;

}

.announcement-bar{

  margin: 30px auto 0;

  max-width: 550px;

  background: #8CC63F;

  padding: 18px;

  border-radius: 999px;

  font-size: 18px;

}

/* SEARCH */
.search-box{

position:relative;

max-width:450px;

}

.search-box input{

width:100%;

height:38px;

padding:0 12px;

border:1px solid #cfd8dc;

border-radius:4px;

font-size:13px;

background:white;

box-sizing:border-box;

}

.dropdown{
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  background:white;
  color:#111;
  border:1px solid #ddd;
  border-radius:8px;
  max-height:250px;
  overflow-y:auto;
  z-index:9999;
}

.dropdown div{

padding:10px 12px;

color:#111;

background:white;

border-bottom:1px solid #eee;

cursor:pointer;

}

.dropdown div:hover{

background:#f3f4f6;

}

/* CART */
#cart-list {
  max-height: 250px;
  overflow-y: auto;
}

.cart-item{

background:white;

border:1px solid var(--border);

border-radius:8px;

padding:12px;

margin-top:10px;

color:var(--text);

}

.cart-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.cart-row input {
  width: 60px;
  text-align: center;
}

.cart-row select {
  border-radius: 6px;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 10px;
  font-size: 12px;
  background: rgba(0,0,0,0.3);
}

.subtotal {
  font-size: 13px;
  margin-top: 5px;
  color: #8CC63F;
}
/* =====================================
🤖 IMAMGPT SCOPED UI
NO COLLISION VERSION
===================================== */

.imam-ai-container{

width:100%;

height:75vh;

min-height:550px;

max-height:800px;

display:flex;

flex-direction:column;

background:
linear-gradient(
180deg,
#081226,
#0b1324
);

border-radius:20px;

overflow:hidden;

border:
1px solid rgba(255,255,255,.06);

box-shadow:
0 10px 35px rgba(0,0,0,.35);

box-sizing:border-box;

}

/* HEADER */

.imam-ai-header{

display:flex;

align-items:center;

gap:12px;

padding:18px 20px;

font-size:22px;

font-weight:700;

color:white;

background:
linear-gradient(
90deg,
rgba(17,24,39,.98),
rgba(15,23,42,.98)
);

border-bottom:
1px solid rgba(255,255,255,.05);

flex-shrink:0;

}

/* CHAT AREA */

#imam-chat-box{

  flex:1;

  overflow-y:auto;

  padding:20px;

  scroll-behavior:smooth;
  
  min-height:0;


}

/* USER */

.imam-user-msg{

  background:
  linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
  );

  color:white;

  padding:14px 18px;

  border-radius:20px;

  margin:14px 0;

  margin-left:auto;

  width:fit-content;

  max-width:82%;

  line-height:1.7;

  font-size:14px;

  box-shadow:
  0 6px 18px rgba(37,99,235,.35);

  word-break:break-word;

}

/* AI */

.imam-ai-msg{

  background:
  rgba(30,41,59,.95);

  color:white;

  padding:14px 18px;

  border-radius:20px;

  margin:14px 0;

  width:fit-content;

  max-width:82%;

  line-height:1.7;

  font-size:14px;

  border:
  1px solid rgba(255,255,255,.04);

  box-shadow:
  0 6px 18px rgba(0,0,0,.25);

  word-break:break-word;

}

/* IMAGE */

.imam-ai-msg img{

  width:100%;

  margin-top:14px;

  border-radius:18px;

  display:block;

}

/* INPUT */

.imam-chat-input-wrap{

display:flex;

align-items:flex-end;

gap:12px;

padding:16px;

background:
rgba(17,24,39,.98);

border-top:
1px solid rgba(255,255,255,.05);

flex-shrink:0;

}

/* TEXTAREA */
#imam-ai-input{

flex:1;

min-height:55px;

max-height:140px;

overflow-y:auto;

border:none;

outline:none;

border-radius:16px;

padding:14px 16px;

background:
rgba(30,41,59,.95);

color:white;

resize:none;

font-size:14px;

line-height:1.5;

box-sizing:border-box;

}

/* BUTTON */

.imam-chat-input-wrap button{

width:58px;

height:58px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#8CC63F;
#8CC63F;
);

color:white;

font-size:22px;

cursor:pointer;

flex-shrink:0;

}

/* MOBILE */

@media(max-width:768px){

.imam-ai-container{

height:70vh;

min-height:500px;

border-radius:16px;

}

.imam-ai-header{

font-size:18px;

padding:16px;

}

#imam-chat-box{

padding:14px;

}

}
  


/* =========================
TYPING ANIMATION
========================= */

.typing{

  display:flex;

  align-items:center;

  gap:6px;

}

.typing span{

  width:8px;

  height:8px;

  border-radius:50%;

  background:white;

  opacity:.5;

  animation:bounce 1s infinite;

}

.typing span:nth-child(2){

  animation-delay:.2s;

}

.typing span:nth-child(3){

  animation-delay:.4s;

}

@keyframes bounce{

  0%,100%{

    transform:translateY(0);

    opacity:.3;

  }

  50%{

    transform:translateY(-4px);

    opacity:1;

  }

}

.ai-action{

  display:flex;

  gap:10px;

  margin-top:14px;

}

.copy-btn,
.download-btn{

  border:none;

  background:#1e293b;

  color:white;

  padding:10px 14px;

  border-radius:12px;

  cursor:pointer;

  font-size:13px;

  transition:.2s;

}

.copy-btn:hover,
.download-btn:hover{

  transform:translateY(-2px);

  background:#334155;

}

.image-upload-wrap{

  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:12px;

}

.image-upload-wrap input{

  color:white;

  font-size:13px;

}

.upload-btn{

  width:58px;

  height:58px;

  border-radius:16px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
  rgba(255,255,255,.08);

  cursor:pointer;

  font-size:24px;

  flex-shrink:0;

}

#preview-box{

  padding:
  12px 18px 0 18px;

}

#preview-box img{

  width:90px;

  border-radius:14px;

  margin-top:8px;

  display:block;

  box-shadow:
  0 6px 20px rgba(0,0,0,.25);

}

.preview-card{

  display:flex;

  align-items:center;

  gap:12px;

  background:
  rgba(255,255,255,.05);

  padding:10px;

  border-radius:16px;

  width:fit-content;

}

.preview-card img{

  width:70px;

  height:70px;

  object-fit:cover;

  border-radius:12px;

}

.vip-layout{

display:flex;

height:100vh;

background:var(--bg);

overflow:hidden;

}

.sidebar{

width:60px;

background:
linear-gradient(
180deg,
#0f2d6b,
#081c4f
);

display:flex;

flex-direction:column;

align-items:center;

padding-top:6px;

gap:6px;

flex-shrink:0;

box-shadow:
2px 0 8px rgba(0,0,0,.15);

}

.sidebar-btn{

width:44px;
height:44px;

border:none;

background:transparent;

color:white;

font-size:20px;

border-radius:6px;

.sidebar-btn:hover{

background:
rgba(255,255,255,.12);

}

.sidebar-btn.active{

background:#e91e63;

}

.main-wrapper{

flex:1;

display:flex;

flex-direction:column;

overflow:hidden;

}

.topbar{

height:34px;

background:#f3f3f3;

display:flex;

align-items:center;

border-bottom:
1px solid #d0d0d0;

margin:0;

border-radius:0;

}

.erp-tabs{

display:flex;

height:100%;

}

.tab{

height:40px;

display:flex;

align-items:center;

font-size:14px;

background:#d9d9d9;

.tab.active{

#main-content{

flex:1;

padding:12px;

overflow:auto;

}

.erp-order{

background:white;

border-radius:8px;

border:1px solid var(--border);

box-shadow:var(--shadow);

height:calc(100vh - 120px);

flex-direction:column;

}

.erp-section{

padding:12px;

border-bottom:
1px solid #e5e7eb;

background:white;

}

.erp-form-row{

display:grid;

grid-template-columns:

1fr
220px
220px
220px;

gap:12px;

align-items:end;

}

.erp-form-group input,
.erp-form-group select{

height:34px;

border:
1px solid #cfd8dc;

.erp-form-group input:focus,
.erp-form-group select:focus{

.dropdown{

border:
1px solid #d7dce3;

box-shadow:
0 3px 8px rgba(0,0,0,.12);

.btn-order{

color:white;

}

.btn-new{

color:white;

}

.btn-cancel{

background:#f44336;
color:white;

}

.btn-draft{

color:white;

}

.btn-order,
.btn-new,
.btn-cancel,
.btn-draft{

border:none;

cursor:pointer;

height:38px;

padding:0 16px;

border-radius:4px;

font-size:13px;

font-weight:600;

}

.floating-menu{
  
display:none;

position:fixed;

left:65px;

background:white;

border-radius:8px;

box-shadow:
0 5px 20px rgba(0,0,0,.15);

.erp-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

.erp-grid div{

background:#e8f5e9;

border:
1px solid #c8e6c9;

border-radius:6px;

}

.erp-grid div:hover{

}



.badge-red{

}

.unit-btn{
  
width:60px;

text-align:center;

height:34px;

padding:0 12px;

border:
1px solid #cfd8dc;

background:white;

border-radius:4px;

cursor:pointer;

}

.btn-delete{

background:#f44336;

color:white;

border:none;

width:34px;

padding:0;

display:flex;

}

.erp-form-group label{

color:#555;

}

.erp-table-empty{

}

.erp-section{

}

.erp-action{

}

.erp-action button{

.sum-row{

.sum-row.total{

/* =========================================
   FLOATING MENU
   SINKRON DENGAN SIDEBAR NAVY + PINK
   ========================================= */

.erp-grid > div {
    background: #FFFFFF;

    color: #293548;

    border: 1px solid #D9E1EA;
    border-radius: 12px;

    box-shadow:
        0 3px 10px rgba(18, 53, 116, 0.08);

    transition:
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
}


/* =========================
   ICON
   ========================= */

.erp-grid > div i {
    color: #8CC63F; !important;

    font-size: 25px;

    margin-bottom: 8px;

    filter:
        drop-shadow(0 0 4px rgba(175, 255, 0, 0.35));

    transition:
        color 0.25s ease,
        filter 0.25s ease,
        transform 0.25s ease;
}


/* =========================
   TEXT
   ========================= */

.erp-grid > div {
    font-weight: 500;
}


/* =========================
   HOVER
   ========================= */

.erp-grid > div:hover {
    background: #123574;

    color: #FFFFFF;

    border-color: #123574;

    box-shadow:
        0 7px 20px rgba(18, 53, 116, 0.25);

    transform: translateY(-2px);
}


/* ICON SAAT HOVER */

.erp-grid > div:hover i {
    color: #8CC63F; !important;

    filter:
        drop-shadow(0 0 8px rgba(175, 255, 0, 0.75));

    transform: scale(1.08);
}


/* =========================
   ACTIVE / SELECTED
   ========================= */

.erp-grid > div.active {
    background: #EF2B6B;

    color: #FFFFFF;

    border-color: #EF2B6B;

    box-shadow:
        0 7px 20px rgba(239, 43, 107, 0.25);
}


.erp-grid > div.active i {
    color: #FFFFFF !important;

    filter:
        drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
}




/* =========================================
   IMAMGPT — INPUT AREA
   NAVY + PINK + LIME
   ========================================= */


/* AREA INPUT */

.imam-ai-header + * {
    box-sizing: border-box;
}


/* TEXTAREA */

#imam-ai-input {
    background: #1B2639 !important;
    color: #FFFFFF !important;

    border: 1px solid rgba(175, 255, 0, 0.08) !important;
    border-radius: 20px;

    outline: none;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}


/* PLACEHOLDER */

#imam-ai-input::placeholder {
    color: #8D96A5;
    opacity: 1;
}


/* FOCUS */

#imam-ai-input:focus {
    background: #202D43 !important;

    border-color: rgba(175, 255, 0, 0.40) !important;

    box-shadow:
        0 0 0 2px rgba(175, 255, 0, 0.06),
        0 0 15px rgba(175, 255, 0, 0.08);
}


/* =========================================
   UPLOAD BUTTON
   ========================================= */

.upload-btn {
    background: #1B2639 !important;

    color: #8CC63F; !important;

    border: 1px solid rgba(175, 255, 0, 0.08);

    border-radius: 20px;

    transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.2s ease;
}


/* UPLOAD ICON */

.upload-btn i {
    color: #8CC63F; !important;

    filter:
        drop-shadow(0 0 4px rgba(175, 255, 0, 0.30));

    transition: all 0.25s ease;
}


/* UPLOAD HOVER */

.upload-btn:hover {
    background: #25344B !important;

    border-color:
        rgba(175, 255, 0, 0.30);

    box-shadow:
        0 0 14px rgba(175, 255, 0, 0.08);

    transform: translateY(-1px);
}

.upload-btn:hover i {
    color: #8CC63F; !important;

    filter:
        drop-shadow(0 0 7px rgba(175, 255, 0, 0.65));
}


/* =========================================
   SEND BUTTON
   ========================================= */

.imam-ai-header ~ button,
#imam-ai-input + button {
    background: #8CC63F; !important;

    color: #0B1209 !important;

    border: none;

    border-radius: 20px;

    transition:
        background 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.2s ease;
}


/* SEND ICON */

.imam-ai-header ~ button i,
#imam-ai-input + button i {
    color: #0B1209 !important;

    font-size: 22px;

    transition:
        transform 0.25s ease;
}


/* SEND HOVER */

.imam-ai-header ~ button:hover,
#imam-ai-input + button:hover {
    background: #8CC63F; !important;

    box-shadow:
        0 0 18px rgba(175, 255, 0, 0.30);

    transform: translateY(-1px);
}


/* ICON HOVER */

.imam-ai-header ~ button:hover i,
#imam-ai-input + button:hover i {
    transform: translateX(2px) rotate(-3deg);
}


/* =========================================
   DISABLED
   ========================================= */

.imam-ai-header ~ button:disabled,
#imam-ai-input + button:disabled {
    background: #3A4350 !important;

    color: #747D89 !important;

    box-shadow: none;

    cursor: not-allowed;

    transform: none;
}

.imam-ai-header ~ button:disabled i,
#imam-ai-input + button:disabled i {
    color: #747D89 !important;

    filter: none;

    transform: none;
}

/* =================================
   SIDEBAR TOOLTIP / BADGE
================================= */

.sidebar-btn{
  position:relative;
}

/* badge dari attribute title */
.sidebar-btn::after{
  content:attr(title);

  position:absolute;

  left:calc(100% + 10px);
  top:50%;

  transform:
    translateY(-50%)
    translateX(-5px);

  background:#fff8d8;
  color:#3f3a20;

  border:1px solid #e4d88f;

  padding:7px 12px;

  border-radius:6px;

  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:500;

  line-height:1;

  white-space:nowrap;

  box-shadow:
    0 4px 14px rgba(0,0,0,.15);

  opacity:0;
  visibility:hidden;

  pointer-events:none;

  z-index:99999;

  transition:
    opacity .18s ease,
    transform .18s ease;
}


/* segitiga */

.sidebar-btn::before{
  content:"";

  position:absolute;

  left:calc(100% + 4px);
  top:50%;

  transform:translateY(-50%);

  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-right:6px solid #e4d88f;

  opacity:0;
  visibility:hidden;

  z-index:99999;

  transition:
    opacity .18s ease;
}


/* hover */

.sidebar-btn:hover::after{
  opacity:1;
  visibility:visible;

  transform:
    translateY(-50%)
    translateX(0);
}

.sidebar-btn:hover::before{
  opacity:1;
  visibility:visible;
}
