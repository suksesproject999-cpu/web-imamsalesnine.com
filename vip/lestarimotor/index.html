03eHapus\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\n\u003ctbody id=\"erp-cart-body\"\u003e\n\n\u003ctr\u003e\n\n\u003ctd colspan=\"7\"\nstyle=\"\nheight:450px;\ntext-align:center;\ncolor:#999;\n\"\u003e\n\nBelum ada data\n\n\u003c/td\u003e\n\n\u003c/tr\u003e\n\n\u003c/tbody\u003e\n\n\u003c/table\u003e\n\n\u003c/div\u003e\n\n\u003cdiv\nstyle=\"\npadding:15px;\nborder-top:1px solid #eee;\n\"\n\u003e\n\n\u003clabel\nstyle=\"\ndisplay:block;\nmargin-bottom:8px;\nfont-weight:600;\n\"\n\u003e\n\nKeterangan Klaim\n\n\u003c/label\u003e\n\n\u003ctextarea\nid=\"ket\"\nplaceholder=\"Contoh: Barang pecah, lampu mati, warna tidak sesuai, unit kurang lengkap...\"\nstyle=\"\nwidth:100%;\nheight:90px;\npadding:10px;\nborder:1px solid #ddd;\nborder-radius:6px;\nbox-sizing:border-box;\nresize:none;\n\"\n\u003e\u003c/textarea\u003e\n\n\u003c/div\u003e\n\n\u003cdiv class=\"erp-footer-area\"\u003e\n\n\u003cdiv class=\"erp-action\"\u003e\n\n\n\u003cbutton \nclass=\"btn-new\"\nonclick=\"orderBaru()\"\n\u003e\n\u003ci class=\"fa-solid fa-plus\"\u003e\u003c/i\u003e\n\u003cspan class=\"btn-label\"\u003e\nData Baru\n\u003c/span\u003e\n\u003c/button\u003e\n\n\n\n\n\u003cbutton\nclass=\"btn-cancel\"\nonclick=\"batalOrder()\"\n\u003e\n\u003ci class=\"fa-solid fa-xmark\"\u003e\u003c/i\u003e\n\u003cspan class=\"btn-label\"\u003e\nBatal\n\u003c/span\u003e\n\u003c/button\u003e\n\n\n\n\n\n\u003cbutton\nclass=\"btn-draft\"\nonclick=\"simpanDraft()\"\n\u003e\n\u003ci class=\"fa-solid fa-floppy-disk\"\u003e\u003c/i\u003e\n\u003cspan class=\"btn-label\"\u003e\nSimpan Draft\n\u003c/span\u003e\n\u003c/button\u003e\n\n\n\n\n\u003cbutton\nclass=\"btn-order btn-klaim\"\nonclick=\"kirimKlaim()\"\n\u003e\n\u003ci class=\"fa-solid fa-rotate\"\u003e\u003c/i\u003e\nKirim Klaim\n\u003c/button\u003e\n\n\n\n\u003c/div\u003e\n\n\u003cdiv class=\"erp-summary\"\u003e\n\n\u003cdiv class=\"sum-row\"\u003e\n\u003cspan\u003eSub Total\u003c/span\u003e\n\u003cb id=\"subTotal\"\u003eRp 0\u003c/b\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"sum-row\"\u003e\n\u003cspan\u003eDiskon\u003c/span\u003e\n\u003cb id=\"totalDiskon\"\u003eRp 0\u003c/b\u003e\n\u003c/div\u003e\n\n\n\u003cdiv class=\"sum-row total\"\u003e\n\u003cspan\u003eTotal\u003c/span\u003e\n\u003cb id=\"grandTotal\"\u003eRp 0\u003c/b\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n`;\n\nrenderCartERP();\n\n}\n\n// ================= SEARCH =================\nfunction openSearch(){\n  document.getElementById(\"hasil\").style.display = \"block\";\n}\n\nfunction showSearch(val){\n\n  let el = document.getElementById(\"hasil\");\n  el.innerHTML = \"\";\n\n  if(!val){\n    el.style.display = \"none\";\n    return;\n  }\n\n  let keyword =\nval.toLowerCase().trim();\n\nlet hasil = allProduk.filter(p =\u003e {\n\n  let nama =\n  p.toLowerCase();\n\n  return nama.includes(keyword);\n\n});\n\n// 🔥 PRIORITAS YANG PALING MIRIP\nhasil.sort((a,b)=\u003e{\n\n  let aa =\n  a.toLowerCase();\n\n  let bb =\n  b.toLowerCase();\n\n  return (\n    aa.indexOf(keyword)\n    -\n    bb.indexOf(keyword)\n  );\n\n});\n\n  hasil.slice(0,20).forEach(item=\u003e{\n\n  let div = document.createElement(\"div\");\n\n  let kosong = false;\n\nif(\n  window.stokData &&\n  window.stokData.length \u003e 0\n){\n  kosong = window.isKosong(item);\n}\n\n  \ndiv.innerHTML = kosong\n    ? '\u003ci class=\"fa-solid fa-circle-xmark\"\u003e\u003c/i\u003e ' + item + ' (Stok Habis)'\n    : '\u003ci class=\"fa-solid fa-circle-check\"\u003e\u003c/i\u003e ' + item;\n\n\n\n  if(kosong){\n    div.style.color = \"#888\";\n    div.style.opacity = \"0.6\";\n  }\n\n  if(kosong && mode === \"order\"){\n    div.style.cursor = \"not-allowed\";\n  } else {\n    div.style.cursor = \"pointer\";\n  }\n\n  div.onclick = () =\u003e {\n\n  if(mode === \"order\" && kosong){\n\n    VIPUI.notice(\"Stok Produk Kosong\", \"Produk ini sedang tidak tersedia untuk dipesan.\", \"warn\");\n\n    return;\n}\n\n  tambahItem(item);\n\n  el.style.display = \"none\";\n\n  document.getElementById(\"searchInput\").value = \"\";\n\n  document.getElementById(\"searchInput\").blur();\n\n};\n\n  el.appendChild(div);\n});\n\n  el.style.display = \"block\";\n}\n\n// ================= CART =================\nfunction tambahItem(nama){\n\n  let existing = cart.find(x =\u003e x.nama === nama);\n\n  if(existing){\n    existing.qty++;\n  } else {\n    cart.push({\n\nnama,\n\nqty:1,\n\nsatuan:\"pcs\",\n\nharga:0,\n\ndiskon:0\n\n});\n\n  }\n  \n  syncCart();\n\n  autoSaveDraft();\n\n  renderCart();\n  \n  renderCartERP();\n}\n\nfunction renderCartERP(){\n\nconst body =\ndocument.getElementById(\n\"erp-cart-body\"\n);\n\n\nif(!body) return;\n\nbody.innerHTML = \"\";\n\nif(cart.length===0){\n\nbody.innerHTML = `\n\u003ctr\u003e\n\u003ctd colspan=\"7\"\nstyle=\"\ntext-align:center;\ncolor:#999;\npadding:100px 0;\n\"\u003e\nBelum ada data\n\u003c/td\u003e\n\u003c/tr\u003e\n`;\n\nreturn;\n\n}\n\ncart.forEach((item,i)=\u003e{\n\nconst subtotal =\n(item.harga || 0) * item.qty;\n\nconst diskon =\nsubtotal *\n((item.diskon || 0) / 100);\n\nconst total =\nsubtotal - diskon;\n\nbody.innerHTML += `\n\n\u003ctr\u003e\n\n\u003ctd\u003e${item.nama}\u003c/td\u003e\n\n\u003ctd\u003e\n\n\u003cinput\ntype=\"number\"\nvalue=\"${item.qty}\"\nmin=\"1\"\nonchange=\"updateQty(${i},this.value)\"\nstyle=\"\nwidth:60px;\ntext-align:center;\n\"\n\u003e\n\n\u003c/td\u003e\n\n\u003ctd\u003e\n\n\u003cbutton\nclass=\"unit-btn\"\nonclick=\"toggleSatuan(${i})\"\n\u003e\n\n${item.satuan}\n\n\u003c/button\u003e\n\n\u003c/td\u003e\n\n\u003ctd\u003e\n\n\u003cinput\ntype=\"text\"\nvalue=\"${item.harga ? formatInputRupiah(item.harga) : ''}\"\noninput=\"handleHargaERP(this,${i})\"\n\u003e\n\n\u003c/td\u003e\n\n\u003ctd\u003e\n\n\u003cinput\ntype=\"number\"\nmin=\"0\"\nmax=\"100\"\nvalue=\"${item.diskon || 0}\"\nonchange=\"updateDiskon(${i},this.value)\"\nstyle=\"width:60px;text-align:center;\"\n\u003e\n\n\u003c/td\u003e\n\n\u003ctd id=\"rowTotal${i}\"\u003e\n\n${formatRupiah(total)}\n\n\u003c/td\u003e\n\n\u003ctd\u003e\n\n\n\u003cbutton\nonclick=\"hapus(${i})\"\nclass=\"btn-delete\"\ntitle=\"Hapus\"\n\u003e\n\n\u003ci class=\"fa-solid fa-trash-can\"\u003e\u003c/i\u003e\n\n\u003c/button\u003e\n\n\n\n\u003c/td\u003e\n\n\u003c/tr\u003e\n\n`;\n\n});\n\nlet subtotal = 0;\n\ncart.forEach(item=\u003e{\n  subtotal += (item.harga || 0) * item.qty;\n});\n\nupdateTotalERP();\n\n}\n\nfunction renderCart(){\n\n  let el = document.getElementById(\"cart-list\");\n\n  if(!el) return;\n\n  el.innerHTML = \"\";\n\n  cart.forEach((item,i)=\u003e{\n\n    let div = document.createElement(\"div\");\n    div.className = \"cart-item\";\n\n    div.innerHTML = `\n  \u003cb\u003e${item.nama}\u003c/b\u003e\n\n  \u003cdiv class=\"cart-row\"\u003e\n\n    \u003cbutton onclick=\"kurang(${i})\"\u003e➖\u003c/button\u003e\n\n    \u003cinput type=\"number\" value=\"${item.qty}\" min=\"1\"\n      onchange=\"updateQty(${i}, this.value)\"\u003e\n\n    \u003cbutton onclick=\"tambah(${i})\"\u003e➕\u003c/button\u003e\n\n    \u003cselect onchange=\"updateSatuan(${i}, this.value)\"\u003e\n      \u003coption ${item.satuan==\"pcs\"?\"selected\":\"\"}\u003epcs\u003c/option\u003e\n      \u003coption ${item.satuan==\"set\"?\"selected\":\"\"}\u003eset\u003c/option\u003e\n    \u003c/select\u003e\n\n    \u003cinput type=\"text\" placeholder=\"Harga\"\n      value=\"${item.harga ? formatInputRupiah(item.harga) : \"\"}\"\n      oninput=\"handleHargaInput(this, ${i})\"\u003e\n\n    \u003cbutton onclick=\"hapus(${i})\"\u003e❌\u003c/button\u003e\n\n  \u003c/div\u003e\n\n  \u003cdiv class=\"subtotal\"\u003e\n    💰 Subtotal: ${formatRupiah((item.harga || 0) * item.qty)}\n  \u003c/div\u003e\n`;\n\n    el.appendChild(div);\n  });\n\nlet total = 0;\n\ncart.forEach(item=\u003e{\n  total += (item.harga || 0) * item.qty;\n});\n\nlet totalDiv = document.createElement(\"div\");\ntotalDiv.innerHTML = `\u003cb\u003e💰 Total: ${formatRupiah(total)}\u003c/b\u003e`;\n\nel.appendChild(totalDiv);\n}\n\nfunction tambah(i){\n\ncart[i].qty++;\n\nsyncCart();\n\nautoSaveDraft();\n\nrenderCart();\n\nrenderCartERP();\n\n}\n\nfunction kurang(i){\n  if(cart[i].qty\u003e1){ cart[i].qty--; }\n  else{ cart.splice(i,1); }\n  \n  syncCart();\n  \n  autoSaveDraft();\n  \n  renderCart();\n  \n  renderCartERP();\n}\n\nfunction hapus(i){\n  cart.splice(i,1);\n  \n  syncCart();\n  \n  autoSaveDraft();\n\n  renderCart();\n  \n  renderCartERP();\n\n  updateTotalERP();\n}\n\nfunction updateSatuan(i,val){\n\n  cart[i].satuan = val;\n\n  renderCartERP();\n\n}\n\nfunction updateHarga(i,val){\n\n  let v = parseInt(val) || 0;\n\n  cart[i].harga = v;\n\n}\n\nfunction formatRupiah(angka){\n  return \"Rp \" + (angka || 0).toLocaleString(\"id-ID\");\n}\n\nfunction formatInputRupiah(angka){\n  return angka.toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, \".\");\n}\n\nfunction handleHargaInput(el, i){\n\n  // ambil angka murni (hapus titik)\n  let angka = el.value.replace(/\\D/g, \"\");\n\n  // simpan ke cart sebagai number\n  cart[i].harga = parseInt(angka) || 0;\n\n  // format tampilan\n  el.value = formatInputRupiah(angka);\n}\n\nfunction updateQty(i,val){\n  let v = parseInt(val);\n  if(v\u003e0){\n    cart[i].qty = v;\n    \n    syncCart();\n    \n    autoSaveDraft();\n    \n    renderCart();\n    renderCartERP();// 🔥 WAJIB\n  }\n}\n\nasync function batalOrder(){\n\nconst ok = await VIPUI.confirm(\"Batalkan Pengisian?\", \"Data yang belum tersimpan akan dihapus. Yakin ingin membatalkan?\", {okText:\"Ya, Batalkan\"});\n\nif(!ok) return;\n\nif(mode===\"order\"){\n\norderCart = [];\ncart = orderCart;\n\nlocalStorage.removeItem(vipKey(\"invoiceNo\"));\nlocalStorage.removeItem(vipKey(\"waktuOrder\"));\nlocalStorage.removeItem(vipKey(\"draftOrder\"));\n\ninvoiceNo = \"\";\nwaktuOrder = \"\";\n\ngenerateOrderInfo();\n\nrenderOrder();\n\n}else{\n\nklaimCart = [];\ncart = klaimCart;\n\nlocalStorage.removeItem(vipKey(\"klaimNo\"));\nlocalStorage.removeItem(vipKey(\"waktuKlaim\"));\nlocalStorage.removeItem(vipKey(\"draftKlaim\"));\n\nklaimNo = \"\";\nwaktuKlaim = \"\";\n\ngenerateKlaimInfo();\n\nrenderKlaim();\n\n}\n\n}\n\nasync function orderBaru(){\n\nconst ok = await VIPUI.confirm(\"Buat Dokumen Baru?\", \"Data yang belum tersimpan akan dihapus. Ingin membuat dokumen baru?\", {okText:\"Buat Baru\"});\n\nif(!ok) return;\n\nif(mode===\"order\"){\n\norderCart = [];\ncart = orderCart;\n\nlocalStorage.removeItem(vipKey(\"invoiceNo\"));\nlocalStorage.removeItem(vipKey(\"waktuOrder\"));\nlocalStorage.removeItem(vipKey(\"draftOrder\"));\n\ninvoiceNo = \"\";\nwaktuOrder = \"\";\n\ngenerateOrderInfo();\n\nrenderOrder();\n\n}else{\n\nklaimCart = [];\ncart = klaimCart;\n\nlocalStorage.removeItem(vipKey(\"klaimNo\"));\nlocalStorage.removeItem(vipKey(\"waktuKlaim\"));\nlocalStorage.removeItem(vipKey(\"draftKlaim\"));\n\nklaimNo = \"\";\nwaktuKlaim = \"\";\n\ngenerateKlaimInfo();\n\nrenderKlaim();\n\n}\n\n}\n\n// ================= KIRIM =================\nfunction kirimWA(confirmedUnavailable = false){\n\n  console.log(\"STOK:\", window.stokData);\n\n  if(\n    !window.stokData ||\n    window.stokData.length === 0\n){\n\n    VIPUI.notice(\"Data Stok Belum Siap\", \"Informasi stok sedang dimuat. Silakan coba kembali.\", \"warn\");\n\n    return;\n}\n\n\nif(cart.length === 0){\n\n    VIPUI.notice(\"Keranjang Kosong\", \"Tambahkan produk terlebih dahulu sebelum membuat pesanan.\", \"warn\");\n\n    return;\n}\n\n  let tersedia = [];\n  let kosong = [];\n\n  cart.forEach(item =\u003e {\n    if(window.isKosong(item.nama)){\n      kosong.push(item);\n    } else {\n      tersedia.push(item);\n    }\n  });\n\n  // 🔥 kalau ada kosong\n  if(kosong.length \u003e 0){\n\n    let pesanKosong = kosong.map(i =\u003e i.nama).join(\"\\n\");\n\n    let confirmMsg =\n      \"Produk berikut sedang tidak tersedia:\\n\" +\n      pesanKosong +\n      \"\\n\\nLanjutkan tanpa produk tersebut?\";\n\n    if (!confirmedUnavailable) {\n      VIPUI.confirm(\"Produk Tidak Tersedia\", confirmMsg, {\n        okText: \"Lanjutkan\",\n        // Pertahankan pembukaan WhatsApp dalam event klik pengguna.\n        onAccept: () =\u003e kirimWA(true)\n      });\n      return;\n    }\n  }\n\n   const invoiceId =\ninvoiceNo;\n  // 🔥 kirim hanya yang tersedia\n  let pesan =\n\n`📋 ORDER ${VIP_NAME}\n\nInvoice : ${invoiceId}\n\n====================\n\n`;\n\n  tersedia.forEach((item,index)=\u003e{\n\n  const subtotal =\n  (item.harga || 0) * item.qty;\n\n  const diskon =\n  subtotal *\n  ((item.diskon || 0)/100);\n\n  const total =\n  subtotal - diskon;\n\n  pesan +=\n\n`${index+1}. ${item.nama}\n\nQty      : ${item.qty} ${item.satuan}\nHarga    : ${formatRupiah(item.harga)}\nDiskon   : ${item.diskon || 0}%\nTotal    : ${formatRupiah(total)}\n\n`;\n\n});\n\n  let gross = 0;\nlet totalDiskon = 0;\nlet grandTotal = 0;\n\ntersedia.forEach(item=\u003e{\n\n  const subtotal =\n  (item.harga || 0) * item.qty;\n\n  const diskon =\n  subtotal *\n  ((item.diskon || 0)/100);\n\n  gross += subtotal;\n  totalDiskon += diskon;\n  grandTotal += subtotal - diskon;\n\n});\n\npesan +=\n\n`====================\n\nSub Total : ${formatRupiah(gross)}\nDiskon    : ${formatRupiah(totalDiskon)}\nGrand Total : ${formatRupiah(grandTotal)}\n\n`;\n\n  fetch(URL, {\n    method:\"POST\",\n    mode:\"no-cors\",\n    body: JSON.stringify({\n      nama:VIP_NAME,\n      order: pesan,\n      status:\"order\"\n    })\n  });\n  \n  // =====================\n// SAVE HEADER INVOICE\n// =====================\n\ndb.collection(\"invoice\")\n.doc(invoiceId)\n.set({\n\n  invoice: invoiceId,\n\n  nama:VIP_NAME,\n\n  type: \"order\",\n\n  status: \"pending\",\n\n  total_item: tersedia.length,\n\n  total: grandTotal,\n\n  waktu:\n  firebase.firestore\n  .FieldValue\n  .serverTimestamp(),\n\n  created_at: Date.now()\n\n});\n\n  tersedia.forEach(item =\u003e {\n\n  const subtotal =\n(item.harga || 0) * item.qty;\n\nconst diskon =\nsubtotal *\n((item.diskon || 0) / 100);\n\nconst total =\nsubtotal - diskon;\n\nlet itemText =\n\n`${item.nama} ` +\n`(${item.qty} ${ ========\n\nGrand Total : ${formatRupiah(total)}\n\nKeterangan:\n${ket}\n\n`;\n\n  fetch(\"https://script.google.com/macros/s/AKfycbwztdCQ87hwDrH0fJfxQe-w6JVUwwV5qETTGCe7TEhTXTLzWlbE0jHPZfAetClBTC5QJQ/exec\", {\n    method:\"POST\",\n    mode:\"no-cors\",\n    body: JSON.stringify({\n      nama:VIP_NAME,\n      order: pesan,\n      status:\"klaim\"\n    })\n  });\n  \n// =====================\n// SAVE HEADER KLAIM\n// =====================\n\ndb.collection(\"invoice\")\n.doc(invoiceId)\n.set({\n\n  invoice: invoiceId,\n\n  nama:VIP_NAME,\n\n  type: \"klaim\",\n\n  status: \"pending\",\n\n  total_item: cart.length,\n\n  total: total,\n\n  keterangan: ket,\n\n  waktu:\n  firebase.firestore\n  .FieldValue\n  .serverTimestamp(),\n\n  created_at: Date.now()\n\n});\n\n\n  cart.forEach(item =\u003e {\n\n  const subtotal =\n(item.harga || 0) * item.qty;\n\nconst diskon =\nsubtotal *\n((item.diskon || 0) / 100);\n\nconst total =\nsubtotal - diskon;\n\nlet itemText =\n\n`${item.nama} ` +\n`(${item.qty} ${item.satuan}) | ` +\n`Harga ${formatRupiah(item.harga)} | ` +\n`Diskon ${item.diskon || 0}% | ` +\n`Total ${formatRupiah(total)}`;\n\n  db.collection(\"pesanan\").add({\n\n  nama:VIP_NAME,\n\n  produk:item.nama,\n\n  qty:item.qty,\n\n  satuan:item.satuan,\n\n  harga:item.harga || 0,\n\n  diskon:item.diskon || 0,\n\n  subtotal:subtotal,\n\n  total:total,\n\n  order:itemText,\n\n  status:\"pending\",\n\n  type:\"klaim\",\n\n  invoice: invoiceId,\n\n  created_at: Date.now(),\n\n  waktu:\n  firebase.firestore\n  .FieldValue.serverTimestamp()\n\n});\n\n});\n\n  window.open(\n\"https://wa.me/6282210109369?text=\" +\nencodeURIComponent(pesan)\n);\n\nlocalStorage.removeItem(vipKey(\"klaimNo\"));\nlocalStorage.removeItem(vipKey(\"waktuKlaim\"));\nlocalStorage.removeItem(vipKey(\"draftKlaim\"));\n\nklaimNo = \"\";\nwaktuKlaim = \"\";\n\nklaimCart = [];\ncart = [];\n\ngenerateKlaimInfo();\n\nrenderKlaim();\n\n}\n\n// HISTORY\nfunction goHistory(){\n  VIPUI.go(window.__VIP_PROFILE.root + \"/history.html\");\n}\n\n// AUTO LOAD\nupdateActivity();\n\nsetInterval(()=\u003e{\n\n  updateActivity();\n\n},30000);\n\n// JAM\nfunction updateJam(){\n\nconst clock =\ndocument.getElementById(\"live-clock\");\n\nif(!clock) return;\n\n\nclock.innerHTML =\n    '\u003ci class=\"fa-solid fa-clock\"\u003e\u003c/i\u003e ' +\n    new Date().toLocaleString(\"id-ID\");\n\n\n}\n\n\nsetInterval(updateJam,1000);\nupdateJam();\n\n// CLOSE DROPDOWN\ndocument.addEventListener(\"click\", function(e){\n  let box = document.querySelector(\".search-box\");\n  if(box && !box.contains(e.target)){\n    let d = document.getElementById(\"hasil\");\n    if(d) d.style.display=\"none\";\n  }\n});\n\nlet memory = [];\n\nlet uploadedFile = null;\n\nlet uploadedBase64 = null;\n\nasync function tanyaAI(){\n\n  const input =\n  document.getElementById(\"imam-ai-input\");\n\n  const message =\n  input.value.trim();\n  \n  const currentImage =\nuploadedBase64;\n\n  if(\n  !message &&\n  !uploadedFile\n) return;\n\n  const chatBox =\n  document.getElementById(\"imam-chat-box\");\n\n  // USER MESSAGE\n\n  chatBox.innerHTML += `\n\n  \u003cdiv class=\"imam-user-msg\"\u003e\n\n    ${message || \"\"}\n\n    ${\n      currentImage\n      ?\n      `\n      \u003cimg\n        src=\"${currentImage}\"\n        style=\"\n          width:100%;\n          margin-top:12px;\n          border-radius:16px;\n        \"\n      \u003e\n      `\n      :\n      \"\"\n    }\n\n  \u003c/div\u003e\n\n`;\n\n  input.value = \"\";\n  \n  chatBox.scrollTop =\n  chatBox.scrollHeight;\n\n  memory.push({\n    role:\"user\",\n    content:message\n  });\n\n  // LOADING\n\n  const loadingId =\n  \"loading-\" + Date.now();\n\n  chatBox.innerHTML += `\n\n    \u003cdiv\n      class=\"imam-ai-msg\"\n      id=\"${loadingId}\"\n    \u003e\n\n      \u003cdiv class=\"typing\"\u003e\n\n        \u003cspan\u003e\u003c/span\u003e\n        \u003cspan\u003e\u003c/span\u003e\n        \u003cspan\u003e\u003c/span\u003e\n\n      \u003c/div\u003e\n\n    \u003c/div\u003e\n\n  `;\n\n  chatBox.scrollTop =\n  chatBox.scrollHeight;\n\n  try {\n\n    const formData =\nnew FormData();\n\nformData.append(\n  \"vip\",\n  VIP_NAME\n);\n\nformData.append(\n  \"message\",\n  message\n);\n\nformData.append(\n  \"memory\",\n  JSON.stringify(memory)\n);\n\nformData.append(\n  \"orders\",\n  JSON.stringify(cart)\n);\n\nif(uploadedFile){\n\n  formData.append(\n    \"image\",\n    uploadedFile\n  );\n\n}\n\nconst res = await fetch(\n\n  \"/.netlify/functions/chat\",\n\n  {\n\n    method:\"POST\",\n\n    headers:{\n\n      Authorization:\n      \"Bearer \" +\n      localStorage.getItem(\"token\")\n\n    },\n\n    body:formData\n\n  }\n\n);\n\n    if(!res.ok){\n\n      throw new Error(\n        \"HTTP ERROR \" + res.status\n      );\n\n    }\n\n    const data =\n    await res.json();\n    \n    uploadedFile = null;\nuploadedBase64 = null;\n\n    document.getElementById(\n\"image-upload\"\n).value = \"\";\n\ndocument.getElementById(\n\"preview-box\"\n).innerHTML = \"\";\n\n    console.log(\n      \"AI RESPONSE:\",\n      data\n    );\n\n    let aiText =\n\n      data.reply\n      || \"Maaf, jawaban belum tersedia. Silakan coba lagi.\";\n\n    let imageHtml = \"\";\n\n    if(data.image){\n\n      imageHtml = `\n\n        \u003cdiv style=\"margin-top:15px;\"\u003e\n\n          \u003cimg\n            src=\"${data.image}\"\n            style=\"\n              width:100%;\n              border-radius:18px;\n              margin-top:10px;\n              box-shadow:\n              0 10px 25px rgba(0,0,0,.35);\n            \"\n          \u003e\n\n        \u003c/div\u003e\n\n      `;\n\n    }\n\n    const loadingBubble =\n    document.getElementById(\n      loadingId\n    );\n    \nif(loadingBubble){\n\n  loadingBubble.outerHTML = `\n\n\u003cdiv class=\"imam-ai-msg\"\u003e\n\n  \u003cdiv id=\"${loadingId}-text\"\u003e\u003c/div\u003e\n\n  ${imageHtml}\n\n  \u003cdiv class=\"ai-action\"\u003e\n\n    \n\u003cbutton\n    onclick=\"copyAI(this)\"\n    class=\"copy-btn\"\n\u003e\n    \u003ci class=\"fa-solid fa-copy\"\u003e\u003c/i\u003e Copy\n\u003c/button\u003e\n\n\n\n    ${\n      data.image\n      ?\n      `\n      \n\u003cbutton\n    onclick=\"downloadImage('${data.image}')\"\n    class=\"download-btn\"\n\u003e\n    \u003ci class=\"fa-solid fa-download\"\u003e\u003c/i\u003e Download\n\u003c/button\u003e\n\n      `\n      :\n      \"\"\n    }\n\n  \u003c/div\u003e\n\n\u003c/div\u003e\n\n`;\n\n  const streamTarget =\n\n  document.getElementById(\n    `${loadingId}-text`\n  );\n\n  await streamText(\n    streamTarget,\n    aiText\n  );\n\n}\n\nmemory.push({\n\n  role:\"assistant\",\n\n  content:aiText\n\n});\n\nchatBox.scrollTop =\nchatBox.scrollHeight;\n\n  } catch(err){\n\n    console.log(\n      \"FRONTEND ERROR:\",\n      err\n    );\n\n    const loadingBubble =\n    document.getElementById(\n      loadingId\n    );\n\n    if(loadingBubble){\n\n      loadingBubble.outerHTML = `\n\n        \u003cdiv class=\"imam-ai-msg\"\u003e\n\n          Layanan sementara tidak tersedia\n\n          \u003cbr\u003e\u003cbr\u003e\n\n          Silakan coba beberapa saat lagi.\n\n        \u003c/div\u003e\n\n      `;\n\n    }\n\n    chatBox.scrollTop =\n    chatBox.scrollHeight;\n\n  }\n\n}\n\nasync function streamText(\n  element,\n  text\n){\n\n  let current = \"\";\n\n  for(\n    let i = 0;\n    i \u003c text.length;\n    i++\n  ){\n\n    current += text[i];\n\n    element.innerHTML =\n    marked.parse(current);\n\n    await new Promise(\n      resolve =\u003e\n      setTimeout(resolve, 8)\n    );\n\n  }\n\n}\n\nfunction downloadImage(imageSrc){\n\n  const link =\n  document.createElement(\"a\");\n\n  link.href = imageSrc;\n\n  link.download =\n  \"imamgpt-image.png\";\n\n  document.body.appendChild(link);\n\n  link.click();\n\n  document.body.removeChild(link);\n\n}\n\nfunction copyAI(btn){\n\n  const text =\n\n  btn.parentElement\n  .parentElement\n  .innerText;\n\n  navigator.clipboard.writeText(text);\n\n  \nbtn one\"\n:\n\"block\";\n\n}\n\nfunction renderInfo(){\n  \n  const VIP_NAME = window.__VIP_PROFILE.name;\n\n  setTabTitle(\"Informasi\");\n\n  document.getElementById(\n    \"main-content\"\n  ).innerHTML = `\n\n  \n  \n\u003cdiv class=\"card\"\u003e\n\n    \u003ch2\u003e\u003ci class=\"fa-solid fa-circle-info\"\u003e\u003c/i\u003e Informasi\u003c/h2\u003e\n\n    \u003cdiv id=\"info-list\"\u003e\n        Memuat data...\n    \u003c/div\u003e\n\n\u003c/div\u003e\n\n\n\n  `;\n\n  db.collection(\"info_distributor\")\n  .where(\"aktif\",\"==\",true)\n  .orderBy(\"created_at\",\"desc\")\n  .onSnapshot((snap)=\u003e{\n\n    let html=\"\";\n\n    if(snap.empty){\n\n      document.getElementById(\n        \"info-list\"\n      ).innerHTML = `\n      \u003cdiv class=\"card\"\u003e\n        Belum ada informasi terbaru.\n      \u003c/div\u003e\n      `;\n\n      return;\n    }\n\n    snap.forEach(doc=\u003e{\n\n      const d = doc.data();\n      \n      if(\n d.target !== \"all\" &&\n d.target !== VIP_NAME\n){\n return;\n}\n\n      const tanggal =\n      d.created_at\n      ?\n      d.created_at\n      .toDate()\n      .toLocaleString(\"id-ID\")\n      :\n      \"-\";\n\n      html += `\n\n\u003cdiv class=\"\ninfo-card\n${d.prioritas===\"high\"\n?\"info-important\"\n:\"\"}\n\"\u003e\n\n\n\u003cdiv class=\"info-title\"\u003e\n\n${\nd.prioritas===\"high\"\n?\n'\u003ci class=\"fa-solid fa-triangle-exclamation\"\u003e\u003c/i\u003e PENTING'\n:\n'\u003ci class=\"fa-solid fa-circle-info\"\u003e\u003c/i\u003e INFORMASI'\n}\n\n\u003c/div\u003e\n\n\n\n\u003ch3\u003e\n${d.title}\n\u003c/h3\u003e\n\n\u003cdiv class=\"info-date\"\u003e\n${tanggal}\n\u003c/div\u003e\n\n\u003cdiv class=\"info-content\"\u003e\n${d.isi}\n\u003c/div\u003e\n\n${\nd.gambar\n?\n`\n\u003cimg\nsrc=\"${d.gambar}\"\nclass=\"info-image\"\n\u003e\n`\n:\n\"\"\n}\n\n\u003cdiv class=\"info-actions\"\u003e\n\n${\nd.pdf\n?\n`\n\u003ca\nhref=\"${d.pdf}\"\ntarget=\"_blank\"\nclass=\"info-btn\"\n\u003e\n📄 PDF\n\u003c/a\u003e\n`\n:  }\n\n}\n\n\nfunction updateTotalERP(){\n\nlet gross = 0;\nlet diskon = 0;\nlet total = 0;\n\ncart.forEach(item=\u003e{\n\n  const hargaAwal =\n  (item.harga || 0) * item.qty;\n\n  const nilaiDiskon =\n  hargaAwal *\n  ((item.diskon || 0) / 100);\n\n  const hargaAkhir =\n  hargaAwal - nilaiDiskon;\n\n  gross += hargaAwal;\n  diskon += nilaiDiskon;\n  total += hargaAkhir;\n\n});\n\nconst subTotal =\ndocument.getElementById(\n\"subTotal\"\n);\n\nconst totalDiskon =\ndocument.getElementById(\n\"totalDiskon\"\n);\n\nconst grandTotal =\ndocument.getElementById(\n\"grandTotal\"\n);\n\nif(subTotal){\n\n  subTotal.innerText =\n  formatRupiah(gross);\n\n}\n\nif(totalDiskon){\n\n  totalDiskon.innerText =\n  formatRupiah(diskon);\n\n}\n\nif(grandTotal){\n\n  grandTotal.innerText =\n  formatRupiah(total);\n\n}\n\n}\n\nfunction updateDiskon(i,val){\n\ncart[i].diskon =\nparseFloat(val) || 0;\n\nsyncCart();\n\nautoSaveDraft();\n\nrenderCartERP();\n\n}\n\n\nfunction closeFloatingMenu(){\n\nconst menu =\ndocument.getElementById(\n\"floating-menu\"\n);\n\nif(menu){\nmenu.style.display=\"none\";\n}\n\n}\n\n\nfunction generateOrderInfo(){\n\n  const savedInvoice =\n  localStorage.getItem(vipKey(\"invoiceNo\"));\n\n  const savedWaktu =\n  localStorage.getItem(vipKey(\"waktuOrder\"));\n\n  if(savedInvoice){\n\n    invoiceNo = savedInvoice;\n    waktuOrder = savedWaktu;\n\n    return;\n  }\n\n  const now = new Date();\n\n  invoiceNo =\n    \"SO-\" +\n    now.getFullYear() +\n    String(now.getMonth()+1).padStart(2,\"0\") +\n    String(now.getDate()).padStart(2,\"0\") +\n    \"-\" +\n    window.__VIP_PROFILE.folder + \"-\" +\n    Date.now().toString().slice(-4);\n\n  waktuOrder =\n    now.toLocaleString(\"id-ID\");\n\n  localStorage.setItem(\n    vipKey(\"invoiceNo\"),\n    invoiceNo\n  );\n\n  localStorage.setItem(\n    vipKey(\"waktuOrder\"),\n    waktuOrder\n  );\n\n}\n\nfunction generateKlaimInfo(){\n\n  const now = new Date();\n\n  klaimNo =\n    \"KLM-\" +\n    now.getFullYear() +\n     const message = err.message === "LOGIN_EXPIRED"
      ? "Sesi login Anda telah habis. Silakan login kembali."
      : err.message === "VIP_ACCOUNT_NOT_MATCHED"
        ? "Akun Anda tidak memiliki akses ke halaman ini."
        : err.message === "VIP_NAME_MISSING"
          ? "Informasi akun belum lengkap. Silakan hubungi admin."
          : "Halaman belum dapat dibuka. Periksa koneksi internet, lalu coba lagi.";
    fail(message);
  });
})();
</script></body></html>
