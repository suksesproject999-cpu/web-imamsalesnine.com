03clabel>Tanggal\u003c/label>\n\n\u003cinput\ntype=\"date\"\nvalue=\"${today}\"\n>\n\n\u003c/div>\n\n\u003cdiv class=\"erp-form-group\">\n\n\u003clabel>No Pesanan\u003c/label>\n\n\u003cinput\ntype=\"text\"\nvalue=\"${invoiceNo}\"\nreadonly\n>\n\n\u003c/div>\n\n\u003cdiv class=\"erp-form-group\">\n\n\u003clabel>Waktu Order\u003c/label>\n\n\u003cinput\ntype=\"text\"\nvalue=\"${waktuOrder}\"\nreadonly\n>\n\n\u003c/div>\n\n\u003c/div>\n\n\u003c/div>\n\n\n\u003cdiv class=\"erp-section\">\n\n\u003c!-- PENCARIAN BARANG -->\n\n\u003cdiv class=\"search-box\">\n\n\u003cinput\ntype=\"text\"\nid=\"searchInput\"\nplaceholder=\"Cari/Pilih Barang...\"\nonkeyup=\"showSearch(this.value)\"\nonclick=\"openSearch()\"\n>\n\n\u003cdiv\nid=\"hasil\"\nclass=\"dropdown\"\n>\u003c/div>\n\n\u003c/div>\n\n\u003cbr>\u003cbr>\n\n\u003cdiv class=\"erp-bottom\">\n\n\u003cdiv class=\"erp-table-area\">\n\n\u003ctable class=\"erp-table\">\n\n\u003cthead>\n\u003ctr>\n\u003cth style=\"width:40%\">Nama Barang\u003c/th>\n\u003cth style=\"width:70px\">Qty\u003c/th>\n\u003cth style=\"width:80px\">Satuan\u003c/th>\n\u003cth style=\"width:120px\">Harga\u003c/th>\n\u003cth style=\"width:80px\">Diskon %\u003c/th>\n\u003cth style=\"width:120px\">Total\u003c/th>\n\u003cth style=\"width:80px\">Hapus\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\n\u003ctbody id=\"erp-cart-body\">\n\n\u003ctr>\n\n\u003ctd colspan=\"6\"\nstyle=\"\nheight:450px;\ntext-align:center;\ncolor:#999;\n\">\n\nBelum ada data\n\n\u003c/td>\n\n\u003c/tr>\n\n\u003c/tbody>\n\n\u003c/table>\n\n\u003c/div>\n\n\u003cdiv class=\"erp-footer-area\">\n\n\u003cdiv class=\"erp-action\">\n\n\u003cbutton \nclass=\"btn-new\"\nonclick=\"orderBaru()\"\n>\n➕ \u003cspan class=\"btn-label\">\nData Baru\n\u003c/span>\n\u003c/button>\n\n\u003cbutton\nclass=\"btn-cancel\"\nonclick=\"batalOrder()\"\n>\n\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\n\u003cspan class=\"btn-label\">\nBatal\n\u003c/span>\n\u003c/button>\n\n\n\n\n\n\u003cbutton\nclass=\"btn-draft\"\nonclick=\"simpanDraft()\"\n>\n\u003ci class=\"fa-solid fa-floppy-disk\">\u003c/i>\n\u003cspan class=\"btn-label\">\nSimpan Draft\n\u003c/span>\n\u003c/button>\n\n\n\n\n\u003cbutton\nclass=\"btn-order\"\nonclick=\"kirimWA()\"\n>\n\u003ci class=\"fa-solid fa-paper-plane\">\u003c/i>\n\u003cspan class=\"btn-label\">\nKirim Order\n\u003c/span>\n\u003c/button>\n\n\n\n\u003c/div>\n\n\u003cdiv class=\"erp-summary\">\n\n\u003cdiv class=\"sum-row\">\n\u003cspan>Sub Total\u003c/span>\n\u003cb id=\"subTotal\">Rp 0\u003c/b>\n\u003c/div>\n\n\u003cdiv class=\"sum-row\">\n\u003cspan>Diskon\u003c/span>\n\u003cb id=\"totalDiskon\">Rp 0\u003c/b>\n\u003c/div>\n\n\n\u003cdiv class=\"sum-row total\">\n\u003cspan>Total\u003c/span>\n\u003cb id=\"grandTotal\">Rp 0\u003c/b>\n\u003c/div>\n\n\u003c/div>\n\n\u003c/div>\n\n`;\n\nrenderCartERP();\n\n}\n\n// ================= KLAIM =================\nfunction renderKlaim(){\n  \nsetTabTitle(\n    \"Klaim Barang\"\n  );\n\ngenerateKlaimInfo(); \n\nmode = \"klaim\";\n\ncart = klaimCart;\n\nconst draft =\nlocalStorage.getItem(\nvipKey(\"draftKlaim\")\n);\n\nif(\n  draft &&\n  klaimCart.length===0\n){\n\n  const lanjut =\n  confirm(\n    \"Ditemukan draft klaim.\\n\\nLanjutkan draft?\"\n  );\n\n  if(lanjut){\n    \n    try{\n\n  klaimCart = JSON.parse(draft);\n  cart = klaimCart;\n\n}catch(e){\n\n  localStorage.removeItem(\n    vipKey(\"draftKlaim\")\n  );\n\n}\n\n  }else{\n\n    localStorage.removeItem(\n      vipKey(\"draftKlaim\")\n    );\n\n  }\n\n}\n\n\nklaimNo =\nlocalStorage.getItem(vipKey(\"klaimNo\")) || klaimNo;\n\nwaktuKlaim =\nlocalStorage.getItem(vipKey(\"waktuKlaim\")) || waktuKlaim;\n  \n  const today =\n\nnew Date()\n.toISOString()\n.split(\"T\")[0];\n\ndocument.getElementById(\"main-content\").innerHTML = `\n\n\u003cdiv class=\"erp-order\">\n\u003cdiv class=\"erp-section\">\n\n\u003c!-- FORM CUSTOMER -->\n\n\u003cdiv class=\"erp-form-row\">\n\n\u003cdiv class=\"erp-form-group\">\n\n\u003clabel>Dipesan oleh\u003c/label>\n\n\u003cinput\ntype=\"text\"\nvalue=\"${VIP_NAME}\"\nreadonly\n>\n\n\u003c/div>\n\n\u003cdiv class=\"erp-form-group\">\n\n\u003clabel>Tanggal\u003c/label>\n\n\u003cinput\ntype=\"date\"\nvalue=\"${today}\"\n>\n\n\u003c/div>\n\n\u003cdiv class=\"erp-form-group\">\n\n\u003clabel>No Klaim\u003c/label>\n\n\u003cinput\ntype=\"text\"\nvalue=\"${klaimNo}\"\nreadonly\n>\n\n\u003c/div>\n\n\u003cdiv class=\"erp-form-group\">\n\n\u003clabel>Waktu Klaim\u003c/label>\n\n\u003cinput\ntype=\"text\"\nvalue=\"${waktuKlaim}\"\nreadonly\n>\n\n\u003c/div>\n\n\u003c/div>\n\n\u003c/div>\n\n\n\u003cdiv class=\"erp-section\">\n\n\u003c!-- PENCARIAN BARANG -->\n\n\u003cdiv class=\"search-box\">\n\n\u003cinput\ntype=\"text\"\nid=\"searchInput\"\nplaceholder=\"Cari/Pilih Barang...\"\nonkeyup=\"showSearch(this.value)\"\nonclick=\"openSearch()\"\n>\n\n\u003cdiv\nid=\"hasil\"\nclass=\"dropdown\"\n>\u003c/div>\n\n\u003c/div>\n\n\u003cbr>\u003cbr>\n\n\u003cdiv class=\"erp-bottom\">\n\n\u003cdiv class=\"erp-table-area\">\n\n\u003ctable class=\"erp-table\">\n\n\u003cthead>\n\u003ctr>\n\u003cth style=\"width:40%\">Nama Barang\u003c/th>\n\u003cth style=\"width:70px\">Qty\u003c/th>\n\u003cth style=\"width:80px\">Satuan\u003c/th>\n\u003cth style=\"width:120px\">Harga\u003c/th>\n\u003cth style=\"width:80px\">Diskon %\u003c/th>\n\u003cth style=\"width:120px\">Total\u003c/th>\n\u003cth style=\"width:80px\">Hapus\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\n\u003ctbody id=\"erp-cart-body\">\n\n\u003ctr>\n\n\u003ctd colspan=\"7\"\nstyle=\"\nheight:450px;\ntext-align:center;\ncolor:#999;\n\">\n\nBelum ada data\n\n\u003c/td>\n\n\u003c/tr>\n\n\u003c/tbody>\n\n\u003c/table>\n\n\u003c/div>\n\n\u003cdiv\nstyle=\"\npadding:15px;\nborder-top:1px solid #eee;\n\"\n>\n\n\u003clabel\nstyle=\"\ndisplay:block;\nmargin-bottom:8px;\nfont-weight:600;\n\"\n>\n\nKeterangan Klaim\n\n\u003c/label>\n\n\u003ctextarea\nid=\"ket\"\nplaceholder=\"Contoh: Barang pecah, lampu mati, warna tidak sesuai, unit kurang lengkap...\"\nstyle=\"\nwidth:100%;\nheight:90px;\npadding:10px;\nborder:1px solid #ddd;\nborder-radius:6px;\nbox-sizing:border-box;\nresize:none;\n\"\n>\u003c/textarea>\n\n\u003c/div>\n\n\u003cdiv class=\"erp-footer-area\">\n\n\u003cdiv class=\"erp-action\">\n\n\n\u003cbutton \nclass=\"btn-new\"\nonclick=\"orderBaru()\"\n>\n\u003ci class=\"fa-solid fa-plus\">\u003c/i>\n\u003cspan class=\"btn-label\">\nData Baru\n\u003c/span>\n\u003c/button>\n\n\n\n\n\u003cbutton\nclass=\"btn-cancel\"\nonclick=\"batalOrder()\"\n>\n\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\n\u003cspan class=\"btn-label\">\nBatal\n\u003c/span>\n\u003c/button>\n\n\n\n\n\n\u003cbutton\nclass=\"btn-draft\"\nonclick=\"simpanDraft()\"\n>\n\u003ci class=\"fa-solid fa-floppy-disk\">\u003c/i>\n\u003cspan class=\"btn-label\">\nSimpan Draft\n\u003c/span>\n\u003c/button>\n\n\n\n\n\u003cbutton\nclass=\"btn-order btn-klaim\"\nonclick=\"kirimKlaim()\"\n>\n\u003ci class=\"fa-solid fa-rotate\">\u003c/i>\nKirim Klaim\n\u003c/button>\n\n\n\n\u003c/div>\n\n\u003cdiv class=\"erp-summary\">\n\n\u003cdiv class=\"sum-row\">\n\u003cspan>Sub Total\u003c/span>\n\u003cb id=\"subTotal\">Rp 0\u003c/b>\n\u003c/div>\n\n\u003cdiv class=\"sum-row\">\n\u003cspan>Diskon\u003c/span>\n\u003cb id=\"totalDiskon\">Rp 0\u003c/b>\n\u003c/div>\n\n\n\u003cdiv class=\"sum-row total\">\n\u003cspan>Total\u003c/span>\n\u003cb id=\"grandTotal\">Rp 0\u003c/b>\n\u003c/div>\n\n\u003c/div>\n\n\u003c/div>\n\n`;\n\nrenderCartERP();\n\n}\n\n// ================= SEARCH =================\nfunction openSearch(){\n  document.getElementById(\"hasil\").style.display = \"block\";\n}\n\nfunction showSearch(val){\n\n  let el = document.getElementById(\"hasil\");\n  el.innerHTML = \"\";\n\n  if(!val){\n    el.style.display = \"none\";\n    return;\n  }\n\n  let keyword =\nval.toLowerCase().trim();\n\nlet hasil = allProduk.filter(p => {\n\n  let nama =\n  p.toLowerCase();\n\n  return nama.includes(keyword);\n\n});\n\n// 🔥 PRIORITAS YANG PALING MIRIP\nhasil.sort((a,b)=>{\n\n  let aa =\n  a.toLowerCase();\n\n  let bb =\n  b.toLowerCase();\n\n  return (\n    aa.indexOf(keyword)\n    -\n    bb.indexOf(keyword)\n  );\n\n});\n\n  hasil.slice(0,20).forEach(item=>{\n\n  let div = document.createElement(\"div\");\n\n  let kosong = false;\n\nif(\n  window.stokData &&\n  window.stokData.length > 0\n){\n  kosong = window.isKosong(item);\n}\n\n  \ndiv.innerHTML = kosong\n    ? '\u003ci class=\"fa-solid fa-circle-xmark\">\u003c/i> ' + item + ' (Stok Habis)'\n    : '\u003ci class=\"fa-solid fa-circle-check\">\u003c/i> ' + item;\n\n\n\n  if(kosong){\n    div.style.color = \"#888\";\n    div.style.opacity = \"0.6\";\n  }\n\n  if(kosong && mode === \"order\"){\n    div.style.cursor = \"not-allowed\";\n  } else {\n    div.style.cursor = \"pointer\";\n  }\n\n  div.onclick = () => {\n\n  if(mode === \"order\" && kosong){\n\n    Swal.fire({\n        icon: \"warning\",\n        title: \"Stok Produk Kosong\",\n        text: \"Produk ini sedang tidak tersedia untuk dipesan.\",\n        confirmButtonText: \"Mengerti\",\n        confirmButtonColor: \"#8CC63F\",\n        customClass: {\n            popup: \"swal-vip-popup\",\n            title: \"swal-vip-title\",\n            confirmButton: \"swal-vip-confirm\"\n        }\n    });\n\n    return;\n}\n\n  tambahItem(item);\n\n  el.style.display = \"none\";\n\n  document.getElementById(\"searchInput\").value = \"\";\n\n  document.getElementById(\"searchInput\").blur();\n\n};\n\n  el.appendChild(div);\n});\n\n  el.style.display = \"block\";\n}\n\n// ================= CART =================\nfunction tambahItem(nama){\n\n  let existing = cart.find(x => x.nama === nama);\n\n  if(existing){\n    existing.qty++;\n  } else {\n    cart.push({\n\nnama,\n\nqty:1,\n\nsatuan:\"pcs\",\n\nharga:0,\n\ndiskon:0\n\n});\n\n  }\n  \n  syncCart();\n\n  autoSaveDraft();\n\n  renderCart();\n  \n  renderCartERP();\n}\n\nfunction renderCartERP(){\n\nconst body =\ndocument.getElementById(\n\"erp-cart-body\"\n);\n\n\nif(!body) return;\n\nbody.innerHTML = \"\";\n\nif(cart.length===0){\n\nbody.innerHTML = `\n\u003ctr>\n\u003ctd colspan=\"7\"\nstyle=\"\ntext-align:center;\ncolor:#999;\npadding:100px 0;\n\">\nBelum ada data\n\u003c/td>\n\u003c/tr>\n`;\n\nreturn;\n\n}\n\ncart.forEach((item,i)=>{\n\nconst subtotal =\n(item.harga || 0) * item.qty;\n\nconst diskon =\nsubtotal *\n((item.diskon || 0) / 100);\n\nconst total =\nsubtotal - diskon;\n\nbody.innerHTML += `\n\n\u003ctr>\n\n\u003ctd>${item.nama}\u003c/td>\n\n\u003ctd>\n\n\u003cinput\ntype=\"number\"\nvalue=\"${item.qty}\"\nmin=\"1\"\nonchange=\"updateQty(${i},this.value)\"\nstyle=\"\nwidth:60px;\ntext-align:center;\n\"\n>\n\n\u003c/td>\n\n\u003ctd>\n\n\u003cbutton\nclass=\"unit-btn\"\nonclick=\"toggleSatuan(${i})\"\n>\n\n${item.satuan}\n\n\u003c/button>\n\n\u003c/td>\n\n\u003ctd>\n\n\u003cinput\ntype=\"text\"\nvalue=\"${item.harga ? formatInputRupiah(item.harga) : ''}\"\noninput=\"handleHargaERP(this,${i})\"\n>\n\n\u003c/td>\n\n\u003ctd>\n\n\u003cinput\ntype=\"number\"\nmin=\"0\"\nmax=\"100\"\nvalue=\"${item.diskon || 0}\"\nonchange=\"updateDiskon(${i},this.value)\"\nstyle=\"width:60px;text-align:center;\"\n>\n\n\u003c/td>\n\n\u003ctd id=\"rowTotal${i}\">\n\n${formatRupiah(total)}\n\n\u003c/td>\n\n\u003ctd>\n\n\n\u003cbutton\nonclick=\"hapus(${i})\"\nclass=\"btn-delete\"\ntitle=\"Hapus\"\n>\n\n\u003ci class=\"fa-solid fa-trash-can\">\u003c/i>\n\n\u003c/button>\n\n\n\n\u003c/td>\n\n\u003c/tr>\n\n`;\n\n});\n\nlet subtotal = 0;\n\ncart.forEach(item=>{\n  subtotal += (item.harga || 0) * item.qty;\n});\n\nupdateTotalERP();\n\n}\n\nfunction renderCart(){\n\n  let el = document.getElementById(\"cart-list\");\n\n  if(!el) return;\n\n  el.innerHTML = \"\";\n\n  cart.forEach((item,i)=>{\n\n    let div = document.createElement(\"div\");\n    div.className = \"cart-item\";\n\n    div.innerHTML = `\n  \u003cb>${item.nama}\u003c/b>\n\n  \u003cdiv class=\"cart-row\">\n\n    \u003cbutton onclick=\"kurang(${i})\">➖\u003c/button>\n\n    \u003cinput type=\"number\" value=\"${item.qty}\" min=\"1\"\n      onchange=\"updateQty(${i}, this.value)\">\n\n    \u003cbutton onclick=\"tambah(${i})\">➕\u003c/button>\n\n    \u003cselect onchange=\"updateSatuan(${i}, this.value)\">\n      \u003coption ${item.satuan==\"pcs\"?\"selected\":\"\"}>pcs\u003c/option>\n      \u003coption ${item.satuan==\"set\"?\"selected\":\"\"}>set\u003c/option>\n    \u003c/select>\n\n    \u003cinput type=\"text\" placeholder=\"Harga\"\n      value=\"${item.harga ? formatInputRupiah(item.harga) : \"\"}\"\n      oninput=\"handleHargaInput(this, ${i})\">\n\n    \u003cbutton onclick=\"hapus(${i})\">❌\u003c/button>\n\n  \u003c/div>\n\n  \u003cdiv class=\"subtotal\">\n    💰 Subtotal: ${formatRupiah((item.harga || 0) * item.qty)}\n  \u003c/div>\n`;\n\n    el.appendChild(div);\n  });\n\nlet total = 0;\n\ncart.forEach(item=>{\n  total += (item.harga || 0) * item.qty;\n});\n\nlet totalDiv = document.createElement(\"div\");\ntotalDiv.innerHTML = `\u003cb>💰 Total: ${formatRupiah(total)}\u003c/b>`;\n\nel.appendChild(totalDiv);\n}\n\nfunction tambah(i){\n\ncart[i].qty++;\n\nsyncCart();\n\nautoSaveDraft();\n\nrenderCart();\n\nrenderCartERP();\n\n}\n\nfunction kurang(i){\n  if(cart[i].qty>1){ cart[i].qty--; }\n  else{ cart.splice(i,1); }\n  \n  syncCart();\n  \n  autoSaveDraft();\n  \n  renderCart();\n  \n  renderCartERP();\n}\n\nfunction hapus(i){\n  cart.splice(i,1);\n  \n  syncCart();\n  \n  autoSaveDraft();\n\n  renderCart();\n  \n  renderCartERP();\n\n  updateTotalERP();\n}\n\nfunction updateSatuan(i,val){\n\n  cart[i].satuan = val;\n\n  renderCartERP();\n\n}\n\nfunction updateHarga(i,val){\n\n  let v = parseInt(val) || 0;\n\n  cart[i].harga = v;\n\n}\n\nfunction formatRupiah(angka){\n  return \"Rp \" + (angka || 0).toLocaleString(\"id-ID\");\n}\n\nfunction formatInputRupiah(angka){\n  return angka.toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, \".\");\n}\n\nfunction handleHargaInput(el, i){\n\n  // ambil angka murni (hapus titik)\n  let angka = el.value.replace(/\\D/g, \"\");\n\n  // simpan ke cart sebagai number\n    style=\"\n          width:100%;\n          margin-top:12px;\n          border-radius:16px;\n        \"\n      >\n      `\n      :\n      \"\"\n    }\n\n  \u003c/div>\n\n`;\n\n  input.value = \"\";\n  \n  chatBox.scrollTop =\n  chatBox.scrollHeight;\n\n  memory.push({\n    role:\"user\",\n    content:message\n  });\n\n  // LOADING\n\n  const loadingId =\n  \"loading-\" + Date.now();\n\n  chatBox.innerHTML += `\n\n    \u003cdiv\n      class=\"imam-ai-msg\"\n      id=\"${loadingId}\"\n    >\n\n      \u003cdiv class=\"typing\">\n\n        \u003cspan>\u003c/span>\n        \u003cspan>\u003c/span>\n        \u003cspan>\u003c/span>\n\n      \u003c/div>\n\n    \u003c/div>\n\n  `;\n\n  chatBox.scrollTop =\n  chatBox.scrollHeight;\n\n  try {\n\n    const formData =\nnew FormData();\n\nformData.append(\n  \"vip\",\n  VIP_NAME\n);\n\nformData.append(\n  \"message\",\n  message\n);\n\nformData.append(\n  \"memory\",\n  JSON.stringify(memory)\n);\n\nformData.append(\n  \"orders\",\n  JSON.stringify(cart)\n);\n\nif(uploadedFile){\n\n  formData.append(\n    \"image\",\n    uploadedFile\n  );\n\n}\n\nconst res = await fetch(\n\n  \"/.netlify/functions/chat\",\n\n  {\n\n    method:\"POST\",\n\n    headers:{\n\n      Authorization:\n      \"Bearer \" +\n      localStorage.getItem(\"token\")\n\n    },\n\n    body:formData\n\n  }\n\n);\n\n    if(!res.ok){\n\n      throw new Error(\n        \"HTTP ERROR \" + res.status\n      );\n\n    }\n\n    const data =\n    await res.json();\n    \n    uploadedFile = null;\nuploadedBase64 = null;\n\n    document.getElementById(\n\"image-upload\"\n).value = \"\";\n\ndocument.getElementById(\n\"preview-box\"\n).innerHTML = \"\";\n\n    console.log(\n      \"AI RESPONSE:\",\n      data\n    );\n\n    let aiText =\n\n      data.reply\n      || \"❌ AI gagal jawab\";\n\n    let imageHtml = \"\";\n\n    if(data.image){\n\n      imageHtml = `\n\n        \u003cdiv style=\"margin-top:15px;\">\n\n          \u003cimg\n            src=\"${data.image}\"\n            style=\"\n              width:100%;\n              border-radius:18px;\n              margin-top:10px;\n              box-shadow:\n              0 10px 25px rgba(0,0,0,.35);\n            \"\n          >\n\n        \u003c/div>\n\n      `;\n\n    }\n\n    const loadingBubble =\n    document.getElementById(\n      loadingId\n    );\n    \nif(loadingBubble){\n\n  loadingBubble.outerHTML = `\n\n\u003cdiv class=\"imam-ai-msg\">\n\n  \u003cdiv id=\"${loadingId}-text\">\u003c/div>\n\n  ${imageHtml}\n\n  \u003cdiv class=\"ai-action\">\n\n    \n\u003cbutton\n    onclick=\"copyAI(this)\"\n    class=\"copy-btn\"\n>\n    \u003ci class=\"fa-solid fa-copy\">\u003c/i> Copy\n\u003c/button>\n\n\n\n    ${\n      data.image\n      ?\n      `\n      \n\u003cbutton\n    onclick=\"downloadImage('${data.image}')\"\n    class=\"download-btn\"\n>\n    \u003ci class=\"fa-solid fa-download\">\u003c/i> Download\n\u003c/button>\n\n      `\n      :\n      \"\"\n    }\n\n  \u003c/div>\n\n\u003c/div>\n\n`;\n\n  const streamTarget =\n\n  document.getElementById(\n    `${loadingId}-text`\n  );\n\n  await streamText(\n    streamTarget,\n    aiText\n  );\n\n}\n\nmemory.push({\n\n  role:\"assistant\",\n\n  content:aiText\n\n});\n\nchatBox.scrollTop =\nchatBox.scrollHeight;\n\n  } catch(err){\n\n    console.log(\n      \"FRONTEND ERROR:\",\n      err\n    );\n\n    const loadingBubble =\n    document.getElementById(\n      loadingId\n    );\n\n    if(loadingBubble){\n\n      loadingBubble.outerHTML = `\n\n        \u003cdiv class=\"imam-ai-msg\">\n\n          ❌ SERVER ERROR\n\n          \u003cbr>\u003cbr>\n\n          ${err.message}\n\n        \u003c/div>\n\n      `;\n\n    }\n\n    chatBox.scrollTop =\n    chatBox.scrollHeight;\n\n  }\n\n}\n\nasync function streamText(\n  element,\n  text\n){\n\n  let current = \"\";\n\n  for(\n    let i = 0;\n    i \u003c text.length;\n    i++\n  ){\n\n    current += text[i];\n\n    element.innerHTML =\n    marked.parse(current);\n\n    await new Promise(\n      resolve =>\n      setTimeout(resolve, 8)\n    );\n\n  }\n\n}\n\nfunction downloadImage(imageSrc){\n\n  const link =\n  document.createElement(\"a\");\n\n  link.href = imageSrc;\n\n  link.download =\n  \"imamgpt-image.png\";\n\n  document.body.appendChild(link);\n\n  link.click();\n\n  document.body.removeChild(link);\n\n}\n\nfunction copyAI(btn){\n\n  const text =\n\n  btn.parentElement\n  .parentElement\n  .innerText;\n\n  navigator.clipboard.writeText(text);\n\n  \nbtn.innerHTML = '\u003ci class=\"fa-solid fa-check\">\u003c/i> Copied';\n\nsetTimeout(() => {\n\n    btn.innerHTML = '\u003ci class=\"fa-solid fa-copy\">\u003c/i> Copy';\n\n}, 2000);\n\n\n\n}\n\nwindow.renderOrder = renderOrder;\nwindow.renderKlaim = renderKlaim;\n\nwindow.kirimWA = kirimWA;\nwindow.kirimKlaim = kirimKlaim;\n\nwindow.goHistory = goHistory;\n\nwindow.tanyaAI = tanyaAI;\n\nwindow.tambah = tambah;\nwindow.kurang = kurang;\nwindow.hapus = hapus;\n\nwindow.updateQty = updateQty;\nwindow.updateSatuan = updateSatuan;\nwindow.handleHargaInput = handleHargaInput;\nwindow.updateHarga = updateHarga;\nwindow.toggleSatuan = toggleSatuan;\n\nwindow.copyAI = copyAI;\nwindow.downloadImage = downloadImage;\n\nfunction renderDashboard(){\n  \n setTabTitle(\n    \"Dashboard\"\n  );\n\ndocument.getElementById(\n\"main-content\"\n).innerHTML = `\n\n\u003cdiv class=\"card\">\n\n\u003cdiv class=\"badge\">\nVIP CUSTOMER\n\u003c/div>\n\n\u003cdiv id=\"live-clock\"\nstyle=\"\nmargin-top:10px;\nfont-size:14px;\nopacity:.8;\n\">\n\u003c/div>\n\n\n\u003ch1>\nSelamat Datang, ${vipDisplayName(VIP_NAME)} \u003ci class=\"fa-solid fa-lock\">\u003c/i>\n\u003c/h1>\n\n\n\n\u003cp>\n\nTerima kasih atas kepercayaan dan kerja sama yang telah terjalin.\n\nHalaman ini kami dedikasikan khusus untuk Anda sebagai mitra terpilih,dengan akses penawaran terbaik yang tidak tersedia secara umum.\n\n\u003c/p>\n\n\u003cdiv class=\"announcement-bar\">\n\n\u003cspan id=\"announcement\">\nLoading...\n\u003c/span>\n\n\u003c/div>\n\n\u003c/div>\n\n`;\n\n}\n\nfunction goHistoryOrder(){\n    window.location.href = window.__VIP_PROFILE.root + \"/history.html?type=order\";\n}\n\nfunction goHistoryKlaim(){\n    window.location.href = window.__VIP_PROFILE.root + \"/history.html?type=klaim\";\n}\n\n\nfunction openTab(page){\n\nconst existing =\nopenedTabs.find(\nt => t.id === page\n);\n\nif(!existing){\n\nopenedTabs.push({\n\nid: page,\n\ntitle:\npageTitles[page] || page\n\n});\n\n}\n\nactiveTab = page;\n\nrenderTabs();\n\nshowPage(page);\n\n}\n\nfunction closeTab(page){\n\nopenedTabs =\nopenedTabs.filter(\ntab => tab.id !== page\n);\n\nif(activeTab === page){\n\nactiveTab =\nopenedTabs.length\n? openedTabs[openedTabs.length - 1].id\n: \"dashboard\";\n\nshowPage(activeTab);\n\n}\n\nrenderTabs();\n\n}\n\n\nfunction renderTabs(){\n\nconst wrap =\ndocument.getElementById(\n\"erp-tabs\"\n);\n\nif(!wrap) return;\n\nwrap.innerHTML = \"\";\n\nopenedTabs.forEach(tab=>{\n\nwrap.innerHTML += `\n\n\u003cdiv\nclass=\"tab ${\nactiveTab===tab.id\n? \"active\"\n: \"\"\n}\"\n>\n\n\u003cspan\nonclick=\"openTab('${tab.id}')\"\nstyle=\"\ncursor:pointer;\n\"\n>\n\n${tab.title}\n\n\u003c/span>\n\n${\ntab.id !== \"dashboard\"\n?\n`\n\u003cspan\nstyle=\"\nmargin-left:8px;\ncursor:pointer;\nfont-weight:bold;\n\"\nonclick=\"\nevent.stopPropagation();\ncloseTab('${tab.id}')\n\"\n>\n✕\n\u003c/span>\n`\n:\n\"\"\n}\n\n\u003c/div>\n\n`;\n\n});\n\n}\n\n\nfunction showPage(page){\n\n  activeTab = page;\n\n  renderTabs();\n\n  closeFloatingMenu();\n\n  switch(page){\n\n    case \"dashboard\":\n      renderDashboard();\n      break;\n\n    case \"info\":\n      renderInfo();\n      break;\n\n    case \"order\":\n      renderOrder();\n      break;\n\n    case \"klaim\":\n      renderKlaim();\n      break;\n\n    case \"pengiriman\":\n      renderPengiriman();\n      break;\n\n    case \"retur\":\n      renderRetur();\n      break;\n\n    case \"ai\":\n      renderAI();\n      break;\n\n    case \"pricelist\":\n      window.open(\n        \"/pricelist.pdf\",\n        \"_blank\"\n      );\n      break;\n\n    case \"katalog\":\n      window.open(\n        \"/katalog.pdf\",\n        \"_blank\"\n      );\n      break;\n\n  }\n\n}\n\nfunction togglePenjualan(){\n\nconst menu =\ndocument.getElementById(\n\"floating-menu\"\n);\n\nmenu.style.display =\n\nmenu.style.display===\"block\"\n?\n\"none\"\n:\n\"block\";\n\n}\n\nfunction renderInfo(){\n  \n  const VIP_NAME = window.__VIP_PROFILE.name;\n\n  setTabTitle(\"Informasi\");\n\n  document.getElementById(\n    \"main-content\"\n  ).innerHTML = `\n\n  \n  \n\u003cdiv class=\"card\">\n\n    \u003ch2>\u003ci class=\"fa-solid fa-circle-info\">\u003c/i> Informasi\u003c/h2>\n\n    \u003cdiv id=\"info-list\">\n        Loading...\n    \u003c/div>\n\n\u003c/div>\n\n\n\n  `;\n\n  db.collection(\"info_distributor\")\n  .where(\"aktif\",\"==\",true)\n  .orderBy(\"created_at\",\"desc\")\n  .onSnapshot((snap)=>{\n\n    let html=\"\";\n\n    if(snap.empty){\n\n      document.getElementById(\n        \"info-list\"\n      ).innerHTML = `\n      \u003cdiv class=\"card\">\n        Belum ada informasi terbaru.\n      \u003c/div>\n      `;\n\n      return;\n    }\n\n    snap.forEach(doc=>{\n\n      const d = doc.data();\n      \n      if(\n d.target !== \"all\" &&\n d.target !== VIP_NAME\n){\n return;\n}\n\n      const tanggal =\n      d.created_at\n      ?\n      d.created_at\n      .toDate()\n      .toLocaleString(\"id-ID\")\n      :\n      \"-\";\n\n      html += `\n\n\u003cdiv class=\"\ninfo-card\n${d.prioritas===\"high\"\n?\"info-important\"\n:\"\"}\n\">\n\n\n\u003cdiv class=\"info-title\">\n\n${\nd.prioritas===\"high\"\n?\n'\u003ci class=\"fa-solid fa-triangle-exclamation\">\u003c/i> PENTING'\n:\n'\u003ci class=\"fa-solid fa-circle-info\">\u003c/i> INFORMASI'\n}\n\n\u003c/div>\n\n\n\n\u003ch3>\n${d.title}\n\u003c/h3>\n\n\u003cdiv class=\"info-date\">\n${tanggal}\n\u003c/div>\n\n\u003cdiv class=\"info-content\">\n${d.isi}\n\u003c/div>\n\n${\nd.gambar\n?\n`\n\u003cimg\nsrc=\"${d.gambar}\"\nclass=\"info-image\"\n>\n`\n:\n\"\"\n}\n\n\u003cdiv class=\"info-actions\">\n\n${\nd.pdf\n?\n`\n\u003ca\nhref=\"${d.pdf}\"\ntarget=\"_blank\"\nclass=\"info-btn\"\n>\n📄 PDF\n\u003c/a>\n`\n:\n\"\"\n}\n\n${\nd.link\n?\n`\n\u003ca\nhref=\"${d.link}\"\ntarget=\"_blank\"\nclass=\"info-btn\"\n>\n🔗 Link\n\u003c/a>\n`\n:\n\"\"\n}\n\n\u003c/div>\n\n\u003c/div>\n\n`;\n\n    });\n\n    document.getElementById(\n      \"info-list\"\n    ).innerHTML = html;\n\n  });\n\n}\n\n\nfunction renderAI(){\n  \nsetTabTitle(\n    \"AI\"\n  );\n\ndocument.getElementById(\n\"main-content\"\n).innerHTML = `\n\n\u003cdiv class=\"imam-ai-container\">\n\n\n\u003cdiv class=\"imam-ai-header\">\n\u003ci class=\"fa-solid fa-wand-magic-sparkles\">\u003c/i>\nImam AI Assistant\n\u003c/div>\n\n\n\n\u003cdiv id=\"imam-chat-box\">\u003c/div>\n\n\u003cdiv id=\"preview-box\">\u003c/div>\n\n\u003cdiv class=\"imam-chat-input-wrap\">\n\n\n\u003clabel\nfor=\"image-upload\"\nclass=\"upload-btn\"\n>\n\u003ci class=\"fa-solid fa-image\">\u003c/i>\n\u003c/label>\n\n\n\n\u003cinput\ntype=\"file\"\nid=\"image-upload\"\naccept=\"image/*\"\nhidden\n>\n\n\n\u003ctextarea\nid=\"imam-ai-input\"\nplaceholder=\"Tanya Imam AI...\"\n>\u003c/textarea>\n\n\u003cbutton onclick=\"tanyaAI()\">\n\u003ci class=\"fa-solid fa-paper-plane\">\u003c/i>\n\u003c/button>\n\n\u003c/div>\n\n\u003c/div>\n\n\n\n`;\n\nconst chatBox =\ndocument.getElementById(\n\"imam-chat-box\"\n);\n\nif(memory.length===0){\n\n\nchatBox.innerHTML = `\n\n\u003cdiv class=\"imam-ai-msg\">\n\n👋 Halo ${vipDisplayName(VIP_NAME)}.\n\nSaya Imam AI .\n\nSaya bisa membantu:\n\n• Info tentang produk nine autoseries\n• Info sales nine autoseries\n• Info syarat menjadi mitra nine autoseries\n• Informasi umum lainnya\n\nSilakan ketik pertanyaan Anda.\n\n\u003c/div>\n\n`;\n\n}\n\ninitAI();\ninitTextarea();\n\n}\n\n\nfunction openMenu(page){\n\nconst menu =\ndocument.getElementById(\n\"floating-menu\"\n);\n\nif(menu){\nmenu.style.display=\"none\";\n}\n\nopenTab(page);\n\n}\n\nfunction renderPengiriman(){\n  \n  setTabTitle(\n    \"Pengiriman\"\n  );\n  \ndocument.getElementById(\n\"main-content\"\n).innerHTML = `\n\n\u003cdiv class=\"card\">\n\n\n\u003ch2>\u003ci class=\"fa-solid fa-truck-fast\">\u003c/i> Pengiriman\u003c/h2>\n\n\u003cdiv id=\"pengiriman-list\">\nLoading...\n\u003c/div>\n\n\n\n\u003c/div>\n\n`;\n\n}\n\nfunction renderRetur(){\n  \nsetTabTitle(\n    \"Retur\"\n  );\n\ndocument.getElementById(\n\"main-content\"\n).innerHTML = `\n\n\u003cdiv class=\"card\">\n\n\n\u003ch2>\u003ci class=\"fa-solid fa-arrow-rotate-left\">\u003c/i> Retur\u003c/h2>\n\n\u003cdiv id=\"retur-list\">\nLoading...\n\u003c/div>\n\n\n\n\u003c/div>\n\n`;\n\n}\n\n\nfunction initAI(){\n\nconst imageUpload =\ndocument.getElementById(\"image-upload\");\n\nif(!imageUpload) return;\n\nimageUpload.addEventListener(\n\"change\",\nfunction(e){\n\nuploadedFile = e.target.files[0];\n\nif(!uploadedFile) return;\n\nconst reader = new FileReader();\n\nreader.onload = function(event){\n\nuploadedBase64 = event.target.result;\n\ndocument.getElementById(\n\"preview-box\"\n).innerHTML = `\n\n\u003cdiv class=\"preview-card\">\n\n\u003cimg\nsrc=\"${uploadedBase64}\"\nstyle=\"\nwidth:70px;\nheight:70px;\nobject-fit:cover;\nborder-radius:12px;\n\">\n\n\n\u003cdiv style=\"flex:1;\">\n\u003ci class=\"fa-solid fa-paperclip\">\u003c/i> ${uploadedFile.name}\n\u003c/div>\n\n\n\n\u003cbutton\nonclick=\"removeUpload()\"\nstyle=\"\nborder:none;\nbackground:#ef4444;\ncolor:white;\nwidth:28px;\nheight:28px;\nborder-radius:50%;\ncursor:pointer;\n\">\n✕\n\u003c/button>\n\n\u003c/div>\n\n`;\n\n};\n\nreader.readAsDataURL(uploadedFile);\n\n});\n\n}\n\nfunction removeUpload(){\n\nuploadedFile = null;\nuploadedBase64 = null;\n\nconst input =\ndocument.getElementById(\"image-upload\");\n\nif(input){\ninput.value=\"\";\n}\n\nconst preview =\ndocument.getElementById(\"preview-box\");\n\nif(preview){\npreview.innerHTML=\"\";\n}\n\n}\n\nfunction setActive(el){\n\ncloseFloatingMenu();\n\ndocument\n.querySelectorAll(\".sidebar-btn\")\n.forEach(btn=>{\n\nbtn.classList.remove(\n\"active\"\n);\n\n});\n\nel.classList.add(\n\"active\"\n);\n\n}\n\nfunction initTextarea(){\n\nconst imamInput =\ndocument.getElementById(\n\"imam-ai-input\"\n);\n\nif(!imamInput) return;\n\nimamInput.addEventListener(\n\"input\",\n()=>{\n\nimamInput.style.height=\"auto\";\n\nimamInput.style.height=\nimamInput.scrollHeight+\"px\";\n\n});\n\n}\n\nfunction toggleSatuan(i){\n\n  cart[i].satuan =\n  cart[i].satuan === \"pcs\"\n  ? \"set\"\n  : \"pcs\";\n  \n  syncCart();\n  \n  autoSaveDraft();\n\n  renderCartERP();\n\n}\n\nfunction simpanDraft(){\n\n if(mode===\"order\"){\n\n   localStorage.setItem(\n     vipKey(\"draftOrder\"),\n     JSON.stringify(orderCart)\n   );\n\n }else{\n\n   localStorage.setItem(\n     vipKey(\"draftKlaim\"),\n     JSON.stringify(klaimCart)\n   );\n\n }\n\n alert(\"Draft tersimpan bro 😎\");\n\n}\n\nfunction handleHargaERP(el,i){\n\nlet angka =\nel.value.replace(/\\D/g,\"\");\n\ncart[i].harga =\nparseInt(angka) || 0;\n\nel.value =\nformatInputRupiah(angka);\n\nconst subtotal =\ncart[i].qty * cart[i].harga;\n\nconst diskon =\nsubtotal *\n((cart[i].diskon || 0) / 100);\n\nconst total =\nsubtotal - diskon;\n\nconst row =\ndocument.getElementById(\n`rowTotal${i}`\n);\n\nif(row){\n\nrow.innerText =\nformatRupiah(total);\n\n}\n\nsyncCart();\n\nupdateTotalERP();\n\nautoSaveDraft();\n\n}\n\nfunction getDraftKey(){\n\n  return mode === \"order\"\n  ? \"draftOrder\"\n  : \"draftKlaim\";\n\n}\n\nfunction autoSaveDraft(){\n\n if(mode===\"order\"){\n\n   localStorage.setItem(\n     vipKey(\"draftOrder\"),\n     JSON.stringify(orderCart)\n   );\n\n }else{\n\n   localStorage.setItem(\n     vipKey(\"draftKlaim\"),\n     JSON.stringify(klaimCart)\n   );\n\n }\n\n}\n\nfunction syncCart(){\n\n  if(mode===\"order\"){\n\n    orderCart = cart;\n\n  }else{\n\n    klaimCart = cart;\n\n  }\n\n}\n\n\nfunction updateTotalERP(){\n\nlet gross = 0;\nlet diskon = 0;\nlet total = 0;\n\ncart.forEach(item=>{\n\n  const hargaAwal =\n  (item.harga || 0) * item.qty;\n\n  const nilaiDiskon =\n  hargaAwal *\n  ((item.diskon || 0) / 100);\n\n  const hargaAkhir =\n  hargaAwal - nilaiDiskon;\n\n  gross += hargaAwal;\n  diskon += nilaiDiskon;\n  total += hargaAkhir;\n\n});\n\nconst subTotal =\ndocument.getElementById(\n\"subTotal\"\n);\n\nconst totalDiskon =\ndocument.getElementById(\n\"totalDiskon\"\n);\n\nconst grandTotal =\ndocument.getElementById(\n\"grandTotal\"\n);\n\nif(subTotal){\n\n  subTotal.innerText =\n  formatRupiah(gross);\n\n}\n\nif(totalDiskon){\n\n  totalDiskon.innerText =\n  formatRupiah(diskon);\n\n}\n\nif(grandTotal){\n\n  grandTotal.innerText =\n  formatRupiah(total);\n\n}\n\n}\n\nfunction updateDiskon(i,val){\n\ncart[i].diskon =\nparseFloat(val) || 0;\n\nsyncCart();\n\nautoSaveDraft();\n\nrenderCartERP();\n\n}\n\n\nfunction closeFloatingMenu(){\n\nconst menu =\ndocument.getElementById(\n\"floating-menu\"\n);\n\nif(menu){\nmenu.style.display=\"none\";\n}\n\n}\n\n\nfunction generateOrderInfo(){\n\n  const savedInvoice =\n  localStorage.getItem(vipKey(\"invoiceNo\"));\n\n  const savedWaktu =\n  localStorage.getItem(vipKey(\"waktuOrder\"));\n\n  if(savedInvoice){\n\n    invoiceNo = savedInvoice;\n    waktuOrder = savedWaktu;\n\n    return;\n  }\n\n  const now = new Date();\n\n  invoiceNo =\n    \"SO-\" +\n    now.getFullYear() +\n    String(now.getMonth()+1).padStart(2,\"0\") +\n    String(now.getDate()).padStart(2,\"0\") +\n    \"-\" +\n    window.__VIP_PROFILE.folder + \"-\" +\n    Date.now().toString().slice(-4);\n\n  waktuOrder =\n    now.toLocaleString(\"id-ID\");\n\n  localStorage.setItem(\n    vipKey(\"invoiceNo\"),\n    invoiceNo\n  );\n\n  localStorage.setItem(\n    vipKey(\"waktuOrder\"),\n    waktuOrder\n  );\n\n}\n\nfunction generateKlaimInfo(){\n\n  const now = new Date();\n\n  klaimNo =\n    \"KLM-\" +\n    now.getFullYear() +\n    String(now.getMonth()+1).padStart(2,\"0\") +\n    String(now.getDate()).padStart(2,\"0\") +\n    \"-\" +\n    window.__VIP_PROFILE.folder + \"-\" +\n    Date.now().toString().slice(-4);\n\n  waktuKlaim =\n    now.toLocaleString(\"id-ID\");\n\n  localStorage.setItem(\n    vipKey(\"klaimNo\"),\n    klaimNo\n  );\n\n  localStorage.setItem(\n    vipKey(\"waktuKlaim\"),\n    waktuKlaim\n  );\n\n}\n\nfunction refreshPageMode(){\n\nif(mode===\"order\"){\n\ngenerateOrderInfo();\nrenderOrder();\n\n}else{\n\ngenerateKlaimInfo();\nrenderKlaim();\n\n}\n\n}\n\n\nfunction setTabTitle(text){\n\n}\n\nopenedTabs = [\n{\n  id:\"dashboard\",\n  title:\"Dashboard\"\n}\n];\n\nactiveTab = \"dashboard\";\n\nrenderTabs();\nshowPage(\"dashboard\");\n  \n\n\n\u003c/script>\n\n\u003cscript src=\"/announcement.js\">\u003c/script>\n\n \u003c!-- 🔥 SCRIPT PALING BAWAH -->\n  \u003cscript src=\"/vip/global.js\">\u003c/script>\n  \n  \u003cscript src=\"https://cdn.jsdelivr.net/npm/sweetalert2@11\">\u003c/script>\n\n\u003c/body>\n\u003c/html>";

    headers: {"Authorization":"Bearer " + token},
    cache: "no-store",
    credentials: "same-origin"
  }).then(async response => {
    if (!response.ok) throw new Error("LOGIN_EXPIRED");
    return response.json();
  }).then(payload => {
    const user = payload && payload.user;
    if (!payload.success || !user || user.role !== "vip" || user.folder !== folder) {
      throw new Error("VIP_ACCOUNT_NOT_MATCHED");
    }
    if (typeof user.nama !== "string" || !user.nama.trim() || user.nama.length > 100) {
      throw new Error("VIP_NAME_MISSING");
    }
    const profile = {name:user.nama.trim(),folder,root:"/vip/"+folder};
    // Ditambahkan sebelum semua script halaman asli berjalan. Role + nama berasal dari JWT yang telah diverifikasi Netlify.
    const seed = "<scr"+"ipt>window.__VIP_PROFILE="+JSON.stringify(profile).replace(/</g,"\u003c")+";</scr"+"ipt>";
    const page = verifiedPage.replace(/<head([^>]*)>/i, (match) => match + seed);
    document.open(); document.write(page); document.close();
  }).catch(err => {
    console.warn("[VIP universal] Session verification failed:", err.message);
    fail(err.message === "VIP_ACCOUNT_NOT_MATCHED" ?
      "Akun login tidak cocok dengan folder VIP ini. Silakan gunakan akun VIP yang benar." :
      "Verifikasi sesi VIP gagal atau koneksi server terputus. Silakan coba lagi / login ulang.");
  });
})();
</script></body></html>
