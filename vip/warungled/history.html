s.confirm){\n        const cancel=el('button','vipux-btn vipux-btn--secondary',options.cancelText||'Batal');\n        cancel.type='button';cancel.addEventListener('click',()=>closeModal(false));\n        actions.append(cancel);\n      }\n      const ok=el('button','vipux-btn',options.okText||(options.confirm?'Lanjutkan':'Mengerti'));\n      ok.type='button';ok.addEventListener('click',()=>{\n        closeModal(true);\n        // Callback opsional dieksekusi dalam klik langsung, untuk aksi yang harus mempertahankan user gesture.\n        if (typeof options.onAccept==='function') options.onAccept();\n      });\n      actions.append(ok);box.append(actions);layer.append(box);\n      document.body.append(layer);\n      document.addEventListener('keydown',active.escape);\n      ok.focus();\n    });\n    return promise;\n  }\n  let toastTimer;\n  const api={\n    notice:(title,message,tone='info')=>dialog(title,message,{tone}),\n    confirm:(title,message,opts={})=>dialog(title,message,{...opts,confirm:true}),\n    toast:(message)=>{\n      const prior=document.querySelector('.vipux-toast'); if(prior) prior.remove();\n      clearTimeout(toastTimer);\n      const node=el('div','vipux-toast',message);node.setAttribute('role','status');document.body.append(node);\n      toastTimer=setTimeout(()=>node.remove(),2800);\n    },\n    go:(url)=>{\n      if (!url || document.querySelector('.vipux-nav-overlay')) return;\n      const overlay=el('div','vipux-overlay vipux-nav-overlay');\n      overlay.setAttribute('role','status');overlay.setAttribute('aria-label','Menunggu...');\n      const loading=el('div','vipux-loader');\n      const spinner=el('div','vipux-spinner');spinner.setAttribute('aria-hidden','true');\n      loading.append(spinner,el('div',null,'Menunggu...'));overlay.append(loading);document.body.append(overlay);\n      // Tampilkan satu frame animasi sebelum pergantian dokumen.\n      requestAnimationFrame(()=>setTimeout(()=>window.location.assign(url),160));\n    }\n  };\n  window.VIPUI=api;\n  window.addEventListener('pageshow',()=>{\n    const overlay=document.querySelector('.vipux-nav-overlay');if(overlay) overlay.remove();\n  });\n  // Alert lama tetap bekerja, tetapi ditampilkan sebagai dialog profesional.\n  window.alert=(message)=>{\n    const txt=String(message||'');\n    if (/berhasil|tersimpan/i.test(txt)) {api.toast(txt);return;}\n    api.notice(/gagal|tidak tersedia|belum/i.test(txt)?'Perhatian':'Informasi',txt,/gagal|ditolak/i.test(txt)?'error':'warn');\n  };\n})();\n\u003c/script>\n\n\u003cstyle id=\"vip-r25-mobile-responsive\">\n/* R25: tata letak HP, desktop R24 tidak disentuh. */\n.vip-mobile-menu,.vip-mobile-backdrop{display:none}\n@media screen and (max-width:767px){\n  html,body{width:100%;height:100%;max-width:100%;overflow:hidden}\n  *,*::before,*::after{box-sizing:border-box}\n  .vip-layout{display:block;width:100%;height:100dvh;min-height:0;overflow:hidden}\n  .main-wrapper{width:100%;min-width:0;height:100dvh;max-height:100dvh;display:flex;flex-direction:column;overflow:hidden}\n  .topbar{flex:0 0 48px;height:48px;min-height:48px;display:flex;align-items:center;gap:0;overflow:hidden;border-bottom:1px solid #dbe2ec;background:#fff}\n  .vip-mobile-menu{display:flex;flex:0 0 auto;align-items:center;justify-content:center;gap:8px;min-width:74px;height:42px;margin:0 4px 0 6px;padding:0 9px;border:0;border-radius:9px;background:#112d64;color:white;font:600 13px system-ui,sans-serif;cursor:pointer}\n  .vip-mobile-menu i{font-size:16px}\n  .erp-tabs{display:flex;align-items:stretch;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;overscroll-behavior-x:contain}\n  .tab,.tab.active{height:48px;min-height:48px;flex-shrink:0;padding:0 12px;font-size:13px;white-space:nowrap;line-height:1.2}\n  #main-content{min-width:0;min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}\n  .vip-mobile-backdrop{display:block; -align:left;white-space:normal;overflow-wrap:anywhere;font-size:13px}\n  .erp-table tbody tr td:first-child{grid-column:1/-1;padding-bottom:7px;border-bottom:1px solid #eef1f5;color:#102f64;font-size:15px;font-weight:750}\n  .erp-table tbody tr td:nth-child(1)::before{content:'Nomor Invoice'}\n  .erp-table tbody tr td:nth-child(2)::before{content:'Tanggal'}\n  .erp-table tbody tr td:nth-child(3)::before{content:'Jenis'}\n  .erp-table tbody tr td:nth-child(4)::before{content:'Jumlah Item'}\n  .erp-table tbody tr td:nth-child(5)::before{content:'Total'}\n  .erp-table tbody tr td:nth-child(6)::before{content:'Status'}\n  .erp-table tbody tr td:not([colspan])::before{display:block;margin-bottom:5px;font-size:11px;font-weight:700;color:#718097}\n  .erp-table tbody tr td[colspan]{grid-column:1/-1;text-align:center;padding:25px 8px}\n  .erp-table tbody tr td[colspan]::before{display:none}\n  #invoice-content{min-width:0;width:100%;max-width:100%;overflow-x:hidden;overflow-y:auto;padding:10px;box-sizing:border-box}\n  .invoice-box{width:100%;max-width:100%;min-height:0;height:auto;display:block;overflow:visible;padding:12px;border-radius:12px}\n  .brand-title{font-size:20px;line-height:1.35}\n  .erp-doc-info{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}\n  .erp-doc-info>div{min-width:0;overflow-wrap:anywhere;padding:10px;font-size:12px}\n  .invoice-table-wrap{min-width:0;max-width:100%;margin-top:15px;overflow:visible}\n  .invoice-table{display:block;min-width:0;width:100%;margin:0;table-layout:auto;border-collapse:separate}\n  .invoice-table thead{display:none}\n  .invoice-table tbody{display:block;width:100%}\n  .invoice-table tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 8px;width:100%;min-width:0;margin:0 0 11px;padding:12px;border:1px solid #e1e7ed;border-radius:11px;background:#fff}\n  .invoice-table tbody td{display:block;min-width:0;max-width:100%;width:100%;padding:0;border:0;text-align:left;overflow-wrap:anywhere;font-size:13px}\n  .invoice-table tbody td:nth-child(2){grid-column:1/-1;font-size:15px;font-weight:700;color:#163459;border-bottom:1px solid #e9edf3;padding-bottom:8px}\n  .invoice-table tbody td:nth-child(7){font-weight:700;color:#11346c}\n  .invoice-table tbody td:nth-child(1)::before{content:'No'}\n  .invoice-table tbody td:nth-child(2)::before{content:'Nama Barang'}\n  .invoice-table tbody td:nth-child(3)::before{content:'Jumlah'}\n  .invoice-table tbody td:nth-child(4)::before{content:'Satuan'}\n  .invoice-table tbody td:nth-child(5)::before{content:'Harga'}\n  .invoice-table tbody td:nth-child(6)::before{content:'Diskon'}\n  .invoice-table tbody td:nth-child(7)::before{content:'Total'}\n  .invoice-table tbody td:nth-child(8)::before{content:'Status'}\n  .invoice-table tbody td:nth-child(9)::before{content:'Aksi'}\n  .invoice-table tbody td::before{display:block;margin-bottom:5px;font-size:11px;font-weight:700;color:#718097}\n  .invoice-table tbody td:nth-child(9) button{height:44px;min-width:44px;border-radius:9px}\n  .invoice-footer{display:flex;flex-direction:column-reverse;gap:12px;align-items:stretch;margin-top:12px}\n  .invoice-action{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;min-width:0}\n  .invoice-action .btn{width:100%;min-width:0;margin:0;min-height:45px;padding:8px 6px;white-space:normal;font-size:12px}\n  .erp-total-box{display:flex;flex-direction:column;align-items:stretch;width:100%;min-width:0;gap:10px;padding:12px}\n  .vipux-dialog{max-height:calc(100dvh - 36px);overflow-y:auto}\n}\n@media screen and (max-width:359px){\n  .erp-doc-info{grid-template-columns:1fr}\n  .erp-toolbar select,.erp-toolbar input{font-size:13px}\n}\n\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\u003cdiv id=\"vip-mobile-backdrop\" class=\"vip-mobile-backdrop\" aria-hidden=\"true\">\u003c/div>\n\n  \u003cdiv class=\"vip-layout\">\n\n    \n\u003caside class=\"sidebar\" id=\"vip-mobile-sidebar\" aria-label=\"Navigasi VIP\">\n\n    \u003cbutton\n        class=\"sidebar-btn\"\n        onclick=\"VIPUI.go(window.__VIP_PROFILE.root)\"\n        title=\"Dashboard\">\n        \u003ci class=\"fa-solid fa-house\">\u003c/i>\n    \u003c/button>\n\n    \u003cbutton\n        class=\"sidebar-btn active\"\n        title=\"History Dokumen\">\n        \u003ci class=\"fa-solid fa-box-open\">\u003c/i>\n    \u003c/button>\n\n\u003c/aside>\n\n\n    \u003cmain class=\"main-wrapper\">\n\n      \u003c!-- TOP TAB -->\n      \u003cdiv class=\"topbar\">\n\u003cbutton id=\"vip-mobile-menu\" class=\"vip-mobile-menu\" type=\"button\" aria-controls=\"vip-mobile-sidebar\" aria-expanded=\"false\" aria-label=\"Buka menu navigasi\">\u003ci class=\"fa-solid fa-bars\" aria-hidden=\"true\">\u003c/i>\u003cspan>Menu\u003c/span>\u003c/button>\n\n        \u003cdiv\n          class=\"erp-tabs\"\n          id=\"erp-tabs\">\n        \u003c/div>\n\n      \u003c/div>\n\n      \u003c!-- HISTORY PAGE -->\n      \u003cdiv id=\"main-content\">\n\n        \u003cdiv class=\"erp-wrapper\">\n\n          \u003cdiv class=\"erp-card\">\n\n            \u003cdiv class=\"erp-toolbar\">\n\n              \u003cinput\n              type=\"date\"\n              id=\"filterDate\"\n              onchange=\"loadData()\">\n\n              \u003cselect\n                id=\"filterStatus\"\n                onchange=\"loadData()\">\n\n                \u003coption value=\"all\">\n                  Status: Semua\n                \u003c/option>\n\n                \u003coption value=\"pending\">\n                  Pending\n                \u003c/option>\n\n                \u003coption value=\"sebagian\">\n                  Sebagian Diproses\n                \u003c/option>\n\n                \u003coption value=\"proses\">\n                  Proses\n                \u003c/option>\n\n                \u003coption value=\"ready\">\n                  Ready\n                \u003c/option>\n\n              \u003c/select>\n\n              \u003cselect\n                id=\"filterType\"\n                onchange=\"loadData()\">\n\n                \u003coption value=\"all\">\n                  Semua Dokumen\n                \u003c/option>\n\n                \u003coption value=\"order\">\n                  Pesanan\n                \u003c/option>\n\n                \u003coption value=\"klaim\">\n                  Klaim\n                \u003c/option>\n\n              \u003c/select>\n\n              \u003cinput\n              id=\"searchBox\"\n              placeholder=\"Cari Nomor Invoice...\"\n              onkeyup=\"loadData()\">\n\n              \u003cbutton\n                class=\"erp-filter-btn\"\n                onclick=\"loadData()\">\n                \ud83d\udd0d\n              \u003c/button>\n\n            \u003c/div>\n\n            \u003cdiv class=\"summary-grid\">\n\n              \u003cdiv class=\"summary-card total-card\">\n                \u003cdiv>\n                  Total Dokumen\n                \u003c/div>\n                \u003cb id=\"sum-total\">0\u003c/b>\n              \u003c/div>\n\n              \u003cdiv class=\"summary-card pending-card\">\n                \u003cdiv>\n                  Pending\n                \u003c/div>\n                \u003cb id=\"sum-pending\">0\u003c/b>\n              \u003c/div>\n\n              \u003cdiv class=\"summary-card sebagian-card\">\n                \u003cdiv>\n                  Sebagian\n                \u003c/div>\n                \u003cb id=\"sum-sebagian\">0\u003c/b>\n              \u003c/div>\n\n              \u003cdiv class=\"summary-card proses-card\">\n                \u003cdiv>\n                  Proses\n                \u003c/div>\n                \u003cb id=\"sum-proses\">0\u003c/b>\n              \u003c/div>\n\n              \u003cdiv class=\"summary-card ready-card\">\n                \u003cdiv>\n                  Ready\n                \u003c/div>\n                \u003cb id=\"sum-ready\">0\u003c/b>\n              \u003c/div>\n\n            \u003c/div>\n\n            \u003cdiv class=\"erp-table-area\">\n\n              \u003ctable class=\"erp-table\">\n\n                \u003cthead>\n\n                  \u003ctr>\n\n                    \u003cth>Invoice\u003c/th>\n                    \u003cth>Tanggal\u003c/th>\n                    \u003cth>Tipe\u003c/th>\n                    \u003cth>Total Item\u003c/th>\n                    \u003cth>Total\u003c/th>\n                    \u003cth>Status\u003c/th>\n\n                  \u003c/tr>\n\n                \u003c/thead>\n\n                \u003ctbody id=\"historyBody\">\n\n                \u003c/tbody>\n\n              \u003c/table>\n\n            \u003c/div>\n\n          \u003c/div>\n\n        \u003c/div>\n\n      \u003c/div>\n\n      \u003c!-- DETAIL INVOICE -->\n      \u003cdiv\n        id=\"invoice-content\"\n        style=\"\n        display:none;\n        padding:12px;\n        overflow:auto;\n        height:100%;\n        \">\n      \u003c/div>\n\n    \u003c/main>\n\n  \u003c/div>\n\n\u003cscript id=\"vip-r25-mobile-navigation\">\n(function(){\n  'use strict';\n  const nav=document.querySelector('.sidebar');\n  const menu=document.getElementById('vip-mobile-menu');\n  const backdrop=document.getElementById('vip-mobile-backdrop');\n  if(!nav||!menu||!backdrop)return;\n  const close=()=>{document.body.classList.remove('vip-mobile-menu-open');menu.setAttribute('aria-expanded','false');};\n  const open=()=>{document.body.classList.add('vip-mobile-menu-open');menu.setAttribute('aria-expanded','true');};\n  const toggle=()=>document.body.classList.contains('vip-mobile-menu-open')?close():open();\n  menu.addEventListener('click',toggle);\n  backdrop.addEventListener('click',close);\n  nav.addEventListener('click',(event)=>{if(event.target.closest('.sidebar-btn'))close();});\n  document.addEventListener('keydown',(event)=>{if(event.key==='Escape')close();});\n  window.addEventListener('pageshow',close);\n  window.VIPMobileNav={close,open,toggle};\n})();\n\u003c/script>\n\u003c/body>\n\n\u003cscript src=\"/js/auth.js\">\u003c/script>\n\n\u003cscript src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js\">\u003c/script>\n\n\u003cscript src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js\">\u003c/script>\n\u003cscript src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js\">\u003c/script>\n\n\n\u003cscript>\n\n  const firebaseConfig = {\n    apiKey: \"AIzaSyBkyMCw47sYQb2BBkGMxgfsXppozWw4Cec\",\n    authDomain: \"apin-web.firebaseapp.com\",\n    projectId: \"apin-web\",\n    storageBucket: \"apin-web.firebasestorage.app\",\n    messagingSenderId: \"733140414417\",\n    appId: \"1:733140414417:web:b6967fd053ac462b2ffaf0\",\n    measurementId: \"G-6ZN6TQ1YVE\"\n  };\n\n  if (!firebase.apps.length) {\n    firebase.initializeApp(firebaseConfig);\n  }\n\n// Firebase App Check - reCAPTCHA Enterprise (sinkron dengan website utama)\nconst VIP_RECAPTCHA_ENTERPRISE_SITE_KEY = \"6LdyvOktAAAAAPcWRB-_bmuw3Z6wVSzgX1kAG11M\";\ntry {\n  firebase.appCheck().activate(\n    new firebase.appCheck.ReCaptchaEnterpriseProvider(VIP_RECAPTCHA_ENTERPRISE_SITE_KEY),\n    true\n  );\n  console.info(\"[VIP] Firebase App Check activated\");\n} catch (error) {\n  console.error(\"[VIP] Firebase App Check initialization failed\", error);\n}\n\n  const db = firebase.firestore();\n\n  const VIP_NAME = window.__VIP_PROFILE.name;\n\n  function updateActivity() {\n\n    console.log(\"UPDATE ACTIVITY JALAN\");\n\n    db.collection(\"aktivitas_vip\")\n    .doc(VIP_NAME)\n    .set({\n\n      nama:VIP_NAME,\n\n      last_active:\n      firebase.firestore.FieldValue.serverTimestamp()\n\n    })\n    .then(()=> {\n\n      console.log(\"BERHASIL SAVE\");\n\n    })\n    .catch(err => {\n\n      console.error(\"GAGAL SAVE\", err);\n\n    });\n\n  }\n\n  let unsubscribe = null;\n  let detailListener = null;\n  let openedTabs = [];\n  let activeTab = \"\";\n\n\n\n  function isToday(dateString) {\n\n    const today =\n    new Date()\n    .toISOString()\n    .split(\"T\")[0];\n\n    return dateString === today;\n\n  }\n\n\n  // History: single-field invoice query, sorted locally to avoid composite-index dependency.\n  // Keep VIP_NAME consistent with the dashboard's saved invoice.nama.\n  let historyRequestId = 0;\n  function historyMessage(message, color = \"#64748b\") {\n    const cell = document.createElement(\"td\");\n    cell.colSpan = 6;\n    cell.style.cssText = \"padding:18px;text-align:center;white-space:normal;color:\" + color;\n    cell.textContent = message;\n    const tr = document.createElement(\"tr\");\n    tr.appendChild(cell);\n    document.getElementById(\"historyBody\").replaceChildren(tr);\n  }\n\n  function historyDate(value) {\n    if (!value) return null;\n    if (typeof value.toDate === \"function\") return value.toDate();\n    if (typeof value === \"number\") return new Date(value);\n    return null;\n  }\n\n  async function loadData(useDateFilter = true) {\n    const requestId = ++historyRequestId;\n    const dateFilter = document.getElementById(\"filterDate\").value;\n    const statusFilter = document.getElementById(\"filterStatus\").value;\n    const typeFilter = document.getElementById(\"filterType\").value;\n    const keyword = document.getElementById(\"searchBox\").value.toLowerCase().trim();\n\n    if (unsubscribe) {\n      unsubscribe();\n      unsubscribe = null;\n    }\n    historyMessage(\"Memuat riwayat pesanan...\");\n\n    const updateTotals = (totals) => {\n      for (const [key, value] of Object.entries(totals)) {\n        document.getElementById(\"sum-\" + key).textContent = value;\n      }\n    };\n    updateTotals({total:0, pending:0, sebagian:0, proses:0, ready:0});\n\n    // Avoid composite index (nama + waktu); Firestore still applies rules/App Check.\n    unsubscribe = db.collection(\"invoice\")\n      .where(\"nama\", \"==\", VIP_NAME)\n      .onSnapshot(async (snapshot) => {\n        if (requestId !== historyRequestId) return;\n        const docs = snapshot.docs.slice().sort((a,b) => {\n          const da = a.data(), dbb = b.data();\n          const ta = historyDate(da.waktu)?.getTime() || Number(da.created_at) || 0;\n          const tb = historyDate(dbb.waktu)?.getTime() || Number(dbb.created_at) || 0;\n          return tb - ta;\n        });\n        const rows = [];\n        const totals = {total:0, pending:0, sebagian:0, proses:0, ready:0};\n        let detailErrors = 0;\n        for (const doc of docs) {\n          if (requestId !== historyRequestId) return;\n          const d = doc.data();\n          const invoiceId = d.invoice || doc.id;\n          if (typeFilter !== \"all\" && String(d.type || \"\").toLowerCase() !== typeFilter) continue;\n          if (keyword && !String(invoiceId).toLowerCase().includes(keyword)) continue;\n          const dt = historyDate(d.waktu) || historyDate(d.created_at);\n          if (useDateFilter && dateFilter && !isToday(dateFilter)) {\n            if (!dt || [dt.getFullYear(),String(dt.getMonth()+1).padStart(2,'0'),String(dt.getDate()).padStart(2,'0')].join('-') !== dateFilter) continue;\n          }\n\n          let finalStatus = String(d.status || \"pending\").toLowerCase();\n          if (![\"pending\",\"proses\",\"ready\",\"sebagian\"].includes(finalStatus)) finalStatus = \"pending\";\n          try {\n            // Use invoice AND VIP name to match invoice-detail access scope.\n            const details = await db.collection(\"pesanan\")\n              .where(\"invoice\", \"==\", invoiceId)\n              .where(\"nama\", \"==\", VIP_NAME).get();\n            if (requestId !== historyRequestId) return;\n            if (!details.empty) {\n              let pending=0, proses=0, ready=0;\n              details.forEach(item => {\n                const st = String(item.data().status || \"pending\").toLowerCase();\n                if (st === \"ready\") ready++;\n                else if (st === \"proses\") proses++;\n                else pending++;\n              });\n              finalStatus = ready === details.size ? \"ready\" : pending === details.size ? \"pending\" : proses === details.size ? \"proses\" : \"sebagian\";\n            }\n          } catch (error) {\n            // Do not hide invoice headers when a detail query fails.\n            detailErrors++;\n            console.error(\"[VIP History] Detail query failed\", invoiceId, error);\n          }\n          if (statusFilter !== \"all\" && finalStatus !== statusFilter) continue;\n          totals.total++;\n          totals[finalStatus]++;\n          const tr = document.createElement(\"tr\");\n          tr.className = \"row-\" + finalStatus;\n          tr.style.cursor = \"pointer\";\n          tr.addEventListener(\"click\", () => openInvoiceTab(invoiceId));\n          const cells = [invoiceId, dt ? dt.toLocaleDateString(\"id-ID\") : \"-\", d.type || \"-\", d.total_item || 0, \"Rp \" + Number(d.total || 0).toLocaleString(\"id-ID\")];\n          for (const val of cells) {\n            const td = document.createElement(\"td\");\n            td.textContent = String(val);\n            tr.appendChild(td);\n          }\n          const td = document.createElement(\"td\");\n          const badge = document.createElement(\"span\");\n          badge.className = \"badge badge-\" + finalStatus;\n          badge.textContent = d.request_delete ? \"MENUNGGU PERSETUJUAN\" : finalStatus.toUpperCase();\n          td.appendChild(badge);\n          tr.appendChild(td);\n          rows.push(tr);\n        }\n        if (requestId !== historyRequestId) return;\n        updateTotals(totals);\n        if (rows.length) {\n          document.getElementById(\"historyBody\").replaceChildren(...rows);\n        } else {\n          historyMessage(snapshot.empty ? \"Belum ada riwayat pesanan.\" : \"Tidak ada riwayat yang sesuai pencarian.\");\n        }\n        if (detailErrors) {\n          console.warn(\"[VIP History] \" + detailErrors + \" detail query(s) failed; showing invoice header status as fallback.\");\n          const warning = document.createElement(\"div\");\n          warning.style.cssText = \"padding:10px 15px;color:#92400e;background:#fffbeb;font-size:13px\";\n          warning.textContent = \"Sebagian informasi status belum dapat diperbarui. Silakan coba memuat ulang.\";\n          const area = document.querySelector(\".erp-table-area\");\n          area.querySelectorAll(\".vip-history-warning\").forEach(el=>el.remove());\n          warning.className = \"vip-history-warning\";\n          area.prepend(warning);\n        } else {\n          document.querySelectorAll(\".vip-history-warning\").forEach(el=>el.remove());\n        }\n      }, (err) => {\n        if (requestId !== historyRequestId) return;\n        console.error(\"[VIP History] Invoice query failed\", err);\n        // Kode detail tersimpan di console, tidak ditampilkan kepada pelanggan.\n        historyMessage(\"Riwayat pesanan belum dapat ditampilkan. Periksa koneksi, lalu coba lagi.\", \"#b91c1c\");\n      });\n  }\n\n\n  // ================= FAKTUR =================\n\n  async function lihatFaktur(invoiceId) {\n\n    if (detailListener) {\n      detailListener();\n    }\n\n    const invoiceDoc =\n    await db\n    .collection(\"invoice\")\n    .doc(invoiceId)\n    .get();\n\n    if (!invoiceDoc.exists) {\n\n      alert(\"Dokumen yang Anda cari tidak ditemukan.\");\n      return;\n\n    }\n\n    const inv =\n    invoiceDoc.data();\n\n    if (inv.nama !== VIP_NAME) {\n\n      alert(\"Akun Anda tidak memiliki akses ke dokumen ini.\");\n\n      return;\n\n    }\n\n    detailListener =\n    db.collection(\"pesanan\")\n    .where(\n      \"invoice\",\n      \"==\",\n      invoiceId\n    )\n    .where(\n      \"nama\",\n      \"==\",\n      VIP_NAME\n    )\n    .onSnapshot(async(detailSnap)=> {\n\n      let total = 0;\n\n      let ready = 0;\n      let proses = 0;\n      let pending = 0;\n\n      let no = 0; // \ud83d\udd25 DROP DI SINI\n\n      let rows = \"\";\n\n      detailSnap.forEach(doc => {\n\n        const itemId = doc.id;\n\n        const item = doc.data();\n\n        const deleteRequest =\n        item.request_delete === true;\n\n        no++;\n\n        const status =\n        (item.status || \"pending\")\n        .toLowerCase();\n\n        let label = \"PENDING\";\n\n        if (status === \"ready\") {\n\n          label = \"READY\";\n          ready++;\n\n        } else if (status === \"proses\") {\n\n          label = \"PROSES\";\n          proses++;\n\n        } else {\n\n          pending++;\n\n        }\n\n        total += item.total || 0;\n\n        rows += `\n        \u003ctr>\n\n        \u003ctd>${no}\u003c/td>\n\n        \u003ctd>${item.produk}\u003c/td>\n\n        \u003ctd>${item.qty}\u003c/td>\n\n        \u003ctd>${item.satuan}\u003c/td>\n\n        \u003ctd>\n        Rp ${(item.harga || 0).toLocaleString(\"id-ID\")}\n        \u003c/td>\n\n        \u003ctd>\n        ${item.diskon || 0}%\n        \u003c/td>\n\n        \u003ctd>\n        Rp ${(item.total || 0).toLocaleString(\"id-ID\")}\n        \u003c/td>\n\n        \u003ctd>\n\n        ${\n        deleteRequest\n        ?\n        '\u003cspan class=\"badge badge-delete\">MENUNGGU PERSETUJUAN\u003c/span>':\n        label\n        }\n\n        \u003c/td>\n\n        \u003ctd>\n        \n\u003cbutton\n    class=\"btn-delete-item\"\n    onclick=\"\n    event.stopPropagation();\n    requestDeleteItem(\n    '${itemId}',\n    '${invoiceId}'\n    )\n    \"\n>\n    \u003ci class=\"fa-solid fa-trash-can\">\u003c/i>\n\u003c/button>\n\n\n\n        \u003c/td>\n\n        \u003c/tr>\n\n        `;\n\n      });\n\n      const waktu =\n\n      inv.waktu\n      ?\n      inv.waktu\n      .toDate()\n      .toLocaleString(\"id-ID\"):\n      \"-\";\n\n      document\n      .getElementById(\"invoice-content\")\n      .innerHTML = `\n\n      \u003cdiv class=\"invoice-box modern-faktur\">\n\n      \u003cdiv class=\"top-header-flex\">\n\n      \u003cdiv style=\"\n      width:100%;\n      text-align:center;\n      \">\n\n      \n\u003cdiv class=\"brand-title\">\n\n    \u003ci class=\"fa-solid fa-file-lines\">\u003c/i> Detail Dokumen\n\n\u003c/div>\n\n\n\n      \u003cdiv class=\"erp-doc-info\">\n\n      \u003cdiv>\n      \u003cdiv class=\"info-label\">No Dokumen\u003c/div>\n      \u003cdiv class=\"info-value\">${invoiceId}\u003c/div>\n      \u003c/div>\n\n      \u003cdiv>\n      \u003cdiv class=\"info-label\">Customer\u003c/div>\n      \u003cdiv class=\"info-value\">${inv.nama}\u003c/div>\n      \u003c/div>\n\n      \u003cdiv>\n      \u003cdiv class=\"info-label\">Tanggal\u003c/div>\n      \u003cdiv class=\"info-value\">${waktu}\u003c/div>\n      \u003c/div>\n\n      \u003cdiv>\n      \u003cdiv class=\"info-label\">Jenis\u003c/div>\n      \u003cdiv class=\"info-value\">${inv.type.toUpperCase()}\u003c/div>\n      \u003c/div>\n\n      \u003c/div>\n\n      \u003c/div>\n\n      \u003c/div>\n\n      \u003cdiv class=\"invoice-table-wrap\">\n\n      \u003ctable class=\"invoice-table\">\n\n      \u003cthead>\n\n      \u003ctr>\n\n      \u003cth>No\u003c/th>\n      \u003cth>Nama Barang\u003c/th>\n      \u003cth>Qty\u003c/th>\n      \u003cth>Satuan\u003c/th>\n      \u003cth>Harga\u003c/th>\n      \u003cth>Diskon\u003c/th>\n      \u003cth>Total\u003c/th>\n      \u003cth>Status\u003c/th>\n      \u003cth>Aksi\u003c/th>\n\n      \u003c/tr>\n\n      \u003c/thead>\n\n      \u003ctbody>\n\n      ${rows}\n\n      \u003c/tbody>\n\n      \u003c/table>\n\n      \u003c/div>\n\n      \u003cdiv class=\"invoice-footer\">\n\n      \n\u003cdiv class=\"invoice-action\">\n\n    \u003cbutton class=\"btn\"\n    onclick=\"window.print()\">\n        \u003ci class=\"fa-solid fa-print\">\u003c/i> Print\n    \u003c/button>\n\n    \u003cbutton class=\"btn\"\n    onclick=\"downloadInvoice()\">\n        \u003ci class=\"fa-solid fa-download\">\u003c/i> Download\n    \u003c/button>\n\n    \u003cbutton class=\"btn\"\n    onclick=\"closeInvoice()\">\n        \u003ci class=\"fa-solid fa-xmark\">\u003c/i> Tutup\n    \u003c/button>\n\n    \u003cbutton\n        class=\"btn btn-delete-doc\"\n        onclick=\"\n        requestDeleteInvoice(\n        '${invoiceId}'\n        )\n        \"\n    >\n        \u003ci class=\"fa-solid fa-trash-can\">\u003c/i> Ajukan Penghapusan\n    \u003c/button>\n\n\u003c/div>\n\n\n\n      \u003cdiv class=\"erp-total-box\">\n\n      \u003cdiv class=\"total-item-box\">\n\n      \u003cb>Total Item\u003c/b>\n      \u003cspan>${detailSnap.size}\u003c/span>\n\n      \u003c/div>\n\n      \u003cdiv class=\"grand-total-box\">\n\n      \u003cb>Grand Total\u003c/b>\n      \u003cspan>\n      Rp ${total.toLocaleString(\"id-ID\")}\n      \u003c/span>\n\n      \u003c/div>\n\n      \u003c/div>\n\n      \u003c/div>\n\n      `;\n\n      document\n      .getElementById(\"main-content\")\n      .style.display = \"none\";\n\n      document\n      .getElementById(\"invoice-content\")\n      .style.display = \"block\";\n    }); // tutup onSnapshot\n  }\n  \n  \n\n\n\n\n  function closeInvoice(){\n\nif(detailListener){\ndetailListener();\ndetailListener = null;\n}\n\nactiveTab = \"history\";\n\nrenderTabs();\n\ndocument.getElementById(\"invoice-content\").style.display = \"none\";\ndocument.getElementById(\"main-content\").style.display = \"block\";\n\n}\n\n\n  function downloadInvoice() {\n\n    const invoice =\n    document.querySelector(\".invoice-box\");\n\n    if (!invoice) {\n\n      alert(\"Dokumen yang ingin diunduh tidak ditemukan.\");\n\n      return;\n\n    }\n\n    // \ud83d\udd25 clone biar bersih\n    const clone =\ninvoice.cloneNode(true);\n\nclone.querySelectorAll(\".btn-delete-item\")\n.forEach(el => el.remove());\n\nconst aksiHeader =\nclone.querySelector(\"th:last-child\");\n\nif(aksiHeader){\naksiHeader.remove();\n}\n\nclone.querySelectorAll(\"tr\")\n.forEach(row=>{\n\nconst lastCell =\nrow.querySelector(\"td:last-child\");\n\nif(lastCell){\nlastCell.remove();\n}\n\n});\n\n    // \ud83d\udd25 buang tombol\n    const actions =\n    clone.querySelector(\".invoice-action\");\n\n    if (actions) {\n\n      actions.remove();\n\n    }\n\n    // \ud83d\udd25 wrapper khusus PDF\n    const wrapper =\n    document.createElement(\"div\");\n\n    wrapper.style.padding = \"20px\";\n    wrapper.style.background = \"#ffffff\";\n\n    wrapper.appendChild(clone);\n\n    document.body.appendChild(wrapper);\n\n    const opt = {\n\n      margin: 0.3,\n\n      filename:\n      \"invoice-\" + Date.now() + \".pdf\",\n\n      image: {\n        type: \"jpeg\",\n        quality: 1\n      },\n\n      html2canvas: {\n\nscale: 2,\n\nuseCORS: true,\n\nscrollX: 0,\n\nscrollY: 0,\n\nwindowWidth: wrapper.scrollWidth,\n\nwindowHeight: wrapper.scrollHeight\n\n},\n\n      jsPDF: {\n\n        unit: \"in\",\n\n        format: \"a4\",\n\n        orientation:\"portrait\"\n\n      },\n\n      pagebreak:{\nmode:[\"css\",\"legacy\"]\n}\n\n    };\n\n    html2pdf()\n    .set(opt)\n    .from(wrapper)\n    .save()\n    .then(() => {\n\n      wrapper.remove();\n\n    });\n\n  }\n\n\n\n  async function assertOwnedInvoice(invoiceId) {\n    const snap = await db.collection(\"invoice\").doc(invoiceId).get();\n    if (!snap.exists || snap.data().nama !== VIP_NAME) throw new Error(\"INVOICE_NOT_OWNED\");\n    return snap;\n  }\n  async function assertOwnedItem(itemId, invoiceId) {\n    const snap = await db.collection(\"pesanan\").doc(itemId).get();\n    if (!snap.exists || snap.data().nama !== VIP_NAME || snap.data().invoice !== invoiceId) {\n      throw new Error(\"ITEM_NOT_OWNED\");\n    }\n    return snap;\n  }\n  async function recalculateInvoice(\n    invoiceId\n  ) {\n    await assertOwnedInvoice(invoiceId);\n\n    const snap =\n    await db\n    .collection(\"pesanan\")\n    .where(\n      \"invoice\",\n      \"==\",\n      invoiceId\n    )\n    .where(\n      \"nama\",\n      \"==\",\n      VIP_NAME\n    )\n    .get();\n\n    let totalItem = 0;\n    let grandTotal = 0;\n\n    snap.forEach(doc => {\n\n      const item =\n      doc.data();\n\n      totalItem++;\n\n      grandTotal +=\n      item.total || 0;\n\n    });\n\n    if (totalItem === 0) {\n\n      await db\n      .collection(\"invoice\")\n      .doc(invoiceId)\n      .delete();\n\n      closeInvoice();\n\n      loadData();\n\n      return;\n\n    }\n\n    await db\n    .collection(\"invoice\")\n    .doc(invoiceId)\n    .update({\n\n      total_item: totalItem,\n\n      total: grandTotal\n\n    });\n\n  }\n\n  async function requestDeleteInvoice(\n    invoiceId\n  ) {\n\n    if (\n      !(await VIPUI.confirm(\"Ajukan Penghapusan\", \"Kirim permintaan penghapusan dokumen ini?\", {okText:\"Kirim Permintaan\"}))\n    ) {\n      return;\n    }\n\n    try {\n      await assertOwnedInvoice(invoiceId);\n\n      console.log(\"STEP 1\");\n\n      await db\n      .collection(\"invoice\")\n      .doc(invoiceId)\n      .set({\n\n        request_delete: true,\n\n        request_delete_at:\n        firebase.firestore\n        .FieldValue\n        .serverTimestamp(),\n\n        request_delete_by: \"VIP\"\n\n      }, {\n        merge: true\n      });\n\n      console.log(\"STEP 2\");\n\n      const snap =\n      await db\n      .collection(\"pesanan\")\n      .where(\n        \"invoice\",\n        \"==\",\n        invoiceId\n      )\n      .where(\n        \"nama\",\n        \"==\",\n        VIP_NAME\n      )\n      .get();\n\n      console.log(\n        \"STEP 3\",\n        snap.size\n      );\n\n      const batch =\n      db.batch();\n\n      snap.forEach(doc => {\n\n        batch.update(doc.ref, {\n\n          request_delete: true,\n\n          request_delete_invoice: true,\n\n          request_delete_at:\n          firebase.firestore\n          .FieldValue\n          .serverTimestamp(),\n\n          request_delete_by: \"VIP\"\n\n        });\n\n      });\n\n      console.log(\"STEP 4\");\n\n      await batch.commit();\n\n      console.log(\"STEP 5\");\n\n      alert(\n        \"Permintaan penghapusan berhasil dikirim.\"\n      );\n\n    }\n    catch(err) {\n\n      console.error(\n        \"ERROR DELETE:\",\n        err\n      );\n\n      alert(\n        \"Permintaan belum berhasil dikirim. Silakan coba lagi.\"\n      );\n\n    }\n\n  }\n\n  async function requestDeleteItem(\n    itemId,\n    invoiceId\n  ) {\n\n    if (\n      !(await VIPUI.confirm(\"Ajukan Penghapusan Produk\", \"Kirim permintaan penghapusan produk ini?\", {okText:\"Kirim Permintaan\"}))\n    ) {\n      return;\n    }\n\n    try {\n      await assertOwnedInvoice(invoiceId); await assertOwnedItem(itemId, invoiceId);\n\n      await db\n      .collection(\"pesanan\")\n      .doc(itemId)\n      .update({\n\n        request_delete: true,\n\n        request_delete_at:\n        firebase.firestore\n        .FieldValue\n        .serverTimestamp(),\n\n        request_delete_by: \"VIP\"\n\n      });\n\n      alert(\n        \"Permintaan penghapusan produk berhasil dikirim.\"\n      );\n\n      lihatFaktur(\n        invoiceId\n      );\n\n    }\n    catch(err) {\n\n      console.error(err);\n\n      alert(\n        \"Permintaan belum berhasil dikirim. Silakan coba lagi.\"\n      );\n\n    }\n\n  }\n\n\n  async function hapusDokumen(\n    invoiceId\n  ) {\n\n    if (\n      !(await VIPUI.confirm(\"Hapus Dokumen?\", \"Seluruh produk dalam dokumen ini akan dihapus dan tidak dapat dipulihkan. Lanjutkan?\", {okText:\"Ya, Hapus\"}))\n    ) {\n      return;\n    }\n\n    try {\n      await assertOwnedInvoice(invoiceId);\n\n      const snap =\n      await db\n      .collection(\"pesanan\")\n      .where(\n        \"invoice\",\n        \"==\",\n        invoiceId\n      )\n      .where(\"nama\", \"==\", VIP_NAME).get();\n\n      const batch =\n      db.batch();\n\n      snap.forEach(doc => {\n\n        batch.delete(\n          doc.ref\n        );\n\n      });\n\n      batch.delete(\n        db.collection(\"invoice\")\n        .doc(invoiceId)\n      );\n\n      await batch.commit();\n\n      alert(\n        \"Dokumen berhasil dihapus.\"\n      );\n\n      closeInvoice();\n\n      loadData();\n\n    }\n    catch(err) {\n\n      console.error(err);\n\n      alert(\n        \"Dokumen belum berhasil dihapus. Silakan coba lagi.\"\n      );\n\n    }\n\n  }\n\n  async function hapusItem(\n    itemId,\n    invoiceId\n  ) {\n\n    if (\n      !(await VIPUI.confirm(\"Hapus Produk?\", \"Produk ini akan dihapus dari dokumen. Lanjutkan?\", {okText:\"Ya, Hapus\"}))\n    ) {\n      return;\n    }\n\n    try {\n      await assertOwnedInvoice(invoiceId); await assertOwnedItem(itemId, invoiceId);\n\n      await db\n      .collection(\"pesanan\")\n      .doc(itemId)\n      .delete();\n\n      await recalculateInvoice(\n        invoiceId\n      );\n\n      alert(\n        \"Produk berhasil dihapus.\"\n      );\n\n      lihatFaktur(\n        invoiceId\n      );\n\n      loadData();\n\n    }\n    catch(err) {\n\n      console.error(err);\n\n      alert(\n        \"Produk belum berhasil dihapus. Silakan coba lagi.\"\n      );\n\n    }\n\n  }\n\n\n  async function manualRefresh(btn) {\n\n    btn.classList.add(\"loading\");\n\n    btn.innerHTML = '\u003ci class=\"fa-solid fa-spinner\">\u003c/i> Memuat...';\n    \n    try {\n\n      await loadData();\n\n    }\n\n    catch(err) {\n\n      console.log(err);\n\n    }\n\n    setTimeout(()=> {\n\n      btn.classList.remove(\n        \"loading\"\n      );\n\n      \nbtn.innerHTML =\n    '\u003ci class=\"fa-solid fa-rotate\">\u003c/i> Refresh';\n\n\n\n    }, 1000);\n\n  }\n\n  window.addEventListener(\n    \"load\",\n    ()=> {\n\n      document\n      .getElementById(\"searchBox\")\n      .focus();\n\n    }\n  );\n\n  setTimeout(()=> {\n\n    const search =\n    document.getElementById(\n      \"searchBox\"\n    );\n\n    if (search) {\n\n      search.focus();\n\n    }\n\n  }, 300);\n\n\n  window.addEventListener(\"load\", ()=> {\n\n    const today =\n    new Date()\n    .toISOString()\n    .split(\"T\")[0];\n\n    document.getElementById(\n      \"filterDate\"\n    ).value = today;\n\n    loadData(false);\n\n  });\n\n  setInterval(()=> {\n\n    updateActivity();\n\n  }, 30000);\n\n  // FILTER AUTO CHANGE\n  document.getElementById(\n    \"filterDate\"\n  ).addEventListener(\n    \"change\",\n    loadData\n  );\n\n  document.getElementById(\n    \"filterStatus\"\n  ).addEventListener(\n    \"change\",\n    loadData\n  );\n\n  document.getElementById(\n    \"filterType\"\n  ).addEventListener(\n    \"change\",\n    loadData\n  );\n\n  function openInvoiceTab(invoiceId) {\n\n    const exist =\n    openedTabs.find(\n      t => t.id === invoiceId\n    );\n\n    if (!exist) {\n\n      openedTabs.push({\n        id: invoiceId,\n        title: invoiceId\n      });\n\n    }\n\n    activeTab = invoiceId;\n\n    renderTabs();\n\n    lihatFaktur(invoiceId);\n\n  }\n\n\n\n\n  function renderTabs() {\n\n    const wrap =\n    document.getElementById(\"erp-tabs\");\n\n    if (!wrap) return;\n\n    wrap.innerHTML = \"\";\n\n    openedTabs.forEach(tab => {\n\n      wrap.innerHTML += `\n\n      \u003cdiv\n      class=\"\n      tab\n      ${activeTab === tab.id ? \"active\": \"\"}\n      \"\n      >\n\n      \u003cspan\n      onclick=\"\n      switchTab('${tab.id}')\n      \"\n      >\n\n      ${tab.title}\n\n      \u003c/span>\n\n      ${\n      tab.id !== \"history\"\n      ?\n      `\n      \u003cspan\n      style=\"\n      margin-left:8px;\n      cursor:pointer;\n      color:white;\n      font-weight:bold;\n      \"\n      onclick=\"\n      event.stopPropagation();\n      closeTab('${tab.id}')\n      \"\n      >\n      \u2715\n      \u003c/span>\n      `:\n      \"\"\n      }\n\n      \u003c/div>\n\n      `;\n\n    });\n\n  }\n\n  function closeTab(tabId) {\n\n    openedTabs =\n    openedTabs.filter(\n      t => t.id !== tabId\n    );\n\n    if (activeTab === tabId) {\n\n      activeTab = \"history\";\n\n      closeInvoice();\n\n    }\n\n    renderTabs();\n\n  }\n\n  function switchTab(tabId) {\n\n    activeTab = tabId;\n\n    renderTabs();\n\n    if (tabId === \"history\") {\n\n      document\n      .getElementById(\"main-content\")\n      .style.display = \"block\";\n\n      document\n      .getElementById(\"invoice-content\")\n      .style.display = \"none\";\n\n      return;\n\n    }\n\n    lihatFaktur(tabId);\n\n  }\n  \n  openedTabs = [\n{\nid:\"history\",\ntitle:\"History Dokumen\"\n}\n];\n\nactiveTab = \"history\";\n\nrenderTabs();\n\n\n\u003c/script>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js\">\u003c/script>\n\n\u003c/body>\n\u003c/html>";
  const status = document.getElementById("vip-status");
  const actions = document.getElementById("vip-actions");
  function fail(message) { status.id = "vip-error"; status.textContent=message; actions.hidden=false; const spin=document.querySelector(".vipux-spinner"); if(spin)spin.remove(); const head=document.querySelector(".verify h1"); if(head)head.textContent="Informasi Akun"; }
  const parts = window.location.pathname.split("/").filter(Boolean);
  const folder = parts[0] === "vip" ? parts[1] : null;
  const token = localStorage.getItem("token");
  if (!folder || !/^[a-z0-9][a-z0-9-]{1,64}$/.test(folder)) { fail("Halaman yang Anda tuju tidak tersedia."); return; }
  if (!token) { fail("Sesi login Anda telah habis. Silakan login kembali."); return; }
  fetch("/.netlify/functions/verify-token", {
    method: "GET",
    headers: {"Authorization":"Bearer " + token},
    cache: "no-store",
    credentials: "same-origin"
  }).then(async response => {
    if (response.status===401 || response.status===403) throw new Error("LOGIN_EXPIRED");
    if (!response.ok) throw new Error("SERVICE_UNAVAILABLE");
    return response.json();
  }).then(payload => {
    const user = payload && payload.user;
    if (!payload.success || !user || user.role !== "vip" || user.folder !== folder) {
      throw new Error("VIP_ACCOUNT_NOT_MATCHED");
    }
    if (typeof user.nama !== "string" || !user.nama.trim() || user.nama.length > 100) {
      throw new Error("VIP_NAME_MISSING");
    }
    const profile = {name:user.nama.trim(),folder,root:"/vip/"+folder};
    // Ditambahkan sebelum semua script halaman asli berjalan. Role + nama berasal dari JWT yang telah diverifikasi Netlify.
    const seed = "<scr"+"ipt>window.__VIP_PROFILE="+JSON.stringify(profile).replace(/</g,"\u003c")+";</scr"+"ipt>";
    const page = verifiedPage.replace(/<head([^>]*)>/i, (match) => match + seed);
    document.open(); document.write(page); document.close();
  }).catch(err => {
    console.warn("[VIP universal] Session verification failed:", err.message);
    const message = err.message === "LOGIN_EXPIRED"
      ? "Sesi login Anda telah habis. Silakan login kembali."
      : err.message === "VIP_ACCOUNT_NOT_MATCHED"
        ? "Akun Anda tidak memiliki akses ke halaman ini."
        : err.message === "VIP_NAME_MISSING"
          ? "Informasi akun belum lengkap. Silakan hubungi admin."
          : "Halaman belum dapat dibuka. Periksa koneksi internet, lalu coba lagi.";
    fail(message);
  });
})();
