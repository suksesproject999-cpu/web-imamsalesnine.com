 let nama =\n  p.toLowerCase();\n\n  return nama.includes(keyword);\n\n});\n\n// \ud83d\udd25 PRIORITAS YANG PALING MIRIP\nhasil.sort((a,b)=>{\n\n  let aa =\n  a.toLowerCase();\n\n  let bb =\n  b.toLowerCase();\n\n  return (\n    aa.indexOf(keyword)\n    -\n    bb.indexOf(keyword)\n  );\n\n});\n\n  hasil.slice(0,20).forEach(item=>{\n\n  let div = document.createElement(\"div\");\n\n  let kosong = false;\n\nif(\n  window.stokData &&\n  window.stokData.length > 0\n){\n  kosong = window.isKosong(item);\n}\n\n  \ndiv.innerHTML = kosong\n    ? '\u003ci class=\"fa-solid fa-circle-xmark\">\u003c/i> ' + vipDisplayName(item) + ' (Stok Habis)'\n    : '\u003ci class=\"fa-solid fa-circle-check\">\u003c/i> ' + vipDisplayName(item);\n\n\n\n  if(kosong){\n    div.style.color = \"#888\";\n    div.style.opacity = \"0.6\";\n  }\n\n  if(kosong && mode === \"order\"){\n    div.style.cursor = \"not-allowed\";\n  } else {\n    div.style.cursor = \"pointer\";\n  }\n\n  div.onclick = () => {\n\n  if(mode === \"order\" && kosong){\n\n    VIPUI.notice(\"Stok Produk Kosong\", \"Produk ini sedang tidak tersedia untuk dipesan.\", \"warn\");\n\n    return;\n}\n\n  tambahItem(item);\n\n  el.style.display = \"none\";\n\n  document.getElementById(\"searchInput\").value = \"\";\n\n  document.getElementById(\"searchInput\").blur();\n\n};\n\n  el.appendChild(div);\n});\n\n  el.style.display = \"block\";\n}\n\n// ================= CART =================\nfunction tambahItem(nama){\n\n  let existing = cart.find(x => x.nama === nama);\n\n  if(existing){\n    existing.qty++;\n  } else {\n    cart.push({\n\nnama,\n\nqty:1,\n\nsatuan:\"pcs\",\n\nharga:0,\n\ndiskon:0\n\n});\n\n  }\n  \n  syncCart();\n\n  autoSaveDraft();\n\n  renderCart();\n  \n  renderCartERP();\n}\n\nfunction renderCartERP(){\n\nconst body =\ndocument.getElementById(\n\"erp-cart-body\"\n);\n\n\nif(!body) return;\n\nbody.innerHTML = \"\";\n\nif(cart.length===0){\n\nbody.innerHTML = `\n\u003ctr>\n\u003ctd colspan=\"7\"\nstyle=\"\ntext-align:center;\ncolor:#999;\npadding:100px 0;\n\">\nBelum ada data\n\u003c/td>\n\u003c/tr>\n`;\n\nreturn;\n\n}\n\ncart.forEach((item,i)=>{\n\nconst subtotal =\n(item.harga || 0) * item.qty;\n\nconst diskon =\nsubtotal *\n((item.diskon || 0) / 100);\n\nconst total =\nsubtotal - diskon;\n\nbody.innerHTML += `\n\n\u003ctr>\n\n\u003ctd>${vipDisplayName(item.nama)}\u003c/td>\n\n\u003ctd>\n\n\u003cinput\ntype=\"number\"\nvalue=\"${item.qty}\"\nmin=\"1\"\nonchange=\"updateQty(${i},this.value)\"\nstyle=\"\nwidth:60px;\ntext-align:center;\n\"\n>\n\n\u003c/td>\n\n\u003ctd>\n\n\u003cbutton\nclass=\"unit-btn\"\nonclick=\"toggleSatuan(${i})\"\n>\n\n${item.satuan}\n\n\u003c/button>\n\n\u003c/td>\n\n\u003ctd>\n\n\u003cinput\ntype=\"text\"\nvalue=\"${item.harga ? formatInputRupiah(item.harga) : ''}\"\noninput=\"handleHargaERP(this,${i})\"\n>\n\n\u003c/td>\n\n\u003ctd>\n\n\u003cinput\ntype=\"number\"\nmin=\"0\"\nmax=\"100\"\nvalue=\"${item.diskon || 0}\"\nonchange=\"updateDiskon(${i},this.value)\"\nstyle=\"width:60px;text-align:center;\"\n>\n\n\u003c/td>\n\n\u003ctd id=\"rowTotal${i}\">\n\n${formatRupiah(total)}\n\n\u003c/td>\n\n\u003ctd>\n\n\n\u003cbutton\nonclick=\"hapus(${i})\"\nclass=\"btn-delete\"\ntitle=\"Hapus\"\n>\n\n\u003ci class=\"fa-solid fa-trash-can\">\u003c/i>\n\n\u003c/button>\n\n\n\n\u003c/td>\n\n\u003c/tr>\n\n`;\n\n});\n\nlet subtotal = 0;\n\ncart.forEach(item=>{\n  subtotal += (item.harga || 0) * item.qty;\n});\n\nupdateTotalERP();\n\n}\n\nfunction renderCart(){\n\n  let el = document.getElementById(\"cart-list\");\n\n  if(!el) return;\n\n  el.innerHTML = \"\";\n\n  cart.forEach((item,i)=>{\n\n    let div = document.createElement(\"div\");\n    div.className = \"cart-item\";\n\n    div.innerHTML = `\n  \u003cb>${item.nama}\u003c/b>\n\n  \u003cdiv class=\"cart-row\">\n\n    \u003cbutton onclick=\"kurang(${i})\">\u2796\u003c/button>\n\n    \u003cinput type=\"number\" value=\"${item.qty}\" min=\"1\"\n      onchange=\"updateQty(${i}, this.value)\">\n\n    \u003cbutton onclick=\"tambah(${i})\">\u2795\u003c/button>\n\n    \u003cselect onchange=\"updateSatuan(${i}, this.value)\">\n      \u003coption ${item.satuan==\"pcs\"?\"selected\":\"\"}>pcs\u003c/option>\n      \u003coption ${item.satuan==\"set\"?\"selected\":\"\"}>set\u003c/option>\n    \u003c/select>\n\n    \u003cinput type=\"text\" placeholder=\"Harga\"\n      value=\"${item.harga ? formatInputRupiah(item.harga) : \"\"}\"\n      oninput=\"handleHargaInput(this, ${i})\">\n\n    \u003cbutton onclick=\"hapus(${i})\">\u274c\u003c/button>\n\n  \u003c/div>\n\n  \u003cdiv class=\"subtotal\">\n    \ud83d\udcb0 Subtotal: ${formatRupiah((item.harga || 0) * item.qty)}\n  \u003c/div>\n`;\n\n    el.appendChild(div);\n  });\n\nlet total = 0;\n\ncart.forEach(item=>{\n  total += (item.harga || 0) * item.qty;\n});\n\nlet totalDiv = document.createElement(\"div\");\ntotalDiv.innerHTML = `\u003cb>\ud83d\udcb0 Total: ${formatRupiah(total)}\u003c/b>`;\n\nel.appendChild(totalDiv);\n}\n\nfunction tambah(i){\n\ncart[i].qty++;\n\nsyncCart();\n\nautoSaveDraft();\n\nrenderCart();\n\nrenderCartERP();\n\n}\n\nfunction kurang(i){\n  if(cart[i].qty>1){ cart[i].qty--; }\n  else{ cart.splice(i,1); }\n  \n  syncCart();\n  \n  autoSaveDraft();\n  \n  renderCart();\n  \n  renderCartERP();\n}\n\nfunction hapus(i){\n  cart.splice(i,1);\n  \n  syncCart();\n  \n  autoSaveDraft();\n\n  renderCart();\n  \n  renderCartERP();\n\n  updateTotalERP();\n}\n\nfunction updateSatuan(i,val){\n\n  cart[i].satuan = val;\n  syncCart();autoSaveDraft();\n\n  renderCartERP();\n\n}\n\nfunction updateHarga(i,val){\n\n  let v = parseInt(val) || 0;\n\n  cart[i].harga = v;\n\n}\n\nfunction formatRupiah(angka){\n  return \"Rp \" + (angka || 0).toLocaleString(\"id-ID\");\n}\n\nfunction formatInputRupiah(angka){\n  return angka.toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, \".\");\n}\n\nfunction handleHargaInput(el, i){\n\n  // ambil angka murni (hapus titik)\n  let angka = el.value.replace(/\\D/g, \"\");\n\n  // simpan ke cart sebagai number\n  cart[i].harga = parseInt(angka) || 0;\n\n  // format tampilan\n  el.value = formatInputRupiah(angka);\n  syncCart();autoSaveDraft();updateTotalERP();\n}\n\nfunction updateQty(i,val){\n  let v = parseInt(val);\n  if(v>0){\n    cart[i].qty = v;\n    \n    syncCart();\n    \n    autoSaveDraft();\n    \n    renderCart();\n    renderCartERP();// \ud83d\udd25 WAJIB\n  }\n}\n\nasync function batalOrder(){\n\nconst ok = await VIPUI.confirm(\"Batalkan Pengisian?\", \"Data yang belum tersimpan akan dihapus. Yakin ingin membatalkan?\", {okText:\"Ya, Batalkan\"});\n\nif(!ok) return;\n\nif(mode===\"order\"){\n\norderCart = [];\ncart = orderCart;\n\nlocalStorage.removeItem(vipKey(\"invoiceNo\"));\nlocalStorage.removeItem(vipKey(\"waktuOrder\"));\nlocalStorage.removeItem(vipKey(\"tanggalOrder\"));\nlocalStorage.removeItem(vipKey(\"draftOrder\"));\n\ninvoiceNo = \"\";\nwaktuOrder = \"\";\n\ngenerateOrderInfo();\n\nrenderOrder();\n\n}else{\n\nklaimCart = [];\ncart = klaimCart;\n\nlocalStorage.removeItem(vipKey(\"klaimNo\"));\nlocalStorage.removeItem(vipKey(\"waktuKlaim\"));\nlocalStorage.removeItem(vipKey(\"tanggalKlaim\"));\nlocalStorage.removeItem(vipKey(\"draftKlaim\"));\n\nklaimNo = \"\";\nwaktuKlaim = \"\";\n\ngenerateKlaimInfo();\n\nrenderKlaim();\n\n}\n\n}\n\nasync function orderBaru(){\n\nconst ok = await VIPUI.confirm(\"Buat Dokumen Baru?\", \"Data yang belum tersimpan akan dihapus. Ingin membuat dokumen baru?\", {okText:\"Buat Baru\"});\n\nif(!ok) return;\n\nif(mode===\"order\"){\n\norderCart = [];\ncart = orderCart;\n\nlocalStorage.removeItem(vipKey(\"invoiceNo\"));\nlocalStorage.removeItem(vipKey(\"waktuOrder\"));\nlocalStorage.removeItem(vipKey(\"tanggalOrder\"));\nlocalStorage.removeItem(vipKey(\"draftOrder\"));\n\ninvoiceNo = \"\";\nwaktuOrder = \"\";\n\ngenerateOrderInfo();\n\nrenderOrder();\n\n}else{\n\nklaimCart = [];\ncart = klaimCart;\n\nlocalStorage.removeItem(vipKey(\"klaimNo\"));\nlocalStorage.removeItem(vipKey(\"waktuKlaim\"));\nlocalStorage.removeItem(vipKey(\"tanggalKlaim\"));\nlocalStorage.removeItem(vipKey(\"draftKlaim\"));\n\nklaimNo = \"\";\nwaktuKlaim = \"\";\n\ngenerateKlaimInfo();\n\nrenderKlaim();\n\n}\n\n}\n\n// ================= KIRIM =================\n/* R27: simpan header + seluruh item secara atomik sebelum WA/draft dibersihkan. */\nasync function vipCommitDokumen(jenis,selectedItems,keterangan='') {\n  if(vipSubmitInProgress){ VIPUI.toast('Dokumen sedang disimpan.');return; }\n  const date=vipTanggalDokumen();\n  if(!date){VIPUI.notice('Periksa Tanggal','Pilih tanggal dokumen yang benar sebelum mengirim.','warn');return;}\n  const invoiceId=jenis==='klaim'?klaimNo:invoiceNo;\n  const dibuat=jenis==='klaim'?waktuKlaim:waktuOrder;\n  if(!invoiceId){ VIPUI.notice('Dokumen Belum Siap','Silakan buat dokumen baru, lalu coba lagi.','warn');return; }\n  if(!selectedItems.length){VIPUI.notice('Produk Belum Dipilih','Tambahkan produk sebelum mengirim dokumen.','warn');return;}\n  if(selectedItems.length>400){VIPUI.notice('Produk Terlalu Banyak','Maksimal 400 produk dalam satu dokumen.','warn');return;}\n  const prepared=selectedItems.map(x=>vipValItem(x,jenis==='klaim'));\n  if(prepared.some(x=>!x)){\n    VIPUI.notice('Periksa Rincian Produk', jenis==='order'\n      ? 'Lengkapi jumlah, harga, satuan, dan diskon setiap produk. Harga pesanan harus lebih dari Rp0.'\n      : 'Periksa kembali jumlah, harga, satuan, dan diskon setiap produk.', 'warn');return;\n  }\n  const gross=prepared.reduce((sum,x)=>sum+x.subtotal,0);\n  const disc=prepared.reduce((sum,x)=>sum+x.diskon,0);\n  const total=prepared.reduce((sum,x)=>sum+x.total,0);\n  const invoiceTxt=invoiceId;\n  let pesan=(jenis==='klaim'?'\u267b\ufe0f KLAIM ':'\ud83d\udccb ORDER ')+VIP_NAME+'\\n\\n'+\n             'Invoice : '+invoiceTxt+'\\nTanggal Dokumen : '+date+'\\nWaktu Dibuat : '+dibuat+'\\n\\n====================\\n\\n';\n  prepared.forEach((x,i)=>{\n    pesan+=(i+1)+'. '+x.nama+'\\nQty      : '+x.qty+' '+x.satuan+\n          '\\nHarga    : '+formatRupiah(x.harga)+'\\nDiskon   : '+x.diskonPersen+'%'+\n          '\\nTotal    : '+formatRupiah(x.total)+'\\n\\n';\n  });\n  pesan+='====================\\nSub Total : '+formatRupiah(gross)+'\\nDiskon : '+\n         formatRupiah(disc)+'\\nGrand Total : '+formatRupiah(total)+'\\n';\n  if(jenis==='klaim')pesan+='\\nKeterangan:\\n'+keterangan+'\\n';\n\n  vipSubmitInProgress=true;\n  const tab=window.open('about:blank','_blank');\n  if(tab){ try{tab.document.title='Menunggu...';tab.document.body.textContent='Menunggu...';}catch(e){} }\n  try {\n    const now=Date.now();\n    const stamp=firebase.firestore.FieldValue.serverTimestamp();\n    const batch=db.batch();\n    const header={invoice:invoiceId,nama:VIP_NAME,type:jenis,status:'pending',\n      total_item:prepared.length,total:total,subtotal:gross,total_diskon:disc,\n      tanggal_dokumen:date,waktu_mulai:dibuat,waktu:stamp,created_at:now};\n    if(jenis==='klaim')header.keterangan=keterangan;\n    batch.set(db.collection('invoice').doc(invoiceId),header);\n    prepared.forEach((x,i)=>{\n      const orderText=`${x.nama} (${x.qty} ${x.satuan}) | Harga ${formatRupiah(x.harga)} | Diskon ${x.diskonPersen}% | Total ${formatRupiah(x.total)}`;\n      // ID deterministik menghindari duplikasi item jika pengguna mengulang pengiriman karena jaringan.\n      batch.set(db.collection('pesanan').doc(invoiceId+'__'+String(i+1).padStart(4,'0')),{\n        nama:VIP_NAME,produk:x.nama,qty:x.qty,satuan:x.satuan,harga:x.harga,\n        diskon:x.diskonPersen,subtotal:x.subtotal,total:x.total,order:orderText,\n        status:'pending',type:jenis,invoice:invoiceId,\n        tanggal_dokumen:date,waktu:stamp,created_at:now\n      });\n    });\n    await batch.commit();\n    vipSendToGAS(pesan,jenis);\n    vipResetDokumenKey(jenis);\n    if(jenis==='klaim'){\n      klaimNo='';waktuKlaim='';klaimCart=[];cart=klaimCart;\n      generateKlaimInfo();renderKlaim();\n    } else {\n      invoiceNo='';waktuOrder='';orderCart=[];cart=orderCart;\n      generateOrderInfo();renderOrder();\n    }\n    VIPUI.toast(jenis==='klaim'?'Klaim berhasil disimpan.':'Pesanan berhasil disimpan.');\n    vipWA(pesan,tab);\n  } catch(error){\n    if(tab&&!tab.closed)tab.close();\n    console.error('[VIP R27] Penyimpanan dokumen gagal:',error);\n    VIPUI.notice('Dokumen Belum Tersimpan','Koneksi atau layanan sedang bermasalah. Data pesanan tetap tersedia. Silakan coba lagi.','error');\n  } finally { vipSubmitInProgress=false; }\n}\n\nfunction kirimWA(confirmedUnavailable = false){\n  if(!window.stokData || !window.stokData.length){\n    VIPUI.notice('Stok Belum Siap','Informasi stok sedang dimuat. Silakan coba kembali.','warn');return;\n  }\n  if(!cart.length){VIPUI.notice('Keranjang Kosong','Tambahkan produk sebelum mengirim pesanan.','warn');return;}\n  const tersedia=cart.filter(x=>!window.isKosong(x.nama));\n  const kosong=cart.filter(x=>window.isKosong(x.nama));\n  if(kosong.length && !confirmedUnavailable){\n    VIPUI.confirm('Produk Tidak Tersedia',\n      'Produk berikut sedang tidak tersedia:\\n'+kosong.map(x=>x.nama).join('\\n')+'\\n\\nLanjutkan tanpa produk tersebut?',{\n        okText:'Lanjutkan',onAccept:()=>kirimWA(true)\n      });\n    return;\n  }\n  return vipCommitDokumen('order',tersedia);\n}\nfunction kirimKlaim(){\n  const ket=document.getElementById('ket')?.value.trim()||'';\n  if(!ket){ VIPUI.notice('Keterangan Dibutuhkan','Isi keterangan klaim sebelum mengirim.','warn');return; }\n  return vipCommitDokumen('klaim',cart.slice(),ket);\n}\n\n// HISTORY\nfunction goHistory(){\n  VIPUI.go(window.__VIP_PROFILE.root + \"/history.html\");\n}\n\n// AUTO LOAD\nupdateActivity();\n\nsetInterval(()=>{\n\n  updateActivity();\n\n},30000);\n\n// JAM\nfunction updateJam(){\n\nconst clock =\ndocument.getElementById(\"live-clock\");\n\nif(!clock) return;\n\n\nclock.innerHTML =\n    '\u003ci class=\"fa-solid fa-clock\">\u003c/i> ' +\n    vipJakartaClock();\n\n\n}\n\n\nsetInterval(updateJam,1000);\nupdateJam();\n\n// CLOSE DROPDOWN\ndocument.addEventListener(\"click\", function(e){\n  let box = document.querySelector(\".search-box\");\n  if(box && !box.contains(e.target)){\n    let d = document.getElementById(\"hasil\");\n    if(d) d.style.display=\"none\";\n  }\n});\n\nlet memory = [];\n\nlet uploadedFile = null;\n\nlet uploadedBase64 = null;\n\nasync function tanyaAI(){\n\n  const input =\n  document.getElementById(\"imam-ai-input\");\n\n  const message =\n  input.value.trim();\n  \n  const currentImage =\nuploadedBase64;\n\n  if(\n  !message &&\n  !uploadedFile\n) return;\n\n  const chatBox =\n  document.getElementById(\"imam-chat-box\");\n\n  // USER MESSAGE\n\n  chatBox.innerHTML += `\n\n  \u003cdiv class=\"imam-user-msg\">\n\n    ${message || \"\"}\n\n    ${\n      currentImage\n      ?\n      `\n      \u003cimg\n        src=\"${currentImage}\"\n        style=\"\n          width:100%;\n          margin-top:12px;\n          border-radius:16px;\n        \"\n      >\n      `\n      :\n      \"\"\n    }\n\n  \u003c/div>\n\n`;\n\n  input.value = \"\";\n  \n  chatBox.scrollTop =\n  chatBox.scrollHeight;\n\n  memory.push({\n    role:\"user\",\n    content:message\n  });\n\n  // LOADING\n\n  const loadingId =\n  \"loading-\" + Date.now();\n\n  chatBox.innerHTML += `\n\n    \u003cdiv\n      class=\"imam-ai-msg\"\n      id=\"${loadingId}\"\n    >\n\n      \u003cdiv class=\"typing\">\n\n        \u003cspan>\u003c/span>\n        \u003cspan>\u003c/span>\n        \u003cspan>\u003c/span>\n\n      \u003c/div>\n\n    \u003c/div>\n\n  `;\n\n  chatBox.scrollTop =\n  chatBox.scrollHeight;\n\n  try {\n\n    const formData =\nnew FormData();\n\nformData.append(\n  \"vip\",\n  VIP_NAME\n);\n\nformData.append(\n  \"message\",\n  message\n);\n\nformData.append(\n  \"memory\",\n  JSON.stringify(memory)\n);\n\nformData.append(\n  \"orders\",\n  JSON.stringify(cart)\n);\n\nif(uploadedFile){\n\n  formData.append(\n    \"image\",\n    uploadedFile\n  );\n\n}\n\nconst res = await fetch(\n\n  \"/.netlify/functions/chat\",\n\n  {\n\n    method:\"POST\",\n\n    headers:{\n\n      Authorization:\n      \"Bearer \" +\n      localStorage.getItem(\"token\")\n\n    },\n\n    body:formData\n\n  }\n\n);\n\n    if(!res.ok){\n\n      throw new Error(\n        \"HTTP ERROR \" + res.status\n      );\n\n    }\n\n    const data =\n    await res.json();\n    \n    uploadedFile = null;\nuploadedBase64 = null;\n\n    document.getElementById(\n\"image-upload\"\n).value = \"\";\n\ndocument.getElementById(\n\"preview-box\"\n).innerHTML = \"\";\n\n    console.log(\n      \"AI RESPONSE:\",\n      data\n    );\n\n    let aiText =\n\n      data.reply\n      || \"Maaf, jawaban belum tersedia. Silakan coba lagi.\";\n\n    let imageHtml = \"\";\n\n    if(data.image){\n\n      imageHtml = `\n\n        \u003cdiv style=\"margin-top:15px;\">\n\n          \u003cimg\n            src=\"${data.image}\"\n            style=\"\n              width:100%;\n              border-radius:18px;\n              margin-top:10px;\n              box-shadow:\n              0 10px 25px rgba(0,0,0,.35);\n            \"\n          >\n\n        \u003c/div>\n\n      `;\n\n    }\n\n    const loadingBubble =\n    document.getElementById(\n      loadingId\n    );\n    \nif(loadingBubble){\n\n  loadingBubble.outerHTML = `\n\n\u003cdiv class=\"imam-ai-msg\">\n\n  \u003cdiv id=\"${loadingId}-text\">\u003c/div>\n\n  ${imageHtml}\n\n  \u003cdiv class=\"ai-action\">\n\n    \n\u003cbutton\n    onclick=\"copyAI(this)\"\n    class=\"copy-btn\"\n>\n    \u003ci class=\"fa-solid fa-copy\">\u003c/i> Copy\n\u003c/button>\n\n\n\n    ${\n      data.image\n      ?\n      `\n      \n\u003cbutton\n    onclick=\"downloadImage('${data.image}')\"\n    class=\"download-btn\"\n>\n    \u003ci class=\"fa-solid fa-download\">\u003c/i> Download\n\u003c/button>\n\n      `\n      :\n      \"\"\n    }\n\n  \u003c/div>\n\n\u003c/div>\n\n`;\n\n  const streamTarget =\n\n  document.getElementById(\n    `${loadingId}-text`\n  );\n\n  await streamText(\n    streamTarget,\n    aiText\n  );\n\n}\n\nmemory.push({\n\n  role:\"assistant\",\n\n  content:aiText\n\n});\n\nchatBox.scrollTop =\nchatBox.scrollHeight;\n\n  } catch(err){\n\n    console.log(\n      \"FRONTEND ERROR:\",\n      err\n    );\n\n    const loadingBubble =\n    document.getElementById(\n      loadingId\n    );\n\n    if(loadingBubble){\n\n      loadingBubble.outerHTML = `\n\n        \u003cdiv class=\"imam-ai-msg\">\n\n          Layanan sementara tidak tersedia\n\n          \u003cbr>\u003cbr>\n\n          Silakan coba beberapa saat lagi.\n\n        \u003c/div>\n\n      `;\n\n    }\n\n    chatBox.scrollTop =\n    chatBox.scrollHeight;\n\n  }\n\n}\n\nasync function streamText(\n  element,\n  text\n){\n\n  let current = \"\";\n\n  for(\n    let i = 0;\n    i \u003c text.length;\n    i++\n  ){\n\n    current += text[i];\n\n    element.innerHTML =\n    marked.parse(current);\n\n    await new Promise(\n      resolve =>\n      setTimeout(resolve, 8)\n    );\n\n  }\n\n}\n\nfunction downloadImage(imageSrc){\n\n  const link =\n  document.createElement(\"a\");\n\n  link.href = imageSrc;\n\n  link.download =\n  \"imamgpt-image.png\";\n\n  document.body.appendChild(link);\n\n  link.click();\n\n  document.body.removeChild(link);\n\n}\n\nfunction copyAI(btn){\n\n  const text =\n\n  btn.parentElement\n  .parentElement\n  .innerText;\n\n  navigator.clipboard.writeText(text);\n\n  \nbtn.innerHTML = '\u003ci class=\"fa-solid fa-check\">\u003c/i> Copied';\n\nsetTimeout(() => {\n\n    btn.innerHTML = '\u003ci class=\"fa-solid fa-copy\">\u003c/i> Copy';\n\n}, 2000);\n\n\n\n}\n\nwindow.renderOrder = renderOrder;\nwindow.renderKlaim = renderKlaim;\n\nwindow.kirimWA = kirimWA;\nwindow.kirimKlaim = kirimKlaim;\n\nwindow.goHistory = goHistory;\n\nwindow.tanyaAI = tanyaAI;\n\nwindow.tambah = tambah;\nwindow.kurang = kurang;\nwindow.hapus = hapus;\n\nwindow.updateQty = updateQty;\nwindow.updateSatuan = updateSatuan;\nwindow.handleHargaInput = handleHargaInput;\nwindow.updateHarga = updateHarga;\nwindow.toggleSatuan = toggleSatuan;\n\nwindow.copyAI = copyAI;\nwindow.downloadImage = downloadImage;\n\nfunction renderDashboard(){\n  \n setTabTitle(\n    \"Dashboard\"\n  );\n\ndocument.getElementById(\n\"main-content\"\n).innerHTML = `\n\n\u003cdiv class=\"card\">\n\n\u003cdiv class=\"badge\">\nVIP CUSTOMER\n\u003c/div>\n\n\u003cdiv id=\"live-clock\"\nstyle=\"\nmargin-top:10px;\nfont-size:14px;\nopacity:.8;\n\">\n\u003c/div>\n\n\n\u003ch1>\nSelamat Datang, ${vipDisplayName(VIP_NAME)} \u003ci class=\"fa-solid fa-lock\">\u003c/i>\n\u003c/h1>\n\n\n\n\u003cp>\n\nTerima kasih atas kepercayaan dan kerja sama yang telah terjalin.\n\nHalaman ini kami dedikasikan khusus untuk Anda sebagai mitra terpilih,dengan akses penawaran terbaik yang tidak tersedia secara umum.\n\n\u003c/p>\n\n\u003cdiv class=\"announcement-bar\">\n\n\u003cspan id=\"announcement\">\nMemuat data...\n\u003c/span>\n\n\u003c/div>\n\n\u003c/div>\n\n`;\n\n}\n\nfunction goHistoryOrder(){\n    VIPUI.go(window.__VIP_PROFILE.root + \"/history.html?type=order\");\n}\n\nfunction goHistoryKlaim(){\n    VIPUI.go(window.__VIP_PROFILE.root + \"/history.html?type=klaim\");\n}\n\n\nfunction openTab(page){\n\nconst existing =\nopenedTabs.find(\nt => t.id === page\n);\n\nif(!existing){\n\nopenedTabs.push({\n\nid: page,\n\ntitle:\npageTitles[page] || page\n\n});\n\n}\n\nactiveTab = page;\n\nrenderTabs();\n\nshowPage(page);\n\n}\n\nfunction closeTab(page){\n\nopenedTabs =\nopenedTabs.filter(\ntab => tab.id !== page\n);\n\nif(activeTab === page){\n\nactiveTab =\nopenedTabs.length\n? openedTabs[openedTabs.length - 1].id\n: \"dashboard\";\n\nshowPage(activeTab);\n\n}\n\nrenderTabs();\n\n}\n\n\nfunction renderTabs(){\n\nconst wrap =\ndocument.getElementById(\n\"erp-tabs\"\n);\n\nif(!wrap) return;\n\nwrap.innerHTML = \"\";\n\nopenedTabs.forEach(tab=>{\n\nwrap.innerHTML += `\n\n\u003cdiv\nclass=\"tab ${\nactiveTab===tab.id\n? \"active\"\n: \"\"\n}\"\n>\n\n\u003cspan\nonclick=\"openTab('${tab.id}')\"\nstyle=\"\ncursor:pointer;\n\"\n>\n\n${tab.title}\n\n\u003c/span>\n\n${\ntab.id !== \"dashboard\"\n?\n`\n\u003cspan\nstyle=\"\nmargin-left:8px;\ncursor:pointer;\nfont-weight:bold;\n\"\nonclick=\"\nevent.stopPropagation();\ncloseTab('${tab.id}')\n\"\n>\n\u2715\n\u003c/span>\n`\n:\n\"\"\n}\n\n\u003c/div>\n\n`;\n\n});\n\n}\n\n\nfunction showPage(page){\n\n  activeTab = page;\n\n  renderTabs();\n\n  closeFloatingMenu();\n\n  switch(page){\n\n    case \"dashboard\":\n      renderDashboard();\n      break;\n\n    case \"info\":\n      renderInfo();\n      break;\n\n    case \"order\":\n      renderOrder();\n      break;\n\n    case \"klaim\":\n      renderKlaim();\n      break;\n\n    case \"pengiriman\":\n      renderPengiriman();\n      break;\n\n    case \"retur\":\n      renderRetur();\n      break;\n\n    case \"ai\":\n      renderAI();\n      break;\n\n    case \"pricelist\":\n      window.open(\n        \"/pricelist.pdf\",\n        \"_blank\"\n      );\n      break;\n\n    case \"katalog\":\n      window.open(\n        \"/katalog.pdf\",\n        \"_blank\"\n      );\n      break;\n\n  }\n\n}\n\nfunction togglePenjualan(){\n\nconst menu =\ndocument.getElementById(\n\"floating-menu\"\n);\n\nmenu.style.display =\n\nmenu.style.display===\"block\"\n?\n\"none\"\n:\n\"block\";\n\n}\n\nfunction renderInfo(){\n  \n  const VIP_NAME = window.__VIP_PROFILE.name;\n\n  setTabTitle(\"Informasi\");\n\n  document.getElementById(\n    \"main-content\"\n  ).innerHTML = `\n\n  \n  \n\u003cdiv class=\"card\">\n\n    \u003ch2>\u003ci class=\"fa-solid fa-circle-info\">\u003c/i> Informasi\u003c/h2>\n\n    \u003cdiv id=\"info-list\">\n        Memuat data...\n    \u003c/div>\n\n\u003c/div>\n\n\n\n  `;\n\n  db.collection(\"info_distributor\")\n  .where(\"aktif\",\"==\",true)\n  .orderBy(\"created_at\",\"desc\")\n  .onSnapshot((snap)=>{\n\n    let html=\"\";\n\n    if(snap.empty){\n\n      document.getElementById(\n        \"info-list\"\n      ).innerHTML = `\n      \u003cdiv class=\"card\">\n        Belum ada informasi terbaru.\n d\"\naccept=\"image/*\"\nhidden\n>\n\n\n\u003ctextarea\nid=\"imam-ai-input\"\nplaceholder=\"Tanya Imam AI...\"\n>\u003c/textarea>\n\n\u003cbutton onclick=\"tanyaAI()\">\n\u003ci class=\"fa-solid fa-paper-plane\">\u003c/i>\n\u003c/button>\n\n\u003c/div>\n\n\u003c/div>\n\n\n\n`;\n\nconst chatBox =\ndocument.getElementById(\n\"imam-chat-box\"\n);\n\nif(memory.length===0){\n\n\nchatBox.innerHTML = `\n\n\u003cdiv class=\"imam-ai-msg\">\n\n\ud83d\udc4b Halo ${vipDisplayName(VIP_NAME)}.\n\nSaya Imam AI .\n\nSaya bisa membantu:\n\n\u2022 Info tentang produk nine autoseries\n\u2022 Info sales nine autoseries\n\u2022 Info syarat menjadi mitra nine autoseries\n\u2022 Informasi umum lainnya\n\nSilakan ketik pertanyaan Anda.\n\n\u003c/div>\n\n`;\n\n}\n\ninitAI();\ninitTextarea();\n\n}\n\n\nfunction openMenu(page){\n\nconst menu =\ndocument.getElementById(\n\"floating-menu\"\n);\n\nif(menu){\nmenu.style.display=\"none\";\n}\n\nopenTab(page);\n\n}\n\nfunction renderPengiriman(){\n  \n  setTabTitle(\n    \"Pengiriman\"\n  );\n  \ndocument.getElementById(\n\"main-content\"\n).innerHTML = `\n\n\u003cdiv class=\"card\">\n\n\n\u003ch2>\u003ci class=\"fa-solid fa-truck-fast\">\u003c/i> Pengiriman\u003c/h2>\n\n\u003cdiv id=\"pengiriman-list\">\nMemuat data...\n\u003c/div>\n\n\n\n\u003c/div>\n\n`;\n\n}\n\nfunction renderRetur(){\n  \nsetTabTitle(\n    \"Retur\"\n  );\n\ndocument.getElementById(\n\"main-content\"\n).innerHTML = `\n\n\u003cdiv class=\"card\">\n\n\n\u003ch2>\u003ci class=\"fa-solid fa-arrow-rotate-left\">\u003c/i> Retur\u003c/h2>\n\n\u003cdiv id=\"retur-list\">\nMemuat data...\n\u003c/div>\n\n\n\n\u003c/div>\n\n`;\n\n}\n\n\nfunction initAI(){\n\nconst imageUpload =\ndocument.getElementById(\"image-upload\");\n\nif(!imageUpload) return;\n\nimageUpload.addEventListener(\n\"change\",\nfunction(e){\n\nuploadedFile = e.target.files[0];\n\nif(!uploadedFile) return;\n\nconst reader = new FileReader();\n\nreader.onload = function(event){\n\nuploadedBase64 = event.target.result;\n\nd 0;\n\nel.value =\nformatInputRupiah(angka);\n\nconst subtotal =\ncart[i].qty * cart[i].harga;\n\nconst diskon =\nsubtotal *\n((cart[i].diskon || 0) / 100);\n\nconst total =\nsubtotal - diskon;\n\nconst row =\ndocument.getElementById(\n`rowTotal${i}`\n);\n\nif(row){\n\nrow.innerText =\nformatRupiah(total);\n\n}\n\nsyncCart();\n\nupdateTotalERP();\n\nautoSaveDraft();\n\n}\n\nfunction getDraftKey(){\n\n  return mode === \"order\"\n  ? \"draftOrder\"\n  : \"draftKlaim\";\n\n}\n\nfunction autoSaveDraft(){\n\n if(mode===\"order\"){\n\n   localStorage.setItem(\n     vipKey(\"draftOrder\"),\n     JSON.stringify(orderCart)\n   );\n\n }else{\n\n   localStorage.setItem(\n     vipKey(\"draftKlaim\"),\n     JSON.stringify(klaimCart)\n   );\n\n }\n\n}\n\nfunction syncCart(){\n\n  if(mode===\"order\"){\n\n    orderCart = cart;\n\n  }else{\n\n    klaimCart = cart;\n\n  }\n\n}\n\n\nfunction updateTotalERP(){\n\nlet gross = 0;\nlet diskon = 0;\nlet total = 0;\n\ncart.forEach(item=>{\n\n  const hargaAwal =\n  (item.harga || 0) * item.qty;\n\n  const nilaiDiskon =\n  hargaAwal *\n  ((item.diskon || 0) / 100);\n\n  const hargaAkhir =\n  hargaAwal - nilaiDiskon;\n\n  gross += hargaAwal;\n  diskon += nilaiDiskon;\n  total += hargaAkhir;\n\n});\n\nconst subTotal =\ndocument.getElementById(\n\"subTotal\"\n);\n\nconst totalDiskon =\ndocument.getElementById(\n\"totalDiskon\"\n);\n\nconst grandTotal =\ndocument.getElementById(\n\"grandTotal\"\n);\n\nif(subTotal){\n\n  subTotal.innerText =\n  formatRupiah(gross);\n\n}\n\nif(totalDiskon){\n\n  totalDiskon.innerText =\n  formatRupiah(diskon);\n\n}\n\nif(grandTotal){\n\n  grandTotal.innerText =\n  formatRupiah(total);\n\n}\n\n}\n\nfunction updateDiskon(i,val){\n\nconst discount=Number(val);\nif (!Number.isFinite(discount)||discount\u003c0||discount>100) {\n  VIPUI.toast('Diskon harus antara 0% sampai 100%.');renderCartERP();return;\n}\ncart[i].diskon=discount;\n\nsyncCart();\n\nautoSaveDraft();\n\nrenderCartERP();\n\n}\n\n\nfunction closeFloatingMenu(){\n\nconst menu =\ndocument.getElementById(\n\"floating-menu\"\n);\n\nif(menu){\nmenu.style.display=\"none\";\n}\n\n}\n\n\nfunction vipNewDocNumber(prefix) {\n  const date=vipJakartaDate().replace(/-/g,'');\n  const suffix=Date.now().toString(36).slice(-7).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();\n  return prefix+'-'+date+'-'+window.__VIP_PROFILE.folder+'-'+suffix;\n}\nfunction generateOrderInfo(){\n  const savedInvoice=localStorage.getItem(vipKey('invoiceNo'));\n  if (savedInvoice){\n    invoiceNo=savedInvoice;\n    waktuOrder=localStorage.getItem(vipKey('waktuOrder')) || vipJakartaClock();\n    localStorage.setItem(vipKey('waktuOrder'),waktuOrder);\n    return;\n  }\n  invoiceNo=vipNewDocNumber('SO');\n  waktuOrder=vipJakartaClock();\n  localStorage.setItem(vipKey('invoiceNo'),invoiceNo);\n  localStorage.setItem(vipKey('waktuOrder'),waktuOrder);\n}\nfunction generateKlaimInfo(){\n  const savedClaim=localStorage.getItem(vipKey('klaimNo'));\n  if(savedClaim){\n    klaimNo=savedClaim;\n    waktuKlaim=localStorage.getItem(vipKey('waktuKlaim'))||vipJakartaClock();\n    localStorage.setItem(vipKey('waktuKlaim'),waktuKlaim);\n    return;\n  }\n  klaimNo=vipNewDocNumber('KLM');\n  waktuKlaim=vipJakartaClock();\n  localStorage.setItem(vipKey('klaimNo'),klaimNo);\n  localStorage.setItem(vipKey('waktuKlaim'),waktuKlaim);\n}\n\nfunction refreshPageMode(){\n\nif(mode===\"order\"){\n\ngenerateOrderInfo();\nrenderOrder();\n\n}else{\n\ngenerateKlaimInfo();\nrenderKlaim();\n\n}\n\n}\n\n\nfunction setTabTitle(text){\n\n}\n\nopenedTabs = [\n{\n  id:\"dashboard\",\n  title:\"Dashboard\"\n}\n];\n\nactiveTab = \"dashboard\";\n\nrenderTabs();\nshowPage(\"dashboard\");\n  \n\n\n\u003c/script>\n\n\u003cscript src=\"/announcement.js\">\u003c/script>\n\n \u003c!-- \ud83d\udd25 SCRIPT PALING BAWAH -->\n  \u003cscript src=\"/vip/global.js\">\u003c/script>\n  \n  \u003cscript src=\"https://cdn.jsdelivr.net/npm/sweetalert2@11\">\u003c/script>\n\n\u003c/body>\n\u003c/html>";

    const seed = "<scr"+"ipt>window.__VIP_PROFILE="+JSON.stringify(profile).replace(/</g,"\u003c")+";</scr"+"ipt>";
    const page = verifiedPage.replace(/<head([^>]*)>/i, (match) => match + seed);
    document.open(); document.write(page); document.close();
  }).catch(err => {
    console.warn("[VIP universal] Session verification failed:", err.message);
    const message = err.message === "LOGIN_EXPIRED"
      ? "Sesi login Anda telah habis. Silakan login kembali."
      : err.message === "VIP_ACCOUNT_NOT_MATCHED"
        ? "Akun Anda tidak memiliki akses ke halaman ini."
        : err.message === "VIP_NAME_MISSING"
          ? "Informasi akun belum lengkap. Silakan hubungi admin."
          : "Halaman belum dapat dibuka. Periksa koneksi internet, lalu coba lagi.";
    fail(message);
  });
})();
</script></body></html>
